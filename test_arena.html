<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Arena PalEntropía - Test</title>

</head>


<body>

<h1>⚔️ Arena PalEntropía</h1>

<p>
Introduce código de Paleoficha:
</p>

<input id="codigo" value="001_04">

<button onclick="cargarFicha()">
Cargar
</button>


<div id="resultado"></div>



<script src="js/paldb.js"></script>
<script src="js/palstats.js"></script>


<script>

function cargarFicha(){


let codigo = document.getElementById("codigo").value;


let ficha = PALDB.find(
x => x.codigo === codigo
);


let stats = PALSTATS[codigo];


if(!ficha){

document.getElementById("resultado").innerHTML =
"<h2>Paleoficha no encontrada</h2>";

return;

}



document.getElementById("resultado").innerHTML = `


<h2>${ficha.nombre}</h2>

<p>Código: ${ficha.codigo}</p>

<p>Carpeta: ${ficha.carpeta}</p>


<hr>


<h3>Stats Arena</h3>

<p>Adaptabilidad: ${stats.adaptabilidad}/10</p>

<p>Sociabilidad: ${stats.sociabilidad}/10</p>

<p>Resistencia: ${stats.resistencia}/10</p>

<p>Reproducción: ${stats.reproduccion}/10</p>


`;

}


</script>


</body>

</html>
