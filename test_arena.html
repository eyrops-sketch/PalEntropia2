<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Test Arena PalEntropía</title>
</head>

<body>

<h1>Prueba Base Arena</h1>

<div id="resultado"></div>


<script src="js/paldb.js"></script>
<script src="js/palstats.js"></script>


<script>

let codigo = "001_04";


let ficha = PALDB.find(
    x => x.codigo === codigo
);


let stats = PALSTATS[codigo];


document.getElementById("resultado").innerHTML = `

<h2>${ficha.nombre}</h2>

<p>Código: ${ficha.codigo}</p>

<p>Carpeta: ${ficha.carpeta}</p>

<hr>

<h3>Stats Arena</h3>

<p>Adaptabilidad: ${stats.adaptabilidad}/10</p>
<p>Sociabilidad: ${stats.sociabilidad}/10</p>
<p>Resistencia: ${stats.resistencia}/10</p>
<p>Reproducción: ${stats.reproduccion}/10</p>

`;

</script>


</body>
</html>
