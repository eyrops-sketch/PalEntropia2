<link rel="stylesheet" href="../style.css">
<link rel="icon" href="../favicon.ico">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#111;
color:#fff;
}

header img{
width:100%;
height:180px;
object-fit:cover;
display:block;
}

main{
max-width:1200px;
margin:auto;
padding:35px 20px;
}

h1{
text-align:center;
font-size:2.3em;
margin-bottom:35px;
}

.lista{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:30px;
}

.elemento{

width:260px;
background:#1c1c1c;
border:3px solid #2f7f43;
border-radius:14px;
overflow:hidden;
box-shadow:0 0 12px rgba(0,0,0,.45);
transition:all .25s ease;

}

.elemento:hover{

transform:translateY(-5px);
border-color:#63d76a;
box-shadow:0 0 20px rgba(99,215,106,.55);

}

.elemento a{

display:block;
text-align:center;

}

.elemento img{

display:block;
width:70%;
height:240px;
object-fit:cover;
margin:18px auto 0 auto;

border:2px solid #2f7f43;
border-radius:10px;

transition:all .25s ease;

}

.elemento img:hover{

border-color:#63d76a;
transform:scale(1.03);

}

.elemento h2{

text-align:center;
margin:18px 10px 10px;
font-size:1.35em;

}

.info{

padding:0 15px 20px;
text-align:center;
font-size:.92em;
color:#d0d0d0;
line-height:1.45;

}

.volver{

text-align:center;
margin-top:45px;

}

.volver a{

display:inline-block;
padding:12px 24px;
background:#2f7f43;
color:white;
text-decoration:none;
border-radius:8px;
transition:.25s;

}

.volver a:hover{

background:#45a85a;

}

footer{

margin-top:50px;
padding:25px;
text-align:center;
border-top:1px solid #333;
color:#aaa;

}

@media (max-width:600px){

header img{

height:150px;

}

h1{

font-size:2em;

}

.elemento{

width:240px;

}

.elemento img{

width:70%;
height:220px;
margin:16px auto 0 auto;

}

}

</style>

</head>

<body>

<header>

<img src="cabeceramv.png" alt="Mundo Vegetal">

<main>
