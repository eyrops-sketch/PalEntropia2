Tu navegador no soporta audio HTML5.

<canvas id="visualizador"></canvas>

<script>

const audio = document.getElementById("audio");

const canvas = document.getElementById("visualizador");

const ctx = canvas.getContext("2d");

const audioContext = new AudioContext();

const analyser = audioContext.createAnalyser();

const source = audioContext.createMediaElementSource(audio);

source.connect(analyser);

analyser.connect(audioContext.destination);

analyser.fftSize = 256;

const datos = new Uint8Array(analyser.frequencyBinCount);

const suavizado = new Uint8Array(analyser.frequencyBinCount);

const onda = new Uint8Array(analyser.fftSize);

function dibujar(){

requestAnimationFrame(dibujar);

analyser.getByteFrequencyData(datos);

for(let i=0;i<datos.length;i++){

suavizado[i]=suavizado[i]*0.8+datos[i]*0.2;

}

ctx.clearRect(0,0,canvas.width,canvas.height);

// Barras

let x=0;

suavizado.forEach(valor=>{

let altura=valor/2;

ctx.fillStyle="#b84cff";

ctx.shadowBlur=15;

ctx.shadowColor="#b84cff";

ctx.fillRect(

x,

canvas.height-altura,

3,

altura

);

x+=4;

});

// Onda

analyser.getByteTimeDomainData(onda);

ctx.beginPath();

ctx.strokeStyle="#ffffff";

ctx.lineWidth=2;

let posicionX=0;

for(let i=0;i<onda.length;i++){

let y=(onda[i]/128.0)*canvas.height/2;

if(i===0){

ctx.moveTo(posicionX,y);

}else{

ctx.lineTo(posicionX,y);

}

posicionX+=canvas.width/onda.length;

}

ctx.stroke();

}

audio.addEventListener("play",()=>{

audioContext.resume();

});

dibujar();

</script>
