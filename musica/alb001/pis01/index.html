<h2>
🎧 Reproductor
</h2>


<audio id="audio" controls>

<source src="a_billion_winters.mp3"
type="audio/mpeg">

Tu navegador no soporta audio HTML5.

</audio>


<canvas id="visualizador"></canvas>


</section>

<script>

const audio = document.getElementById("audio");

const canvas = document.getElementById("visualizador");

const ctx = canvas.getContext("2d");


const audioContext = new AudioContext();

const analyser = audioContext.createAnalyser();


const source = audioContext.createMediaElementSource(audio);


source.connect(analyser);

analyser.connect(audioContext.destination);


analyser.fftSize = 256;


const datos = new Uint8Array(analyser.frequencyBinCount);

const suavizado = new Uint8Array(analyser.frequencyBinCount);



function dibujar(){


requestAnimationFrame(dibujar);



analyser.getByteFrequencyData(datos);



for(let i=0;i<datos.length;i++){

suavizado[i] = suavizado[i] * 0.8 + datos[i] * 0.2;

}



ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



let x = 0;



suavizado.forEach(valor=>{


let altura = valor / 2;



ctx.fillStyle="#b84cff";


ctx.shadowBlur=15;

ctx.shadowColor="#b84cff";



ctx.fillRect(

x,

canvas.height-altura,

3,

altura

);



x+=4;



});



}



audio.addEventListener("play",()=>{

audioContext.resume();

});



dibujar();


</script>
