<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constructor 1.4 | PalEntropía</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Constructor PalEntropía 1.4</h1>

<div id="buscador">
<input id="codigo" type="text" placeholder="Ej: 005_12">
<button onclick="buscarFicha()">Buscar</button>
<button onclick="abrirAnalisis()">Análisis</button>
</div>

<div id="ficha" style="display:none;">
<div id="titulo"></div>
<div id="cronologia"></div>
<img id="imagenPrincipal" src="">

<!-- VÍDEO -->
<div id="videoFicha"></div>

<div id="bloqueInfo"></div>

<h2>Estadísticas</h2>
<div id="estadisticas" class="stats"></div>

<div id="galeria">
<img id="img2" src="">
<img id="img3" src="">
</div>
</div>

<!-- =========================
     VISOR DE IMÁGENES
========================= -->
<div id="visorImagen">
<img id="imagenAmpliada" src="">
</div>

<!-- =========================
     BASES DE DATOS
========================= -->
<script src="paldb.js"></script>
<script src="palstats.js"></script>
<script src="palhab.js"></script>
<script src="palgeo.js"></script>
<script src="palmodo.js"></script>
<script src="palmedio.js"></script>
<script src="paltaxon.js"></script>
<script src="palvideo.js"></script>

<!-- =========================
     DECODIFICADORES
========================= -->
<script src="paldecoder.js"></script>
<script src="paldecoder2.js"></script>
<script src="paldecoder3.js"></script>

<script>
let paleofichas = [];

fetch("paleofichas.json")
.then(r => r.json())
.then(datos => {
    paleofichas = datos;
});

function abrirAnalisis(){
    const codigo = document.getElementById("codigo").value.trim();

    if(codigo===""){
        alert("Introduce un código.");
        return;
    }

    const ficha = paleofichas.find(f => f.codigo === codigo);

    if(!ficha){
        alert("Código no encontrado.");
        return;
    }

    window.location.href = "analisis.html?codigo=" + codigo;
}

function buscarFicha(){
    const codigo = document.getElementById("codigo").value.trim();

    const ficha = paleofichas.find(f => f.codigo === codigo);
    const db = PALDB.find(f => f.codigo === codigo);
    const stats = PALSTATS[codigo];
    const taxon = PALTAXON[codigo];

    if(!ficha || !db || !stats || !taxon){
        alert("Código no encontrado.");
        return;
    }

    document.getElementById("ficha").style.display="block";
     
    /*=========================================
      TÍTULO
    =========================================*/
    document.getElementById("titulo").innerHTML = ficha.nombre;

    /*=========================================
      CRONOLOGÍA
    =========================================*/
    const geo = PALDECODER.decodeCronologia(ficha.cronologia);
    let htmlGeo = `<div>${geo.rango}</div>`;

    if(geo.periodo_texto){
        htmlGeo += `<div><strong>Período:</strong> ${geo.periodo_texto}</div>`;
    }

    if(geo.subperiodo_texto){
        htmlGeo += `<div><strong>Subperíodo:</strong> ${geo.subperiodo_texto}</div>`;
    }

    document.getElementById("cronologia").innerHTML = htmlGeo;

    /*=========================================
      HÁBITATS
    =========================================*/
    const hab = PALDECODER.decodeHabitats(ficha.HP, ficha.HS);
    let habitats = "";

    if(hab.principales.length){
        habitats += "<b>Principales</b><br>";
        hab.principales.forEach(h => {
            habitats += "• " + h.nombre + "<br>";
        });
    }

    if(hab.secundarios.length){
        habitats += "<br><b>Secundarios</b><br>";
        hab.secundarios.forEach(h => {
            habitats += "• " + h.nombre + "<br>";
        });
    }

    /*=========================================
      MODO DE VIDA
    =========================================*/
    const modo = ficha.modo_vida ? PALDECODER2.decodeModoVida(ficha.modo_vida) : null;
    let textoModo = "";

    if(modo){
        textoModo = "<span class='campo'>Modo de vida</span><br>• " + modo.nombre;
    }

    /*=========================================
      MEDIO ECOLÓGICO
    =========================================*/
    const medioCompuesto = ficha.medio_compuesto ? PALDECODER2.decodeMedio(ficha.medio_compuesto) : null;
    let textoMedio = "";

    if(medioCompuesto){
        textoMedio = "<span class='campo'>Medio ecológico</span><br>";
        if(medioCompuesto.medio){
            textoMedio += "• " + medioCompuesto.medio.nombre + "<br>";
        }
        if(medioCompuesto.localizacion){
            textoMedio += "• " + medioCompuesto.localizacion.nombre + "<br>";
        }
        if(medioCompuesto.estrato){
            textoMedio += "• " + medioCompuesto.estrato.nombre + "<br>";
        }
        if(medioCompuesto.comportamiento){
            textoMedio += "• " + medioCompuesto.comportamiento.nombre + "<br>";
        }
    }

    /*=========================================
      TAXONOMÍA
    =========================================*/
    const arbolTaxonomia = "└─ " + taxon.ta1.split(">").map(t => t.trim()).join("<br>└─ ");

    /*=========================================
      BLOQUE PRINCIPAL
    =========================================*/
    document.getElementById("bloqueInfo").innerHTML =
        "<span class='campo'>Código</span><br>" + ficha.codigo +
        "<br><br><span class='campo'>Taxonomía</span><br>" + arbolTaxonomia +
        "<br><br><span class='campo'>Clasificación</span><br>" + taxon.ta2 +
        "<br><br>" + textoModo +
        "<br><br>" + textoMedio +
        "<br><br><span class='campo'>Dieta</span><br>" + ficha.dieta +
        "<br><br><span class='campo'>Anatomía</span><br>" + ficha.anatomia +
        "<br><br><span class='campo'>Hábitats</span><br>" + habitats;

    /*=========================================
      RUTA DE IMÁGENES
    =========================================*/
    const especie = db.carpeta.split("_").slice(2).join("_");
    const nombreArchivo = especie.charAt(0).toUpperCase() + especie.slice(1);
    const ruta = "../../paleofichas/vol" + String(db.volumen).padStart(3,"0") + "/" + db.carpeta + "/";

    /*=========================================
      CARGA DE IMÁGENES
    =========================================*/
    function cargarImagen(elemento, base){
        const img = document.getElementById(elemento);
        img.src = "";
        const extensiones = [".png", ".jpg", ".jpeg"];
        let indice = 0;

        function probar(){
            if(indice >= extensiones.length){
                return;
            }
            const url = ruta + base + extensiones[indice];
            const prueba = new Image();
            
            prueba.onload = function(){
                img.src = url;
            };
            
            prueba.onerror = function(){
                indice++;
                probar();
            };
            
            prueba.src = url;
        }
        probar();
    }

    cargarImagen("imagenPrincipal", nombreArchivo + "_i0");
    cargarImagen("img2", nombreArchivo + "_i2");
    cargarImagen("img3", nombreArchivo + "_i3");

    /*=========================================
      VÍDEO YOUTUBE
    =========================================*/
    const videoData = PALVIDEO[codigo];
    const bloqueVideo = document.getElementById("videoFicha");

    if(videoData && videoData.video){
        bloqueVideo.innerHTML = "<a href='" + videoData.video + "' target='_blank' class='botonVideo'>▶ Pulsar para ver imagen en movimiento</a>";
    } else {
        bloqueVideo.innerHTML = "";
    }

    /*=========================================
      ESTADÍSTICAS
    =========================================*/
    document.getElementById("estadisticas").innerHTML =
        "<div>Adaptabilidad: " + stats.adaptabilidad + "</div>" +
        "<div>Resistencia: " + stats.resistencia + "</div>" +
        "<div>Sociabilidad: " + stats.sociabilidad + "</div>" +
        "<div>Reproducción: " + stats.reproduccion + "</div>" +
        "<div>Ofensiva: " + stats.ofensiva + "</div>" +
        "<div>Defensa: " + stats.defensa + "</div>" +
        "<div>Movilidad: " + stats.movilidad + "</div>" +
        "<div>Plasticidad ecológica: " + stats.plasticidad_ecologica + "</div>" +
        "<div>Tamaño: " + stats.tamano + "</div>" +
        "<div>Velocidad: " + stats.velocidad + "</div>" +
        "<div>Inteligencia: " + stats.inteligencia + "</div>";
}
</script>

<!-- =========================
     LIGHTBOX IMÁGENES
========================= -->
<script>
const visor = document.getElementById("visorImagen");
const imagenAmpliada = document.getElementById("imagenAmpliada");

function ampliarImagen(src){
    if(!src){
        return;
    }
    imagenAmpliada.src = src;
    visor.style.display = "flex";
    document.body.style.overflow = "hidden";
}

function cerrarImagen(){
    visor.style.display = "none";
    imagenAmpliada.src = "";
    document.body.style.overflow = "auto";
}

document.getElementById("imagenPrincipal").onclick = function(){
    ampliarImagen(this.src);
};

document.getElementById("img2").onclick = function(){
    ampliarImagen(this.src);
};

document.getElementById("img3").onclick = function(){
    ampliarImagen(this.src);
};

visor.onclick = function(e){
    if(e.target === visor){
        cerrarImagen();
    }
};
</script>

</body>
</html>
