<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TEST CONTENEDOR</title>

<style>

body{

    font-family:Arial,sans-serif;

    margin:20px;

    background:#111;

    color:#eee;

}

h1{

    margin-bottom:20px;

}

input{

    padding:10px;

    font-size:16px;

    width:180px;

    box-sizing:border-box;

}

button{

    padding:10px 18px;

    margin-left:8px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    border:1px solid #777;

    border-radius:6px;

    background:#222;

    color:#fff;

}

button:hover{

    background:#333;

}

#estado{

    margin-top:20px;

}

.bloque{

    margin-top:15px;

    padding:15px;

    border:1px solid #555;

    border-radius:8px;

    background:#1b1b1b;

}

.campo{

    font-weight:bold;

}

.ok{

    color:#7cff9b;

}

.error{

    color:#ff7777;

}

ul{

    margin-top:8px;

}

</style>

</head>


<body>


<h1>TEST CONTENEDOR</h1>


<div>

<input
id="codigoInput"
type="text"
value="002_11"
placeholder="Ej: 002_11"
>

<button
onclick="cargarFicha()"
>
Cargar ficha
</button>

</div>


<div id="estado">

Esperando carga...

</div>


<div id="resultado"></div>


<!-- =========================================
     PALGEO
========================================= -->

<script src="palgeo.js"></script>


<!-- =========================================
     DECODIFICADOR GEO SIMPLIFICADO
========================================= -->

<script src="palgeosimplificado.js"></script>


<script>


/* =================================================
   VARIABLES
================================================= */

let registros = [];


/* =================================================
   CARGAR CSV
================================================= */

fetch("contenedor.csv")

.then(response=>{

    if(!response.ok){

        throw new Error(
            "No se pudo cargar contenedor.csv"
        );

    }

    return response.text();

})

.then(texto=>{

    const lineas =

        texto
        .trim()
        .split(/\r?\n/);


    if(!lineas.length){

        throw new Error(
            "El CSV está vacío"
        );

    }


    /*
    CABECERA
    */

    const cabecera =

        lineas[0]
        .split(",")
        .map(x=>x.trim());


    /*
    REGISTROS
    */

    registros = [];


    for(
        let i=1;
        i<lineas.length;
        i++
    ){

        if(!lineas[i].trim()){

            continue;

        }


        const valores =

            lineas[i]
            .split(",")
            .map(x=>x.trim());


        if(
            valores.length !==
            cabecera.length
        ){

            console.warn(
                "Fila incorrecta:",
                i+1
            );

            continue;

        }


        const registro = {};


        cabecera.forEach(
            (campo,index)=>{

                registro[campo] =
                    valores[index];

            }
        );


        registros.push(
            registro
        );

    }


    document.getElementById(
        "estado"
    ).innerHTML =

        "<span class='ok'>" +

        "✓ contenedor.csv cargado correctamente" +

        "</span><br>" +

        "Registros leídos: " +

        registros.length +

        "<br>" +

        "Columnas detectadas: " +

        cabecera.length;

})


.catch(error=>{

    console.error(error);

    document.getElementById(
        "estado"
    ).innerHTML =

        "<span class='error'>" +

        "✗ Error cargando contenedor.csv" +

        "</span><br>" +

        error.message;

});


/* =================================================
   CARGAR FICHA
================================================= */

function cargarFicha(){


    const codigo =

        document.getElementById(
            "codigoInput"
        )
        .value
        .trim();


    const resultado =

        document.getElementById(
            "resultado"
        );


    resultado.innerHTML = "";


    if(!codigo){

        resultado.innerHTML =

            "<div class='bloque error'>" +

            "Introduce un código." +

            "</div>";

        return;

    }


    /*
    BUSCAR J1
    */

    const registro =

        registros.find(
            r => r.j1 === codigo
        );


    if(!registro){

        resultado.innerHTML =

            "<div class='bloque error'>" +

            "✗ Ficha no encontrada: " +

            codigo +

            "</div>";

        return;

    }


    /*
    =============================================
    MOSTRAR CONTENEDOR
    =============================================
    */

    let html =

        "<div class='bloque'>" +

        "<h2>✓ Ficha encontrada: " +

        registro.j1 +

        "</h2>" +

        "<div>" +

        "<span class='campo'>j1:</span> " +

        registro.j1 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j2:</span> " +

        registro.j2 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j3:</span> " +

        registro.j3 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j4:</span> " +

        registro.j4 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j5:</span> " +

        registro.j5 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j6:</span> " +

        registro.j6 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j7:</span> " +

        registro.j7 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j8:</span> " +

        registro.j8 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j9:</span> " +

        registro.j9 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j10:</span> " +

        registro.j10 +

        "</div>" +

        "</div>";


    /* =================================================
       ESTADÍSTICAS
    ================================================= */

    html +=

        "<div class='bloque'>" +

        "<h2>Estadísticas E</h2>" +

        "<div>e1: " + registro.e1 + "</div>" +

        "<div>e2: " + registro.e2 + "</div>" +

        "<div>e3: " + registro.e3 + "</div>" +

        "<div>e4: " + registro.e4 + "</div>" +

        "<div>e5: " + registro.e5 + "</div>" +

        "<div>e6: " + registro.e6 + "</div>" +

        "<div>e7: " + registro.e7 + "</div>" +

        "<div>e8: " + registro.e8 + "</div>" +

        "<div>e9: " + registro.e9 + "</div>" +

        "<div>e10: " + registro.e10 + "</div>" +

        "<div>e11: " + registro.e11 + "</div>" +

        "</div>";


    /* =================================================
       PALEFICHA NORMALIZADA
    ================================================= */

    const paleoficha = {

        codigo:
            registro.j1,

        cronologia:
            registro.j3,

        HP:
            registro.j5,

        HS:
            registro.j6,

        modo_vida:
            registro.j9,

        medio_compuesto:
            registro.j10

    };


    /* =================================================
       DECODIFICACIÓN GEOCRONOLÓGICA
    ================================================= */

    let geo = null;


    if(
        window.PALGEOSIMPLIFICADO
    ){

        geo =

            PALGEOSIMPLIFICADO
            .analizar(
                paleoficha.cronologia
            );

    }


    /* =================================================
       MOSTRAR RESULTADO GEO
    ================================================= */

    html +=

        "<div class='bloque'>" +

        "<h2>Decodificación geológica</h2>";


    if(!geo){

        html +=

            "<div class='error'>" +

            "✗ No se pudo interpretar la cronología." +

            "</div>";

    }

    else{


        html +=

            "<div>" +

            "<span class='campo'>Cronología:</span> " +

            geo.cronologia +

            "</div>";


        html +=

            "<div>" +

            "<span class='campo'>Rango:</span> " +

            geo.rango +

            "</div>";


        /*
        CÓDIGOS PALGEO
        */

        html +=

            "<br>" +

            "<div class='campo'>" +

            "Códigos PALGEO:" +

            "</div>";


        if(
            geo.codes.length
        ){

            html += "<ul>";

            geo.codes.forEach(
                codigo=>{

                    html +=

                        "<li>" +

                        codigo +

                        "</li>";

                }
            );

            html += "</ul>";

        }

        else{

            html +=

                "<div>" +

                "Sin códigos encontrados." +

                "</div>";

        }


        /*
        PERÍODOS
        */

        html +=

            "<br>" +

            "<div class='campo'>" +

            "Período:" +

            "</div>";


        if(
            geo.periodo.length
        ){

            html += "<ul>";

            geo.periodo.forEach(
                periodo=>{

                    html +=

                        "<li>" +

                        periodo +

                        "</li>";

                }
            );

            html += "</ul>";

        }

        else{

            html +=

                "<div>" +

                "Sin período registrado." +

                "</div>";

        }


        /*
        EDAD / SUBPERÍODO
        */

        html +=

            "<br>" +

            "<div class='campo'>" +

            "Edad / Subperíodo:" +

            "</div>";


        if(
            geo.edad.length
        ){

            html += "<ul>";

            geo.edad.forEach(
                edad=>{

                    html +=

                        "<li>" +

                        edad +

                        "</li>";

                }
            );

            html += "</ul>";

        }

        else{

            html +=

                "<div>" +

                "Sin edad/subperíodo registrado." +

                "</div>";

        }

    }


    html +=

        "</div>";


    /* =================================================
       DATOS TRANSCRITOS
    ================================================= */

    html +=

        "<div class='bloque'>" +

        "<h2>Datos transcritos para Paleoficha</h2>" +

        "<div>codigo: " +

        paleoficha.codigo +

        "</div>" +

        "<div>cronologia: " +

        paleoficha.cronologia +

        "</div>" +

        "<div>HP: " +

        paleoficha.HP +

        "</div>" +

        "<div>HS: " +

        paleoficha.HS +

        "</div>" +

        "<div>modo_vida: " +

        paleoficha.modo_vida +

        "</div>" +

        "<div>medio_compuesto: " +

        paleoficha.medio_compuesto +

        "</div>" +

        "</div>";


    resultado.innerHTML = html;

}

</script>


</body>

</html>
