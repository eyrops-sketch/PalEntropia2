<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TEST CONTENEDOR</title>

<style>

body{

    font-family:Arial,sans-serif;

    margin:20px;

    background:#111;

    color:#eee;

}

h1{

    margin-bottom:20px;

}

input{

    padding:10px;

    font-size:16px;

    width:220px;

    box-sizing:border-box;

    background:#222;

    color:#fff;

    border:1px solid #777;

    border-radius:6px;

}

button{

    padding:10px 18px;

    margin-left:8px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    border:1px solid #777;

    border-radius:6px;

    background:#222;

    color:#fff;

}

button:hover{

    background:#333;

}

#estado{

    margin-top:20px;

}

.bloque{

    margin-top:15px;

    padding:15px;

    border:1px solid #555;

    border-radius:8px;

    background:#1b1b1b;

}

.campo{

    font-weight:bold;

}

.ok{

    color:#7cff9b;

}

.error{

    color:#ff7777;

}

.separador{

    margin-top:30px;

    padding-top:20px;

    border-top:2px solid #555;

}

</style>

</head>


<body>


<h1>TEST CONTENEDOR</h1>


<!-- =========================================
     BUSCADOR DEL CONTENEDOR
========================================= -->

<div>

<input
id="codigoInput"
type="text"
value="002_15"
placeholder="Ej: 002_15"
>

<button
onclick="cargarFicha()"
>
Cargar ficha
</button>

</div>


<div id="estado">

Esperando carga...

</div>


<div id="resultado"></div>


<!-- =========================================
     PALGEO
========================================= -->

<script src="palgeo.js"></script>


<!-- =========================================
     DECODIFICADOR GEO SIMPLIFICADO
========================================= -->

<script src="palgeosimplificado.js"></script>


<!-- =========================================
     DECODIFICADOR DEL CONTENEDOR
========================================= -->

<script src="palcontenedor_decoder.js"></script>


<script>


/* =================================================
   VARIABLES
================================================= */

let registros = [];


/* =================================================
   CARGAR CSV
================================================= */

fetch("contenedor.csv")

.then(response=>{

    if(!response.ok){

        throw new Error(
            "No se pudo cargar contenedor.csv"
        );

    }

    return response.text();

})

.then(texto=>{

    const lineas =

        texto
        .trim()
        .split(/\r?\n/);


    if(!lineas.length){

        throw new Error(
            "El CSV está vacío"
        );

    }


    /*
    CABECERA
    */

    const cabecera =

        lineas[0]
        .split(",")
        .map(x=>x.trim());


    /*
    REGISTROS
    */

    registros = [];


    for(
        let i=1;
        i<lineas.length;
        i++
    ){

        if(!lineas[i].trim()){

            continue;

        }


        const valores =

            lineas[i]
            .split(",")
            .map(x=>x.trim());


        if(
            valores.length !==
            cabecera.length
        ){

            console.warn(
                "Fila incorrecta:",
                i+1
            );

            continue;

        }


        const registro = {};


        cabecera.forEach(
            (campo,index)=>{

                registro[campo] =
                    valores[index];

            }
        );


        registros.push(
            registro
        );

    }


    document.getElementById(
        "estado"
    ).innerHTML =

        "<span class='ok'>" +

        "✓ contenedor.csv cargado correctamente" +

        "</span><br>" +

        "Registros leídos: " +

        registros.length +

        "<br>" +

        "Columnas detectadas: " +

        cabecera.length;

})


.catch(error=>{

    console.error(error);

    document.getElementById(
        "estado"
    ).innerHTML =

        "<span class='error'>" +

        "✗ Error cargando contenedor.csv" +

        "</span><br>" +

        error.message;

});


/* =================================================
   CARGAR FICHA
================================================= */

function cargarFicha(){


    const codigo =

        document.getElementById(
            "codigoInput"
        )
        .value
        .trim();


    const resultado =

        document.getElementById(
            "resultado"
        );


    resultado.innerHTML = "";


    if(!codigo){

        resultado.innerHTML =

            "<div class='bloque error'>" +

            "Introduce un código." +

            "</div>";

        return;

    }


    /*
    BUSCAR J1
    */

    const registro =

        registros.find(
            r => r.j1 === codigo
        );


    if(!registro){

        resultado.innerHTML =

            "<div class='bloque error'>" +

            "✗ Ficha no encontrada: " +

            codigo +

            "</div>";

        return;

    }


    /* =================================================
       MOSTRAR REGISTRO J
    ================================================= */

    let html =

        "<div class='bloque'>" +

        "<h2>✓ Ficha encontrada: " +

        registro.j1 +

        "</h2>" +

        "<div>" +

        "<span class='campo'>j1:</span> " +

        registro.j1 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j2:</span> " +

        registro.j2 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j3:</span> " +

        registro.j3 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j4:</span> " +

        registro.j4 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j5:</span> " +

        registro.j5 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j6:</span> " +

        registro.j6 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j7:</span> " +

        registro.j7 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j8:</span> " +

        registro.j8 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j9:</span> " +

        registro.j9 +

        "</div>" +

        "<div>" +

        "<span class='campo'>j10:</span> " +

        registro.j10 +

        "</div>" +

        "</div>";


    /* =================================================
       ESTADÍSTICAS E
    ================================================= */

    html +=

        "<div class='bloque'>" +

        "<h2>Estadísticas E</h2>" +

        "<div>e1: " + registro.e1 + "</div>" +

        "<div>e2: " + registro.e2 + "</div>" +

        "<div>e3: " + registro.e3 + "</div>" +

        "<div>e4: " + registro.e4 + "</div>" +

        "<div>e5: " + registro.e5 + "</div>" +

        "<div>e6: " + registro.e6 + "</div>" +

        "<div>e7: " + registro.e7 + "</div>" +

        "<div>e8: " + registro.e8 + "</div>" +

        "<div>e9: " + registro.e9 + "</div>" +

        "<div>e10: " + registro.e10 + "</div>" +

        "<div>e11: " + registro.e11 + "</div>" +

        "</div>";


    /* =================================================
       DECODIFICADOR DEL CONTENEDOR
    ================================================= */

    let datosDecodificados = null;


    if(
        window.PALCONTENEDOR_DECODER
    ){

        datosDecodificados =

            PALCONTENEDOR_DECODER
            .decodificarRegistro(
                registro
            );

    }


    /* =================================================
       DATOS TRANSCRITOS
    ================================================= */

    if(datosDecodificados){

        const p =

            datosDecodificados.paleoficha;


        html +=

            "<div class='bloque'>" +

            "<h2>Datos transcritos para Paleoficha</h2>" +

            "<div>codigo: " +

            p.codigo +

            "</div>" +

            "<div>cronologia: " +

            p.cronologia +

            "</div>" +

            "<div>HP: " +

            p.HP +

            "</div>" +

            "<div>HS: " +

            p.HS +

            "</div>" +

            "<div>modo_vida: " +

            p.modo_vida +

            "</div>" +

            "<div>medio_compuesto: " +

            p.medio_compuesto +

            "</div>" +

            "</div>";

    }


    /* =================================================
       DECODIFICACIÓN GEOCRONOLÓGICA
    ================================================= */

    const cronologia =

        datosDecodificados

        ?

        datosDecodificados
        .paleoficha
        .cronologia

        :

        registro.j3;


    let geo = null;


    if(
        window.PALGEOSIMPLIFICADO
    ){

        geo =

            PALGEOSIMPLIFICADO
            .analizar(
                cronologia
            );

    }


    /* =================================================
       RESULTADO GEO
    ================================================= */

    html +=

        "<div class='bloque'>" +

        "<h2>Decodificación geológica</h2>";


    if(!geo){

        html +=

            "<div class='error'>" +

            "✗ No se pudo interpretar la cronología." +

            "</div>";

    }

    else{

        html +=

            "<div>" +

            "<span class='campo'>Cronología:</span> " +

            geo.cronologia +

            "</div>";


        html +=

            "<div>" +

            "<span class='campo'>Rango:</span> " +

            geo.rango +

            "</div>";


        /* =========================================
           CÓDIGOS PALGEO
        ========================================= */

        html +=

            "<br>" +

            "<div class='campo'>" +

            "Códigos PALGEO:" +

            "</div>";


        if(
            geo.codes.length
        ){

            html += "<ul>";

            geo.codes.forEach(
                codigoGeo=>{

                    html +=

                        "<li>" +

                        codigoGeo +

                        "</li>";

                }
            );

            html += "</ul>";

        }

        else{

            html +=

                "<div>" +

                "Sin códigos encontrados." +

                "</div>";

        }


        /* =========================================
           PERÍODOS
        ========================================= */

        html +=

            "<br>" +

            "<div class='campo'>" +

            "Período:" +

            "</div>";


        if(
            geo.periodo.length
        ){

            html += "<div>";

            html +=

                geo.periodo.join(
                    " · "
                );

            html += "</div>";

        }

        else{

            html +=

                "<div>" +

                "Sin período registrado." +

                "</div>";

        }


        /* =========================================
           EDAD / SUBPERÍODO
        ========================================= */

        html +=

            "<br>" +

            "<div class='campo'>" +

            "Edad / Subperíodo:" +

            "</div>";


        if(
            geo.edad.length
        ){

            html += "<div>";

            html +=

                geo.edad.join(
                    " · "
                );

            html += "</div>";

        }

        else{

            html +=

                "<div>" +

                "Sin edad/subperíodo registrado." +

                "</div>";

        }

    }


    html +=

        "</div>";


    /* =================================================
       GUARDAR RESULTADO
    ================================================= */

    resultado.innerHTML = html;

}


/* =================================================
   PRUEBA INDEPENDIENTE DE PALGEOSIMPLIFICADO
================================================= */

function probarCronologia(){


    const texto =

        document.getElementById(
            "cronologiaPrueba"
        )
        .value
        .trim();


    const resultado =

        document.getElementById(
            "resultadoCronologia"
        );


    resultado.innerHTML = "";


    if(!texto){

        resultado.innerHTML =

            "<div class='bloque error'>" +

            "Introduce una cronología." +

            "</div>";

        return;

    }


    /*
    CONVERTIR FORMATO HUMANO
    A FORMATO INTERNO
    */

    const codificada =

        PALGEOSIMPLIFICADO
        .codificarRango(
            texto
        );


    if(!codificada){

        resultado.innerHTML =

            "<div class='bloque error'>" +

            "❌ Formato no válido." +

            "<br><br>" +

            "Ejemplos válidos:" +

            "<br>521 Ma - 201,3 Ma" +

            "<br>0521.0000-0201.3000" +

            "<br>21700 a - Actualidad" +

            "</div>";

        return;

    }


    /*
    ANALIZAR
    */

    const analisis =

        PALGEOSIMPLIFICADO
        .analizar(
            codificada
        );


    if(!analisis){

        resultado.innerHTML =

            "<div class='bloque error'>" +

            "❌ La cronología fue convertida " +

            "pero PALGEO no pudo analizarla." +

            "</div>";

        return;

    }


    let html =

        "<div class='bloque'>" +

        "<h2>✓ Cronología válida</h2>" +

        "<div>" +

        "<span class='campo'>Entrada:</span><br>" +

        texto +

        "</div>" +

        "<br>" +

        "<div>" +

        "<span class='campo'>Código interno:</span><br>" +

        codificada +

        "</div>" +

        "<br>" +

        "<div>" +

        "<span class='campo'>Rango:</span><br>" +

        analisis.rango +

        "</div>";


    /*
    PERÍODOS
    */

    html +=

        "<br><br>" +

        "<div class='campo'>" +

        "Períodos:" +

        "</div>";


    if(
        analisis.periodo.length
    ){

        html +=

            analisis.periodo.join(
                " · "
            );

    }

    else{

        html +=

            "Sin datos";

    }


    /*
    EDADES / SUBPERÍODOS
    */

    html +=

        "<br><br>" +

        "<div class='campo'>" +

        "Edades / subperíodos:" +

        "</div>";


    if(
        analisis.edad.length
    ){

        html +=

            analisis.edad.join(
                " · "
            );

    }

    else{

        html +=

            "Sin datos";

    }


    html +=

        "</div>";


    resultado.innerHTML = html;

}

</script>


<!-- =========================================
     PRUEBA INDEPENDIENTE
========================================= -->

<div class="separador">

<h2>Prueba PALGEOSIMPLIFICADO</h2>

<p>

Prueba una cronología sin utilizar el
constructor.

</p>


<input
id="cronologiaPrueba"
type="text"
placeholder="Ej: 521 Ma - 201,3 Ma"
>


<button
onclick="probarCronologia()"
>

Probar cronología

</button>


<div id="resultadoCronologia"></div>

</div>


</body>

</html>
