<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TEST CONTENEDOR</title><style>

body{
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #111;
    color: #eee;
}

h1{
    margin-bottom: 20px;
}

input{
    padding: 10px;
    font-size: 16px;
    width: 150px;
}

button{
    padding: 10px 15px;
    font-size: 16px;
    cursor: pointer;
}

#resultado{
    margin-top: 25px;
    padding: 20px;
    border: 1px solid #555;
    background: #1b1b1b;
    line-height: 1.6;
}

.ok{
    color: #7cff9b;
}

.error{
    color: #ff7777;
}

</style></head><body><h1>TEST CONTENEDOR</h1><input
id="codigo"
type="text"
value="002_11"
placeholder="j1"

«»

<button onclick="cargarFicha()">
    Cargar ficha
</button><div id="resultado">
    Esperando carga...
</div><script>

/*=========================================
CARGAR CONTENEDOR
=========================================*/

async function cargarFicha(){

    const codigo =
        document
        .getElementById("codigo")
        .value
        .trim();


    const salida =
        document
        .getElementById("resultado");


    salida.innerHTML =
        "Cargando contenedor.csv...";


    try{

        const respuesta =
            await fetch("contenedor.csv");


        if(!respuesta.ok){

            throw new Error(
                "HTTP " + respuesta.status
            );

        }


        const texto =
            await respuesta.text();


        salida.innerHTML =

            "<div class='ok'>" +

            "✓ contenedor.csv cargado correctamente" +

            "</div>" +

            "<br>" +

            "Código solicitado: " +

            codigo +

            "<br>" +

            "Tamaño del archivo: " +

            texto.length +

            " caracteres";


        console.log(
            "CONTENEDOR.CSV:"
        );

        console.log(texto);

    }


    catch(error){

        salida.innerHTML =

            "<div class='error'>" +

            "✗ Error cargando contenedor.csv" +

            "</div>" +

            "<br>" +

            error.message;


        console.error(error);

    }

}


/*=========================================
PRUEBA AUTOMÁTICA AL ABRIR
=========================================*/

cargarFicha();

</script></body></html>
