<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TEST CONTENEDOR</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    line-height:1.5;
}

h1{
    font-size:22px;
}

input{
    padding:10px;
    margin:5px 0;
    font-size:16px;
    width:180px;
    box-sizing:border-box;
    border:1px solid #999;
    border-radius:6px;
}

button{
    padding:10px 16px;
    margin:8px 0;
    font-size:16px;
    cursor:pointer;
    border:1px solid #777;
    border-radius:6px;
    background:#eee;
    box-shadow:0 2px 4px rgba(0,0,0,.25);
}

button:active{
    box-shadow:0 1px 2px rgba(0,0,0,.2);
    transform:translateY(1px);
}

.bloque{
    margin-top:20px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

.resultado{
    margin-top:15px;
    padding:12px;
    background:#f5f5f5;
    border-radius:6px;
    white-space:pre-wrap;
}

.ok{
    color:green;
}

.error{
    color:red;
}

.rangoEntrada{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
}

.rangoEntrada input{
    width:120px;
}

.separador{
    font-weight:bold;
    font-size:20px;
}

</style>

</head>


<body>


<h1>TEST CONTENEDOR</h1>


<!-- =====================================================
     ENTRADA DE CÓDIGO
====================================================== -->

<div class="bloque">

<input
id="codigoEntrada"
type="text"
value="002_15"
placeholder="Ej: 002_15">

<br>

<button
type="button"
onclick="cargarFicha()">

Cargar ficha

</button>

</div>


<!-- =====================================================
     RESULTADO DEL CONTENEDOR
====================================================== -->

<div
id="resultadoContenedor"
class="resultado">

Esperando carga...

</div>


<!-- =====================================================
     PRUEBA PALGEO SIMPLIFICADO
====================================================== -->

<div class="bloque">

<h2>Prueba PALGEOSIMPLIFICADO</h2>

<p>
Prueba una cronología sin utilizar el constructor.
</p>


<!-- =====================================================
     RANGO EN MA
====================================================== -->

<h3>Rango en Ma</h3>

<div class="rangoEntrada">

<input
id="maInicio"
type="number"
step="0.0001"
placeholder="521">

<span class="separador">Ma -</span>

<input
id="maFin"
type="number"
step="0.0001"
placeholder="201.3">

<span>Ma</span>

</div>


<br>

<button
type="button"
onclick="probarRangoMa()">

Probar rango Ma

</button>


<!-- =====================================================
     RANGO EN AÑOS
====================================================== -->

<h3>Rango en años</h3>

<div class="rangoEntrada">

<input
id="anosInicio"
type="number"
step="1"
placeholder="21700">

<span class="separador">a -</span>

<input
id="anosFin"
type="text"
placeholder="Actualidad">

</div>


<br>

<button
type="button"
onclick="probarRangoAnos()">

Probar rango en años

</button>


<div
id="resultadoPALGEO"
class="resultado">

Esperando prueba...

</div>

</div>


<!-- =====================================================
     BASES DE DATOS
====================================================== -->

<script src="palgeo.js"></script>

<script src="palgeosimplificado.js"></script>

<script src="palcontenedor_decoder.js"></script>


<script>


/* ======================================================
   VARIABLES
====================================================== */

let contenedor = [];


/* ======================================================
   CARGAR CONTENEDOR.CSV
====================================================== */

async function cargarContenedor(){

    try{

        const respuesta =
            await fetch("contenedor.csv");


        if(!respuesta.ok){

            throw new Error(
                "No se pudo cargar contenedor.csv"
            );

        }


        const texto =
            await respuesta.text();


        const lineas =
            texto
            .trim()
            .split(/\r?\n/);


        if(!lineas.length){

            throw new Error(
                "El archivo está vacío"
            );

        }


        const cabecera =
            lineas[0]
            .split(",")
            .map(x=>x.trim());


        contenedor = [];


        for(
            let i=1;
            i<lineas.length;
            i++
        ){

            if(!lineas[i].trim()){

                continue;

            }


            const valores =
                lineas[i]
                .split(",")
                .map(x=>x.trim());


            const registro = {};


            cabecera.forEach(
                (campo,indice)=>{

                    registro[campo] =
                        valores[indice] !== undefined
                        ?
                        valores[indice]
                        :
                        "";

                }
            );


            contenedor.push(registro);

        }


        return true;

    }

    catch(error){

        console.error(error);


        document.getElementById(
            "resultadoContenedor"
        ).innerHTML =

            "<span class='error'>" +

            "❌ Error cargando contenedor.csv" +

            "</span>";


        return false;

    }

}


/* ======================================================
   CARGAR FICHA
====================================================== */

async function cargarFicha(){

    const codigo =
        document
        .getElementById(
            "codigoEntrada"
        )
        .value
        .trim();


    const resultado =
        document.getElementById(
            "resultadoContenedor"
        );


    resultado.innerHTML =
        "Cargando contenedor.csv...";


    const cargado =
        await cargarContenedor();


    if(!cargado){

        return;

    }


    const registro =
        contenedor.find(
            r => r.j1 === codigo
        );


    if(!registro){

        resultado.innerHTML =

            "<span class='error'>" +

            "❌ Ficha no encontrada: " +

            codigo +

            "</span>";

        return;

    }


    const datos =
        PALCONTENEDOR_DECODER
        .decodificarRegistro(
            registro
        );


    if(!datos){

        resultado.innerHTML =

            "<span class='error'>" +

            "❌ No se pudo decodificar el registro." +

            "</span>";

        return;

    }


    const J = datos.J;

    const E = datos.E;

    const ficha = datos.paleoficha;


    let html = "";


    html +=
        "<span class='ok'>" +

        "✓ contenedor.csv cargado correctamente" +

        "</span><br><br>";


    html +=
        "<b>Registros leídos:</b> " +

        contenedor.length +

        "<br><br>";


    html +=
        "<b>✓ Ficha encontrada:</b> " +

        J.j1 +

        "<br><br>";


    html +=
        "<b>Contenedor J</b><br>";


    for(
        let i=1;
        i<=10;
        i++
    ){

        html +=
            "j" +
            i +
            ": " +
            J["j"+i] +
            "<br>";

    }


    html +=
        "<br><b>Estadísticas E</b><br>";


    for(
        let i=1;
        i<=11;
        i++
    ){

        html +=
            "e" +
            i +
            ": " +
            E["e"+i] +
            "<br>";

    }


    html +=
        "<br><b>Datos transcritos para Paleoficha</b><br>";


    html +=
        "codigo: " +
        ficha.codigo +
        "<br>";


    html +=
        "cronologia: " +
        ficha.cronologia +
        "<br>";


    html +=
        "HP: " +
        ficha.HP +
        "<br>";


    html +=
        "HS: " +
        ficha.HS +
        "<br>";


    html +=
        "modo_vida: " +
        ficha.modo_vida +
        "<br>";


    html +=
        "medio_compuesto: " +
        ficha.medio_compuesto +
        "<br>";


    resultado.innerHTML = html;

}


/* ======================================================
   PROBAR RANGO MA
====================================================== */

function probarRangoMa(){

    const inicioTexto =
        document
        .getElementById(
            "maInicio"
        )
        .value
        .trim();


    const finTexto =
        document
        .getElementById(
            "maFin"
        )
        .value
        .trim();


    const salida =
        document
        .getElementById(
            "resultadoPALGEO"
        );


    if(
        inicioTexto === "" ||
        finTexto === ""
    ){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ Introduce los dos valores del rango." +

            "</span>";

        return;

    }


    const inicio =
        parseFloat(
            inicioTexto
        );


    const fin =
        parseFloat(
            finTexto
        );


    if(
        isNaN(inicio) ||
        isNaN(fin)
    ){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ Los valores no son válidos." +

            "</span>";

        return;

    }


    if(inicio < fin){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ El primer valor debe ser mayor o igual que el segundo." +

            "</span>";

        return;

    }


    const cronologia =
        normalizarMa(inicio)
        +
        "-"
        +
        normalizarMa(fin);


    ejecutarPruebaPALGEO(
        cronologia
    );

}


/* ======================================================
   NORMALIZAR MA
====================================================== */

function normalizarMa(valor){

    const partes =
        valor
        .toFixed(4)
        .split(".");


    const entero =
        partes[0]
        .padStart(4,"0");


    const decimal =
        partes[1] || "0000";


    return (
        entero +
        "." +
        decimal
    );

}


/* ======================================================
   PROBAR RANGO EN AÑOS
====================================================== */

function probarRangoAnos(){

    const inicioTexto =
        document
        .getElementById(
            "anosInicio"
        )
        .value
        .trim();


    const finTexto =
        document
        .getElementById(
            "anosFin"
        )
        .value
        .trim();


    const salida =
        document
        .getElementById(
            "resultadoPALGEO"
        );


    if(
        inicioTexto === "" ||
        finTexto === ""
    ){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ Introduce los valores." +

            "</span>";

        return;

    }


    const inicio =
        parseFloat(
            inicioTexto
        );


    let fin;


    if(
        finTexto
        .toLowerCase()
        ===
        "actualidad"
    ){

        fin = 0;

    }

    else{

        fin =
            parseFloat(
                finTexto
            );

    }


    if(
        isNaN(inicio) ||
        isNaN(fin)
    ){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ Valor no válido." +

            "</span>";

        return;

    }


    if(inicio < fin){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ El primer valor debe representar una antigüedad mayor." +

            "</span>";

        return;

    }


    const inicioMa =
        inicio / 1000000;


    const finMa =
        fin / 1000000;


    const cronologia =
        normalizarMa(inicioMa)
        +
        "-"
        +
        normalizarMa(finMa);


    ejecutarPruebaPALGEO(
        cronologia
    );

}


/* ======================================================
   EJECUTAR PALGEOSIMPLIFICADO
====================================================== */

function ejecutarPruebaPALGEO(
    cronologia
){

    const salida =
        document
        .getElementById(
            "resultadoPALGEO"
        );


    salida.innerHTML =
        "Procesando...";


    try{

        const resultado =
            PALGEOSIMPLIFICADO
            .analizar(
                cronologia
            );


        if(!resultado){

            salida.innerHTML =

                "<span class='error'>" +

                "❌ Formato no válido o cronología no procesable." +

                "</span>";

            return;

        }


        let html = "";


        html +=
            "<b>Cronología interna:</b><br>" +

            resultado.cronologia +

            "<br><br>";


        html +=
            "<b>Rango:</b><br>" +

            resultado.rango +

            "<br><br>";


        html +=
            "<b>Códigos PALGEO:</b><br>" +

            (
                resultado.codes.length
                ?
                resultado.codes.join("<br>")
                :
                "Ninguno"
            ) +

            "<br><br>";


        html +=
            "<b>Período:</b><br>" +

            (
                resultado.periodo.length
                ?
                resultado.periodo.join(" · ")
                :
                "No disponible"
            ) +

            "<br><br>";


        html +=
            "<b>Edad / Subperíodo:</b><br>" +

            (
                resultado.edad.length
                ?
                resultado.edad.join(" · ")
                :
                "No disponible"
            );


        salida.innerHTML =
            html;

    }

    catch(error){

        console.error(error);


        salida.innerHTML =

            "<span class='error'>" +

            "❌ Error ejecutando PALGEOSIMPLIFICADO." +

            "</span>";

    }

}

</script>


</body>

</html>
