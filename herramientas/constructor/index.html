<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Constructor | PalEntropía</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#111;
color:#eee;
padding:40px;
}

h1{
color:#6cf;
}

input{
padding:10px;
font-size:18px;
width:180px;
}

button{
padding:10px 20px;
font-size:18px;
cursor:pointer;
margin-left:10px;
}

#resultado{

margin-top:30px;
padding:20px;

background:#222;

border-radius:10px;

white-space:pre-line;

}

</style>

</head>

<body>

<h1>Constructor PalEntropía</h1>

<p>Introduce un código de Paleoficha.</p>

<input
id="codigo"
type="text"
placeholder="Ej: 004_12">

<button onclick="buscarFicha()">
Buscar
</button>

<div id="resultado">
Esperando búsqueda...
</div>

<script src="paldb.js"></script>
<script src="palstats.js"></script>
<script src="palhab.js"></script>
<script src="palgeo.js"></script>

<script>

let paleofichas=[];

fetch("paleofichas.json")
.then(r=>r.json())
.then(datos=>{

paleofichas=datos;

});

function buscarFicha(){

const codigo=document.getElementById("codigo").value.trim();

const ficha=paleofichas.find(f=>f.codigo===codigo);

const db=PALDB.find(f=>f.codigo===codigo);

const stats=PALSTATS[codigo];

const salida=document.getElementById("resultado");

if(!ficha){

salida.innerHTML="Código no encontrado.";

return;

}

salida.innerHTML=

"Nombre: "+ficha.nombre+

"\n\nCódigo: "+ficha.codigo+

"\nCronología: "+ficha.cronologia+

"\nMedio: "+ficha.medio+

"\n\nHP: "+ficha.HP+

"\nHS: "+ficha.HS+

"\n\nDieta: "+ficha.dieta+

"\n\nAnatomía: "+ficha.anatomia+

"\n\nCarpeta: "+db.carpeta+

"\nVolumen: "+db.volumen+

"\nPosición: "+db.posicion+

"\n\nAdaptabilidad: "+stats.adaptabilidad+

"\nResistencia: "+stats.resistencia+

"\nSociabilidad: "+stats.sociabilidad+

"\nReproducción: "+stats.reproduccion+

"\nOfensiva: "+stats.ofensiva+

"\nDefensa: "+stats.defensa+

"\nMovilidad: "+stats.movilidad+

"\nPlasticidad ecológica: "+stats.plasticidad_ecologica+

"\nTamaño: "+stats.tamano+

"\nVelocidad: "+stats.velocidad+

"\nInteligencia: "+stats.inteligencia;

}

</script>

</body>

</html>
