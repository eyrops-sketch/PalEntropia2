<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Constructor | PalEntropía</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#111;
color:#eee;
padding:40px;
}

h1{
color:#6cf;
}

#estado{
margin-top:20px;
padding:20px;
background:#222;
border-radius:10px;
}

.ok{
color:#7CFC00;
}

.error{
color:#ff6666;
}

</style>

</head>

<body>

<h1>Constructor PalEntropía</h1>

<p>Comprobando carga de archivos...</p>

<div id="estado">
Cargando...
</div>

<script src="paldb.js"></script>
<script src="palstats.js"></script>
<script src="palhab.js"></script>
<script src="palgeo.js"></script>

<script>

const estado=document.getElementById("estado");

try{

estado.innerHTML=`
<p class="ok">✔ PALDB cargado: ${PALDB.length} registros</p>
<p class="ok">✔ PALSTATS cargado: ${Object.keys(PALSTATS).length} registros</p>
<p class="ok">✔ PALHAB cargado: ${Object.keys(PALHAB).length} registros</p>
<p class="ok">✔ PALGEO cargado: ${Object.keys(PALGEO).length} registros</p>
`;

}catch(e){

estado.innerHTML=`
<p class="error">Error cargando archivos.</p>
<pre>${e}</pre>
`;

}

</script>

<script>
fetch("paleofichas.json")
.then(r => r.json())
.then(datos => {

    console.log(datos);

    const p=document.createElement("p");
    p.style.color="lime";
    p.textContent="✔ paleofichas.json cargado: "+datos.length+" registros";
    document.body.appendChild(p);

})
.catch(error=>{

    const p=document.createElement("p");
    p.style.color="red";
    p.textContent="✖ Error cargando paleofichas.json";
    document.body.appendChild(p);

    console.error(error);

});
</script>



  
</body>

</html>
