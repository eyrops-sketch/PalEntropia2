/* ======================================================
   VARIABLES
====================================================== */

let contenedor = [];

let paleofichas = [];


/* ======================================================
   CARGAR CONTENEDOR.CSV
====================================================== */

async function cargarContenedor(){

    try{

        const respuesta =
            await fetch("contenedor.csv");


        if(!respuesta.ok){

            throw new Error(
                "No se pudo cargar contenedor.csv"
            );

        }


        const texto =
            await respuesta.text();


        const lineas =
            texto
            .trim()
            .split(/\r?\n/);


        if(!lineas.length){

            throw new Error(
                "El archivo está vacío"
            );

        }


        const cabecera =
            lineas[0]
            .split(",")
            .map(
                x => x.trim()
            );


        contenedor = [];


        for(
            let i = 1;
            i < lineas.length;
            i++
        ){

            if(!lineas[i].trim()){

                continue;

            }


            const valores =
                lineas[i]
                .split(",")
                .map(
                    x => x.trim()
                );


            const registro = {};


            cabecera.forEach(
                (campo,indice)=>{

                    registro[campo] =
                        valores[indice] !== undefined
                        ?
                        valores[indice]
                        :
                        "";

                }
            );


            contenedor.push(
                registro
            );

        }


        return true;

    }

    catch(error){

        console.error(error);

        document.getElementById(
            "resultadoCarga"
        ).innerHTML =

            "<span class='error'>" +

            "❌ Error cargando contenedor.csv" +

            "</span>";

        return false;

    }

}


/* ======================================================
   CARGAR PALEOFICHAS.JSON
====================================================== */

async function cargarPaleofichas(){

    try{

        const respuesta =
            await fetch("paleofichas.json");


        if(!respuesta.ok){

            throw new Error(
                "No se pudo cargar paleofichas.json"
            );

        }


        paleofichas =
            await respuesta.json();


        if(!Array.isArray(paleofichas)){

            throw new Error(
                "paleofichas.json no contiene un array válido"
            );

        }


        return true;

    }

    catch(error){

        console.error(error);

        return false;

    }

}


/* ======================================================
   CARGAR FICHA
====================================================== */

async function cargarFicha(){

    const codigo =
        document
        .getElementById(
            "codigoEntrada"
        )
        .value
        .trim();


    const salida =
        document
        .getElementById(
            "resultadoCarga"
        );


    salida.innerHTML =
        "Cargando datos...";


    /*
    ======================================================
    CARGAR AMBAS FUENTES
    ======================================================
    */

    const csvOK =
        await cargarContenedor();


    if(!csvOK){

        return;

    }


    const jsonOK =
        await cargarPaleofichas();


    if(!jsonOK){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ No se pudo cargar paleofichas.json" +

            "</span>";

        return;

    }


    /*
    ======================================================
    BUSCAR REGISTRO DEL CONTENEDOR POR J1
    ======================================================
    */

    const registro =
        contenedor.find(
            r =>
                String(r.j1)
                .trim()
                ===
                codigo
        );


    if(!registro){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ Ficha no encontrada: " +

            escapeHTML(codigo) +

            "</span>";

        return;

    }


    /*
    ======================================================
    DECODIFICAR REGISTRO
    ======================================================
    */

    const datos =
        PALCONTENEDOR_DECODER
        .decodificarRegistro(
            registro
        );


    if(!datos){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ No se pudo decodificar el registro." +

            "</span>";

        return;

    }


    const J = datos.J;

    const E = datos.E;

    const ficha =
        datos.paleoficha;


    /*
    ======================================================
    BUSCAR LA PALEOFICHA CORRESPONDIENTE EN JSON
    USANDO J1 COMO PUNTERO
    ======================================================
    */

    const fichaJSON =
        paleofichas.find(
            f =>
                String(f.codigo)
                .trim()
                ===
                String(J.j1)
                .trim()
        );


    if(!fichaJSON){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ Registro encontrado en CSV, " +

            "pero no existe una Paleoficha con código " +

            escapeHTML(J.j1) +

            " en paleofichas.json." +

            "</span>";

        return;

    }


    /*
    ======================================================
    DATOS INTERPRETADOS DESDE JSON
    ======================================================
    */

    const nombre =
        fichaJSON.nombre
        ||
        "";


    const dieta =
        fichaJSON.dieta
        ||
        "";


    const anatomia =
        fichaJSON.anatomia
        ||
        "";


    /*
    ======================================================
    DECODIFICACIÓN GEOLÓGICA
    ======================================================
    */

    let geo = null;


    if(
        J.j3 &&
        window.PALGEOSIMPLIFICADO
    ){

        geo =
            PALGEOSIMPLIFICADO
            .analizar(
                J.j3
            );

    }


    /*
    ======================================================
    RESULTADO
    ======================================================
    */

    let html = "";


    /*
    ======================================================
    ESTADO
    ======================================================
    */

    html +=

        "<div class='ok'>" +

        "✓ Registro identificado" +

        "</div>";


    html +=

        "<div class='seccion'>" +

        "<b>Registros leídos:</b> " +

        contenedor.length +

        "</div>";


    /*
    ======================================================
    DATOS BRUTOS
    ======================================================
    */

    html +=

        "<h2>DATOS BRUTOS DEL CONTENEDOR</h2>";


    html +=

        "<div class='resultado bruto'>" +

        "<b>Contenedor J</b>\n";


    for(
        let i = 1;
        i <= 10;
        i++
    ){

        html +=

            "j" +
            i +
            ": " +
            escapeHTML(
                J["j"+i]
            ) +
            "\n";

    }


    html +=

        "\n<b>Estadísticas E</b>\n";


    for(
        let i = 1;
        i <= 11;
        i++
    ){

        html +=

            "e" +
            i +
            " → " +
            escapeHTML(
                E["e"+i]
            ) +
            "\n";

    }


    html +=

        "</div>";


    /*
    ======================================================
    PALEOFICHA INTERPRETADA
    ======================================================
    */

    html +=

        "<h2>PALEOFICHA INTERPRETADA</h2>";


    html +=

        "<div class='paleoficha'>";


    /*
    CÓDIGO
    */

    html +=

        "<div class='linea'>" +

        "<span class='campo'>" +

        "Código:" +

        "</span> " +

        escapeHTML(
            J.j1
        ) +

        "</div>";


    /*
    NOMBRE
    */

    html +=

        "<div class='seccion'>" +

        "<span class='campo'>" +

        "Nombre:" +

        "</span><br>" +

        escapeHTML(
            nombre
        ) +

        "</div>";


    /*
    CRONOLOGÍA
    */

    html +=

        "<div class='seccion'>" +

        "<span class='campo'>" +

        "Cronología:" +

        "</span> ";


    if(
        geo &&
        geo.rango
    ){

        html +=

            escapeHTML(
                geo.rango
            );

    }

    else{

        html +=

            escapeHTML(
                J.j3
            );

    }


    html +=

        "</div>";


    /*
    PERÍODO
    */

    html +=

        "<div class='seccion'>" +

        "<span class='campo'>" +

        "Período:" +

        "</span><br>";


    if(
        geo &&
        geo.periodo &&
        geo.periodo.length
    ){

        html +=

            escapeHTML(
                geo.periodo.join(
                    " · "
                )
            );

    }

    else{

        html +=

            "No disponible";

    }


    html +=

        "</div>";


    /*
    EDAD / SUBPERÍODO
    */

    html +=

        "<div class='seccion'>" +

        "<span class='campo'>" +

        "Edad / Subperíodo:" +

        "</span><br>";


    if(
        geo &&
        geo.edad &&
        geo.edad.length
    ){

        html +=

            escapeHTML(
                geo.edad.join(
                    " · "
                )
            );

    }

    else{

        html +=

            "No disponible";

    }


    html +=

        "</div>";


    /*
    ======================================================
    DIETA
    ======================================================
    */

    html +=

        "<div class='seccion'>" +

        "<span class='campo'>" +

        "Dieta:" +

        "</span><br>" +

        escapeHTML(
            dieta
        ) +

        "</div>";


    /*
    ======================================================
    ANATOMÍA
    ======================================================
    */

    html +=

        "<div class='seccion'>" +

        "<span class='campo'>" +

        "Anatomía:" +

        "</span><br>" +

        escapeHTML(
            anatomia
        ) +

        "</div>";


    /*
    ======================================================
    CAMPOS TODAVÍA SIN DECODIFICAR
    ======================================================
    */

    html +=

        "<div class='seccion'>" +

        "(Aún por decodificar)" +

        "</div>";


    /*
    HP
    */

    html +=

        "<div class='seccion'>" +

        "<span class='campo'>" +

        "HP:" +

        "</span> " +

        escapeHTML(
            J.j5
        ) +

        "</div>";


    /*
    HS
    */

    html +=

        "<div class='linea'>" +

        "<span class='campo'>" +

        "HS:" +

        "</span> " +

        escapeHTML(
            J.j6
        ) +

        "</div>";


    /*
    MODO DE VIDA
    */

    html +=

        "<div class='linea'>" +

        "<span class='campo'>" +

        "modo_vida:" +

        "</span> " +

        escapeHTML(
            J.j9
        ) +

        "</div>";


    /*
    MEDIO ECOLÓGICO
    */

    html +=

        "<div class='linea'>" +

        "<span class='campo'>" +

        "medio_compuesto:" +

        "</span> " +

        escapeHTML(
            J.j10
        ) +

        "</div>";


    html +=

        "</div>";


    /*
    ======================================================
    CORRESPONDENCIA DE CAMPOS
    ======================================================
    */

    html +=

        "<h2>INTERPRETACIÓN DE CAMPOS</h2>";


    html +=

        "<div class='resultado bruto'>";


    html +=

        "j1 → Código → " +

        escapeHTML(
            J.j1
        ) +

        "\n\n";


    html +=

        "j2 → Nombre → " +

        escapeHTML(
            nombre
        ) +

        "\n\n";


    html +=

        "j3 → Cronología → " +

        escapeHTML(
            J.j3
        ) +

        "\n\n";


    html +=

        "j5 → HP → " +

        escapeHTML(
            J.j5
        ) +

        "\n\n";


    html +=

        "j6 → HS → " +

        escapeHTML(
            J.j6
        ) +

        "\n\n";


    html +=

        "j7 → Dieta → " +

        escapeHTML(
            dieta
        ) +

        "\n\n";


    html +=

        "j8 → Anatomía → " +

        escapeHTML(
            anatomia
        ) +

        "\n\n";


    html +=

        "j9 → Modo de vida → " +

        escapeHTML(
            J.j9
        ) +

        "\n\n";


    html +=

        "j10 → Medio ecológico → " +

        escapeHTML(
            J.j10
        );


    html +=

        "</div>";


    /*
    ======================================================
    ESTADÍSTICAS
    ======================================================
    */

    html +=

        "<h2>ESTADÍSTICAS</h2>";


    html +=

        "<div class='resultado bruto'>";


    for(
        let i = 1;
        i <= 11;
        i++
    ){

        html +=

            "e" +
            i +
            " → " +
            escapeHTML(
                E["e"+i]
            ) +
            "\n";

    }


    html +=

        "</div>";


    salida.innerHTML =
        html;

}


/* ======================================================
   ESCAPAR HTML
====================================================== */

function escapeHTML(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}








    

    
/* ======================================================
   PRUEBA MANUAL PALGEOSIMPLIFICADO
====================================================== */

function probarRangoMa(){

    const inicioTexto =
        document
        .getElementById(
            "maInicio"
        )
        .value
        .trim();


    const finTexto =
        document
        .getElementById(
            "maFin"
        )
        .value
        .trim();


    const salida =
        document
        .getElementById(
            "resultadoPALGEO"
        );


    if(
        inicioTexto === "" ||
        finTexto === ""
    ){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ Introduce los dos valores." +

            "</span>";

        return;

    }


    const inicio =
        parseFloat(
            inicioTexto
        );


    const fin =
        parseFloat(
            finTexto
        );


    if(
        isNaN(inicio) ||
        isNaN(fin)
    ){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ Los valores no son válidos." +

            "</span>";

        return;

    }


    if(inicio < fin){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ El primer valor debe ser mayor o igual que el segundo." +

            "</span>";

        return;

    }


    const cronologia =
        normalizarMa(inicio)
        +
        "-"
        +
        normalizarMa(fin);


    ejecutarPALGEO(
        cronologia
    );

}


/* ======================================================
   NORMALIZAR MA
====================================================== */

function normalizarMa(valor){

    const partes =
        Number(valor)
        .toFixed(4)
        .split(".");


    const entero =
        partes[0]
        .padStart(
            4,
            "0"
        );


    const decimal =
        partes[1] ||
        "0000";


    return (
        entero +
        "." +
        decimal
    );

}

<script>


/* ======================================================
   PRUEBA RANGO EN AÑOS
====================================================== */

function probarRangoAnos(){

    const inicioTexto =
        document
        .getElementById("anosInicio")
        .value
        .trim();


    const finTexto =
        document
        .getElementById("anosFin")
        .value
        .trim();


    const salida =
        document
        .getElementById("resultadoPALGEO");


    /*
    COMPROBAR CAMPOS
    */

    if(
        inicioTexto === "" ||
        finTexto === ""
    ){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ Introduce los dos valores." +

            "</span>";

        return;

    }


    /*
    PRIMER VALOR
    */

    const inicio =
        parseFloat(
            inicioTexto
        );


    /*
    SEGUNDO VALOR

    Puede ser:

    21700
    Actualidad
    */

    let fin;


    if(
        finTexto.toLowerCase()
        ===
        "actualidad"
    ){

        fin = 0;

    }

    else{

        fin =
            parseFloat(
                finTexto
            );

    }


    /*
    VALIDAR
    */

    if(
        isNaN(inicio) ||
        isNaN(fin)
    ){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ Valor no válido." +

            "</span>";

        return;

    }


    /*
    SENTIDO TEMPORAL

    El primer valor debe ser
    más antiguo que el segundo.
    */

    if(inicio < fin){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ El primer valor debe representar una antigüedad mayor." +

            "</span>";

        return;

    }


    /*
    CONVERTIR A Ma
    */

    const inicioMa =
        inicio / 1000000;


    const finMa =
        fin / 1000000;


    /*
    CONSTRUIR FORMATO INTERNO

    Ejemplo:

    21700 a - Actualidad

    ↓

    0000.0217-0000.0000

    */

    const cronologia =
        normalizarMa(
            inicioMa
        )
        +
        "-"
        +
        normalizarMa(
            finMa
        );


    /*
    PASAR A PALGEOSIMPLIFICADO
    */

    ejecutarPALGEO(
        cronologia
    );

}


/* ======================================================
   NORMALIZAR MA
====================================================== */

function normalizarMa(valor){

    const partes =
        Number(valor)
        .toFixed(4)
        .split(".");


    const entero =
        partes[0]
        .padStart(
            4,
            "0"
        );


    const decimal =
        partes[1]
        ||
        "0000";


    return (

        entero
        +
        "."
        +
        decimal

    );

}


/* ======================================================
   EJECUTAR PALGEOSIMPLIFICADO
====================================================== */

function ejecutarPALGEO(
    cronologia
){

    const salida =
        document
        .getElementById(
            "resultadoPALGEO"
        );


    /*
    COMPROBAR QUE EXISTE EL DECODIFICADOR
    */

    if(
        !window.PALGEOSIMPLIFICADO
    ){

        salida.innerHTML =

            "<span class='error'>" +

            "❌ PALGEOSIMPLIFICADO no está cargado." +

            "</span>";

        return;

    }


    try{

        const resultado =
            PALGEOSIMPLIFICADO
            .analizar(
                cronologia
            );


        /*
        RESULTADO NO VÁLIDO
        */

        if(!resultado){

            salida.innerHTML =

                "<span class='error'>" +

                "❌ Formato no válido o cronología no procesable." +

                "</span>";

            return;

        }


        /*
        CONSTRUIR RESULTADO
        */

        let html = "";


        /*
        CRONOLOGÍA INTERNA
        */

        html +=

            "<b>Cronología interna:</b><br>" +

            escapeHTML(
                resultado.cronologia
            ) +

            "<br><br>";


        /*
        RANGO HUMANO
        */

        html +=

            "<b>Rango:</b><br>" +

            escapeHTML(

<script>

/* ======================================================
   PRUEBA RANGO MA
====================================================== */

function probarRangoMa(){

    const inicioTexto =
        document
        .getElementById("maInicio")
        .value
        .trim();

    const finTexto =
        document
        .getElementById("maFin")
        .value
        .trim();

    const salida =
        document
        .getElementById("resultadoPALGEO");


    if(
        inicioTexto === "" ||
        finTexto === ""
    ){

        salida.innerHTML =
            "<span class='error'>" +
            "❌ Introduce los dos valores." +
            "</span>";

        return;

    }


    const inicio =
        parseFloat(inicioTexto);

    const fin =
        parseFloat(finTexto);


    if(
        isNaN(inicio) ||
        isNaN(fin)
    ){

        salida.innerHTML =
            "<span class='error'>" +
            "❌ Los valores no son válidos." +
            "</span>";

        return;

    }


    if(inicio < fin){

        salida.innerHTML =
            "<span class='error'>" +
            "❌ El primer valor debe ser mayor o igual que el segundo." +
            "</span>";

        return;

    }


    const cronologia =
        normalizarMa(inicio)
        +
        "-"
        +
        normalizarMa(fin);


    ejecutarPALGEO(cronologia);

}


/* ======================================================
   NORMALIZAR MA
====================================================== */

function normalizarMa(valor){

    const partes =
        Number(valor)
        .toFixed(4)
        .split(".");


    const entero =
        partes[0]
        .padStart(4,"0");


    const decimal =
        partes[1] ||
        "0000";


    return (
        entero +
        "." +
        decimal
    );

}


/* ======================================================
   PRUEBA RANGO EN AÑOS
====================================================== */

function probarRangoAnos(){

    const inicioTexto =
        document
        .getElementById("anosInicio")
        .value
        .trim();


    const finTexto =
        document
        .getElementById("anosFin")
        .value
        .trim();


    const salida =
        document
        .getElementById("resultadoPALGEO");


    if(
        inicioTexto === "" ||
        finTexto === ""
    ){

        salida.innerHTML =
            "<span class='error'>" +
            "❌ Introduce los dos valores." +
            "</span>";

        return;

    }


    const inicio =
        parseFloat(inicioTexto);


    let fin;


    if(
        finTexto
        .toLowerCase()
        ===
        "actualidad"
    ){

        fin = 0;

    }

    else{

        fin =
            parseFloat(finTexto);

    }


    if(
        isNaN(inicio) ||
        isNaN(fin)
    ){

        salida.innerHTML =
            "<span class='error'>" +
            "❌ Valor no válido." +
            "</span>";

        return;

    }


    if(inicio < fin){

        salida.innerHTML =
            "<span class='error'>" +
            "❌ El primer valor debe representar una antigüedad mayor." +
            "</span>";

        return;

    }


    /*
    CONVERTIR A MILLONES DE AÑOS
    */

    const inicioMa =
        inicio / 1000000;


    const finMa =
        fin / 1000000;


    /*
    CONSTRUIR CRONOLOGÍA INTERNA
    */

    const cronologia =
        normalizarMa(inicioMa)
        +
        "-"
        +
        normalizarMa(finMa);


    ejecutarPALGEO(cronologia);

}


/* ======================================================
   EJECUTAR PALGEOSIMPLIFICADO
====================================================== */

function ejecutarPALGEO(cronologia){

    const salida =
        document
        .getElementById("resultadoPALGEO");


    if(
        !window.PALGEOSIMPLIFICADO
    ){

        salida.innerHTML =
            "<span class='error'>" +
            "❌ PALGEOSIMPLIFICADO no está cargado." +
            "</span>";

        return;

    }


    try{

        const resultado =
            PALGEOSIMPLIFICADO
            .analizar(
                cronologia
            );


        if(!resultado){

            salida.innerHTML =
                "<span class='error'>" +
                "❌ Formato no válido o cronología no procesable." +
                "</span>";

            return;

        }


        let html = "";


        html +=
            "<b>Cronología interna:</b><br>" +
            escapeHTML(
                resultado.cronologia
            ) +
            "<br><br>";


        html +=
            "<b>Rango:</b><br>" +
            escapeHTML(
                resultado.rango
            ) +
            "<br><br>";


        html +=
            "<b>Período:</b><br>";


        if(
            resultado.periodo &&
            resultado.periodo.length
        ){

            html +=
                escapeHTML(
                    resultado.periodo.join(
                        " · "
                    )
                );

        }

        else{

            html +=
                "No disponible";

        }


        html +=
            "<br><br>";


        html +=
            "<b>Edad / Subperíodo:</b><br>";


        if(
            resultado.edad &&
            resultado.edad.length
        ){

            html +=
                escapeHTML(
                    resultado.edad.join(
                        " · "
                    )
                );

        }

        else{

            html +=
                "No disponible";

        }


        salida.innerHTML =
            html;

    }

    catch(error){

        console.error(error);

        salida.innerHTML =
            "<span class='error'>" +
            "❌ Error ejecutando PALGEOSIMPLIFICADO." +
            "</span>";

    }

}


/* ======================================================
   ESCAPAR HTML
====================================================== */

function escapeHTML(valor){

    return String(
        valor ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
