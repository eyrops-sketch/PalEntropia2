<script src="../generador_fase_2/palhab.js"></script>

<script src="../generador_fase_2/palmedio.js"></script>

<script src="palarena.js"></script>


<script>

/*
============================================================
palentropía — arena 2
archivo: pruebaarena_2.html
versión: desarrollo
parte: 1/2
============================================================
*/


const RUTA_PALEOFICHAS =
    "../generador_fase_2/paleofichas.json";


const RUTA_GENERADOR =
    "../generador_fase_2/generador_fase_2.html";


let PALEOFICHAS_ARENA = {};

let COMBATE_ARENA = null;


/* ==========================================================
   ESCAPAR HTML
   ========================================================== */

function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return "";

    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================================
   CARGAR PALEOFICHAS.JSON
   ========================================================== */

async function cargarPaleofichasArena() {

    const respuesta =
        await fetch(
            RUTA_PALEOFICHAS
        );


    if (!respuesta.ok) {

        throw new Error(
            "No se pudo cargar paleofichas.json"
        );

    }


    const fichas =
        await respuesta.json();


    if (!Array.isArray(fichas)) {

        throw new Error(
            "paleofichas.json no contiene un array válido."
        );

    }


    PALEOFICHAS_ARENA = {};


    fichas.forEach(
        function(ficha) {

            if (
                !ficha ||
                !ficha.codigo
            ) {

                return;

            }


            PALEOFICHAS_ARENA[
                String(
                    ficha.codigo
                ).trim()
            ] = ficha;

        }
    );


    return fichas.length;

}


/* ==========================================================
   OBTENER PALEOFICHA
   ========================================================== */

function obtenerPaleofichaArena(codigo) {

    return PALEOFICHAS_ARENA[
        String(codigo).trim()
    ] || null;

}


/* ==========================================================
   OBTENER NOMBRE REAL
   ========================================================== */

function obtenerNombreArena(codigo) {

    const ficha =
        obtenerPaleofichaArena(
            codigo
        );


    if (
        ficha &&
        ficha.nombre
    ) {

        return ficha.nombre;

    }


    return "Nombre no disponible";

}


/* ==========================================================
   OBTENER DOS FICHAS ALEATORIAS
   ========================================================== */

function obtenerDosFichasAleatoriasArena() {

    if (
        !window.PALARENA_DATOS ||
        !window.PALARENA_DATOS.datos ||
        !window.PALARENA_DATOS.datos.length
    ) {

        throw new Error(
            "No hay datos cargados en PALARENA_DATOS."
        );

    }


    const fichasValidas =
        window.PALARENA_DATOS.datos.filter(
            function(fila) {

                return (
                    fila &&
                    fila.j1 &&
                    obtenerPaleofichaArena(
                        fila.j1
                    )
                );

            }
        );


    if (
        fichasValidas.length < 2
    ) {

        throw new Error(
            "No hay suficientes Paleofichas válidas."
        );

    }


    const indice1 =
        Math.floor(
            Math.random() *
            fichasValidas.length
        );


    let indice2 =
        Math.floor(
            Math.random() *
            fichasValidas.length
        );


    while (
        indice2 === indice1
    ) {

        indice2 =
            Math.floor(
                Math.random() *
                fichasValidas.length
            );

    }


    return [

        fichasValidas[indice1],

        fichasValidas[indice2]

    ];

}


/* ==========================================================
   CONVERTIR ESTADÍSTICA
   ========================================================== */

function numeroArena(valor) {

    const numero =
        Number(valor);


    return Number.isFinite(numero)
        ? numero
        : 0;

}


/* ==========================================================
   MOSTRAR ESTADÍSTICAS
   ========================================================== */

function generarEstadisticasArena(datos) {

    const estadisticas = [

        ["e1", "Adaptabilidad"],
        ["e2", "Sociabilidad"],
        ["e3", "Resistencia"],
        ["e4", "Reproducción"],
        ["e5", "Ofensiva"],
        ["e6", "Defensa"],
        ["e7", "Movilidad"],
        ["e8", "Plasticidad ecológica"],
        ["e9", "Tamaño"],
        ["e10", "Velocidad"],
        ["e11", "Inteligencia"]

    ];


    let html = "";


    estadisticas.forEach(
        function(stat) {

            html += `

                <div class="stat">

                    <span>
                        ${escaparHTML(stat[1])}
                    </span>

                    <span>
                        ${numeroArena(
                            datos.estadisticas[
                                stat[0]
                            ]
                        )}
                    </span>

                </div>

            `;

        }
    );


    return html;

}


/* ==========================================================
   CREAR DATOS DEL COMBATIENTE
   ========================================================== */

function crearDatosCombatienteArena(codigo) {

    const datos =
        window.PALARENA_DATOS.preparar(
            codigo
        );


    if (!datos) {

        throw new Error(
            "No se pudo preparar la Paleoficha " +
            codigo
        );

    }


    return {

        codigo:
            datos.j1,

        nombre:
            obtenerNombreArena(
                datos.j1
            ),

        modo:
            datos.modo,

        habitats:
            datos.habitats,

        estadisticas:
            datos.estadisticas

    };

}


/* ==========================================================
   MOSTRAR COMBATIENTE
   ========================================================== */

function mostrarCombatienteArena(datos) {

    const enlace =
        RUTA_GENERADOR +
        "?codigo=" +
        encodeURIComponent(
            datos.codigo
        );


    const habitatsHTML =
        datos.habitats
            .filter(
                function(codigo) {

                    return (
                        codigo &&
                        codigo !== "H000"
                    );

                }
            )
            .map(
                function(codigo) {

                    const habitat =
                        window.PALARENA_DATOS
                            .obtenerHabitat(
                                codigo
                            );


                    const nombre =
                        habitat &&
                        habitat.nombre
                            ? habitat.nombre
                            : "";


                    return `

                        <div class="habitat">

                            <strong>
                                ${escaparHTML(codigo)}
                            </strong>

                            ${
                                nombre
                                    ? " — " +
                                      escaparHTML(nombre)
                                    : ""
                            }

                        </div>

                    `;

                }
            )
            .join("");


    const modoDatos =
        window.PALARENA_DATOS
            .obtenerModo(
                datos.modo
            );


    const modoNombre =
        modoDatos &&
        modoDatos.nombre
            ? modoDatos.nombre
            : "";


    return `

        <div class="combatiente">

            <div class="nombre">

                🦖 ${escaparHTML(
                    datos.nombre
                )}

            </div>


            <div class="codigoFicha">

                Código:
                ${escaparHTML(
                    datos.codigo
                )}

            </div>


            <div class="seccion">

                <h3>
                    🧬 Modo de vida
                </h3>

                <div class="dato">

                    <strong>
                        ${escaparHTML(
                            datos.modo
                        )}
                    </strong>

                    ${
                        modoNombre
                            ? " — " +
                              escaparHTML(
                                  modoNombre
                              )
                            : ""
                    }

                </div>

            </div>


            <div class="seccion">

                <h3>
                    🏠 Hábitats
                </h3>

                ${
                    habitatsHTML ||
                    '<div class="habitat">Ninguno</div>'
                }

            </div>


            <div class="seccion">

                <h3>
                    📊 Estadísticas
                </h3>

                ${generarEstadisticasArena({
                    estadisticas:
                        datos.estadisticas
                })}

            </div>


            <a
                class="enlace"
                href="${escaparHTML(enlace)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                📖 Consultar Paleoficha
            </a>

        </div>

    `;

}


/* ==========================================================
   PREPARAR COMBATE
   ========================================================== */

function prepararCombateArena(
    datos1,
    datos2
) {

    try {

        if (
            typeof crearCombatienteArena !==
            "function"
        ) {

            throw new Error(
                "palarena.js no está cargado correctamente."
            );

        }


        const combatiente1 =
            crearCombatienteArena({
                ...datos1,
                j1: datos1.codigo,
                j2: datos1.nombre,
                ...datos1.estadisticas
            });


        const combatiente2 =
            crearCombatienteArena({
                ...datos2,
                j1: datos2.codigo,
                j2: datos2.nombre,
                ...datos2.estadisticas
            });


        COMBATE_ARENA =
            crearCombateArena(
                {
                    ...datos1,
                    j1: datos1.codigo,
                    j2: datos1.nombre,
                    ...datos1.estadisticas
                },
                {
                    ...datos2,
                    j1: datos2.codigo,
                    j2: datos2.nombre,
                    ...datos2.estadisticas
                }
            );


        const ataque1 =
            obtenerAtaqueArena(
                combatiente1.ataque_especial
            );


        const ataque2 =
            obtenerAtaqueArena(
                combatiente2.ataque_especial
            );


        document.getElementById(
            "panelCombate"
        ).style.display = "block";


        document.getElementById(
            "panelResultadoCombate"
        ).style.display = "none";


        document.getElementById(
            "combatientesPreparados"
        ).innerHTML = `

            <div>

                <strong>
                    ${escaparHTML(
                        combatiente1.nombre
                    )}
                </strong>

                <br>

                ❤️ HP:
                ${numeroArena(
                    combatiente1.hp_max
                )}

                <br>

                ⚡ Iniciativa:
                ${numeroArena(
                    combatiente1.iniciativa
                )}

                <br>

                ⚔️ Ataque especial:
                ${escaparHTML(
                    combatiente1.ataque_especial
                )}

                ${
                    ataque1 && ataque1.nombre
                        ? " — " +
                          escaparHTML(
                              ataque1.nombre
                          )
                        : ""
                }

            </div>


            <hr>


            <div>

                <strong>
                    ${escaparHTML(
                        combatiente2.nombre
                    )}
                </strong>

                <br>

                ❤️ HP:
                ${numeroArena(
                    combatiente2.hp_max
                )}

                <br>

                ⚡ Iniciativa:
                ${numeroArena(
                    combatiente2.iniciativa
                )}

                <br>

                ⚔️ Ataque especial:
                ${escaparHTML(
                    combatiente2.ataque_especial
                )}

                ${
                    ataque2 && ataque2.nombre
                        ? " — " +
                          escaparHTML(
                              ataque2.nombre
                          )
                        : ""
                }

            </div>

        `;

    } catch (error) {
            console.error(
            "Error preparando combate:",
            error
        );


        document.getElementById(
            "panelResultadoCombate"
        ).style.display = "block";


        document.getElementById(
            "ganadorCombate"
        ).innerHTML = `

            <span class="error">

                ❌ ${escaparHTML(
                    error.message
                )}

            </span>

        `;

    }

}


/* ==========================================================
   EJECUTAR COMBATE AUTOMÁTICO
   ========================================================== */

function ejecutarCombateAutomaticoArena() {

    try {

        if (!COMBATE_ARENA) {

            throw new Error(
                "No hay un combate preparado."
            );

        }


        while (
    COMBATE_ARENA.estado !==
    "finalizado"
) {

    ejecutarTurnoArena(
        COMBATE_ARENA
    );

}

const resultado = {

    ganador:
        COMBATE_ARENA.ganador,

    combatiente1:
        COMBATE_ARENA.combatiente1,

    combatiente2:
        COMBATE_ARENA.combatiente2,

    historial:
        COMBATE_ARENA.historial

};


        document.getElementById(
            "panelResultadoCombate"
        ).style.display = "block";


        document.getElementById(
            "ganadorCombate"
        ).innerHTML = `

            🏆 Ganador:
            <strong>
                ${escaparHTML(
                    resultado.ganador
                )}
            </strong>

        `;


        document.getElementById(
            "estadoCombatientes"
        ).innerHTML = `

            <div class="combateFicha">

                <h3>
                    ${escaparHTML(
                        resultado.combatiente1.nombre
                    )}
                </h3>

                ❤️ HP:
                ${numeroArena(
                    resultado.combatiente1.hp
                )}

                <div class="barraHp">

                    <div
                        class="barraHpInterior"
                        style="width:${
                            numeroArena(
                                resultado.combatiente1.porcentajeHp
                            )
                        }%;"
                    ></div>

                </div>

            </div>


            <div class="combateFicha">

                <h3>
                    ${escaparHTML(
                        resultado.combatiente2.nombre
                    )}
                </h3>

                ❤️ HP:
                ${numeroArena(
                    resultado.combatiente2.hp
                )}

                <div class="barraHp">

                    <div
                        class="barraHpInterior"
                        style="width:${
                            numeroArena(
                                resultado.combatiente2.porcentajeHp
                            )
                        }%;"
                    ></div>

                </div>

            </div>

        `;


        document.getElementById(
            "historialCombate"
        ).innerHTML =

            resultado.historial
                .map(
                    function(turno) {

                        return `

                            <div class="turnoCombate">

                                ${escaparHTML(
                                    turno
                                )}

                            </div>

                        `;

                    }
                )
                .join("");


    } catch (error) {

        console.error(
            "Error ejecutando combate:",
            error
        );


        document.getElementById(
            "panelResultadoCombate"
        ).style.display = "block";


        document.getElementById(
            "ganadorCombate"
        ).innerHTML = `

            <span class="error">

                ❌ ${escaparHTML(
                    error.message
                )}

            </span>

        `;

    }

}


/* ==========================================================
   NUEVO COMBATE
   ========================================================== */

function nuevoCombateArena() {

    try {

        const seleccion =
            obtenerDosFichasAleatoriasArena();


        const fila1 =
            seleccion[0];


        const fila2 =
            seleccion[1];


        const datos1 =
            crearDatosCombatienteArena(
                fila1.j1
            );


        const datos2 =
            crearDatosCombatienteArena(
                fila2.j1
            );


        document.getElementById(
            "codigo1"
        ).textContent =
            datos1.codigo;


        document.getElementById(
            "codigo2"
        ).textContent =
            datos2.codigo;


        document.getElementById(
            "resultado"
        ).innerHTML =

            mostrarCombatienteArena(
                datos1
            ) +

            mostrarCombatienteArena(
                datos2
            );


        prepararCombateArena(
            datos1,
            datos2
        );

    } catch (error) {

        console.error(
            "Error creando nuevo combate:",
            error
        );


        document.getElementById(
            "estado"
        ).innerHTML = `

            <span class="error">

                ✗ ${
                    escaparHTML(
                        error.message
                    )
                }

            </span>

        `;

    }

}


/* ==========================================================
   CARGAR DATOS
   ========================================================== */

async function iniciarArena() {

    try {

        document.getElementById(
            "estado"
        ).innerHTML =

            "⏳ Cargando datos...";


        /*
        --------------------------------------------------
        1. Cargar paleofichas
        --------------------------------------------------
        */

        await cargarPaleofichasArena();


        /*
        --------------------------------------------------
        2. Cargar master mediante PALARENA_DATOS
        --------------------------------------------------
        */

        const cargado =
            await window.PALARENA_DATOS
                .cargar();


        if (!cargado) {

            throw new Error(
                "No se pudo cargar master.csv"
            );

        }


        document.getElementById(
            "estado"
        ).innerHTML = `

            <span class="ok">

                ✓ Paleofichas cargadas correctamente

            </span>

        `;


        /*
        --------------------------------------------------
        3. Generar dos fichas aleatorias
        --------------------------------------------------
        */

        nuevoCombateArena();

    } catch (error) {

        console.error(
            "Error iniciando Arena:",
            error
        );


        document.getElementById(
            "estado"
        ).innerHTML = `

            <span class="error">

                ✗ ${
                    escaparHTML(
                        error.message
                    )
                }

            </span>

        `;

    }

}


/* ==========================================================
   BOTÓN NUEVO COMBATE
   ========================================================== */

document.getElementById(
    "btnNuevo"
).addEventListener(
    "click",
    nuevoCombateArena
);


/* ==========================================================
   BOTÓN EJECUTAR COMBATE
   ========================================================== */

document.getElementById(
    "btnEjecutarCombate"
).addEventListener(
    "click",
    ejecutarCombateAutomaticoArena
);


/* ==========================================================
   INICIO
   ========================================================== */

iniciarArena();

</script>

</body>

</html>
