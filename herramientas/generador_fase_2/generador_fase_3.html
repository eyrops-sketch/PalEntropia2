<!-- =====================================================
     ALMACÉN MAESTRO
     ===================================================== -->

<script>

window.MASTER_ACTUAL = null;


window.cargarMasterPorJ1 =
async function(j1) {

    if (
        j1 === undefined ||
        j1 === null ||
        String(j1).trim() === ""
    ) {

        window.MASTER_ACTUAL = null;

        return null;

    }


    const respuesta =
        await fetch("master.csv");


    if (!respuesta.ok) {

        throw new Error(
            "No se pudo cargar master.csv."
        );

    }


    const texto =
        await respuesta.text();


    const lineas =
        texto.split(/\r?\n/);


    for (const linea of lineas) {

        if (!linea.trim()) {

            continue;

        }


        const columnas =
            linea.split(",");


        if (columnas.length < 21) {

            continue;

        }


        const codigo =
            String(
                columnas[0]
            ).trim();


        if (
            codigo !==
            String(j1).trim()
        ) {

            continue;

        }


        window.MASTER_ACTUAL = {

            j1: columnas[0]?.trim() || "",
            j2: columnas[1]?.trim() || "",
            j3: columnas[2]?.trim() || "",
            j4: columnas[3]?.trim() || "",
            j5: columnas[4]?.trim() || "",
            j6: columnas[5]?.trim() || "",
            j7: columnas[6]?.trim() || "",
            j8: columnas[7]?.trim() || "",
            j9: columnas[8]?.trim() || "",
            j10: columnas[9]?.trim() || "",

            e1: columnas[10]?.trim() || "",
            e2: columnas[11]?.trim() || "",
            e3: columnas[12]?.trim() || "",
            e4: columnas[13]?.trim() || "",
            e5: columnas[14]?.trim() || "",
            e6: columnas[15]?.trim() || "",
            e7: columnas[16]?.trim() || "",
            e8: columnas[17]?.trim() || "",
            e9: columnas[18]?.trim() || "",
            e10: columnas[19]?.trim() || "",
            e11: columnas[20]?.trim() || ""

        };


        return window.MASTER_ACTUAL;

    }


    window.MASTER_ACTUAL = null;

    return null;

};

</script>

     ===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        try {

            await window.PALNAVEGADOR.inicializar();


            const parametros =
                new URLSearchParams(
                    window.location.search
                );


            const codigo =
                parametros.get("codigo");


            const arena =
                parametros.get("arena");


            const esArena =
                arena === "1" ||
                arena === "2";


            let codigoArenaInicial =
                codigo;


            if (codigo) {

                await window.PALNAVEGADOR.cargarPorCodigo(
                    codigo
                );


                if (esArena) {

                    setInterval(
                        function() {

                            const codigoActual =
                                window.PALNAVEGADOR.codigoActual;


                            if (
                                codigoActual &&
                                codigoActual !==
                                codigoArenaInicial
                            ) {

                                localStorage.setItem(
                                    "palentropia_arena_seleccion",
                                    JSON.stringify({

                                        arena:
                                            arena,

                                        codigo:
                                            codigoActual

                                    })
                                );


                                codigoArenaInicial =
                                    codigoActual;

                            }

                        },
                        500
                    );

                }


                return;

            }


            await window.PALNAVEGADOR.aleatorio();

        }

        catch (error) {

            console.error(
                "VISOR DE PALEOFICHAS: error durante el arranque.",
                error
            );

        }

    }
);

</script>

<script>

function abrirIndiceTorneo() {

    /*
    =====================================================
    MATRIZ DE PARTICIPANTES
    =====================================================
    */

    let matriz = [];


    /*
    =====================================================
    SI EXISTE UNA MATRIZ DEL BUSCADOR
    =====================================================
    */

    if (
        window.PALNAVEGADOR &&
        typeof window.PALNAVEGADOR.estaEnMatriz ===
        "function" &&
        window.PALNAVEGADOR.estaEnMatriz()
    ) {

        if (
            window.MATRIXFILTRO &&
            typeof window.MATRIXFILTRO.actualizar ===
            "function"
        ) {

            matriz =
                window.MATRIXFILTRO.actualizar();

        }


        /*
        Si MATRIXFILTRO no devuelve resultados,
        usamos directamente su matriz actual.
        */

        if (
            !Array.isArray(matriz) &&
            window.MATRIXFILTRO &&
            Array.isArray(
                window.MATRIXFILTRO.datos
            )
        ) {

            matriz =
                window.MATRIXFILTRO.datos;

        }


        /*
        Normalizar matriz.
        */

        matriz =
            Array.isArray(matriz)
                ? matriz
                    .map(
                        codigo =>
                            String(
                                codigo || ""
                            ).trim()
                    )
                    .filter(Boolean)
                    .filter(
                        (codigo, indice, array) =>
                            array.indexOf(codigo) === indice
                    )
                : [];

    }


    /*
    =====================================================
    SELECCIÓN RÁPIDA
    =====================================================

    Cuando NO hay una matriz activa:

        15 aleatorias del conjunto general

        +

        la paleoficha actualmente cargada

        =

        16 participantes
    */

    if (
        !window.PALNAVEGADOR ||
        !window.PALNAVEGADOR.estaEnMatriz ||
        !window.PALNAVEGADOR.estaEnMatriz()
    ) {

        const codigoActual =
            window.PALNAVEGADOR &&
            window.PALNAVEGADOR.codigoActual
                ? String(
                    window.PALNAVEGADOR.codigoActual
                  ).trim()
                : "";


        /*
        =================================================
        OBTENER CONJUNTO GENERAL
        =================================================
        */

        const registros =
            window.PALNAVEGADOR &&
            Array.isArray(
                window.PALNAVEGADOR.registros
            )
                ? window.PALNAVEGADOR.registros
                : [];


        /*
        =================================================
        OBTENER CÓDIGOS
        =================================================
        */

        let todosLosCodigos =
            registros
                .map(
                    registro => {

                        if (
                            window.PALNAVEGADOR &&
                            typeof window.PALNAVEGADOR
                                .obtenerCodigoRegistro ===
                            "function"
                        ) {

                            return window.PALNAVEGADOR
                                .obtenerCodigoRegistro(
                                    registro
                                );

                        }

                        return "";

                    }
                )
                .map(
                    codigo =>
                        String(
                            codigo || ""
                        ).trim()
                )
                .filter(Boolean)
                .filter(
                    (codigo, indice, array) =>
                        array.indexOf(codigo) === indice
                );


        /*
        =================================================
        EXCLUIR LA PALEOFICHA ACTUAL
        =================================================
        */

        todosLosCodigos =
            todosLosCodigos.filter(
                codigo =>
                    codigo !== codigoActual
            );


        /*
        =================================================
        MEZCLAR ALEATORIAMENTE
        =================================================
        */

        for (
            let i =
                todosLosCodigos.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );


            [
                todosLosCodigos[i],
                todosLosCodigos[j]
            ] =
            [
                todosLosCodigos[j],
                todosLosCodigos[i]
            ];

        }


        /*
        =================================================
        TOMAR 15 ALEATORIAS
        =================================================
        */

        matriz =
            todosLosCodigos.slice(
                0,
                15
            );


        /*
        =================================================
        AÑADIR LA PALEOFICHA ACTUAL
        =================================================
        */

        if (codigoActual) {

            matriz.push(
                codigoActual
            );

        }

    }


    /*
    =====================================================
    CRITERIO DE BÚSQUEDA DEL TORNEO
    =====================================================

    CAB16 utiliza buscarUniversal como campo
    real del buscador.

    Guardamos exactamente el texto introducido.
    No lo transformamos aquí.

    La transformación visual se realizará
    posteriormente en combates.html.
    */

    const campoBusqueda =
        document.getElementById(
            "buscarUniversal"
        );


    const criterioTorneo =
        campoBusqueda
            ? String(
                campoBusqueda.value || ""
              ).trim()
            : "";


    /*
    =====================================================
    GUARDAR PARTICIPANTES
    =====================================================
    */

    localStorage.setItem(
        "palentropia_matriz_combatientes",
        JSON.stringify(matriz)
    );


    /*
    =====================================================
    GUARDAR CRITERIO DEL TORNEO
    =====================================================
    */

    localStorage.setItem(
        "palentropia_criterio_torneo",
        criterioTorneo
    );


    /*
    =====================================================
    ACTIVAR MODO TORNEO
    =====================================================
    */

    localStorage.setItem(
        "palentropia_modotorneo",
        "true"
    );


    console.log(
        "PalEntropía — matriz transferida al torneo:",
        matriz
    );


    console.log(
        "PalEntropía — criterio del torneo:",
        criterioTorneo
    );


    console.log(
        "PalEntropía — modotorneo:",
        true
    );


    /*
    =====================================================
    IR AL ÍNDICE DEL TORNEO
    =====================================================
    */

    window.location.href =
        "../torneo/index.html";

}


document.addEventListener(
    "DOMContentLoaded",
    function() {

        const boton =
            document.getElementById(
                "botonIndiceTorneo"
            );


        if (!boton) {

            return;

        }


        boton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                abrirIndiceTorneo();

            }
        );

    }
);

</script>

<script>

function abrirModoArena() {

    /*
    =====================================================
    OBTENER J1 ACTUAL
    =====================================================
    */

    const codigo =
        window.PALNAVEGADOR &&
        window.PALNAVEGADOR.codigoActual
            ? String(
                window.PALNAVEGADOR.codigoActual
              ).trim()
            : "";


    if (!codigo) {

        return;

    }


    /*
    =====================================================
    ACTIVAR MODO ARENA
    =====================================================
    */

    localStorage.setItem(
        "palentropia_modotorneo",
        "false"
    );


    /*
    =====================================================
    CONSERVAR J1 ACTUAL
    =====================================================
    */

    localStorage.setItem(
        "palentropia_arena_seleccion",
        JSON.stringify({

            arena: "directa",

            codigo:
                codigo

        })
    );


    console.log(
        "PalEntropía — modo arena:",
        false
    );


    console.log(
        "PalEntropía — j1 conservado:",
        codigo
    );


    /*
    =====================================================
    IR A ARENA.HTML
    =====================================================
    */

    window.location.href =
        "../torneo/arena.html" +
        "?codigo=" +
        encodeURIComponent(codigo);

}


document.addEventListener(
    "DOMContentLoaded",
    function() {

        const botonArena =
            document.getElementById(
                "botonModoArena"
            );


        if (!botonArena) {

            return;

        }


        botonArena.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                abrirModoArena();

            }
        );

    }
);

</script>
