<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Test MatrixFiltro → MatrixNavegador</title>

<style>

body {

    margin: 0;

    padding: 20px;

    background: #0b0d0f;

    color: #ffffff;

    font-family: Arial, sans-serif;

}

h1 {

    text-align: center;

}

.estado {

    text-align: center;

    margin: 15px 0;

    opacity: .8;

}

button {

    display: block;

    margin: 20px auto;

    padding: 12px 20px;

    border: 2px solid #62d6ff;

    border-radius: 20px;

    background: #15191d;

    color: #ffffff;

    cursor: pointer;

    font-weight: 600;

}

#resultado {

    margin-top: 20px;

    padding: 15px;

    background: #15191d;

    border: 1px solid #62d6ff;

    border-radius: 12px;

    overflow-x: auto;

}

pre {

    white-space: pre-wrap;

    word-break: break-word;

    color: #62d6ff;

}

</style>

</head>


<body>


<h1>
    Test MatrixFiltro → MatrixNavegador
</h1>


<div class="estado">

    Códigos de prueba:

    004_03 · 004_07 · 004_11 · 005_02

</div>


<button id="probar">

    PROBAR CONEXIÓN

</button>


<div id="resultado">

    Esperando prueba...

</div>


<!-- =====================================================
     MATRIXNAVEGADOR
     ===================================================== -->

<script src="matrixnavegador.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const boton =
            document.getElementById(
                "probar"
            );


        const salida =
            document.getElementById(
                "resultado"
            );


        boton.addEventListener(
            "click",
            async function() {

                try {

                    /*
                    =====================================
                    PASO 1
                    MATRIZ QUE ENTREGA MATRIXFILTRO
                    =====================================
                    */

                    const matrizFiltro = [

                        "004_03",
                        "004_07",
                        "004_11",
                        "005_02"

                    ];


                    /*
                    =====================================
                    PASO 2
                    MATRIXNAVEGADOR RECIBE LOS J1
                    =====================================
                    */

                    const matrizNavegador =

                        await window.MatrixNavegador.obtener(
                            matrizFiltro
                        );


                    /*
                    =====================================
                    PASO 3
                    MOSTRAR RESULTADO
                    =====================================
                    */

                    console.log(
                        "MatrizFiltro:",
                        matrizFiltro
                    );


                    console.log(
                        "MatrixNavegador:",
                        matrizNavegador
                    );


                    salida.innerHTML =

                        "<pre>" +

                        "MATRIXFILTRO\n\n" +

                        JSON.stringify(
                            matrizFiltro,
                            null,
                            4
                        ) +

                        "\n\n====================\n\n" +

                        "MATRIXNAVEGADOR\n\n" +

                        JSON.stringify(
                            matrizNavegador,
                            null,
                            4
                        ) +

                        "</pre>";

                }

                catch(error) {

                    console.error(
                        error
                    );


                    salida.innerHTML =

                        "<pre>" +

                        "ERROR: " +

                        error.message +

                        "</pre>";

                }

            }
        );

    }
);

</script>


</body>

</html>
