<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Test MatrixNavegador</title>

<style>

body {

    margin: 0;

    padding: 20px;

    background: #0b0d0f;

    color: #ffffff;

    font-family: Arial, sans-serif;

}


h1 {

    text-align: center;

}


#resultado {

    margin-top: 20px;

    padding: 15px;

    background: #15191d;

    border: 1px solid #62d6ff;

    border-radius: 12px;

    overflow-x: auto;

}


pre {

    white-space: pre-wrap;

    word-break: break-word;

    color: #62d6ff;

}


.estado {

    text-align: center;

    margin: 15px 0;

    opacity: 0.8;

}

</style>

</head>


<body>


<h1>
    Test MatrixNavegador
</h1>


<div class="estado">

    Códigos de prueba:

    004_03 · 004_07 · 004_11 · 005_02

</div>


<div id="resultado">

    Cargando...

</div>


<script src="matrixnavegador.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        const codigos = [

            "004_03",
            "004_07",
            "004_11",
            "005_02"

        ];


        const salida =
            document.getElementById(
                "resultado"
            );


        try {

            const matriz =
                await window.MatrixNavegador.obtener(
                    codigos
                );


            console.log(
                "MatrixNavegador:",
                matriz
            );


            salida.innerHTML =
                "<pre>" +
                JSON.stringify(
                    matriz,
                    null,
                    4
                ) +
                "</pre>";

        }

        catch(error) {

            console.error(
                "ERROR TEST MatrixNavegador:",
                error
            );


            salida.innerHTML =
                "<pre>" +
                "ERROR: " +
                error.message +
                "</pre>";

        }

    }
);

</script>


</body>

</html>
