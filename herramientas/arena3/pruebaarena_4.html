<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    PalEntropía - Arena 1.0
</title>

<link
    rel="stylesheet"
    href="pruebaarena_2.css"
>

</head>

<body>

<!-- ======================================================
     BOTÓN HOME
     ====================================================== -->

<a
    href="https://palentropia.es/"
    class="boton-home"
    aria-label="Inicio"
    title="Inicio"
>
    🏠
</a>


<div class="contenedor">

<h1>
    🎲 PalEntropía<br>
    Arena 1.0
</h1>


<!-- ======================================================
     FICHAS ALEATORIAS
     ====================================================== -->

<div class="panel">

    <div class="selector">

        <div>

            <strong class="titulo-ficha">
                🦖 Paleoficha 1
            </strong>

            <div
                id="codigo1"
                class="codigo nombre-ficha"
            >
                ---
            </div>

        </div>


        <div>

            <strong class="titulo-ficha">
                🦖 Paleoficha 2
            </strong>

            <div
                id="codigo2"
                class="codigo nombre-ficha"
            >
                ---
            </div>

        </div>

    </div>


    <button
        id="btnNuevo"
        type="button"
        class="boton-nuevo"
    >
        🎲 Nuevo combate
    </button>


    <div
        id="estado"
        class="estado"
    >
        Cargando datos...
    </div>

</div>


<!-- ======================================================
     INFORMACIÓN DE COMBATIENTES
     ====================================================== -->

<div
    id="resultado"
    class="combatientes"
></div>


<!-- ======================================================
     COMBATIENTES PREPARADOS
     ====================================================== -->

<div
    id="panelCombate"
    class="panel"
    style="display:none;"
>

    <h2>
        ⚔️ Combatientes preparados
    </h2>


    <div
        id="escenarioCombate"
        class="escenarioCombate"
    ></div>


    <div
        id="combatientesPreparados"
        class="preparados"
    ></div>


    <button
        id="btnEjecutarCombate"
        type="button"
    >
        ⚔️ Ejecutar combate automático
    </button>

</div>


<!-- ======================================================
     RESULTADO DEL COMBATE
     ====================================================== -->

<div
    id="panelResultadoCombate"
    class="panel"
    style="display:none;"
>

    <h2>
        🏆 Resultado del combate
    </h2>


    <div
        id="ganadorCombate"
        class="ganador"
    ></div>


    <div
        id="estadoCombatientes"
        class="combateCabecera"
    ></div>


    <div class="seccion">

        <h3>
            📜 Historial
        </h3>

        <div
            id="historialCombate"
            class="historialCombate"
        ></div>

    </div>

</div>

</div>


<!-- ======================================================
     DEPENDENCIAS DEL MOTOR
     ====================================================== -->

<script src="../generador_fase_2/palhab.js"></script>
<script src="../generador_fase_2/palmedio.js"></script>
<script src="../generador_fase_2/palmodo.js"></script>
<script src="../generador_fase_2/buscaruta.js"></script>

<script src="palarenadatos.js"></script>
<script src="palarenaescenario.js"></script>
<script src="palarenastats.js"></script>
<script src="palarenacombatiente.js"></script>
<script src="palarenacombate.js"></script>
<script src="palarenabonificaciones.js"></script>
<script src="palarenamodificadores.js"></script>
<script src="palarenaataques.js"></script>
<script src="palarenaejecutarataque.js"></script>
<script src="palarenaefectos.js"></script>
<script src="palarenaasignacion.js"></script>

<!-- ======================================================
     MOTOR PRINCIPAL
     NO TOCAR
     ====================================================== -->

<script src="palarena.js"></script>


<!-- ======================================================
     INTERFAZ ARENA
     ====================================================== -->

<script src="palarena_ui1.js"></script>
<script src="palarena_ui2.js"></script>
<script src="palarena_ui3.js"></script>
<script src="palarena_ui4.js"></script>

</body>

</html>
