<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Generador — Prueba de LEEPALMEDIO</title><style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
}

input{
    padding:10px;
    margin:3px;
    text-align:center;
    font-size:18px;
}

.codigo-largo{
    width:160px;
}

.codigo-slot{
    width:55px;
}

button{
    padding:10px 20px;
    margin-top:15px;
    cursor:pointer;
}

.opcion{
    margin-top:25px;
}

.resultado{
    margin-top:25px;
}

.error{
    color:#b00020;
    font-weight:bold;
}

.bloque{
    margin-top:25px;
    padding-bottom:10px;
}

.codigo{
    font-weight:bold;
}

.separador{
    margin:0 5px;
    font-weight:bold;
}

.oculto{
    display:none;
}

</style></head><body><h1>Generador — Prueba de LEEPALMEDIO</h1><!-- =====================================================
     OPCIÓN DE ENTRADA
===================================================== --><div class="opcion"><h2>Modo de entrada</h2><label><input
type="radio"
name="modo"
value="largo"
checked>

Código largo

</label><br><label><input
type="radio"
name="modo"
value="descompuesto">

Código descompuesto

</label></div><!-- =====================================================
     CÓDIGO LARGO
===================================================== --><div
    id="entradaLargo"
    class="opcion"><h2>Código j10</h2><input
id="j10"
class="codigo-largo"
type="text"
maxlength="12"
inputmode="numeric"
placeholder="000000000000">

</div><!-- =====================================================
     CÓDIGO DESCOMPUESTO
===================================================== --><div
    id="entradaDescompuesto"
    class="opcion oculto"><h2>Código j10 descompuesto</h2><div><label>SM</label>

<input
id="sm"
class="codigo-slot"
type="text"
maxlength="3"
inputmode="numeric"
placeholder="000">

<span class="separador">|</span>

<label>L</label>

<input
id="l"
class="codigo-slot"
type="text"
maxlength="3"
inputmode="numeric"
placeholder="000">

<span class="separador">|</span>

<label>ES</label>

<input
id="es"
class="codigo-slot"
type="text"
maxlength="3"
inputmode="numeric"
placeholder="000">

<span class="separador">|</span>

<label>C</label>

<input
id="c"
class="codigo-slot"
type="text"
maxlength="3"
inputmode="numeric"
placeholder="000">

</div></div><button id="buscar">
Buscar
</button><div
    id="resultado"
    class="resultado">
</div><!-- =====================================================
     CATÁLOGO PALMEDIO
===================================================== --><script src="palmedio.js"></script><!-- =====================================================
     FUNCIÓN LEEPALMEDIO
===================================================== --><script src="leepalmedio.js"></script><script>

/*
========================================================
PRUEBA LEEPALMEDIO
========================================================

Dos formas de introducir j10:

1. Código largo

   002002004002


2. Código descompuesto

   SM | L | ES | C

   002 | 002 | 004 | 002


Ambos producen:

002002004002


La interpretación siempre la realiza:

LEEPALMEDIO.decodificar()

========================================================
*/


/* ======================================================
   CAMBIAR MODO DE ENTRADA
====================================================== */

const radiosModo =
    document.querySelectorAll(
        'input[name="modo"]'
    );


radiosModo.forEach(
    function(radio){

        radio.addEventListener(
            "change",
            function(){

                const entradaLargo =
                    document.getElementById(
                        "entradaLargo"
                    );

                const entradaDescompuesto =
                    document.getElementById(
                        "entradaDescompuesto"
                    );


                if(
                    this.value === "largo"
                ){

                    entradaLargo.classList
                        .remove("oculto");

                    entradaDescompuesto.classList
                        .add("oculto");

                }
                else{

                    entradaLargo.classList
                        .add("oculto");

                    entradaDescompuesto.classList
                        .remove("oculto");

                }

            }
        );

    }
);


/* ======================================================
   NORMALIZAR SLOT
====================================================== */

function normalizarSlot(id){

    const elemento =
        document.getElementById(id);


    let valor =
        elemento.value.trim();


    /*
    Campo vacío = 000
    */

    if(valor === ""){

        return "000";

    }


    /*
    Solo números.
    */

    if(!/^\d{1,3}$/.test(valor)){

        return null;

    }


    /*
    Normalizar:

    2 → 002
    25 → 025
    256 → 256
    */

    return String(
        Number(valor)
    ).padStart(
        3,
        "0"
    );

}


/* ======================================================
   OBTENER j10 DESCOMPUESTO
====================================================== */

function obtenerJ10Descompuesto(){

    const sm =
        normalizarSlot("sm");

    const l =
        normalizarSlot("l");

    const es =
        normalizarSlot("es");

    const c =
        normalizarSlot("c");


    if(
        sm === null ||
        l === null ||
        es === null ||
        c === null
    ){

        return {

            valido:false,

            mensaje:
                "Cada bloque debe contener solamente " +
                "números de hasta tres cifras."

        };

    }


    return {

        valido:true,

        codigo:
            sm +
            l +
            es +
            c

    };

}


/* ======================================================
   SINCRONIZAR CÓDIGO LARGO
====================================================== */

function sincronizarDescompuesto(
    codigo
){

    if(
        !/^\d{12}$/.test(codigo)
    ){

        return;

    }


    document.getElementById("sm").value =
        codigo.substring(0,3);

    document.getElementById("l").value =
        codigo.substring(3,6);

    document.getElementById("es").value =
        codigo.substring(6,9);

    document.getElementById("c").value =
        codigo.substring(9,12);

}


/* ======================================================
   SINCRONIZAR CÓDIGO LARGO
====================================================== */

function sincronizarLargo(){

    const datos =
        obtenerJ10Descompuesto();


    if(!datos.valido){

        return;

    }


    document.getElementById("j10").value =
        datos.codigo;

}


/* ======================================================
   MOSTRAR RESULTADO
====================================================== */

function mostrarResultado(datos){

    const resultado =
        document.getElementById(
            "resultado"
        );


    let html = "";


    html += "<hr>";

    html +=
        "<h2>Resultado</h2>";


    html +=
        "<p>" +
        "<strong>j10:</strong> " +
        datos.j10 +
        "</p>";


    /*
    MEDIO GENERAL
    */

    html +=
        "<div class='bloque'>";

    html +=
        "<h3>Medio general</h3>";

    html +=
        "<p class='codigo'>" +
        datos.SM.codigo +
        "</p>";

    html +=
        "<p><strong>" +
        datos.SM.nombre +
        "</strong></p>";

    html +=
        "<p>" +
        datos.SM.descripcion +
        "</p>";

    html +=
        "</div>";


    /*
    LOCALIZACIÓN
    */

    html +=
        "<div class='bloque'>";

    html +=
        "<h3>Localización ecológica</h3>";

    html +=
        "<p class='codigo'>" +
        datos.L.codigo +
        "</p>";

    html +=
        "<p><strong>" +
        datos.L.nombre +
        "</strong></p>";

    html +=
        "<p>" +
        datos.L.descripcion +
        "</p>";

    html +=
        "</div>";


    /*
    ESTRATO
    */

    html +=
        "<div class='bloque'>";

    html +=
        "<h3>Estrato ecológico</h3>";

    html +=
        "<p class='codigo'>" +
        datos.ES.codigo +
        "</p>";

    html +=
        "<p><strong>" +
        datos.ES.nombre +
        "</strong></p>";

    html +=
        "<p>" +
        datos.ES.descripcion +
        "</p>";

    html +=
        "</div>";


    /*
    COMPORTAMIENTO
    */

    html +=
        "<div class='bloque'>";

    html +=
        "<h3>Comportamiento espacial</h3>";

    html +=
        "<p class='codigo'>" +
        datos.C.codigo +
        "</p>";

    html +=
        "<p><strong>" +
        datos.C.nombre +
        "</strong></p>";

    html +=
        "<p>" +
        datos.C.descripcion +
        "</p>";

    html +=
        "</div>";


    resultado.innerHTML =
        html;

}


/* ======================================================
   BOTÓN BUSCAR
====================================================== */

document
.getElementById("buscar")
.addEventListener(
    "click",
    function(){

        const resultado =
            document.getElementById(
                "resultado"
            );


        resultado.innerHTML = "";


        /*
        Comprobar que LEEPALMEDIO
        está cargado.
        */

        if(
            typeof window.LEEPALMEDIO !== "object" ||
            window.LEEPALMEDIO === null
        ){

            resultado.innerHTML =
                '<p class="error">' +
                'ERROR: leepalmedio.js no se ha ' +
                'cargado correctamente.' +
                '</p>';

            return;

        }


        let j10;


        /*
        CÓDIGO LARGO
        */

        if(
            document.querySelector(
                'input[name="modo"]:checked'
            ).value === "largo"
        ){

            j10 =
                document.getElementById(
                    "j10"
                ).value.trim();


            /*
            Si es válido,
            sincronizar los cuatro bloques.
            */

            if(/^\d{12}$/.test(j10)){

                sincronizarDescompuesto(
                    j10
                );

            }

        }


        /*
        CÓDIGO DESCOMPUESTO
        */

        else{

            const datos =
                obtenerJ10Descompuesto();


            if(!datos.valido){

                resultado.innerHTML =
                    '<p class="error">' +
                    'ERROR: ' +
                    datos.mensaje +
                    '</p>';

                return;

            }


            j10 =
                datos.codigo;


            /*
            Mantener sincronizado
            el código largo.
            */

            document.getElementById(
                "j10"
            ).value =
                j10;

        }


        /*
        Decodificar.
        */

        const datos =
            window.LEEPALMEDIO.decodificar(
                j10
            );


        /*
        Error.
        */

        if(!datos.valido){

            resultado.innerHTML =
                '<p class="error">' +
                'ERROR: ' +
                datos.mensaje +
                '</p>';

            return;

        }


        /*
        Mostrar resultado.
        */

        mostrarResultado(
            datos
        );

    }
);

</script></body></html>
