<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Generador — Prueba de BUSCARUTA</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f4f4f4;
}

h1{
    font-size:22px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    max-width:300px;
    box-sizing:border-box;
    padding:12px;
    font-size:18px;
    margin-top:5px;
}

button{
    display:block;
    margin-top:15px;
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
}

#estado{
    margin-top:20px;
    font-weight:bold;
}

#resultado{
    margin-top:20px;
}

.imagenes{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:15px;
}

.imagen{
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 1px 5px rgba(0,0,0,.15);
}

.imagen img{
    display:block;
    max-width:300px;
    max-height:300px;
}

.ruta{
    margin-top:8px;
    font-size:12px;
    word-break:break-all;
}

.error{
    color:#b00020;
}

.exito{
    color:#176b2c;
}

</style>

</head>


<body>


<h1>Generador — Prueba de BUSCARUTA</h1>


<label for="j1">
Código j1
</label>


<input
    id="j1"
    type="text"
    maxlength="6"
    placeholder="Ejemplo: 002_02"
>


<button id="buscar">
Buscar
</button>


<div id="estado"></div>


<div id="resultado"></div>


<!-- =====================================================
     BUSCARUTA
===================================================== -->

<script src="buscaruta.js"></script>


<script>


/* ======================================================
   ELEMENTOS
====================================================== */

const inputJ1 =
    document.getElementById("j1");

const botonBuscar =
    document.getElementById("buscar");

const estado =
    document.getElementById("estado");

const resultado =
    document.getElementById("resultado");


/* ======================================================
   BUSCAR
====================================================== */

botonBuscar.addEventListener(
    "click",
    buscar
);


/* ======================================================
   FUNCIÓN PRINCIPAL
====================================================== */

async function buscar(){

    resultado.innerHTML = "";

    estado.className = "";
    estado.textContent = "";


    /*
    LEER J1
    */

    let j1 =
        inputJ1.value
        .trim();


    if(!j1){

        estado.className = "error";
        estado.textContent =
            "Introduce un código j1.";

        return;

    }


    /*
    NORMALIZAR

    Ejemplo:

    002_02

    */

    j1 =
        j1.toUpperCase();


    /*
    COMPROBAR BUSCARUTA
    */

    if(
        !window.BUSCARUTA ||
        typeof window.BUSCARUTA.buscar !==
        "function"
    ){

        estado.className = "error";

        estado.textContent =
            "ERROR: buscaruta.js no se ha cargado correctamente.";

        return;

    }


    /*
    =====================================================
    BUSCAR RUTAS
    =====================================================
    */

    let datos;

    try{

        datos =
            await window.BUSCARUTA.buscar(
                j1
            );

    }catch(error){

        console.error(error);

        estado.className = "error";

        estado.textContent =
            "ERROR al ejecutar BUSCARUTA.";

        return;

    }


    /*
    SIN RESULTADOS
    */

    if(
        !datos ||
        !Array.isArray(datos.imagenes) ||
        datos.imagenes.length === 0
    ){

        estado.className = "error";

        estado.textContent =
            "No se han encontrado imágenes para " +
            j1 + ".";

        return;

    }


    /*
    =====================================================
    MOSTRAR RESULTADO
    =====================================================
    */

    estado.className = "exito";

    estado.textContent =
        "Se han encontrado " +
        datos.imagenes.length +
        " imagen(es) para " +
        j1 + ".";


    /*
    INFORMACIÓN DE ARQUITECTURA
    */

    let info =
        document.createElement(
            "div"
        );


    if(datos.arquitectura){

        info.textContent =
            "Arquitectura detectada: " +
            datos.arquitectura;

        info.style.marginTop =
            "10px";

        resultado.appendChild(
            info
        );

    }


    /*
    CONTENEDOR DE IMÁGENES
    */

    let contenedor =
        document.createElement(
            "div"
        );

    contenedor.className =
        "imagenes";


    /*
    RECORRER IMÁGENES
    */

    datos.imagenes.forEach(
        imagenData => {


            let caja =
                document.createElement(
                    "div"
                );

            caja.className =
                "imagen";


            let imagen =
                document.createElement(
                    "img"
                );


            /*
            BUSCARUTA PUEDE DEVOLVER
            UNA CADENA O UN OBJETO
            */

            let ruta = "";


            if(
                typeof imagenData ===
                "string"
            ){

                ruta =
                    imagenData;

            }else if(
                imagenData &&
                typeof imagenData ===
                "object"
            ){

                ruta =
                    imagenData.ruta ||
                    imagenData.url ||
                    "";

            }


            /*
            SIN RUTA
            */

            if(!ruta){

                return;

            }


            imagen.src =
                ruta;

            imagen.alt =
                j1;


            /*
            ERROR DE CARGA
            */

            imagen.onerror =
                function(){

                    caja.remove();

                };


            caja.appendChild(
                imagen
            );


            /*
            MOSTRAR RUTA
            */

            let textoRuta =
                document.createElement(
                    "div"
                );

            textoRuta.className =
                "ruta";

            textoRuta.textContent =
                ruta;


            caja.appendChild(
                textoRuta
            );


            contenedor.appendChild(
                caja
            );

        }
    );


    resultado.appendChild(
        contenedor
    );

}


</script>


</body>

</html>
