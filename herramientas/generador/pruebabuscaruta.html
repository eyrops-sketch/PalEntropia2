<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Generador — Prueba de BUSCARUTA</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f4f4f4;
}

h1{
    font-size:22px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    max-width:300px;
    box-sizing:border-box;
    padding:12px;
    font-size:18px;
    margin-top:5px;
}

button{
    display:block;
    margin-top:15px;
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
}

#resultado{
    margin-top:20px;
}

.imagenes{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:15px;
}

.imagen{
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 1px 5px rgba(0,0,0,.15);
}

.imagen img{
    display:block;
    max-width:300px;
    max-height:300px;
}

.estado{
    margin-top:8px;
    font-weight:bold;
}

.ok{
    color:#176b2c;
}

.no-subida{
    color:#8a5a00;
}

.ruta{
    margin-top:8px;
    font-size:12px;
    word-break:break-all;
}

</style>

</head>


<body>


<h1>Generador — Prueba de BUSCARUTA</h1>


<label for="j1">
Código j1
</label>


<input
    id="j1"
    type="text"
    maxlength="6"
    placeholder="Ejemplo: 003_14"
>


<button
    id="buscar"
    type="button"
>
Buscar
</button>


<div id="resultado"></div>


<!-- =====================================================
     BUSCARUTA
===================================================== -->

<script src="buscaruta.js"></script>


<script>

/* ======================================================
   ELEMENTOS
====================================================== */

const input =
    document.getElementById("j1");

const boton =
    document.getElementById("buscar");

const resultado =
    document.getElementById("resultado");


/* ======================================================
   BOTÓN BUSCAR
====================================================== */

boton.addEventListener(
    "click",
    buscar
);


/* ======================================================
   BUSCAR POR J1
====================================================== */

async function buscar(){

    resultado.innerHTML = "";


    const j1 =
        input.value
        .trim()
        .toUpperCase();


    if(!j1){

        resultado.textContent =
            "Introduce un código j1.";

        return;

    }


    /*
    Comprobar BUSCARUTA
    */

    if(
        !window.BUSCARUTA ||
        typeof window.BUSCARUTA.buscar !==
        "function"
    ){

        resultado.textContent =
            "ERROR: buscaruta.js no se ha cargado.";

        return;

    }


    /*
    Buscar por j1
    */

    const datos =
        await window.BUSCARUTA.buscar(
            j1
        );


    /*
    Contenedor
    */

    const contenedor =
        document.createElement(
            "div"
        );

    contenedor.className =
        "imagenes";


    /*
    Las tres imágenes
    */

    if(
        datos &&
        Array.isArray(datos.imagenes)
    ){

        datos.imagenes.forEach(
            imagenData => {

                const caja =
                    document.createElement(
                        "div"
                    );

                caja.className =
                    "imagen";


                /*
                Si existe
                */

                if(
                    imagenData.estado ===
                    "ok"
                ){

                    const imagen =
                        document.createElement(
                            "img"
                        );


                    imagen.src =
                        imagenData.ruta;


                    imagen.alt =
                        j1 +
                        "_" +
                        imagenData.tipo;


                    const ruta =
                        document.createElement(
                            "div"
                        );

                    ruta.className =
                        "ruta";

                    ruta.textContent =
                        imagenData.ruta;


                    caja.appendChild(
                        imagen
                    );

                    caja.appendChild(
                        ruta
                    );

                }


                /*
                Si no existe
                */

                else{

                    const mensaje =
                        document.createElement(
                            "div"
                        );

                    mensaje.className =
                        "estado no-subida";

                    mensaje.textContent =
                        "Imagen no subida";


                    caja.appendChild(
                        mensaje
                    );

                }


                contenedor.appendChild(
                    caja
                );

            }
        );

    }


    resultado.appendChild(
        contenedor
    );

}

</script>


</body>

</html>
