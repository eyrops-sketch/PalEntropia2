<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Generador — Prueba de BUSCARUTA</title><style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f4f4f4;
}

h1{
    font-size:22px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    max-width:300px;
    box-sizing:border-box;
    padding:12px;
    font-size:18px;
    margin-top:5px;
}

button{
    display:block;
    margin-top:15px;
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
}

#estado{
    margin-top:20px;
    font-weight:bold;
}

#resultado{
    margin-top:20px;
}

.imagenes{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:15px;
}

.imagen{
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 1px 5px rgba(0,0,0,.15);
}

.imagen img{
    display:block;
    max-width:300px;
    max-height:300px;
}

.ruta{
    margin-top:8px;
    font-size:12px;
    word-break:break-all;
}

.error{
    color:#b00020;
}

.exito{
    color:#176b2c;
}

.info{
    color:#8a5a00;
    background:#fff8e1;
    padding:12px;
    margin-top:15px;
    border-radius:6px;
}

.info-item{
    margin-top:8px;
}

</style></head><body><h1>Generador — Prueba de BUSCARUTA</h1><label for="j1">
Código j1
</label><input
id="j1"
type="text"
maxlength="6"
placeholder="Ejemplo: 002_02"

«»

<button
id="buscar"
type="button"

«»

Buscar
</button>

<div id="estado"></div><div id="resultado"></div><!-- =====================================================
     BUSCARUTA
===================================================== --><script src="buscaruta.js"></script><script>

/* ======================================================
   ELEMENTOS
====================================================== */

const inputJ1 =
    document.getElementById("j1");

const botonBuscar =
    document.getElementById("buscar");

const estado =
    document.getElementById("estado");

const resultado =
    document.getElementById("resultado");


/* ======================================================
   EVENTO BOTÓN BUSCAR
====================================================== */

botonBuscar.addEventListener(
    "click",
    buscar
);


/* ======================================================
   FUNCIÓN PRINCIPAL
====================================================== */

async function buscar(){

    resultado.innerHTML = "";

    estado.className = "";

    estado.textContent = "";


    /* ==================================================
       LEER J1
    ================================================== */

    let j1 =
        inputJ1.value.trim();


    if(!j1){

        estado.className = "error";

        estado.textContent =
            "Introduce un código j1.";

        return;

    }


    /* ==================================================
       NORMALIZAR
    ================================================== */

    j1 =
        j1.toUpperCase();


    /* ==================================================
       COMPROBAR BUSCARUTA
    ================================================== */

    if(
        !window.BUSCARUTA ||
        typeof window.BUSCARUTA.buscar !==
        "function"
    ){

        estado.className = "error";

        estado.textContent =
            "ERROR: buscaruta.js no se ha cargado correctamente.";

        return;

    }


    /* ==================================================
       BUSCAR
    ================================================== */

    botonBuscar.disabled = true;

    botonBuscar.textContent =
        "Buscando...";


    let datos;


    try{

        datos =
            await window.BUSCARUTA.buscar(
                j1
            );

    }

    catch(error){

        console.error(error);

        estado.className = "error";

        estado.textContent =
            "ERROR al ejecutar BUSCARUTA.";

        botonBuscar.disabled = false;

        botonBuscar.textContent =
            "Buscar";

        return;

    }


    botonBuscar.disabled = false;

    botonBuscar.textContent =
        "Buscar";


    /* ==================================================
       INFORMACIÓN
    ================================================== */

    let tieneInformacion =

        datos &&

        Array.isArray(
            datos.informacion
        ) &&

        datos.informacion.length > 0;


    if(
        tieneInformacion
    ){

        let cajaInfo =
            document.createElement(
                "div"
            );

        cajaInfo.className =
            "info";


        datos.informacion.forEach(
            dato => {

                let linea =
                    document.createElement(
                        "div"
                    );

                linea.className =
                    "info-item";


                if(
                    dato &&
                    dato.mensaje
                ){

                    linea.textContent =
                        dato.mensaje;

                }

                else{

                    linea.textContent =
                        "Subir imagen al directorio 001_075";

                }


                cajaInfo.appendChild(
                    linea
                );

            }
        );


        resultado.appendChild(
            cajaInfo
        );

    }


    /* ==================================================
       COMPROBAR IMÁGENES
    ================================================== */

    let hayImagenes =

        datos &&

        Array.isArray(
            datos.imagenes
        ) &&

        datos.imagenes.length > 0;


    /* ==================================================
       SIN IMÁGENES
    ================================================== */

    if(!hayImagenes){

        /*
        Si hay información,
        no es un error.
        */

        if(
            tieneInformacion
        ){

            estado.className =
                "info";

            estado.textContent =
                "Información para " +
                j1 + ":";

            return;

        }


        /*
        Caso normal sin imágenes.
        */

        estado.className =
            "error";

        estado.textContent =
            "No se han encontrado imágenes para " +
            j1 + ".";

        return;

    }


    /* ==================================================
       ESTADO DE ÉXITO
    ================================================== */

    estado.className =
        "exito";

    estado.textContent =
        "Se han encontrado " +
        datos.imagenes.length +
        " imagen(es) para " +
        j1 + ".";


    /* ==================================================
       ARQUITECTURA
    ================================================== */

    if(
        datos.arquitectura
    ){

        let infoArquitectura =
            document.createElement(
                "div"
            );

        infoArquitectura.style.marginTop =
            "10px";

        infoArquitectura.textContent =
            "Arquitectura detectada: " +
            datos.arquitectura;

        resultado.appendChild(
            infoArquitectura
        );

    }


    /* ==================================================
       CONTENEDOR DE IMÁGENES
    ================================================== */

    let contenedor =
        document.createElement(
            "div"
        );

    contenedor.className =
        "imagenes";


    /* ==================================================
       MOSTRAR IMÁGENES
    ================================================== */

    datos.imagenes.forEach(
        imagenData => {

            let ruta = "";


            /*
            CADENA
            */

            if(
                typeof imagenData ===
                "string"
            ){

                ruta =
                    imagenData;

            }


            /*
            OBJETO
            */

            else if(
                imagenData &&
                typeof imagenData ===
                "object"
            ){

                ruta =
                    imagenData.ruta ||
                    imagenData.url ||
                    "";

            }


            if(!ruta){

                return;

            }


            let caja =
                document.createElement(
                    "div"
                );

            caja.className =
                "imagen";


            let imagen =
                document.createElement(
                    "img"
                );

            imagen.src =
                ruta;

            imagen.alt =
                j1;


            /*
            Si por algún motivo
            una ruta falla al cargar,
            se elimina únicamente
            esa imagen.
            */

            imagen.onerror =
                function(){

                    caja.remove();

                };


            caja.appendChild(
                imagen
            );


            /* ==========================================
               RUTA
            ========================================== */

            let textoRuta =
                document.createElement(
                    "div"
                );

            textoRuta.className =
                "ruta";

            textoRuta.textContent =
                ruta;


            caja.appendChild(
                textoRuta
            );


            contenedor.appendChild(
                caja
            );

        }
    );


    resultado.appendChild(
        contenedor
    );

}

</script></body></html>
