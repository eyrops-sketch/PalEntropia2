<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generador — Prueba de LEEPALHAB</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
}

input{
    width:55px;
    padding:8px;
    margin:3px;
    text-align:center;
    font-size:16px;
}

button{
    padding:10px 20px;
    margin-top:15px;
    cursor:pointer;
}

#resultado{
    margin-top:25px;
}

.error{
    color:#b00020;
    font-weight:bold;
}

.campo{
    margin-bottom:20px;
}

</style>

</head>


<body>


<h1>Generador — Prueba de LEEPALHAB</h1>


<!-- =====================================================
     HÁBITAT PRINCIPAL — j5
===================================================== -->

<div class="campo">

<h2>Hábitat principal — j5</h2>

<input id="hp1"
       type="text"
       maxlength="3"
       inputmode="numeric"
       placeholder="000">

<input id="hp2"
       type="text"
       maxlength="3"
       inputmode="numeric"
       placeholder="000">

<input id="hp3"
       type="text"
       maxlength="3"
       inputmode="numeric"
       placeholder="000">

<input id="hp4"
       type="text"
       maxlength="3"
       inputmode="numeric"
       placeholder="000">

</div>


<!-- =====================================================
     HÁBITAT SECUNDARIO — j6
===================================================== -->

<div class="campo">

<h2>Hábitat secundario — j6</h2>

<input id="hs1"
       type="text"
       maxlength="3"
       inputmode="numeric"
       placeholder="000">

<input id="hs2"
       type="text"
       maxlength="3"
       inputmode="numeric"
       placeholder="000">

<input id="hs3"
       type="text"
       maxlength="3"
       inputmode="numeric"
       placeholder="000">

<input id="hs4"
       type="text"
       maxlength="3"
       inputmode="numeric"
       placeholder="000">

</div>


<button id="buscar">
Buscar
</button>


<div id="resultado"></div>


<!-- =====================================================
     PALHAB

     El archivo está en:

     herramientas/generador/palhab.js
===================================================== -->

<script src="palhab.js"></script>


<script>

/*
========================================================
PRUEBA LEEPALHAB
========================================================

j5 = HP
j6 = HS

Cada código tiene:

12 caracteres

4 slots de 3 caracteres:

000 | 000 | 000 | 000

Límite:

000 = vacío
001-256 = válido
257-999 = inválido

El prefijo H NO forma parte
del código HP/HS.

Se utiliza únicamente
para consultar PALHAB.

Ejemplo:

002
↓
H002
↓
Océano pelágico

========================================================
*/


/* ======================================================
   COMPROBAR PALHAB
====================================================== */

function comprobarPALHAB(){

    if(
        typeof window.PALHAB !== "object" ||
        window.PALHAB === null
    ){

        return false;

    }

    return true;

}


/* ======================================================
   LEER UN SLOT
====================================================== */

function leerSlot(id){

    const elemento =
        document.getElementById(id);


    if(!elemento){

        return {
            valido:false,
            mensaje:
                "No se encontró el campo " + id
        };

    }


    let valor =
        elemento.value.trim();


    /*
    Campo vacío = 000
    */

    if(valor === ""){

        valor = "000";

    }


    /*
    Solo números.
    */

    if(!/^\d{1,3}$/.test(valor)){

        return {
            valido:false,
            mensaje:
                "El campo " +
                id +
                " debe contener solamente números."
        };

    }


    let numero =
        Number(valor);


    /*
    LÍMITE MÁXIMO ABSOLUTO
    */

    if(numero > 256){

        return {
            valido:false,
            mensaje:
                "El valor " +
                valor +
                " no es válido. " +
                "El límite máximo es 256."
        };

    }


    /*
    Normalizar a tres cifras.

    2 → 002
    25 → 025
    256 → 256
    */

    let codigo =
        String(numero)
        .padStart(3,"0");


    return {

        valido:true,

        codigo:codigo,

        numero:numero

    };

}


/* ======================================================
   LEER LOS 4 SLOTS
====================================================== */

function leerSlots(prefijo){

    let slots = [];


    for(
        let i = 1;
        i <= 4;
        i++
    ){

        let resultado =
            leerSlot(
                prefijo + i
            );


        if(!resultado.valido){

            return resultado;

        }


        slots.push(
            resultado.codigo
        );

    }


    return {

        valido:true,

        slots:slots

    };

}


/* ======================================================
   MONTAR CÓDIGO
====================================================== */

function montarCodigo(prefijo,slots){

    return (
        prefijo +
        slots.join("")
    );

}


/* ======================================================
   CONSULTAR PALHAB
====================================================== */

function consultarHabitat(codigo){

    /*
    000 = slot vacío.
    */

    if(codigo === "000"){

        return null;

    }


    /*
    Convertimos:

    002

    en referencia:

    H002
    */

    const referencia =
        "H" + codigo;


    const habitat =
        window.PALHAB[referencia];


    if(!habitat){

        return {

            error:true,

            mensaje:
                "No existe " +
                referencia +
                " en PALHAB.js."

        };

    }


    return {

        error:false,

        codigo:referencia,

        nombre:
            habitat.nombre,

        descripcion:
            habitat.descripcion

    };

}


/* ======================================================
   PROCESAR HP
====================================================== */

function procesarHP(slots){

    let habitats = [];


    /*
    El primer slot de HP
    debe contener un hábitat.
    */

    if(slots[0] === "000"){

        return {

            error:true,

            mensaje:
                "El Hábitat principal debe ocupar " +
                "como mínimo el primer slot."

        };

    }


    for(
        let i = 0;
        i < slots.length;
        i++
    ){

        const codigo =
            slots[i];


        if(codigo === "000"){

            continue;

        }


        const habitat =
            consultarHabitat(codigo);


        if(habitat.error){

            return habitat;

        }


        habitats.push(habitat);

    }


    return {

        error:false,

        habitats:habitats

    };

}


/* ======================================================
   PROCESAR HS
====================================================== */

function procesarHS(slots){

    let habitats = [];


    for(
        let i = 0;
        i < slots.length;
        i++
    ){

        const codigo =
            slots[i];


        if(codigo === "000"){

            continue;

        }


        const habitat =
            consultarHabitat(codigo);


        if(habitat.error){

            return habitat;

        }


        habitats.push(habitat);

    }


    return {

        error:false,

        habitats:habitats

    };

}


/* ======================================================
   MOSTRAR RESULTADO
====================================================== */

function mostrarResultado(
    hpCodigo,
    hsCodigo,
    hp,
    hs
){

    const resultado =
        document.getElementById(
            "resultado"
        );


    let html = "";


    html += "<hr>";

    html +=
        "<h2>Resultado</h2>";


    /*
    Estos códigos se muestran
    SOLO en esta página de prueba
    para comprobar que el montaje
    funciona correctamente.
    */

    html +=
        "<p><strong>HP interno:</strong> " +
        hpCodigo +
        "</p>";


    html +=
        "<p><strong>HS interno:</strong> " +
        hsCodigo +
        "</p>";


    /*
    HÁBITAT PRINCIPAL
    */

    html +=
        "<h3>Hábitat principal:</h3>";


    if(
        hp.habitats.length === 0
    ){

        html +=
            "<p>No definido</p>";

    }
    else{

        hp.habitats.forEach(
            function(habitat){

                html +=
                    "<p>" +
                    habitat.nombre +
                    "</p>";

            }
        );

    }


    /*
    HÁBITAT SECUNDARIO
    */

    html +=
        "<h3>Hábitat secundario:</h3>";


    if(
        hs.habitats.length === 0
    ){

        html +=
            "<p>No definido</p>";

    }
    else{

        hs.habitats.forEach(
            function(habitat){

                html +=
                    "<p>" +
                    habitat.nombre +
                    "</p>";

            }
        );

    }


    resultado.innerHTML =
        html;

}


/* ======================================================
   BOTÓN BUSCAR
====================================================== */

document
.getElementById("buscar")
.addEventListener(
    "click",
    function(){

        const resultado =
            document.getElementById(
                "resultado"
            );


        resultado.innerHTML = "";


        /*
        Comprobar que PALHAB
        está cargado.
        */

        if(!comprobarPALHAB()){

            resultado.innerHTML =
                '<p class="error">' +
                'ERROR: PALHAB.js no se ha ' +
                'cargado correctamente.' +
                '</p>';

            return;

        }


        /*
        LEER HP
        */

        const hp =
            leerSlots("hp");


        if(!hp.valido){

            resultado.innerHTML =
                '<p class="error">' +
                'ERROR: ' +
                hp.mensaje +
                '</p>';

            return;

        }


        /*
        LEER HS
        */

        const hs =
            leerSlots("hs");


        if(!hs.valido){

            resultado.innerHTML =
                '<p class="error">' +
                'ERROR: ' +
                hs.mensaje +
                '</p>';

            return;

        }


        /*
        MONTAR HP

        002 | 000 | 000 | 000

        ↓

        HP002000000000
        */

        const hpCodigo =
            montarCodigo(
                "HP",
                hp.slots
            );


        /*
        MONTAR HS

        000 | 000 | 000 | 000

        ↓

        HS000000000000
        */

        const hsCodigo =
            montarCodigo(
                "HS",
                hs.slots
            );


        /*
        PROCESAR HP
        */

        const datosHP =
            procesarHP(
                hp.slots
            );


        if(datosHP.error){

            resultado.innerHTML =
                '<p class="error">' +
                'ERROR: ' +
                datosHP.mensaje +
                '</p>';

            return;

        }


        /*
        PROCESAR HS
        */

        const datosHS =
            procesarHS(
                hs.slots
            );


        if(datosHS.error){

            resultado.innerHTML =
                '<p class="error">' +
                'ERROR: ' +
                datosHS.mensaje +
                '</p>';

            return;

        }


        /*
        MOSTRAR RESULTADO
        */

        mostrarResultado(
            hpCodigo,
            hsCodigo,
            datosHP,
            datosHS
        );

    }
);

</script>


</body>

</html>
