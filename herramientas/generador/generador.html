<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PalEntropía — Generador de Paleofichas</title>

<link rel="stylesheet"
      href="style.css">


<style>

/* =====================================================
   CONTROLES DE NAVEGACIÓN
   ===================================================== */

#controlesNavegacion {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 8px;

    margin: 12px auto;

    flex-wrap: wrap;

}


.botonNavegacion {

    width: 38px;

    height: 38px;

    border-radius: 50%;

    border: none;

    cursor: pointer;

    font-size: 16px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;

}


.botonNavegacion:active {

    transform: scale(0.92);

}


.botonNavegacion:disabled {

    opacity: 0.35;

    cursor: default;

}


#posicionNavegacion {

    min-width: 70px;

    text-align: center;

    font-size: 13px;

    font-weight: 600;

    opacity: 0.8;

    padding: 4px 9px;

    border-radius: 12px;

}


/* =====================================================
   BOTÓN VÍDEO
   ===================================================== */

#videoFicha {

    text-align: center;

    margin: 12px 0;

}


#botonVideo {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    text-decoration: none;

    padding: 9px 16px;

    border-radius: 20px;

    font-weight: 600;

}


/* =====================================================
   RESULTADOS DEL BUSCADOR
   ===================================================== */

.resultadoBuscador {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 10px;

    text-align: left;

    padding: 10px 12px;

    margin: 5px 0;

    border-radius: 12px;

    border: none;

    cursor: pointer;

}


.resultadoCodigo {

    font-weight: 700;

    opacity: 0.75;

}


.resultadoNombre {

    font-weight: 600;

}

</style>

</head>


<body>


<!-- =====================================================
     BOTÓN PALEOFICHA ALEATORIA
     ===================================================== -->

<button id="botonAleatorio"
        type="button"
        title="Paleoficha aleatoria"
        aria-label="Paleoficha aleatoria">

    🎲

</button>


<!-- =====================================================
     CABECERA
     ===================================================== -->

<header id="cabecera">

    <h1>PalEntropía</h1>

    <div id="subtitulo">
        Generador de Paleofichas
    </div>

</header>


<!-- =====================================================
     CONTROLES DE BÚSQUEDA
     ===================================================== -->

<section id="controlesBusqueda">

    <button id="botonBuscar"
            type="button">

        🔎 Explorar Paleofichas

    </button>

</section>


<!-- =====================================================
     CONTROLES DE NAVEGACIÓN
     ===================================================== -->

<section id="controlesNavegacion"
         aria-label="Navegación de paleofichas">


    <button id="botonPrimero"
            class="botonNavegacion"
            type="button"
            title="Primera paleoficha"
            aria-label="Primera paleoficha">

        ⏮

    </button>


    <button id="botonAnterior"
            class="botonNavegacion"
            type="button"
            title="Paleoficha anterior"
            aria-label="Paleoficha anterior">

        ◀

    </button>


    <span id="posicionNavegacion">

        — / —

    </span>


    <button id="botonSiguiente"
            class="botonNavegacion"
            type="button"
            title="Paleoficha siguiente"
            aria-label="Paleoficha siguiente">

        ▶

    </button>


    <button id="botonUltimo"
            class="botonNavegacion"
            type="button"
            title="Última paleoficha"
            aria-label="Última paleoficha">

        ⏭

    </button>


</section>


<!-- =====================================================
     ESTADO
     ===================================================== -->

<div id="estado">

    Cargando contenedor...

</div>


<!-- =====================================================
     FICHA
     ===================================================== -->

<main id="ficha"
      class="ficha"
      style="display:none;">


    <div id="titulo"></div>


    <div id="codigoFicha"></div>


    <!-- =================================================
         CRONOLOGÍA
         ================================================= -->

    <div id="cronologia">

    </div>


    <!-- =================================================
         IMAGEN PRINCIPAL
         ================================================= -->

    <div id="contenedorImagenPrincipal">

        <img id="imagenPrincipal"
             alt="Imagen principal de la paleoficha">

    </div>


    <!-- =================================================
         VÍDEO
         ================================================= -->

    <div id="videoFicha"
         style="display:none;">

        <a id="botonVideo"
           href="#"
           target="_self"
           rel="noopener">

            ▶ Ver vídeo

        </a>

    </div>


    <!-- =================================================
         INFORMACIÓN
         ================================================= -->

    <section id="bloqueInfo">


        <div class="campoInfo">

            <span class="campo">
                Dieta
            </span>

            <span id="dieta"></span>

        </div>


        <div class="campoInfo">

            <span class="campo">
                Descripción
            </span>

            <span id="descripcion"></span>

        </div>


    </section>


    <!-- =================================================
         GALERÍA
         ================================================= -->

    <section id="galeria">


        <img id="img2"
             alt="Imagen secundaria 1">


        <img id="img3"
             alt="Imagen secundaria 2">


    </section>


    <!-- =================================================
         ESTADÍSTICAS
         ================================================= -->

    <section id="bloqueEstadisticas"
             style="display:none;">

        <h2>
            Estadísticas
        </h2>


        <div id="estadisticas"
             class="stats">

        </div>

    </section>


</main>


<!-- =====================================================
     LIGHTBOX DE IMÁGENES
     ===================================================== -->

<div id="visorImagen"
     class="visor"
     aria-hidden="true">


    <button id="cerrarImagen"
            class="botonCerrar"
            type="button"
            aria-label="Cerrar imagen">

        ×

    </button>


    <img id="imagenAmpliada"
         alt="Imagen ampliada">


</div>


<!-- =====================================================
     EXPLORADOR DE PALEOFICHAS
     ===================================================== -->

<div id="visorBuscador"
     class="visor"
     aria-hidden="true">


    <div id="ventanaBuscador">


        <button id="cerrarBuscador"
                class="botonCerrar botonCerrarBuscador"
                type="button"
                aria-label="Cerrar buscador">

            ×

        </button>


        <h2>
            Explorador de Paleofichas
        </h2>


        <input id="buscarNombre"
               type="text"
               placeholder="Buscar por nombre o código"
               autocomplete="off">


        <div id="listaResultados">

        </div>


    </div>


</div>


<!-- =====================================================
     MÓDULOS
     ===================================================== -->

<script src="leepaljson.js"></script>

<script src="palvideo.js"></script>

<script src="buscaruta.js"></script>

<script src="cargacont.js"></script>

<script src="palbuscador.js"></script>

<script src="palnavegador.js"></script>


<!-- =====================================================
     GENERADOR — CAPA VISUAL
     ===================================================== -->

<script>


let fichaActual = null;


/* =====================================================
   REFERENCIAS DE NAVEGACIÓN
   ===================================================== */

const botonPrimero =
    document.getElementById(
        "botonPrimero"
    );


const botonAnterior =
    document.getElementById(
        "botonAnterior"
    );


const botonSiguiente =
    document.getElementById(
        "botonSiguiente"
    );


const botonUltimo =
    document.getElementById(
        "botonUltimo"
    );


const posicionNavegacion =
    document.getElementById(
        "posicionNavegacion"
    );


/* =====================================================
   ACTUALIZAR CONTROLES
   ===================================================== */

function actualizarControlesNavegacion() {

    if(
        !window.PALNAVEGADOR
    ) {

        return;

    }


    const estado =
        window.PALNAVEGADOR.estado();


    const total =
        estado.total || 0;


    const posicion =
        estado.posicion || 0;


    posicionNavegacion.textContent =

        total

            ? posicion +
              " / " +
              total

            : "— / —";


    botonPrimero.disabled =
        !total ||
        posicion <= 1;


    botonAnterior.disabled =
        !total ||
        posicion <= 1;


    botonSiguiente.disabled =
        !total ||
        posicion >= total;


    botonUltimo.disabled =
        !total ||
        posicion >= total;

}


/* =====================================================
   EVENTO: CONTENEDOR CARGADO
   ===================================================== */

document.addEventListener(
    "palentropia:contenedor-cargado",
    async function(evento) {

        try {

            const ficha =
                evento.detail;


            if(!ficha) {

                throw new Error(
                    "CARGACONT no entregó ningún registro."
                );

            }


            fichaActual =
                ficha;


            /* =========================================
               POSICIONAR PUNTERO
               ========================================= */

            if(
                window.PALNAVEGADOR &&
                ficha.j1
            ) {

                await window.PALNAVEGADOR.posicionar(
                    ficha.j1
                );

            }


            /* =========================================
               DATOS
               ========================================= */

            document.getElementById(
                "titulo"
            ).textContent =
                ficha.j2 || "";


            document.getElementById(
                "codigoFicha"
            ).textContent =
                ficha.j1 || "";


            document.getElementById(
                "dieta"
            ).textContent =
                ficha.j7 || "";


            document.getElementById(
                "descripcion"
            ).textContent =
                ficha.j8 || "";


            /* =========================================
               VÍDEO
               ========================================= */

            actualizarVideo(
                ficha.j1
            );


            /* =========================================
               IMÁGENES
               ========================================= */

            cargarImagen(
                "imagenPrincipal",
                ficha.i0
            );


            cargarImagen(
                "img2",
                ficha.i2
            );


            cargarImagen(
                "img3",
                ficha.i3
            );


            /* =========================================
               MOSTRAR FICHA
               ========================================= */

            document.getElementById(
                "ficha"
            ).style.display =
                "block";


            document.getElementById(
                "estado"
            ).innerHTML =

                '<span class="ok">' +

                "✓ Ficha " +

                (ficha.j1 || "") +

                " cargada" +

                "</span>";


            actualizarControlesNavegacion();


            console.log(
                "PalEntropía — GENERADOR",
                ficha
            );

        }

        catch(error) {

            mostrarError(
                error
            );

        }

    }
);


/* =====================================================
   ACTUALIZAR VÍDEO
   ===================================================== */

function actualizarVideo(j1) {

    const contenedorVideo =
        document.getElementById(
            "videoFicha"
        );


    const botonVideo =
        document.getElementById(
            "botonVideo"
        );


    if(
        !contenedorVideo ||
        !botonVideo
    ) {

        return;

    }


    contenedorVideo.style.display =
        "none";


    botonVideo.href =
        "#";


    if(
        !window.PALVIDEO ||
        !j1
    ) {

        return;

    }


    const codigo =
        String(j1)
            .trim()
            .toUpperCase();


    const registro =
        window.PALVIDEO[codigo];


    if(
        !registro ||
        typeof registro !== "object"
    ) {

        return;

    }


    const enlace =
        registro.video;


    if(
        enlace === null ||
        enlace === undefined ||
        String(enlace).trim() === ""
    ) {

        return;

    }


    botonVideo.href =
        String(enlace).trim();


    contenedorVideo.style.display =
        "block";

}


/* =====================================================
   CARGAR IMAGEN
   ===================================================== */

function cargarImagen(
    idImagen,
    ruta
) {

    const imagen =
        document.getElementById(
            idImagen
        );


    if(!imagen) {

        return;

    }


    imagen.style.display =
        "none";


    if(!ruta) {

        return;

    }


    imagen.src =
        ruta;


    imagen.onload =
        function() {

            imagen.style.display =
                "block";

        };


    imagen.onerror =
        function() {

            imagen.style.display =
                "none";

        };

}


/* =====================================================
   ERROR DEL CONTENEDOR
   ===================================================== */

document.addEventListener(
    "palentropia:error-carga",
    function(evento) {

        mostrarError(
            evento.detail
        );

    }
);


function mostrarError(error) {

    console.error(
        "ERROR GENERADOR:",
        error
    );


    document.getElementById(
        "estado"
    ).innerHTML =

        '<span class="error">' +

        "✗ ERROR: " +

        (
            error &&
            error.message

                ? error.message

                : error

        ) +

        "</span>";

}


/* =====================================================
   NAVEGACIÓN
   ===================================================== */

async function ejecutarNavegacion(
    funcion
) {

    try {

        document.getElementById(
            "estado"
        ).textContent =
            "Cargando paleoficha...";


        await funcion();


        actualizarControlesNavegacion();

    }

    catch(error) {

        mostrarError(
            error
        );

    }

}


/* =====================================================
   PRIMERO
   ===================================================== */

botonPrimero.addEventListener(
    "click",
    function() {

        ejecutarNavegacion(
            function() {

                return window.PALNAVEGADOR.primero();

            }
        );

    }
);


/* =====================================================
   ANTERIOR
   ===================================================== */

botonAnterior.addEventListener(
    "click",
    function() {

        ejecutarNavegacion(
            function() {

                return window.PALNAVEGADOR.anterior();

            }
        );

    }
);


/* =====================================================
   SIGUIENTE
   ===================================================== */

botonSiguiente.addEventListener(
    "click",
    function() {

        ejecutarNavegacion(
            function() {

                return window.PALNAVEGADOR.siguiente();

            }
        );

    }
);


/* =====================================================
   ÚLTIMO
   ===================================================== */

botonUltimo.addEventListener(
    "click",
    function() {

        ejecutarNavegacion(
            function() {

                return window.PALNAVEGADOR.ultimo();

            }
        );

    }
);


/* =====================================================
   BOTÓN ALEATORIO
   ===================================================== */

document.getElementById(
    "botonAleatorio"
)
.addEventListener(
    "click",
    async function() {

        try {

            if(
                !window.PALNAVEGADOR
            ) {

                throw new Error(
                    "PALNAVEGADOR no está disponible."
                );

            }


            document.getElementById(
                "estado"
            ).innerHTML =
                "Cargando paleoficha aleatoria...";


            await window.PALNAVEGADOR.aleatorio();


            actualizarControlesNavegacion();

        }

        catch(error) {

            mostrarError(
                error
            );

        }

    }
);


/* =====================================================
   LIGHTBOX DE IMÁGENES
   ===================================================== */

const visorImagen =
    document.getElementById(
        "visorImagen"
    );


const imagenAmpliada =
    document.getElementById(
        "imagenAmpliada"
    );


function abrirLightbox(
    imagen
) {

    if(
        !imagen ||
        !imagen.src
    ) {

        return;

    }


    imagenAmpliada.src =
        imagen.currentSrc ||
        imagen.src;


    visorImagen.style.display =
        "flex";


    visorImagen.setAttribute(
        "aria-hidden",
        "false"
    );

}


function cerrarLightbox() {

    visorImagen.style.display =
        "none";


    visorImagen.setAttribute(
        "aria-hidden",
        "true"
    );


    imagenAmpliada.src =
        "";

}


document.getElementById(
    "imagenPrincipal"
)
.addEventListener(
    "click",
    function() {

        abrirLightbox(
            this
        );

    }
);


document.getElementById(
    "img2"
)
.addEventListener(
    "click",
    function() {

        abrirLightbox(
            this
        );

    }
);


document.getElementById(
    "img3"
)
.addEventListener(
    "click",
    function() {

        abrirLightbox(
            this
        );

    }
);


document.getElementById(
    "cerrarImagen"
)
.addEventListener(
    "click",
    cerrarLightbox
);


visorImagen.addEventListener(
    "click",
    function(evento) {

        if(
            evento.target ===
            visorImagen
        ) {

            cerrarLightbox();

        }

    }
);


/* =====================================================
   BUSCADOR
   ===================================================== */

const visorBuscador =
    document.getElementById(
        "visorBuscador"
    );


function abrirBuscador() {

    visorBuscador.style.display =
        "flex";


    visorBuscador.setAttribute(
        "aria-hidden",
        "false"
    );


    const input =
        document.getElementById(
            "buscarNombre"
        );


    if(input) {

        input.value =
            "";


        setTimeout(
            function() {

                input.focus();

            },
            50
        );

    }

}


function cerrarBuscador() {

    visorBuscador.style.display =
        "none";


    visorBuscador.setAttribute(
        "aria-hidden",
        "true"
    );

}


document.getElementById(
    "botonBuscar"
)
.addEventListener(
    "click",
    abrirBuscador
);


document.getElementById(
    "cerrarBuscador"
)
.addEventListener(
    "click",
    cerrarBuscador
);


/* =====================================================
   BÚSQUEDA EN TIEMPO REAL
   ===================================================== */

const campoBusqueda =
    document.getElementById(
        "buscarNombre"
    );


const listaResultados =
    document.getElementById(
        "listaResultados"
    );


campoBusqueda.addEventListener(
    "input",
    async function() {

        const texto =
            this.value.trim();


        /* -----------------------------------------
           LIMPIAR
           ----------------------------------------- */

        if(!texto) {

            listaResultados.innerHTML =
                "";

            return;

        }


        /* -----------------------------------------
           BUSCAR
           ----------------------------------------- */

        try {

            const resultados =
                await window.PALBUSCADOR.buscar(
                    texto
                );


            listaResultados.innerHTML =
                "";


            /* -------------------------------------
               SIN RESULTADOS
               ------------------------------------- */

            if(
                !resultados.length
            ) {

                listaResultados.innerHTML =
                    '<div class="sinResultados">' +
                    'No se encontraron paleofichas' +
                    '</div>';

                return;

            }


            /* -------------------------------------
               MOSTRAR RESULTADOS
               ------------------------------------- */

            for(
                const resultado
                of resultados
            ) {

                const elemento =
                    document.createElement(
                        "button"
                    );


                elemento.type =
                    "button";


                elemento.className =
                    "resultadoBuscador";


                elemento.innerHTML =

                    '<span class="resultadoCodigo">' +

                    resultado.codigo +

                    '</span>' +

                    '<span class="resultadoNombre">' +

                    resultado.nombre +

                    '</span>';


                /* -------------------------------
                   SELECCIONAR RESULTADO
                   ------------------------------- */

                elemento.addEventListener(
                    "click",
                    async function() {

                        try {

                            listaResultados.innerHTML =

                                '<div class="sinResultados">' +

                                'Cargando paleoficha...' +

                                '</div>';


                            await window.PALBUSCADOR.cargarResultado(
                                resultado
                            );


                            cerrarBuscador();


                        }

                        catch(error) {

                            console.error(
                                "ERROR BUSCADOR:",
                                error
                            );


                            listaResultados.innerHTML =

                                '<div class="sinResultados">' +

                                'Error al cargar la paleoficha' +

                                '</div>';

                        }

                    }
                );


                listaResultados.appendChild(
                    elemento
                );

            }

        }

        catch(error) {

            console.error(
                "ERROR PALBUSCADOR:",
                error
            );


            listaResultados.innerHTML =

                '<div class="sinResultados">' +

                'Error en el buscador' +

                '</div>';

        }

    }
);


/* =====================================================
   CERRAR BUSCADOR AL PULSAR FUERA
   ===================================================== */

visorBuscador.addEventListener(
    "click",
    function(evento) {

        if(
            evento.target ===
            visorBuscador
        ) {

            cerrarBuscador();

        }

    }
);


/* =====================================================
   TECLA ESC
   ===================================================== */

document.addEventListener(
    "keydown",
    function(evento) {

        if(
            evento.key === "Escape"
        ) {

            cerrarLightbox();

            cerrarBuscador();

        }

    }
);


/* =====================================================
   INICIAR GENERADOR
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        try {

            if(
                !window.LEEPALJSON
            ) {

                throw new Error(
                    "LEEPALJSON no está disponible."
                );

            }


            if(
                !window.CARGACONT
            ) {

                throw new Error(
                    "CARGACONT no está disponible."
                );

            }


            if(
                !window.PALBUSCADOR
            ) {

                throw new Error(
                    "PALBUSCADOR no está disponible."
                );

            }


            if(
                !window.PALNAVEGADOR
            ) {

                throw new Error(
                    "PALNAVEGADOR no está disponible."
                );

            }


            /* -----------------------------------------
               INICIALIZAR NAVEGADOR
               ----------------------------------------- */

            await window.PALNAVEGADOR.inicializar();


            /* -----------------------------------------
               CARGAR PALEOFICHA ALEATORIA
               ----------------------------------------- */

            await window.PALNAVEGADOR.aleatorio();


            /* -----------------------------------------
               ACTUALIZAR CONTROLES
               ----------------------------------------- */

            actualizarControlesNavegacion();

        }

        catch(error) {

            mostrarError(
                error
            );

        }

    }
);


/* =====================================================
   FIN GENERADOR
   ===================================================== */

</script>


</body>

</html>
