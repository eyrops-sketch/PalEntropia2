<!DOCTYPE html><html lang="es">
<head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PalEntropía — Test Generador Aleatorio</title><style>

    body {
        margin: 0;
        padding: 20px;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
    }

    h1 {
        margin-top: 0;
    }

    #estado {
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 6px;
        background: #222;
    }

    .ok {
        color: #7CFF7C;
    }

    .error {
        color: #FF7777;
    }

    .ficha {
        max-width: 900px;
        margin: auto;
        padding: 20px;
        background: #181818;
        border-radius: 10px;
    }

    .datos {
        margin-bottom: 20px;
        line-height: 1.6;
    }

    .imagenes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .imagen {
        background: #222;
        padding: 10px;
        border-radius: 8px;
    }

    .imagen img {
        display: block;
        width: 100%;
        height: 220px;
        object-fit: contain;
        background: #000;
        border-radius: 5px;
    }

    .imagen p {
        font-size: 13px;
        word-break: break-all;
    }

    @media (max-width: 700px) {

        .imagenes {
            grid-template-columns: 1fr;
        }

    }

</style></head><body><div class="ficha"><h1>PalEntropía — Test Generador Aleatorio</h1>

<div id="estado">
    Cargando contenedor...
</div>


<div id="contenido" style="display:none;">

    <div class="datos">

        <div>
            <strong>j1:</strong>
            <span id="j1"></span>
        </div>

        <div>
            <strong>j2:</strong>
            <span id="j2"></span>
        </div>

        <div>
            <strong>j7:</strong>
            <span id="j7"></span>
        </div>

        <div>
            <strong>j8:</strong>
            <span id="j8"></span>
        </div>

    </div>


    <h2>Imágenes</h2>

    <div class="imagenes">

        <div class="imagen">

            <strong>i0</strong>

            <img id="imagen_i0"
                 alt="Imagen i0">

            <p id="ruta_i0"></p>

        </div>


        <div class="imagen">

            <strong>i2</strong>

            <img id="imagen_i2"
                 alt="Imagen i2">

            <p id="ruta_i2"></p>

        </div>


        <div class="imagen">

            <strong>i3</strong>

            <img id="imagen_i3"
                 alt="Imagen i3">

            <p id="ruta_i3"></p>

        </div>

    </div>

</div>

</div><!-- =====================================================
     MÓDULOS DEL CONTENEDOR
===================================================== --><script src="leepaljson.js"></script><script src="buscaruta.js"></script><script src="cargacont.js"></script><!-- =====================================================
     TEST DEL GENERADOR
===================================================== --><script>

document.addEventListener(
    "palentropia:contenedor-cargado",
    function(evento) {

        try {

            const ficha =
                evento.detail;


            if(!ficha) {

                throw new Error(
                    "CARGACONT no entregó ningún registro."
                );

            }


            /* =========================================
               DATOS FINALES
            ========================================= */

            document.getElementById("j1")
                .textContent =
                ficha.j1 || "";

            document.getElementById("j2")
                .textContent =
                ficha.j2 || "";

            document.getElementById("j7")
                .textContent =
                ficha.j7 || "";

            document.getElementById("j8")
                .textContent =
                ficha.j8 || "";


            /* =========================================
               IMÁGENES
            ========================================= */

            cargarImagen(
                "imagen_i0",
                "ruta_i0",
                ficha.i0
            );

            cargarImagen(
                "imagen_i2",
                "ruta_i2",
                ficha.i2
            );

            cargarImagen(
                "imagen_i3",
                "ruta_i3",
                ficha.i3
            );


            /* =========================================
               MOSTRAR RESULTADO
            ========================================= */

            document.getElementById(
                "contenido"
            ).style.display = "block";


            document.getElementById(
                "estado"
            ).innerHTML =
                '<span class="ok">' +
                "✓ CONTENEDOR ALEATORIO RECIBIDO — FICHA " +
                ficha.j1 +
                " CARGADA" +
                "</span>";


            console.log(
                "========================================"
            );

            console.log(
                "PalEntropía — TEST GENERADOR ALEATORIO"
            );

            console.log(
                "Registro final recibido:"
            );

            console.log(
                ficha
            );

            console.log(
                "========================================"
            );

        }


        catch(error) {

            mostrarError(error);

        }

    }
);


/* =====================================================
   FUNCIÓN CARGAR IMAGEN
===================================================== */

function cargarImagen(
    idImagen,
    idRuta,
    ruta
) {

    const imagen =
        document.getElementById(
            idImagen
        );

    const textoRuta =
        document.getElementById(
            idRuta
        );


    if(!ruta) {

        imagen.style.display =
            "none";

        textoRuta.innerHTML =
            "<strong>Sin imagen</strong>";

        return;

    }


    textoRuta.textContent =
        ruta;


    imagen.src =
        ruta;


    imagen.onload =
        function() {

            textoRuta.innerHTML =
                ruta +
                "<br><strong>✓ Imagen encontrada</strong>";

        };


    imagen.onerror =
        function() {

            textoRuta.innerHTML =
                ruta +
                "<br><strong>✗ Imagen no encontrada</strong>";

            imagen.style.display =
                "none";

        };

}


/* =====================================================
   ERROR DEL CONTENEDOR
===================================================== */

document.addEventListener(
    "palentropia:error-carga",
    function(evento) {

        mostrarError(
            evento.detail
        );

    }
);


/* =====================================================
   MOSTRAR ERROR
===================================================== */

function mostrarError(error) {

    console.error(
        "ERROR TEST GENERADOR:",
        error
    );


    document.getElementById(
        "estado"
    ).innerHTML =
        '<span class="error">' +
        "✗ ERROR: " +
        (
            error.message ||
            error
        ) +
        "</span>";

}


/* =====================================================
   INICIAR PRUEBA ALEATORIA
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        try {

            /* -----------------------------------------
               COMPROBAR LEEPALJSON
            ----------------------------------------- */

            if(
                !window.LEEPALJSON
            ) {

                throw new Error(
                    "LEEPALJSON no está disponible."
                );

            }


            /* -----------------------------------------
               COMPROBAR CARGACONT
            ----------------------------------------- */

            if(
                !window.CARGACONT
            ) {

                throw new Error(
                    "CARGACONT no está disponible."
                );

            }


            /* -----------------------------------------
               PRIMERO:

               Cargar master.csv
            ----------------------------------------- */

            await window.LEEPALJSON.cargar();


            /* -----------------------------------------
               SEGUNDO:

               Cargar una ficha ALEATORIA
            ----------------------------------------- */

            await window.CARGACONT.aleatorio();

        }

        catch(error) {

            mostrarError(error);

        }

    }
);

</script></body>
</html>
