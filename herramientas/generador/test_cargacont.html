<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PalEntropía — Test CARGACONT</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#111;
    color:#eee;
}

button,
input{
    font-size:16px;
    padding:10px;
    margin:5px 0;
}

button{
    cursor:pointer;
}

#resultado{
    white-space:pre-wrap;
    background:#1d1d1d;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
    overflow:auto;
}

.imagenes{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-top:20px;
}

.imagen{
    width:30%;
    min-width:180px;
}

.imagen img{
    width:100%;
    display:block;
    border-radius:8px;
}

.estado-ok{
    color:#7cff9b;
}

.estado-error{
    color:#ff7777;
}

</style>

</head>


<body>

<h1>PalEntropía</h1>

<h2>Test CARGACONT</h2>


<div>

<input
    id="entradaJ1"
    type="text"
    placeholder="Ejemplo: 001_01"
>

<br>

<button id="btnCargar">

Cargar J1

</button>

<button id="btnAleatorio">

Cargar aleatorio

</button>

</div>


<div id="resultado">

Esperando carga...

</div>


<div
    id="imagenes"
    class="imagenes"
></div>


<script src="leepaljson.js"></script>

<script src="buscaruta.js"></script>

<script src="cargacont.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const entrada =
            document.getElementById(
                "entradaJ1"
            );

        const btnCargar =
            document.getElementById(
                "btnCargar"
            );

        const btnAleatorio =
            document.getElementById(
                "btnAleatorio"
            );

        const resultado =
            document.getElementById(
                "resultado"
            );

        const imagenes =
            document.getElementById(
                "imagenes"
            );


        /* ==========================================
           MOSTRAR RESULTADO
        ========================================== */

        function mostrar(datos){

            resultado.textContent =
                JSON.stringify(
                    datos,
                    null,
                    2
                );


            imagenes.innerHTML = "";


            if(
                !datos ||
                !datos.imagenes ||
                !Array.isArray(
                    datos.imagenes.imagenes
                )
            ){

                return;

            }


            for(
                const imagen of
                datos.imagenes.imagenes
            ){

                const bloque =
                    document.createElement(
                        "div"
                    );

                bloque.className =
                    "imagen";


                const titulo =
                    document.createElement(
                        "div"
                    );

                titulo.textContent =
                    imagen.tipo +
                    " — " +
                    imagen.estado;


                bloque.appendChild(
                    titulo
                );


                if(imagen.ruta){

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src =
                        imagen.ruta;

                    img.alt =
                        datos.j1 +
                        " " +
                        imagen.tipo;


                    bloque.appendChild(
                        img
                    );

                }


                imagenes.appendChild(
                    bloque
                );

            }

        }


        /* ==========================================
           MOSTRAR ERROR
        ========================================== */

        function mostrarError(error){

            resultado.textContent =
                "ERROR CARGACONT\n\n" +
                error.message;

            imagenes.innerHTML = "";

        }


        /* ==========================================
           CARGA MANUAL
        ========================================== */

        btnCargar.addEventListener(

            "click",

            async function(){

                const j1 =
                    entrada.value
                    .trim();


                if(!j1){

                    resultado.textContent =
                        "Introduce un código j1.";

                    return;

                }


                resultado.textContent =
                    "Cargando " +
                    j1 +
                    "...";

                imagenes.innerHTML = "";


                try{

                    const datos =
                        await window.CARGACONT.cargar(
                            j1
                        );


                    mostrar(datos);

                }

                catch(error){

                    mostrarError(error);

                }

            }

        );


        /* ==========================================
           CARGA ALEATORIA
        ========================================== */

        btnAleatorio.addEventListener(

            "click",

            async function(){

                resultado.textContent =
                    "Seleccionando registro aleatorio...";

                imagenes.innerHTML = "";


                try{

                    const datos =
                        await window.CARGACONT.aleatorio();


                    mostrar(datos);

                }

                catch(error){

                    mostrarError(error);

                }

            }

        );

    }

);

</script>


</body>

</html>
