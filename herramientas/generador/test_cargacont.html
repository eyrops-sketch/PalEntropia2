<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PalEntropía — Test Carga Contenedor</title>


<style>

    body {

        margin: 0;

        padding: 20px;

        background: #111;

        color: #eee;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

    }


    h1 {

        margin-top: 0;

    }


    #estado {

        padding: 15px;

        margin-bottom: 20px;

        border-radius: 8px;

        background: #222;

    }


    .ok {

        color: #7CFF7C;

    }


    .error {

        color: #FF7070;

    }


    .aviso {

        color: #FFD966;

    }


    .registro {

        margin-bottom: 18px;

        padding: 15px;

        background: #1c1c1c;

        border-radius: 8px;

    }


    .registro h3 {

        margin-top: 0;

    }


    .imagenes {

        display: grid;

        grid-template-columns:
            repeat(
                auto-fit,
                minmax(180px, 1fr)
            );

        gap: 12px;

        margin-top: 12px;

    }


    .imagen {

        padding: 10px;

        background: #252525;

        border-radius: 6px;

    }


    .imagen img {

        display: block;

        width: 100%;

        max-height: 180px;

        object-fit: contain;

        background: #000;

        border-radius: 4px;

        margin-bottom: 8px;

    }


    .no-subida {

        padding: 30px 10px;

        text-align: center;

        background: #151515;

        border-radius: 4px;

        color: #888;

    }


    pre {

        white-space: pre-wrap;

        word-break: break-word;

    }

</style>

</head><body><h1>
    PalEntropía — Test Carga Contenedor
</h1>


<div id="estado">

    Iniciando prueba...

</div>


<div id="resultados"></div>


<!-- =================================================
     CARGA DE LOS MÓDULOS
================================================== -->


<script src="./leepaljson.js"></script>

<script src="buscaruta.js"></script>


<!-- =================================================
     PRUEBA
================================================== -->

<script>

    (async function(){

        const estado =
            document.getElementById(
                "estado"
            );

        const resultados =
            document.getElementById(
                "resultados"
            );


        function mostrarEstado(
            texto,
            clase = ""
        ){

            estado.className = clase;

            estado.textContent = texto;

        }


        /* =================================================
           COMPROBAR LEEPALJSON
        ================================================= */

        if(
            typeof window.LEEPALJSON ===
            "undefined"
        ){

            mostrarEstado(
                "✗ ERROR: LEEPALJSON.js no está cargado.",
                "error"
            );

            return;

        }


        if(
            typeof window.LEEPALJSON.cargar !==
            "function"
        ){

            mostrarEstado(
                "✗ ERROR: LEEPALJSON está cargado pero no contiene la función cargar().",
                "error"
            );

            return;

        }


        /* =================================================
           COMPROBAR BUSCARUTA
        ================================================= */

        if(
            typeof window.BUSCARUTA ===
            "undefined"
        ){

            mostrarEstado(
                "✗ ERROR: buscaruta.js no está cargado.",
                "error"
            );

            return;

        }


        mostrarEstado(
            "✓ Módulos cargados. Esperando master.csv..."
        );


        /* =================================================
           ESPERAR A QUE LEEPALJSON CARGUE EL CSV
        ================================================= */

        let datos;


        try {

            datos =
                await window.LEEPALJSON.cargar();

        }

        catch(error){

            console.error(
                error
            );

            mostrarEstado(
                "✗ ERROR AL CARGAR master.csv: " +
                error.message,
                "error"
            );

            return;

        }


        /* =================================================
           COMPROBAR DATOS
        ================================================= */

        if(
            !Array.isArray(datos)
        ){

            mostrarEstado(
                "✗ ERROR: los datos cargados no son un array.",
                "error"
            );

            return;

        }


        mostrarEstado(
            "✓ master.csv cargado correctamente. " +
            datos.length +
            " registros preparados. Probando imágenes...",
            "ok"
        );


        /* =================================================
           RECORRER REGISTROS
        ================================================= */

        let imagenesOK = 0;

        let imagenesNoSubidas = 0;

        let registrosOK = 0;


        for(
            const registro of datos
        ){

            const j1 =
                String(
                    registro.codigo || ""
                ).trim();


            if(
                !j1
            ){

                continue;

            }


            let resultado;


            try {

                resultado =
                    await window.BUSCARUTA.buscar(
                        j1
                    );

            }

            catch(error){

                console.error(
                    "Error BUSCARUTA:",
                    j1,
                    error
                );

                resultado = {

                    j1: j1,

                    caso: "error",

                    imagenes: [],

                    error:
                        error.message

                };

            }


            registrosOK++;


            const bloque =
                document.createElement(
                    "div"
                );

            bloque.className =
                "registro";


            const titulo =
                document.createElement(
                    "h3"
                );

            titulo.textContent =
                j1 +
                " — " +
                (
                    registro.nombre ||
                    "Sin nombre"
                );


            bloque.appendChild(
                titulo
            );


            const info =
                document.createElement(
                    "div"
                );


            info.innerHTML =
                "<strong>Caso:</strong> " +
                (
                    resultado.caso ||
                    "—"
                );


            if(
                resultado.j2
            ){

                info.innerHTML +=
                    "<br><strong>j2:</strong> " +
                    resultado.j2;

            }


            if(
                resultado.error
            ){

                info.innerHTML +=
                    "<br><span class='error'>" +
                    "<strong>Error:</strong> " +
                    resultado.error +
                    "</span>";

            }


            bloque.appendChild(
                info
            );


            const contenedorImagenes =
                document.createElement(
                    "div"
                );

            contenedorImagenes.className =
                "imagenes";


            for(
                const imagen of
                (
                    resultado.imagenes ||
                    []
                )
            ){

                const caja =
                    document.createElement(
                        "div"
                    );

                caja.className =
                    "imagen";


                const etiqueta =
                    document.createElement(
                        "strong"
                    );

                etiqueta.textContent =
                    imagen.tipo;


                caja.appendChild(
                    etiqueta
                );


                if(
                    imagen.ruta &&
                    imagen.estado ===
                    "ok"
                ){

                    imagenesOK++;


                    const elemento =
                        document.createElement(
                            "img"
                        );


                    elemento.src =
                        imagen.ruta;


                    elemento.alt =
                        j1 +
                        "_" +
                        imagen.tipo;


                    caja.appendChild(
                        elemento
                    );


                    const ruta =
                        document.createElement(
                            "div"
                        );


                    ruta.textContent =
                        imagen.ruta;


                    caja.appendChild(
                        ruta
                    );

                }

                else {

                    imagenesNoSubidas++;


                    const aviso =
                        document.createElement(
                            "div"
                        );


                    aviso.className =
                        "no-subida";


                    aviso.textContent =
                        "Imagen no subida";


                    caja.appendChild(
                        aviso
                    );

                }


                contenedorImagenes.appendChild(
                    caja
                );

            }


            bloque.appendChild(
                contenedorImagenes
            );


            resultados.appendChild(
                bloque
            );

        }


        /* =================================================
           RESULTADO FINAL
        ================================================== */

        mostrarEstado(

            "✓ PRUEBA COMPLETADA — " +

            registrosOK +

            " registros | " +

            imagenesOK +

            " imágenes encontradas | " +

            imagenesNoSubidas +

            " imágenes no subidas",

            "ok"

        );


        console.log(
            "========================================"
        );

        console.log(
            "PalEntropía — TEST CARGA CONTENEDOR"
        );

        console.log(
            "Registros:",
            registrosOK
        );

        console.log(
            "Imágenes encontradas:",
            imagenesOK
        );

        console.log(
            "Imágenes no subidas:",
            imagenesNoSubidas
        );

        console.log(
            "========================================"
        );


    })();

</script>

</body></html>
