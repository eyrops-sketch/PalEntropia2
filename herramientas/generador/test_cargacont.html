<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PalEntropía — Test CARGACONT</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#111;
    color:#eee;
}

button,
input{
    font-size:16px;
    padding:10px;
    margin:5px 0;
}

button{
    cursor:pointer;
}

#resultado{
    white-space:pre-wrap;
    background:#1d1d1d;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
    overflow:auto;
}

.imagenes{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-top:20px;
}

.imagen{
    width:30%;
    min-width:180px;
}

.imagen img{
    width:100%;
    display:block;
    border-radius:8px;
}

.titulo-imagen{
    margin-bottom:6px;
    font-weight:bold;
}

.estado-ok{
    color:#7cff9b;
}

.estado-error{
    color:#ff7777;
}

.ruta{
    font-size:12px;
    word-break:break-all;
    margin-top:6px;
    color:#aaa;
}

</style>

</head>


<body>

<h1>PalEntropía</h1>

<h2>Test CARGACONT</h2>


<div>

<input
    id="entradaJ1"
    type="text"
    placeholder="Ejemplo: 001_01"
>

<br>

<button id="btnCargar">
Cargar J1
</button>

<button id="btnAleatorio">
Cargar aleatorio
</button>

</div>


<div id="resultado">
Esperando carga...
</div>


<div
    id="imagenes"
    class="imagenes"
></div>


<!-- ==================================================
     MÓDULOS
================================================== -->

<script src="leepaljson.js"></script>

<script src="buscaruta.js"></script>

<script src="cargacont.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const entrada =
            document.getElementById(
                "entradaJ1"
            );

        const btnCargar =
            document.getElementById(
                "btnCargar"
            );

        const btnAleatorio =
            document.getElementById(
                "btnAleatorio"
            );

        const resultado =
            document.getElementById(
                "resultado"
            );

        const imagenes =
            document.getElementById(
                "imagenes"
            );


        /* ==========================================
           MOSTRAR RESULTADO
        ========================================== */

        function mostrar(datos){

            resultado.textContent =
                JSON.stringify(
                    datos,
                    null,
                    2
                );


            imagenes.innerHTML = "";


            if(!datos){

                return;

            }


            /*
            =================================================
            CARGACONT ENTREGA:

            i0
            i2
            i3

            como rutas absolutas.

            Ejemplo:

            /paleofichas/vol003/
            003_05_anomalocaris/
            Anomalocaris_i0.png
            =================================================
            */


            const tipos = [
                "i0",
                "i2",
                "i3"
            ];


            for(
                const tipo of tipos
            ){

                const ruta =
                    datos[tipo];


                const bloque =
                    document.createElement(
                        "div"
                    );

                bloque.className =
                    "imagen";


                const titulo =
                    document.createElement(
                        "div"
                    );

                titulo.className =
                    "titulo-imagen";

                titulo.textContent =
                    tipo;


                bloque.appendChild(
                    titulo
                );


                /*
                ==============================================
                SI CARGACONT HA ENTREGADO RUTA
                ==============================================
                */

                if(ruta){

                    const img =
                        document.createElement(
                            "img"
                        );


                    /*
                    ------------------------------------------
                    LA RUTA YA VIENE PREPARADA POR CARGACONT.
                    EL HTML NO LA MODIFICA.
                    ------------------------------------------
                    */

                    img.src =
                        ruta;


                    img.alt =
                        datos.j1 +
                        " " +
                        tipo;


                    /*
                    ------------------------------------------
                    INFORMACIÓN DE CARGA
                    ------------------------------------------
                    */

                    img.onload =
                        function(){

                            estado.className =
                                "estado-ok";

                            estado.textContent =
                                "✓ imagen cargada";

                        };


                    img.onerror =
                        function(){

                            estado.className =
                                "estado-error";

                            estado.textContent =
                                "✗ error al cargar";

                        };


                    bloque.appendChild(
                        img
                    );


                    /*
                    ------------------------------------------
                    MOSTRAR RUTA REAL
                    ------------------------------------------
                    */

                    const rutaTexto =
                        document.createElement(
                            "div"
                        );

                    rutaTexto.className =
                        "ruta";

                    rutaTexto.textContent =
                        ruta;


                    bloque.appendChild(
                        rutaTexto
                    );


                    /*
                    ------------------------------------------
                    ESTADO
                    ------------------------------------------
                    */

                    const estado =
                        document.createElement(
                            "div"
                        );

                    estado.textContent =
                        "Cargando...";


                    bloque.appendChild(
                        estado
                    );

                }

                else{

                    const estado =
                        document.createElement(
                            "div"
                        );

                    estado.className =
                        "estado-error";

                    estado.textContent =
                        "✗ imagen no disponible";


                    bloque.appendChild(
                        estado
                    );

                }


                imagenes.appendChild(
                    bloque
                );

            }

        }


        /* ==========================================
           MOSTRAR ERROR
        ========================================== */

        function mostrarError(error){

            resultado.textContent =
                "ERROR CARGACONT\n\n" +
                (
                    error &&
                    error.message
                        ? error.message
                        : error
                );


            imagenes.innerHTML = "";

        }


        /* ==========================================
           CARGA MANUAL
        ========================================== */

        btnCargar.addEventListener(

            "click",

            async function(){

                const j1 =
                    entrada.value
                    .trim();


                if(!j1){

                    resultado.textContent =
                        "Introduce un código j1.";

                    imagenes.innerHTML = "";

                    return;

                }


                resultado.textContent =
                    "Cargando " +
                    j1 +
                    "...";


                imagenes.innerHTML = "";


                try{

                    const datos =
                        await window.CARGACONT.cargar(
                            j1
                        );


                    mostrar(datos);

                }

                catch(error){

                    mostrarError(error);

                }

            }

        );


        /* ==========================================
           CARGA ALEATORIA
        ========================================== */

        btnAleatorio.addEventListener(

            "click",

            async function(){

                resultado.textContent =
                    "Seleccionando registro aleatorio...";


                imagenes.innerHTML = "";


                try{

                    const datos =
                        await window.CARGACONT.aleatorio();


                    mostrar(datos);

                }

                catch(error){

                    mostrarError(error);

                }

            }

        );

    }

);

</script>


</body>

</html>
