<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PalEntropía — Test Carga Contenedor
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 20px;

            background: #111;

            color: #eee;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }

        h1 {

            margin-top: 0;

            font-size: 24px;

        }

        #estado {

            padding: 14px;

            margin-bottom: 20px;

            border: 1px solid #444;

            border-radius: 8px;

            background: #1b1b1b;

        }

        .registro {

            margin-bottom: 18px;

            padding: 14px;

            border: 1px solid #333;

            border-radius: 8px;

            background: #181818;

        }

        .cabecera {

            margin-bottom: 12px;

            padding-bottom: 10px;

            border-bottom: 1px solid #333;

        }

        .j1 {

            font-size: 18px;

            font-weight: bold;

        }

        .nombre {

            font-size: 16px;

            margin-top: 4px;

        }

        .datos {

            margin-top: 8px;

            color: #bbb;

            font-size: 13px;

            line-height: 1.5;

        }

        .imagenes {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 12px;

            margin-top: 14px;

        }

        .imagen {

            min-height: 150px;

            padding: 8px;

            border: 1px solid #333;

            border-radius: 6px;

            background: #101010;

        }

        .imagen-titulo {

            margin-bottom: 8px;

            font-weight: bold;

        }

        .imagen img {

            display: block;

            width: 100%;

            max-height: 220px;

            object-fit: contain;

            border-radius: 4px;

        }

        .ok {

            color: #7CFF8A;

        }

        .error {

            color: #ff7777;

        }

        .ruta {

            margin-top: 7px;

            word-break: break-all;

            font-size: 11px;

            color: #999;

        }

    </style>

</head>


<body>


    <h1>
        PalEntropía — Test Carga Contenedor
    </h1>


    <div id="estado">
        Iniciando prueba...
    </div>


    <div id="contenedor"></div>


    <!-- =================================================
         LECTOR CSV
         ================================================= -->

    <script src="LEEPALJSON.js"></script>


    <!-- =================================================
         BUSCARUTA
         ================================================= -->

    <script src="buscaruta.js"></script>


    <!-- =================================================
         PRUEBA DE INTEGRACIÓN
         ================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            iniciarPrueba
        );


        async function iniciarPrueba() {

            const estado =
                document.getElementById(
                    "estado"
                );


            const contenedor =
                document.getElementById(
                    "contenedor"
                );


            try {

                /* =========================================
                   COMPROBACIÓN 1
                   ========================================= */

                if (
                    !window.LEEPALJSON
                ) {

                    throw new Error(
                        "LEEPALJSON.js no está cargado."
                    );

                }


                if (
                    !window.BUSCARUTA
                ) {

                    throw new Error(
                        "buscaruta.js no está cargado."
                    );

                }


                estado.textContent =
                    "Cargando master.csv...";


                /* =========================================
                   CARGAR CSV
                   ========================================= */

                const datos =

                    await window.LEEPALJSON.cargar(
                        "master.csv"
                    );


                if (
                    !Array.isArray(datos)
                ) {

                    throw new Error(
                        "LEEPALJSON no devolvió un array."
                    );

                }


                estado.innerHTML =

                    '<span class="ok">' +

                    "✓ CSV cargado: " +

                    datos.length +

                    " registros" +

                    "</span>" +

                    "<br><br>" +

                    "Comenzando prueba de BUSCARUTA...";


                /* =========================================
                   PROBAR TODOS LOS REGISTROS
                   ========================================= */

                let total = 0;

                let correctas = 0;

                let faltantes = 0;


                for (
                    const registro
                    of datos
                ) {

                    const j1 =
                        registro.codigo;


                    const resultado =

                        await window.BUSCARUTA.buscar(
                            j1
                        );


                    const bloque =
                        document.createElement(
                            "div"
                        );


                    bloque.className =
                        "registro";


                    /* -------------------------------------
                       DATOS
                       ------------------------------------- */

                    bloque.innerHTML =

                        '<div class="cabecera">' +

                        '<div class="j1">' +

                        escaparHTML(
                            j1
                        ) +

                        "</div>" +

                        '<div class="nombre">' +

                        escaparHTML(
                            registro.nombre
                        ) +

                        "</div>" +

                        '<div class="datos">' +

                        "Dieta: " +

                        escaparHTML(
                            registro.dieta
                        ) +

                        "<br>" +

                        "Anatomía: " +

                        escaparHTML(
                            registro.anatomia
                        ) +

                        "</div>" +

                        "</div>";


                    /* -------------------------------------
                       IMÁGENES
                       ------------------------------------- */

                    const imagenes =
                        document.createElement(
                            "div"
                        );


                    imagenes.className =
                        "imagenes";


                    for (
                        const imagen
                        of resultado.imagenes
                    ) {

                        total++;


                        const caja =
                            document.createElement(
                                "div"
                            );


                        caja.className =
                            "imagen";


                        const titulo =
                            document.createElement(
                                "div"
                            );


                        titulo.className =
                            "imagen-titulo";


                        titulo.textContent =
                            imagen.tipo;


                        caja.appendChild(
                            titulo
                        );


                        if (
                            imagen.estado ===
                            "ok"
                        ) {

                            correctas++;


                            const img =
                                document.createElement(
                                    "img"
                                );


                            img.src =
                                imagen.ruta;


                            img.alt =
                                j1 +
                                " " +
                                imagen.tipo;


                            caja.appendChild(
                                img
                            );


                            const ok =
                                document.createElement(
                                    "div"
                                );


                            ok.className =
                                "ok";


                            ok.textContent =
                                "✓ Imagen cargada";


                            caja.appendChild(
                                ok
                            );


                            const ruta =
                                document.createElement(
                                    "div"
                                );


                            ruta.className =
                                "ruta";


                            ruta.textContent =
                                imagen.ruta;


                            caja.appendChild(
                                ruta
                            );

                        }

                        else {

                            faltantes++;


                            const error =
                                document.createElement(
                                    "div"
                                );


                            error.className =
                                "error";


                            error.textContent =
                                "Imagen no subida";


                            caja.appendChild(
                                error
                            );

                        }


                        imagenes.appendChild(
                            caja
                        );

                    }


                    bloque.appendChild(
                        imagenes
                    );


                    /* -------------------------------------
                       CASO BUSCARUTA
                       ------------------------------------- */

                    const caso =
                        document.createElement(
                            "div"
                        );


                    caso.className =
                        "datos";


                    caso.textContent =

                        "BUSCARUTA: " +

                        resultado.caso;


                    bloque.appendChild(
                        caso
                    );


                    contenedor.appendChild(
                        bloque
                    );

                }


                /* =========================================
                   RESULTADO FINAL
                   ========================================= */

                estado.innerHTML =

                    '<span class="ok">' +

                    "✓ PRUEBA COMPLETADA" +

                    "</span>" +

                    "<br><br>" +

                    "Registros: " +

                    datos.length +

                    "<br>" +

                    "Imágenes comprobadas: " +

                    total +

                    "<br>" +

                    "Imágenes cargadas: " +

                    correctas +

                    "<br>" +

                    "Imágenes no subidas: " +

                    faltantes;


            }

            catch (error) {

                console.error(
                    "ERROR TEST CARGACONT:",
                    error
                );


                estado.innerHTML =

                    '<span class="error">' +

                    "✗ ERROR EN LA PRUEBA" +

                    "</span>" +

                    "<br><br>" +

                    escaparHTML(
                        error.message
                    );

            }

        }


        /* =============================================
           ESCAPAR HTML
           ============================================= */

        function escaparHTML(
            valor
        ) {

            return String(
                valor ?? ""
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

        }

    </script>


</body>

</html>
