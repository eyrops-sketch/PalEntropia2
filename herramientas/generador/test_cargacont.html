<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PalEntropía — Test Carga Contenedor
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 20px;

            background: #111;

            color: #eee;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }

        h1 {

            margin-top: 0;

            font-size: 24px;

        }

        #estado {

            padding: 14px;

            margin-bottom: 20px;

            border: 1px solid #444;

            border-radius: 8px;

            background: #1b1b1b;

        }

        .registro {

            margin-bottom: 18px;

            padding: 14px;

            border: 1px solid #333;

            border-radius: 8px;

            background: #181818;

        }

        .cabecera {

            margin-bottom: 12px;

            padding-bottom: 10px;

            border-bottom: 1px solid #333;

        }

        .j1 {

            font-size: 18px;

            font-weight: bold;

        }

        .nombre {

            font-size: 16px;

            margin-top: 4px;

        }

        .datos {

            margin-top: 8px;

            color: #bbb;

            font-size: 13px;

            line-height: 1.5;

        }

        .imagenes {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 12px;

            margin-top: 14px;

        }

        .imagen {

            min-height: 150px;

            padding: 8px;

            border: 1px solid #333;

            border-radius: 6px;

            background: #101010;

        }

        .imagen-titulo {

            margin-bottom: 8px;

            font-weight: bold;

        }

        .imagen img {

            display: block;

            width: 100%;

            max-height: 220px;

            object-fit: contain;

            border-radius: 4px;

        }

        .ok {

            color: #7CFF8A;

        }

        .error {

            color: #ff7777;

        }

        .ruta {

            margin-top: 7px;

            word-break: break-all;

            font-size: 11px;

            color: #999;

        }

        .resumen {

            margin-top: 20px;

            padding: 14px;

            border: 1px solid #444;

            border-radius: 8px;

            background: #1b1b1b;

            font-size: 14px;

            line-height: 1.6;

        }

    </style>

</head>


<body>


    <h1>
        PalEntropía — Test Carga Contenedor
    </h1>


    <div id="estado">
        Iniciando prueba...
    </div>


    <div id="contenedor"></div>


    <div
        id="resumen"
        class="resumen"
    >
    </div>


    <!-- =================================================
         LEEPALJSON
         ================================================= -->

    <script src="herramientas/generador/LEEPALJSON.js"></script>


    <!-- =================================================
         BUSCARUTA
         ================================================= -->

    <script src="herramientas/generador/buscaruta.js"></script>


    <!-- =================================================
         PRUEBA
         ================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            iniciarPrueba
        );


        async function iniciarPrueba() {

            const estado =
                document.getElementById(
                    "estado"
                );

            const contenedor =
                document.getElementById(
                    "contenedor"
                );

            const resumen =
                document.getElementById(
                    "resumen"
                );


            try {

                /* =========================================
                   1. PREPARAR LECTOR DEL CSV
                   ========================================= */

                estado.innerHTML =
                    "Cargando master.csv...";


                /*
                LEEPALJSON intenta automáticamente
                cargar master.csv.

                Aquí utilizamos explícitamente la ruta
                del master del Generador.
                */

                const datos =

                    await window.LEEPALJSON.cargar(
                        "herramientas/generador/master.csv"
                    );


                if (
                    !Array.isArray(datos)
                ) {

                    throw new Error(
                        "LEEPALJSON no devolvió un array."
                    );

                }


                estado.innerHTML =

                    "CSV cargado correctamente. " +

                    datos.length +

                    " registros encontrados. " +

                    "Comprobando imágenes...";


                /* =========================================
                   2. PREPARAR PALEOFICHAS.JSON
                      PARA BUSCARUTA — CASO 2
                   ========================================= */

                /*
                BUSCARUTA v2.0 LTS espera
                paleofichas.json relativo a la página.

                Como esta prueba está en la raíz,
                preparamos su caché directamente con
                el JSON real del Generador.

                NO modificamos buscaruta.js.
                */

                const respuestaJSON =

                    await fetch(
                        "herramientas/generador/paleofichas.json",
                        {
                            cache: "default"
                        }
                    );


                if (
                    !respuestaJSON.ok
                ) {

                    throw new Error(
                        "No se pudo cargar " +
                        "herramientas/generador/paleofichas.json"
                    );

                }


                const datosJSON =

                    await respuestaJSON.json();


                window.BUSCARUTA._datosJSON =
                    datosJSON;


                /* =========================================
                   3. RECORRER TODOS LOS REGISTROS
                   ========================================= */

                let totalImagenes = 0;

                let imagenesOK = 0;

                let imagenesFaltantes = 0;


                for (
                    const registro of datos
                ) {

                    const j1 =
                        registro.codigo;


                    /* -------------------------------------
                       CONTENEDOR DEL REGISTRO
                       ------------------------------------- */

                    const bloque =
                        document.createElement(
                            "div"
                        );


                    bloque.className =
                        "registro";


                    /* -------------------------------------
                       CABECERA
                       ------------------------------------- */

                    const cabecera =
                        document.createElement(
                            "div"
                        );


                    cabecera.className =
                        "cabecera";


                    cabecera.innerHTML =

                        '<div class="j1">' +

                        escaparHTML(
                            j1
                        ) +

                        '</div>' +

                        '<div class="nombre">' +

                        escaparHTML(
                            registro.nombre
                        ) +

                        '</div>' +

                        '<div class="datos">' +

                        'dieta: ' +

                        escaparHTML(
                            registro.dieta
                        ) +

                        '<br>' +

                        'anatomia: ' +

                        escaparHTML(
                            registro.anatomia
                        ) +

                        '</div>';


                    bloque.appendChild(
                        cabecera
                    );


                    /* -------------------------------------
                       BUSCARUTA
                       ------------------------------------- */

                    const resultado =

                        await window.BUSCARUTA.buscar(
                            j1
                        );


                    /* -------------------------------------
                       IMÁGENES
                       ------------------------------------- */

                    const imagenes =
                        document.createElement(
                            "div"
                        );


                    imagenes.className =
                        "imagenes";


                    for (
                        const imagen
                        of resultado.imagenes
                    ) {

                        totalImagenes++;


                        const caja =
                            document.createElement(
                                "div"
                            );


                        caja.className =
                            "imagen";


                        const titulo =
                            document.createElement(
                                "div"
                            );


                        titulo.className =
                            "imagen-titulo";


                        titulo.textContent =
                            imagen.tipo;


                        caja.appendChild(
                            titulo
                        );


                        if (
                            imagen.estado ===
                            "ok"
                        ) {

                            imagenesOK++;


                            const elemento =
                                document.createElement(
                                    "img"
                                );


                            elemento.src =
                                imagen.ruta;


                            elemento.alt =

                                j1 +
                                " " +
                                imagen.tipo;


                            caja.appendChild(
                                elemento
                            );


                            const estadoImagen =
                                document.createElement(
                                    "div"
                                );


                            estadoImagen.className =
                                "ok";


                            estadoImagen.textContent =
                                "✓ Imagen cargada";


                            caja.appendChild(
                                estadoImagen
                            );


                            const ruta =
                                document.createElement(
                                    "div"
                                );


                            ruta.className =
                                "ruta";


                            ruta.textContent =
                                imagen.ruta;


                            caja.appendChild(
                                ruta
                            );

                        }

                        else {

                            imagenesFaltantes++;


                            const estadoImagen =
                                document.createElement(
                                    "div"
                                );


                            estadoImagen.className =
                                "error";


                            estadoImagen.textContent =
                                "Imagen no subida";


                            caja.appendChild(
                                estadoImagen
                            );

                        }


                        imagenes.appendChild(
                            caja
                        );

                    }


                    bloque.appendChild(
                        imagenes
                    );


                    /* -------------------------------------
                       INFORMACIÓN DEL CASO
                       ------------------------------------- */

                    const informacion =
                        document.createElement(
                            "div"
                        );


                    informacion.className =
                        "datos";


                    informacion.textContent =

                        "BUSCARUTA → " +
                        resultado.caso;


                    bloque.appendChild(
                        informacion
                    );


                    contenedor.appendChild(
                        bloque
                    );

                }


                /* =========================================
                   4. RESUMEN
                   ========================================= */

                estado.innerHTML =

                    '<span class="ok">' +

                    "✓ PRUEBA COMPLETADA" +

                    "</span>";


                resumen.innerHTML =

                    "<strong>Resultado</strong><br><br>" +

                    "Registros CSV: " +

                    datos.length +

                    "<br>" +

                    "Imágenes comprobadas: " +

                    totalImagenes +

                    "<br>" +

                    "Imágenes cargadas: " +

                    imagenesOK +

                    "<br>" +

                    "Imágenes no subidas: " +

                    imagenesFaltantes;


            }


            catch (error) {

                console.error(
                    error
                );


                estado.innerHTML =

                    '<span class="error">' +

                    "✗ ERROR EN LA PRUEBA" +

                    "</span>" +

                    "<br><br>" +

                    escaparHTML(
                        error.message
                    );


                resumen.innerHTML =

                    '<span class="error">' +

                    "La prueba se ha detenido. " +

                    "Revisa la consola del navegador."

                    +

                    "</span>";

            }

        }


        /* =================================================
           ESCAPAR HTML
           ================================================= */

        function escaparHTML(
            valor
        ) {

            return String(
                valor ?? ""
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

        }

    </script>


</body>

</html>
