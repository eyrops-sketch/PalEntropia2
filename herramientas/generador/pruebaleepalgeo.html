<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Generador — Prueba LEEPALGEO</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#eee;
    margin:0;
    padding:20px;
}

h1{
    font-size:22px;
    margin-bottom:20px;
}

.contenedor{
    max-width:700px;
    margin:auto;
}

.fila{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

input{
    width:60px;
    padding:10px;
    font-size:18px;
    text-align:center;
    box-sizing:border-box;
}

.punto,
.guion{
    font-size:22px;
}

button{
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
    margin-bottom:20px;
}

#resultado{
    display:none;
    line-height:1.6;
}

.campo{
    margin-bottom:12px;
}

.etiqueta{
    font-weight:bold;
}

.valor{
    margin-top:3px;
}

.error{
    color:#ff7777;
}

</style>

</head>


<body>

<div class="contenedor">

<h1>Generador — Prueba de LEEPALGEO</h1>


<div class="fila">

    <input
        id="inicioEntero"
        maxlength="4"
        inputmode="numeric"
        placeholder="0000"
    >

    <span class="punto">.</span>

    <input
        id="inicioDecimal"
        maxlength="4"
        inputmode="numeric"
        placeholder="0000"
    >

    <span class="guion">-</span>

    <input
        id="finEntero"
        maxlength="4"
        inputmode="numeric"
        placeholder="0000"
    >

    <span class="punto">.</span>

    <input
        id="finDecimal"
        maxlength="4"
        inputmode="numeric"
        placeholder="0000"
    >

</div>


<button id="buscar">
    Buscar
</button>


<div id="resultado">

    <div class="campo">

        <div class="etiqueta">
            Intervalo:
        </div>

        <div
            id="intervalo"
            class="valor">
        </div>

    </div>


    <div class="campo">

        <div class="etiqueta">
            Período:
        </div>

        <div
            id="periodo"
            class="valor">
        </div>

    </div>


    <div class="campo">

        <div class="etiqueta">
            Subperíodo:
        </div>

        <div
            id="edad"
            class="valor">
        </div>

    </div>

</div>


<div
    id="mensaje"
    class="error">
</div>

</div>


<!-- =====================================================
     BASE CRONOESTRATIGRÁFICA
===================================================== -->

<script src="js/palgeo.js"></script>


<!-- =====================================================
     MÓDULO SIMPLIFICADO
===================================================== -->

<script src="js/palgeosimplificado.js"></script>


<!-- =====================================================
     LECTOR PALGEO
===================================================== -->

<script src="js/leepalgeo.js"></script>


<script>

document
.getElementById("buscar")
.addEventListener(
    "click",
    function(){

        const ie =
            document
            .getElementById("inicioEntero")
            .value
            .trim();

        const id =
            document
            .getElementById("inicioDecimal")
            .value
            .trim();

        const fe =
            document
            .getElementById("finEntero")
            .value
            .trim();

        const fd =
            document
            .getElementById("finDecimal")
            .value
            .trim();


        const mensaje =
            document
            .getElementById("mensaje");

        const resultado =
            document
            .getElementById("resultado");


        mensaje.textContent = "";

        resultado.style.display = "none";


        /*
        =================================================
        VALIDAR LAS CUATRO CAJAS
        =================================================
        */

        if(
            ie.length !== 4 ||
            id.length !== 4 ||
            fe.length !== 4 ||
            fd.length !== 4
        ){

            mensaje.textContent =
                "Debes introducir 4 caracteres en cada caja.";

            return;

        }


        if(
            !/^\d{4}$/.test(ie) ||
            !/^\d{4}$/.test(id) ||
            !/^\d{4}$/.test(fe) ||
            !/^\d{4}$/.test(fd)
        ){

            mensaje.textContent =
                "Las cuatro cajas deben contener únicamente números.";

            return;

        }


        /*
        =================================================
        CONSTRUIR CRONOLOGÍA INTERNA

        0521 + . + 0000
        -
        0201 + . + 3000

        ↓

        0521.0000-0201.3000
        =================================================
        */

        const cronologia =
            ie + "." + id +
            "-" +
            fe + "." + fd;


        /*
        =================================================
        COMPROBAR LEEPALGEO
        =================================================
        */

        if(
            !window.LEEPALGEO ||
            typeof window.LEEPALGEO.analizar !==
            "function"
        ){

            mensaje.textContent =
                "No se ha podido cargar LEEPALGEO.";

            return;

        }


        /*
        =================================================
        ANALIZAR
        =================================================
        */

        const datos =
            window.LEEPALGEO.analizar(
                cronologia
            );


        if(!datos){

            mensaje.textContent =
                "Cronología no válida o sin datos.";

            return;

        }


        /*
        =================================================
        MOSTRAR INTERVALO

        Se utiliza el formato humano
        preparado por PALGEOSIMPLIFICADO.

        NO se muestra la cronología interna.
        =================================================
        */

        document
        .getElementById("intervalo")
        .textContent =
            datos.rango || "";


        /*
        =================================================
        PERÍODOS
        =================================================
        */

        document
        .getElementById("periodo")
        .textContent =
            datos.periodo &&
            datos.periodo.length
            ?
            datos.periodo.join(" · ")
            :
            "Sin datos";


        /*
        =================================================
        SUBPERÍODOS / EDADES
        =================================================
        */

        document
        .getElementById("edad")
        .textContent =
            datos.edad &&
            datos.edad.length
            ?
            datos.edad.join(" - ")
            :
            "Sin datos";


        /*
        =================================================
        MOSTRAR RESULTADO
        =================================================
        */

        resultado.style.display =
            "block";

    }
);

</script>

</body>

</html>
