<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Generador — Prueba de LEEPALGEO</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#eee;
    margin:0;
    padding:20px;
}

.contenedor{
    max-width:800px;
    margin:auto;
}

h1{
    font-size:22px;
    margin-bottom:25px;
}

.cronologia{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.cronologia input{
    width:55px;
    height:42px;
    box-sizing:border-box;
    padding:5px;
    font-size:18px;
    text-align:center;
    background:#222;
    color:#fff;
    border:1px solid #666;
    border-radius:5px;
}

.simbolo{
    font-size:24px;
}

button{
    padding:12px 24px;
    font-size:16px;
    border:0;
    border-radius:5px;
    cursor:pointer;
    background:#eee;
    color:#111;
}

#estado{
    margin-top:15px;
    font-size:14px;
}

.error{
    color:#ff6666;
}

.ok{
    color:#8f8;
}

.resultado{
    margin-top:25px;
    padding:20px;
    background:#1b1b1b;
    border:1px solid #444;
    border-radius:7px;
}

.campo{
    margin-bottom:20px;
}

.etiqueta{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.valor{
    line-height:1.6;
}

</style>

</head>


<body>


<div class="contenedor">


<h1>
Generador — Prueba de LEEPALGEO
</h1>


<!-- =====================================================
     CRONOLOGÍA
====================================================== -->

<div class="cronologia">

    <input
        id="inicioEntero"
        type="text"
        inputmode="numeric"
        maxlength="4"
        value="0521"
        autocomplete="off"
    >

    <span class="simbolo">.</span>

    <input
        id="inicioDecimal"
        type="text"
        inputmode="numeric"
        maxlength="4"
        value="0000"
        autocomplete="off"
    >

    <span class="simbolo">-</span>

    <input
        id="finEntero"
        type="text"
        inputmode="numeric"
        maxlength="4"
        value="0201"
        autocomplete="off"
    >

    <span class="simbolo">.</span>

    <input
        id="finDecimal"
        type="text"
        inputmode="numeric"
        maxlength="4"
        value="3000"
        autocomplete="off"
    >

</div>


<button
    type="button"
    id="buscar">
    Buscar
</button>


<div id="estado">
    Comprobando módulos...
</div>


<!-- =====================================================
     RESULTADO
====================================================== -->

<div
    id="resultado"
    class="resultado"
    style="display:none;"
>


    <div class="campo">

        <span class="etiqueta">
            Intervalo
        </span>

        <div
            id="intervalo"
            class="valor">
        </div>

    </div>


    <div class="campo">

        <span class="etiqueta">
            Período:
        </span>

        <div
            id="periodo"
            class="valor">
        </div>

    </div>


    <div class="campo">

        <span class="etiqueta">
            Subperíodo:
        </span>

        <div
            id="subperiodo"
            class="valor">
        </div>

    </div>


</div>


</div>


<!-- =====================================================
     MÓDULOS

     LOS TRES ARCHIVOS ESTÁN EN ESTA MISMA CARPETA
====================================================== -->

<script src="palgeo.js"></script>

<script src="palgeosimplificado.js"></script>

<script src="leepalgeo.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){


        const estado =
            document.getElementById(
                "estado"
            );


        /*
        =================================================
        COMPROBAR PALGEO
        =================================================
        */

        if(
            typeof window.PALGEO === "undefined"
        ){

            estado.innerHTML =
                '<span class="error">' +
                'ERROR: PALGEO no se ha cargado correctamente.' +
                '</span>';

            return;

        }


        /*
        =================================================
        COMPROBAR PALGEOSIMPLIFICADO
        =================================================
        */

        if(
            typeof window.PALGEOSIMPLIFICADO ===
            "undefined"
        ){

            estado.innerHTML =
                '<span class="error">' +
                'ERROR: PALGEOSIMPLIFICADO no se ha cargado correctamente.' +
                '</span>';

            return;

        }


        /*
        =================================================
        COMPROBAR LEEPALGEO
        =================================================
        */

        if(
            typeof window.LEEPALGEO === "undefined"
        ){

            estado.innerHTML =
                '<span class="error">' +
                'ERROR: LEEPALGEO no se ha cargado correctamente.' +
                '</span>';

            return;

        }


        /*
        =================================================
        COMPROBAR FUNCIÓN leer()
        =================================================
        */

        if(
            typeof window.LEEPALGEO.leer !==
            "function"
        ){

            estado.innerHTML =
                '<span class="error">' +
                'ERROR: La función LEEPALGEO.leer() no está disponible.' +
                '</span>';

            return;

        }


        /*
        =================================================
        MÓDULOS CORRECTAMENTE CARGADOS
        =================================================
        */

        estado.innerHTML =
            '<span class="ok">' +
            'Módulos cargados correctamente.' +
            '</span>';


        /*
        =================================================
        BOTÓN BUSCAR
        =================================================
        */

        document
        .getElementById("buscar")
        .addEventListener(
            "click",
            buscar
        );


        /*
        =================================================
        FUNCIÓN BUSCAR
        =================================================
        */

        function buscar(){


            /*
            ---------------------------------------------
            LEER LAS CUATRO CAJAS
            ---------------------------------------------
            */

            const inicioEntero =
                document
                .getElementById(
                    "inicioEntero"
                )
                .value
                .trim();


            const inicioDecimal =
                document
                .getElementById(
                    "inicioDecimal"
                )
                .value
                .trim();


            const finEntero =
                document
                .getElementById(
                    "finEntero"
                )
                .value
                .trim();


            const finDecimal =
                document
                .getElementById(
                    "finDecimal"
                )
                .value
                .trim();


            /*
            ---------------------------------------------
            VALIDAR LAS CUATRO CAJAS
            ---------------------------------------------
            */

            if(
                !/^\d{4}$/.test(
                    inicioEntero
                ) ||

                !/^\d{4}$/.test(
                    inicioDecimal
                ) ||

                !/^\d{4}$/.test(
                    finEntero
                ) ||

                !/^\d{4}$/.test(
                    finDecimal
                )
            ){

                mostrarError(
                    "Las cuatro cajas deben contener exactamente 4 cifras."
                );

                return;

            }


            /*
            ---------------------------------------------
            CONSTRUIR J3
            ---------------------------------------------

            0521
            0000
            0201
            3000

            ↓

            0521.0000-0201.3000
            ---------------------------------------------
            */

            const cronologia =

                inicioEntero
                +
                "."
                +
                inicioDecimal
                +
                "-"
                +
                finEntero
                +
                "."
                +
                finDecimal;


            /*
            ---------------------------------------------
            CREAR REGISTRO DEL CONTENEDOR

            J3 ES LA ÚNICA INFORMACIÓN QUE
            LEEPALGEO UTILIZA.
            ---------------------------------------------
            */

            const registro = {

                j1:"PRUEBA",

                j2:"Prueba",

                j3:cronologia

            };


            /*
            ---------------------------------------------
            ENTREGAR REGISTRO A LEEPALGEO
            ---------------------------------------------
            */

            const datos =
                window.LEEPALGEO.leer(
                    registro
                );


            /*
            ---------------------------------------------
            COMPROBAR RESULTADO
            ---------------------------------------------
            */

            if(
                !datos
            ){

                mostrarError(
                    "LEEPALGEO no ha podido procesar: " +
                    cronologia
                );

                return;

            }


            /*
            ---------------------------------------------
            MOSTRAR INTERVALO
            ---------------------------------------------
            */

            document
            .getElementById(
                "intervalo"
            )
            .textContent =
                datos.intervalo || "—";


            /*
            ---------------------------------------------
            MOSTRAR PERÍODOS
            ---------------------------------------------
            */

            document
            .getElementById(
                "periodo"
            )
            .textContent =
                datos.periodo || "—";


            /*
            ---------------------------------------------
            MOSTRAR SUBPERÍODOS
            ---------------------------------------------
            */

            document
            .getElementById(
                "subperiodo"
            )
            .textContent =
                datos.subperiodo || "—";


            /*
            ---------------------------------------------
            MOSTRAR RESULTADO
            ---------------------------------------------
            */

            document
            .getElementById(
                "resultado"
            )
            .style.display =
                "block";


            estado.innerHTML =
                '<span class="ok">' +
                'Cronología procesada correctamente.' +
                '</span>';

        }


        /*
        =================================================
        MOSTRAR ERROR
        =================================================
        */

        function mostrarError(
            mensaje
        ){

            estado.innerHTML =
                '<span class="error">' +
                mensaje +
                '</span>';


            document
            .getElementById(
                "resultado"
            )
            .style.display =
                "none";

        }


    }

);

</script>


</body>

</html>
