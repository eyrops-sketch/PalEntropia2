<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Generador — Prueba de LEEPALGEO</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#eee;
    margin:0;
    padding:20px;
}

.contenedor{
    max-width:800px;
    margin:auto;
}

h1{
    font-size:22px;
    margin-bottom:25px;
}

.fila{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

input{
    width:65px;
    height:42px;
    box-sizing:border-box;
    text-align:center;
    font-size:18px;
    background:#222;
    color:#fff;
    border:1px solid #555;
    border-radius:4px;
}

.separador{
    font-size:22px;
}

button{
    padding:11px 22px;
    font-size:16px;
    cursor:pointer;
    background:#eee;
    color:#111;
    border:0;
    border-radius:4px;
}

#mensaje{
    margin-top:15px;
    color:#ff7777;
}

#resultado{
    display:none;
    margin-top:30px;
}

.campo{
    margin-bottom:20px;
}

.etiqueta{
    font-weight:bold;
    margin-bottom:5px;
}

.valor{
    line-height:1.6;
}

</style>

</head>


<body>

<div class="contenedor">

<h1>Generador — Prueba de LEEPALGEO</h1>


<!-- =================================================
     CRONOLOGÍA

     Cuatro cajas de exactamente 4 caracteres:

     MMMM . DDDD - MMMM . DDDD
================================================== -->

<div class="fila">

    <input
        id="inicioEntero"
        type="text"
        maxlength="4"
        inputmode="numeric"
        placeholder="0000"
    >

    <span class="separador">.</span>

    <input
        id="inicioDecimal"
        type="text"
        maxlength="4"
        inputmode="numeric"
        placeholder="0000"
    >

    <span class="separador">-</span>

    <input
        id="finEntero"
        type="text"
        maxlength="4"
        inputmode="numeric"
        placeholder="0000"
    >

    <span class="separador">.</span>

    <input
        id="finDecimal"
        type="text"
        maxlength="4"
        inputmode="numeric"
        placeholder="0000"
    >

</div>


<button
    type="button"
    id="buscar">
    Buscar
</button>


<div id="mensaje"></div>


<!-- =================================================
     RESULTADO PARA EL GENERADOR
================================================== -->

<div id="resultado">


    <div class="campo">

        <div class="etiqueta">
            Intervalo:
        </div>

        <div
            id="intervalo"
            class="valor">
        </div>

    </div>


    <div class="campo">

        <div class="etiqueta">
            Período:
        </div>

        <div
            id="periodo"
            class="valor">
        </div>

    </div>


    <div class="campo">

        <div class="etiqueta">
            Subperíodo:
        </div>

        <div
            id="subperiodo"
            class="valor">
        </div>

    </div>


</div>

</div>


<!-- =================================================
     ORDEN DE CARGA

     1. PALGEO
     2. PALGEOSIMPLIFICADO
     3. LEEPALGEO
================================================== -->

<script src="js/palgeo.js"></script>

<script src="js/palgeosimplificado.js"></script>

<script src="js/leepalgeo.js"></script>


<script>

/*
========================================================
BUSCAR
========================================================
*/

document
.getElementById("buscar")
.addEventListener(
    "click",
    function(){

        const mensaje =
            document.getElementById(
                "mensaje"
            );

        const resultado =
            document.getElementById(
                "resultado"
            );


        /*
        LIMPIAR RESULTADO ANTERIOR
        */

        mensaje.textContent = "";

        resultado.style.display =
            "none";


        /*
        =================================================
        LEER LAS CUATRO CAJAS
        =================================================
        */

        const inicioEntero =
            document
            .getElementById(
                "inicioEntero"
            )
            .value
            .trim();


        const inicioDecimal =
            document
            .getElementById(
                "inicioDecimal"
            )
            .value
            .trim();


        const finEntero =
            document
            .getElementById(
                "finEntero"
            )
            .value
            .trim();


        const finDecimal =
            document
            .getElementById(
                "finDecimal"
            )
            .value
            .trim();


        /*
        =================================================
        COMPROBAR 4 CARACTERES
        =================================================
        */

        if(
            !/^\d{4}$/.test(
                inicioEntero
            ) ||

            !/^\d{4}$/.test(
                inicioDecimal
            ) ||

            !/^\d{4}$/.test(
                finEntero
            ) ||

            !/^\d{4}$/.test(
                finDecimal
            )
        ){

            mensaje.textContent =
                "Las cuatro cajas deben contener exactamente 4 cifras.";

            return;

        }


        /*
        =================================================
        CONSTRUIR J3

        Ejemplo:

        0521
        0000
        0201
        3000

        ↓

        0521.0000-0201.3000
        =================================================
        */

        const j3 =
            inicioEntero
            + "."
            + inicioDecimal
            + "-"
            + finEntero
            + "."
            + finDecimal;


        /*
        =================================================
        CREAR REGISTRO DEL CONTENEDOR

        LEEPALGEO SOLO NECESITA J3.

        Los demás campos son simulados.
        =================================================
        */

        const registro = {

            j1: "PRUEBA",

            j2: "Prueba",

            j3: j3

        };


        /*
        =================================================
        COMPROBAR LEEPALGEO
        =================================================
        */

        if(
            !window.LEEPALGEO ||
            typeof
            window.LEEPALGEO.leer
            !== "function"
        ){

            mensaje.textContent =
                "ERROR: LEEPALGEO no se ha cargado correctamente.";

            return;

        }


        /*
        =================================================
        LLAMAR A LA FUNCIÓN REAL

        NO usamos:

        LEEPALGEO.analizar()

        porque esa función no pertenece
        al módulo.

        Usamos:

        LEEPALGEO.leer(registro)
        =================================================
        */

        const datos =
            window.LEEPALGEO.leer(
                registro
            );


        /*
        =================================================
        COMPROBAR RESULTADO
        =================================================
        */

        if(!datos){

            mensaje.textContent =
                "No se han podido obtener datos para esta cronología.";

            return;

        }


        /*
        =================================================
        MOSTRAR INTERVALO
        =================================================

        Ejemplo:

        521 Ma - 201,3 Ma

        La cronología interna NO se muestra.
        =================================================
        */

        document
        .getElementById(
            "intervalo"
        )
        .textContent =
            datos.intervalo || "";


        /*
        =================================================
        MOSTRAR PERÍODOS
        =================================================
        */

        document
        .getElementById(
            "periodo"
        )
        .textContent =
            datos.periodo || "";


        /*
        =================================================
        MOSTRAR SUBPERÍODOS
        =================================================
        */

        document
        .getElementById(
            "subperiodo"
        )
        .textContent =
            datos.subperiodo || "";


        /*
        =================================================
        MOSTRAR RESULTADO
        =================================================
        */

        resultado.style.display =
            "block";

    }
);

</script>


</body>

</html>
