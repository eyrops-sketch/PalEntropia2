<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PalEntropía — Torneo</title><link rel="stylesheet"
      href="index.css"></head><body><!-- =====================================================
     BOTÓN MENÚ PRINCIPAL
     ===================================================== --><button
id="botonMenuPrincipal"
type="button"
title="Volver al menú principal"
aria-label="Volver al menú principal">

🏠

</button><!-- =====================================================
     CABECERA
     ===================================================== --><header id="cabecera"><h1>PalEntropía</h1>

<div id="subtitulo">
    Torneo
</div>

</header><!-- =====================================================
     CONTENEDOR PRINCIPAL
     ===================================================== --><main id="torneo"><section id="cabeceraTorneo">

    <h2>⚔️ Torneo PalEntropía</h2>

    <p>
        Índice del torneo
    </p>

</section>


<!-- =================================================
     ÍNDICE DEL TORNEO
     ================================================= -->

<section id="indiceTorneo">


    <div class="bloqueTorneo">

        <h3>🏆 Torneo</h3>

        <a
            class="botonTorneo"
            href="torneo.html">

            Entrar al torneo

        </a>

    </div>


    <div class="bloqueTorneo">

        <h3>📋 Participantes</h3>

        <button
            id="botonParticipantes"
            class="botonTorneo"
            type="button">

            Ver participantes

        </button>

    </div>


    <div class="bloqueTorneo">

        <h3>⚔️ Combates</h3>

        <a
            class="botonTorneo"
            href="combates.html">

            Ver combates

        </a>

    </div>


    <div class="bloqueTorneo">

        <h3>🏅 Clasificación</h3>

        <a
            class="botonTorneo"
            href="clasificacion.html">

            Ver clasificación

        </a>

    </div>


</section>


<!-- =================================================
     PARTICIPANTES
     ================================================= -->

<section
    id="panelParticipantes"
    style="display:none;">

    <h2>
        📋 Participantes
    </h2>

    <div id="listaParticipantes">
    </div>

</section>

</main><!-- =====================================================
     VOLVER AL VISOR
     ===================================================== --><section id="volver"><a
    href="../generador_fase_2/generador_fase_3.html"
    id="botonVolver">

    ← Volver al visor

</a>

</section><!-- =====================================================
     PARTICIPANTES DEL TORNEO
     ===================================================== --><script>

window.MATRIZ_COMBATIENTES_TORNEO = [];


/* =====================================================
   CARGAR PARTICIPANTES
   ===================================================== */

async function cargarParticipantesTorneo() {

    const lista =
        document.getElementById(
            "listaParticipantes"
        );


    if (!lista) {

        return;

    }


    lista.innerHTML = "";


    /*
    Recuperamos exclusivamente los J1
    preparados por el visor.
    */

    const matrizGuardada =
        localStorage.getItem(
            "palentropia_matriz_combatientes"
        );


    if (!matrizGuardada) {

        lista.innerHTML =
            "<p>No hay participantes cargados.</p>";

        return;

    }


    let matrizJ1;


    try {

        matrizJ1 =
            JSON.parse(
                matrizGuardada
            );

    }

    catch (error) {

        console.error(
            "Matriz de combatientes no válida:",
            error
        );

        lista.innerHTML =
            "<p>No se pudo cargar la matriz de participantes.</p>";

        return;

    }


    if (
        !Array.isArray(matrizJ1) ||
        !matrizJ1.length
    ) {

        lista.innerHTML =
            "<p>No hay participantes cargados.</p>";

        return;

    }


    /*
    Limpiamos y normalizamos J1.
    */

    matrizJ1 =
        matrizJ1
            .map(
                codigo =>
                    String(
                        codigo || ""
                    ).trim()
            )
            .filter(
                codigo =>
                    codigo !== ""
            );


    /*
    =====================================================
    PALEOFICHAS.JSON
    =====================================================
    */

    const respuestaJSON =
        await fetch(
            "../generador_fase_2/paleofichas.json"
        );


    if (!respuestaJSON.ok) {

        throw new Error(
            "No se pudo cargar paleofichas.json."
        );

    }


    const datosJSON =
        await respuestaJSON.json();


    /*
    =====================================================
    MASTER.CSV
    =====================================================
    */

    const respuestaMaster =
        await fetch(
            "../generador_fase_2/master.csv"
        );


    if (!respuestaMaster.ok) {

        throw new Error(
            "No se pudo cargar master.csv."
        );

    }


    const textoMaster =
        await respuestaMaster.text();


    /*
    =====================================================
    MAPA J1 → J2
    =====================================================
    */

    const mapaNombres =
        new Map();


    if (
        Array.isArray(
            datosJSON
        )
    ) {

        datosJSON.forEach(
            registro => {

                if (
                    !registro
                ) {

                    return;

                }


                const j1 =
                    String(
                        registro.j1 ||
                        registro.codigo ||
                        registro.J1 ||
                        ""
                    ).trim();


                const j2 =
                    String(
                        registro.j2 ||
                        registro.nombre ||
                        registro.J2 ||
                        ""
                    ).trim();


                if (
                    j1 &&
                    j2
                ) {

                    mapaNombres.set(
                        j1,
                        j2
                    );

                }

            }
        );

    }


    /*
    =====================================================
    MAPA DEL MASTER
    =====================================================
    */

    const mapaMaster =
        new Map();


    const lineas =
        textoMaster.split(
            /\r?\n/
        );


    lineas.forEach(
        linea => {

            if (
                !linea.trim()
            ) {

                return;

            }


            const columnas =
                linea.split(",");


            if (
                columnas.length < 21
            ) {

                return;

            }


            const j1 =
                String(
                    columnas[0] || ""
                ).trim();


            if (
                !j1
            ) {

                return;

            }


            mapaMaster.set(
                j1,
                columnas
            );

        }
    );


    /*
    =====================================================
    CONSTRUIR MATRIZ FINAL
    =====================================================
    */

    const participantes = [];


    matrizJ1.forEach(
        j1 => {

            const columnas =
                mapaMaster.get(
                    j1
                );


            const j2 =
                mapaNombres.get(
                    j1
                ) || "";


            if (
                !columnas
            ) {

                return;

            }


            participantes.push({

                j1:
                    j1,

                j2:
                    j2,

                master:
                    columnas

            });

        }
    );


    window.MATRIZ_COMBATIENTES_TORNEO =
        participantes;


    /*
    =====================================================
    MOSTRAR SOLO J1 Y J2
    =====================================================
    */

    participantes.forEach(
        participante => {

            const fila =
                document.createElement(
                    "div"
                );


            fila.className =
                "participanteTorneo";


            fila.textContent =
                participante.j1 +
                " — " +
                participante.j2;


            lista.appendChild(
                fila
            );

        }
    );


    if (
        !participantes.length
    ) {

        lista.innerHTML =
            "<p>No se encontraron participantes.</p>";

    }

}


/* =====================================================
   BOTÓN PARTICIPANTES
   ===================================================== */

document
    .getElementById(
        "botonParticipantes"
    )
    .addEventListener(
        "click",
        async function() {

            const panel =
                document.getElementById(
                    "panelParticipantes"
                );


            if (
                panel.style.display ===
                "none"
            ) {

                panel.style.display =
                    "block";


                try {

                    await cargarParticipantesTorneo();

                }

                catch (error) {

                    console.error(
                        "Error cargando participantes:",
                        error
                    );

                    document
                        .getElementById(
                            "listaParticipantes"
                        )
                        .innerHTML =
                            "<p>Error cargando participantes.</p>";

                }

            }

            else {

                panel.style.display =
                    "none";

            }

        }
    );


/* =====================================================
   BOTÓN MENÚ PRINCIPAL
   ===================================================== */

document
    .getElementById(
        "botonMenuPrincipal"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "../../index.html";

        }
    );

</script></body></html>
