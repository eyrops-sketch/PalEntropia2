<!-- =====================================================
     PARTICIPANTES DEL TORNEO
     ===================================================== -->

<script>

window.MATRIZ_COMBATIENTES_TORNEO = [];


/* =====================================================
   OBTENER TODOS LOS J1 DEL PALNAVEGADOR
   ===================================================== */

function obtenerTodosLosJ1DelNavegador() {

    const navegador =
        window.PALNAVEGADOR;


    if (!navegador) {

        console.warn(
            "PALNAVEGADOR no está disponible."
        );

        return [];

    }


    /*
    PALNAVEGADOR puede mantener la matriz
    de navegación en diferentes propiedades.
    Probamos las estructuras existentes sin
    modificar PALNAVEGADOR.
    */

    const posiblesMatrices = [

        navegador.matriz,

        navegador.datos,

        navegador.registros,

        navegador.lista,

        navegador.paleofichas

    ];


    for (
        const matriz of posiblesMatrices
    ) {

        if (
            Array.isArray(matriz) &&
            matriz.length
        ) {

            const codigos =
                matriz
                    .map(
                        registro => {

                            if (
                                typeof registro ===
                                "string"
                            ) {

                                return registro;

                            }


                            if (
                                registro &&
                                registro.j1
                            ) {

                                return registro.j1;

                            }


                            if (
                                registro &&
                                registro.codigo
                            ) {

                                return registro.codigo;

                            }


                            return "";

                        }
                    )
                    .map(
                        codigo =>
                            String(
                                codigo || ""
                            ).trim()
                    )
                    .filter(Boolean);


            if (
                codigos.length
            ) {

                return [
                    ...new Set(
                        codigos
                    )
                ];

            }

        }

    }


    /*
    Respaldo: si el navegador expone un índice
    de códigos, también lo utilizamos.
    */

    const posiblesIndices = [

        navegador.codigos,

        navegador.listaCodigos,

        navegador.matrizCodigos

    ];


    for (
        const indice of posiblesIndices
    ) {

        if (
            Array.isArray(indice) &&
            indice.length
        ) {

            const codigos =
                indice
                    .map(
                        codigo =>
                            String(
                                codigo || ""
                            ).trim()
                    )
                    .filter(Boolean);


            if (
                codigos.length
            ) {

                return [
                    ...new Set(
                        codigos
                    )
                ];

            }

        }

    }


    return [];

}


/* =====================================================
   CARGAR PARTICIPANTES
   ===================================================== */

async function cargarParticipantesTorneo() {

    const lista =
        document.getElementById(
            "listaParticipantes"
        );


    const total =
        document.getElementById(
            "totalParticipantes"
        );


    if (!lista) {

        return;

    }


    lista.innerHTML = "";


    if (total) {

        total.textContent = "";

    }


    /*
    =====================================================
    1. INTENTAR MATRIZ PROCEDENTE DEL BUSCADOR
    =====================================================
    */

    const matrizGuardada =
        localStorage.getItem(
            "palentropia_matriz_combatientes"
        );


    let matrizJ1 = [];


    if (matrizGuardada) {

        try {

            const matrizTemporal =
                JSON.parse(
                    matrizGuardada
                );


            if (
                Array.isArray(
                    matrizTemporal
                )
            ) {

                matrizJ1 =
                    matrizTemporal
                        .map(
                            codigo =>
                                String(
                                    codigo || ""
                                ).trim()
                        )
                        .filter(Boolean);

            }

        }

        catch (error) {

            console.warn(
                "La matriz guardada no es válida. Se utilizará el total del navegador.",
                error
            );

            matrizJ1 = [];

        }

    }


    /*
    =====================================================
    2. SI NO HAY BÚSQUEDA:
       USAR TODOS LOS REGISTROS DEL NAVEGADOR
    =====================================================
    */

    if (
        !matrizJ1.length
    ) {

        matrizJ1 =
            obtenerTodosLosJ1DelNavegador();

    }


    /*
    =====================================================
    COMPROBAR MATRIZ
    =====================================================
    */

    if (
        !matrizJ1.length
    ) {

        if (total) {

            total.textContent =
                "0 participantes";

        }


        lista.innerHTML =
            "<p>No hay participantes cargados.</p>";

        return;

    }


    /*
    Eliminar duplicados manteniendo el orden.
    */

    matrizJ1 =
        [
            ...new Set(
                matrizJ1
            )
        ];


    /*
    =====================================================
    PALEOFICHAS.JSON
    =====================================================
    */

    const respuestaJSON =
        await fetch(
            "../generador_fase_2/paleofichas.json"
        );


    if (!respuestaJSON.ok) {

        throw new Error(
            "No se pudo cargar paleofichas.json."
        );

    }


    const datosJSON =
        await respuestaJSON.json();


    /*
    =====================================================
    MASTER.CSV
    =====================================================
    */

    const respuestaMaster =
        await fetch(
            "../generador_fase_2/master.csv"
        );


    if (!respuestaMaster.ok) {

        throw new Error(
            "No se pudo cargar master.csv."
        );

    }


    const textoMaster =
        await respuestaMaster.text();


    /*
    =====================================================
    MAPA J1 → J2
    =====================================================
    */

    const mapaNombres =
        new Map();


    if (
        Array.isArray(
            datosJSON
        )
    ) {

        datosJSON.forEach(
            registro => {

                if (
                    !registro
                ) {

                    return;

                }


                const j1 =
                    String(
                        registro.j1 ||
                        registro.codigo ||
                        registro.J1 ||
                        ""
                    ).trim();


                const j2 =
                    String(
                        registro.j2 ||
                        registro.nombre ||
                        registro.J2 ||
                        ""
                    ).trim();


                if (
                    j1 &&
                    j2
                ) {

                    mapaNombres.set(
                        j1,
                        j2
                    );

                }

            }
        );

    }


    /*
    =====================================================
    MAPA DEL MASTER
    ===================================================== */

    const mapaMaster =
        new Map();


    const lineas =
        textoMaster.split(
            /\r?\n/
        );


    lineas.forEach(
        linea => {

            if (
                !linea.trim()
            ) {

                return;

            }


            const columnas =
                linea.split(",");


            if (
                columnas.length < 21
            ) {

                return;

            }


            const j1 =
                String(
                    columnas[0] || ""
                ).trim();


            if (
                !j1
            ) {

                return;

            }


            mapaMaster.set(
                j1,
                columnas
            );

        }
    );


    /*
    =====================================================
    CONSTRUIR MATRIZ FINAL
    ===================================================== */

    const participantes = [];


    matrizJ1.forEach(
        j1 => {

            const columnas =
                mapaMaster.get(
                    j1
                );


            const j2 =
                mapaNombres.get(
                    j1
                ) || "";


            /*
            Solo incluimos registros que
            existen realmente en master.csv.
            */

            if (
                !columnas
            ) {

                return;

            }


            participantes.push({

                j1:
                    j1,

                j2:
                    j2,

                master:
                    columnas

            });

        }
    );


    /*
    =====================================================
    GUARDAR MATRIZ FINAL
    ===================================================== */

    window.MATRIZ_COMBATIENTES_TORNEO =
        participantes;


    /*
    =====================================================
    MOSTRAR TOTAL
    ===================================================== */

    if (total) {

        total.textContent =
            participantes.length +
            (
                participantes.length === 1
                    ? " participante"
                    : " participantes"
            );

    }


    /*
    =====================================================
    MOSTRAR SOLO J1 Y J2
    ===================================================== */

    participantes.forEach(
        participante => {

            const fila =
                document.createElement(
                    "div"
                );


            fila.className =
                "participanteTorneo";


            fila.textContent =
                participante.j1 +
                " — " +
                participante.j2;


            lista.appendChild(
                fila
            );

        }
    );


    if (
        !participantes.length
    ) {

        lista.innerHTML =
            "<p>No se encontraron participantes.</p>";

    }

}


/* =====================================================
   BOTÓN PARTICIPANTES
   ===================================================== */

document
    .getElementById(
        "botonParticipantes"
    )
    .addEventListener(
        "click",
        async function() {

            const panel =
                document.getElementById(
                    "panelParticipantes"
                );


            if (
                panel.style.display ===
                "none"
            ) {

                panel.style.display =
                    "block";


                try {

                    await cargarParticipantesTorneo();

                }

                catch (error) {

                    console.error(
                        "Error cargando participantes:",
                        error
                    );

                    document
                        .getElementById(
                            "listaParticipantes"
                        )
                        .innerHTML =
                            "<p>Error cargando participantes.</p>";

                }

            }

            else {

                panel.style.display =
                    "none";

            }

        }
    );


/* =====================================================
   BOTÓN MENÚ PRINCIPAL
   ===================================================== */

document
    .getElementById(
        "botonMenuPrincipal"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "../../index.html";

        }
    );

</script>
