<!-- =====================================================
     PARTICIPANTES DEL TORNEO
     ===================================================== -->

<script>

window.MATRIZ_COMBATIENTES_TORNEO = [];


/* =====================================================
   CLAVES DEL TORNEO
   ===================================================== */

const CLAVE_MATRIZ_COMBATIENTES =
    "palentropia_matriz_combatientes";

const CLAVE_CRITERIO_TORNEO =
    "palentropia_criterio_torneo";


/* =====================================================
   CREAR COPA RANDOM
   ===================================================== */

async function crearCopaRandom() {

    try {

        /*
        =================================================
        CARGAR MASTER.CSV
        =================================================
        */

        const respuesta =
            await fetch(
                "../generador_fase_2/master.csv"
            );


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo cargar master.csv."
            );

        }


        const textoMaster =
            await respuesta.text();


        /*
        =================================================
        OBTENER TODOS LOS J1
        =================================================
        */

        const todosLosJ1 = [];


        const lineas =
            textoMaster.split(
                /\r?\n/
            );


        lineas.forEach(
            linea => {

                if (
                    !linea.trim()
                ) {

                    return;

                }


                const columnas =
                    linea.split(",");


                if (
                    columnas.length < 21
                ) {

                    return;

                }


                const j1 =
                    String(
                        columnas[0] || ""
                    ).trim();


                /*
                Evitamos la cabecera
                y los duplicados.
                */

                if (
                    !j1 ||
                    j1.toLowerCase() === "j1"
                ) {

                    return;

                }


                if (
                    !todosLosJ1.includes(
                        j1
                    )
                ) {

                    todosLosJ1.push(
                        j1
                    );

                }

            }
        );


        if (
            todosLosJ1.length < 16
        ) {

            throw new Error(
                "No hay al menos 16 participantes válidos en master.csv."
            );

        }


        /*
        =================================================
        BARAJAR FISHER-YATES
        =================================================
        */

        for (
            let i =
                todosLosJ1.length - 1;

            i > 0;

            i--
        ) {

            const j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );


            const temporal =
                todosLosJ1[i];


            todosLosJ1[i] =
                todosLosJ1[j];


            todosLosJ1[j] =
                temporal;

        }


        /*
        =================================================
        SELECCIONAR 16
        =================================================
        */

        const participantes =
            todosLosJ1.slice(
                0,
                16
            );


        /*
        =================================================
        GUARDAR PARTICIPANTES
        =================================================
        */

        localStorage.setItem(
            CLAVE_MATRIZ_COMBATIENTES,
            JSON.stringify(
                participantes
            )
        );


        /*
        =================================================
        GUARDAR NOMBRE DEL TORNEO
        =================================================
        */

        localStorage.setItem(
            CLAVE_CRITERIO_TORNEO,
            "copa random"
        );


        console.log(
            "🏆 Copa Random creada:",
            participantes
        );


        return participantes;

    }

    catch (error) {

        console.error(
            "Error creando Copa Random:",
            error
        );


        return [];

    }

}


/* =====================================================
   INICIALIZAR TORNEO
   ===================================================== */

async function inicializarTorneo() {

    const guardado =
        localStorage.getItem(
            CLAVE_MATRIZ_COMBATIENTES
        );


    /*
    =====================================================
    SI YA EXISTEN PARTICIPANTES
    NO HACER NADA
    =====================================================
    */

    if (
        guardado
    ) {

        try {

            const matriz =
                JSON.parse(
                    guardado
                );


            if (
                Array.isArray(
                    matriz
                ) &&
                matriz.length > 0
            ) {

                return;

            }

        }

        catch (error) {

            console.warn(
                "La matriz existente no es válida. Se creará una Copa Random."
            );

        }

    }


    /*
    =====================================================
    LOCALSTORAGE VACÍO
    → CREAR COPA RANDOM
    ===================================================== */

    await crearCopaRandom();

}


/* =====================================================
   CRITERIO IDENTIFICATIVO DEL TORNEO
   ===================================================== */

function obtenerCriterioTorneo() {

    const criterio =
        localStorage.getItem(
            CLAVE_CRITERIO_TORNEO
        );


    if (
        !criterio ||
        !String(
            criterio
        ).trim()
    ) {

        return "";

    }


    const valor =
        String(
            criterio
        ).trim();


    /*
    =====================================================
    TRANSFORMACIONES DE PRESENTACIÓN
    =====================================================
    */

    const equivalencias = {

        "perm":
            "Pérmico",

        "chord":
            "Chordata",

        "placen":
            "Placentaria"

    };


    const clave =
        valor.toLowerCase();


    if (
        equivalencias[
            clave
        ]
    ) {

        return equivalencias[
            clave
        ];

    }


    /*
    Los códigos y nombres se conservan
    tal como fueron introducidos.
    */

    return valor;

}


/* =====================================================
   MOSTRAR IDENTIFICADOR DEL TORNEO
   ===================================================== */

function mostrarIdentificadorTorneo() {

    const criterio =
        obtenerCriterioTorneo();


    if (
        !criterio
    ) {

        return;

    }


    const subtitulo =
        document.getElementById(
            "subtitulo"
        );


    const tituloCabecera =
        document.getElementById(
            "tituloCabeceraTorneo"
        );


    const tituloBloque =
        document.getElementById(
            "tituloBloqueTorneo"
        );


    /*
    =====================================================
    CABECERA SUPERIOR
    =====================================================
    */

    if (
        subtitulo
    ) {

        subtitulo.textContent =
            "Torneo " +
            criterio;

    }


    /*
    =====================================================
    CABECERA PRINCIPAL
    =====================================================
    */

    if (
        tituloCabecera
    ) {

        tituloCabecera.textContent =
            "⚔️ Torneo " +
            criterio;

    }


    /*
    =====================================================
    BLOQUE TORNEO
    =====================================================
    */

    if (
        tituloBloque
    ) {

        tituloBloque.textContent =
            "🏆 Torneo " +
            criterio;

    }

}


/* =====================================================
   CARGAR PARTICIPANTES
   ===================================================== */

async function cargarParticipantesTorneo() {

    const lista =
        document.getElementById(
            "listaParticipantes"
        );


    if (
        !lista
    ) {

        return;

    }


    lista.innerHTML =
        "";


    /*
    Recuperamos exclusivamente los J1
    preparados por el visor o por Copa Random.
    */

    const matrizGuardada =
        localStorage.getItem(
            CLAVE_MATRIZ_COMBATIENTES
        );


    if (
        !matrizGuardada
    ) {

        lista.innerHTML =
            "<p>No hay participantes cargados.</p>";

        return;

    }


    let matrizJ1;


    try {

        matrizJ1 =
            JSON.parse(
                matrizGuardada
            );

    }

    catch (error) {

        console.error(
            "Matriz de combatientes no válida:",
            error
        );

        lista.innerHTML =
            "<p>No se pudo cargar la matriz de participantes.</p>";

        return;

    }


    if (
        !Array.isArray(
            matrizJ1
        ) ||
        !matrizJ1.length
    ) {

        lista.innerHTML =
            "<p>No hay participantes cargados.</p>";

        return;

    }


    /*
    Limpiamos y normalizamos J1.
    */

    matrizJ1 =
        matrizJ1
            .map(
                codigo =>
                    String(
                        codigo || ""
                    ).trim()
            )
            .filter(
                codigo =>
                    codigo !== ""
            );


    /*
    =====================================================
    PALEOFICHAS.JSON
    =====================================================
    */

    const respuestaJSON =
        await fetch(
            "../generador_fase_2/paleofichas.json"
        );


    if (
        !respuestaJSON.ok
    ) {

        throw new Error(
            "No se pudo cargar paleofichas.json."
        );

    }


    const datosJSON =
        await respuestaJSON.json();


    /*
    =====================================================
    MASTER.CSV
    =====================================================
    */

    const respuestaMaster =
        await fetch(
            "../generador_fase_2/master.csv"
        );


    if (
        !respuestaMaster.ok
    ) {

        throw new Error(
            "No se pudo cargar master.csv."
        );

    }


    const textoMaster =
        await respuestaMaster.text();


    /*
    =====================================================
    MAPA J1 → J2
    =====================================================
    */

    const mapaNombres =
        new Map();


    if (
        Array.isArray(
            datosJSON
        )
    ) {

        datosJSON.forEach(
            registro => {

                if (
                    !registro
                ) {

                    return;

                }


                const j1 =
                    String(
                        registro.j1 ||
                        registro.codigo ||
                        registro.J1 ||
                        ""
                    ).trim();


                const j2 =
                    String(
                        registro.j2 ||
                        registro.nombre ||
                        registro.J2 ||
                        ""
                    ).trim();


                if (
                    j1 &&
                    j2
                ) {

                    mapaNombres.set(
                        j1,
                        j2
                    );

                }

            }
        );

    }


    /*
    =====================================================
    MAPA DEL MASTER
    =====================================================
    */

    const mapaMaster =
        new Map();


    const lineasMaster =
        textoMaster.split(
            /\r?\n/
        );


    lineasMaster.forEach(
        linea => {

            if (
                !linea.trim()
            ) {

                return;

            }


            const columnas =
                linea.split(",");


            if (
                columnas.length < 21
            ) {

                return;

            }


            const j1 =
                String(
                    columnas[0] || ""
                ).trim();


            if (
                !j1 ||
                j1.toLowerCase() === "j1"
            ) {

                return;

            }


            mapaMaster.set(
                j1,
                columnas
            );

        }
    );


    /*
    =====================================================
    CONSTRUIR MATRIZ FINAL
    =====================================================
    */

    const participantes = [];


    matrizJ1.forEach(
        j1 => {

            const columnas =
                mapaMaster.get(
                    j1
                );


            const j2 =
                mapaNombres.get(
                    j1
                ) || "";


            if (
                !columnas
            ) {

                return;

            }


            participantes.push({

                j1:
                    j1,

                j2:
                    j2,

                master:
                    columnas

            });

        }
    );


    window.MATRIZ_COMBATIENTES_TORNEO =
        participantes;


    /*
    =====================================================
    MOSTRAR SOLO J1 Y J2
    =====================================================
    */

    participantes.forEach(
        participante => {

            const fila =
                document.createElement(
                    "div"
                );


            fila.className =
                "participanteTorneo";


            fila.textContent =
                participante.j1 +
                " — " +
                participante.j2;


            lista.appendChild(
                fila
            );

        }
    );


    if (
        !participantes.length
    ) {

        lista.innerHTML =
            "<p>No se encontraron participantes.</p>";

    }

}
/* =====================================================
   BOTÓN PARTICIPANTES
   ===================================================== */

document
    .getElementById(
        "botonParticipantes"
    )
    .addEventListener(
        "click",
        async function() {

            const panel =
                document.getElementById(
                    "panelParticipantes"
                );


            if (
                panel.style.display ===
                "none"
            ) {

                panel.style.display =
                    "block";


                try {

                    await cargarParticipantesTorneo();

                }

                catch (error) {

                    console.error(
                        "Error cargando participantes:",
                        error
                    );


                    document
                        .getElementById(
                            "listaParticipantes"
                        )
                        .innerHTML =
                            "<p>Error cargando participantes.</p>";

                }

            }

            else {

                panel.style.display =
                    "none";

            }

        }
    );


/* =====================================================
   BOTÓN MENÚ PRINCIPAL
   ===================================================== */

document
    .getElementById(
        "botonMenuPrincipal"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "../../index.html";

        }
    );


/* =====================================================
   INICIALIZACIÓN
   ===================================================== */

(async function() {

    /*
    Primero comprobamos si existe
    un torneo guardado.

    Si no existe, se crea automáticamente
    una Copa Random de 16 participantes.
    */

    await inicializarTorneo();


    /*
    Después mostramos el nombre
    correcto del torneo.
    */

    mostrarIdentificadorTorneo();

})();

</script>
