<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PalEntropía — Combates</title>
    <link rel="stylesheet" href="combates.css">
</head>
<body>
<button id="botonMenuPrincipal" type="button" title="Volver al menú principal" aria-label="Volver al menú principal"> 🏠 </button>
<header id="cabecera">
    <h1>PalEntropía</h1>
    <div id="subtitulo">Combates</div>
</header>
<main id="combates">
    <section id="cabeceraCombates">
        <h2 id="tituloTorneo">⚔️ Torneo</h2>
        <p id="estadoCombates">Preparando emparejamientos...</p>
        <button id="botonRehacerEmparejamientos" type="button"> 🔄 Rehacer emparejamientos </button>
    </section>
    <section id="contenedorRondas"></section>
</main>
<section id="volver">
    <a href="index.html" id="botonVolver"> ← Volver al índice del torneo </a>
</section>
<script>
window.TORNEO_COMBATES = [];
const CLAVE_TORNEO_EMPAREJAMIENTOS = "palentropia_emparejamientos_torneo";
const CLAVE_RESULTADOS_SERIES = "palentropia_resultados_series";

function obtenerCriterioTorneo() {
    const criterio = localStorage.getItem("palentropia_criterio_torneo");
    return String(criterio || "").trim();
}
function transformarCriterioTorneo(criterio) {
    const valor = String(criterio || "").trim();
    if (!valor) return "";
    const equivalencias = { "perm": "Pérmico", "chord": "Chordata", "placen": "Placentaria" };
    const clave = valor.toLowerCase();
    if (equivalencias[clave]) return equivalencias[clave];
    return valor;
}
function mostrarTituloTorneo() {
    const titulo = document.getElementById("tituloTorneo");
    if (!titulo) return;
    const criterio = obtenerCriterioTorneo();
    const criterioMostrar = transformarCriterioTorneo(criterio);
    titulo.textContent = criterioMostrar ? "⚔️ Torneo " + criterioMostrar : "⚔️ Torneo";
}
function obtenerParticipantes() {
    const guardado = localStorage.getItem("palentropia_matriz_combatientes");
    if (!guardado) return [];
    try {
        const matriz = JSON.parse(guardado);
        if (!Array.isArray(matriz)) return [];
        return matriz.map(codigo => String(codigo || "").trim()).filter(codigo => codigo !== "");
    } catch (error) { console.error("Error leyendo participantes:", error); return []; }
}
async function obtenerMapaNombres() {
    const mapaNombres = new Map();
    try {
        const respuesta = await fetch("../generador_fase_2/paleofichas.json");
        if (!respuesta.ok) throw new Error();
        const datos = await respuesta.json();
        if (!Array.isArray(datos)) return mapaNombres;
        datos.forEach(registro => {
            if (!registro) return;
            const j1 = String(registro.j1 || registro.codigo || registro.J1 || "").trim();
            const j2 = String(registro.j2 || registro.nombre || registro.J2 || "").trim();
            if (j1 && j2) mapaNombres.set(j1, j2);
        });
    } catch (error) { console.error("Error cargando nombres J2:", error); }
    return mapaNombres;
}
function crearParticipantesDatos(matrizJ1, mapaNombres) {
    const participantes = [];
    matrizJ1.forEach(codigo => {
        const j1 = String(codigo || "").trim();
        if (!j1) return;
        participantes.push({ j1: j1, j2: mapaNombres.get(j1) || "" });
    });
    return participantes;
}
function barajar(matriz) {
    const resultado = [...matriz];
    for (let i = resultado.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temporal = resultado[i];
        resultado[i] = resultado[j];
        resultado[j] = temporal;
    }
    return resultado;
}
function calcularCuadroPrincipal(cantidad) {
    let potencia = 1;
    while (potencia * 2 <= cantidad) potencia *= 2;
    return potencia;
}
function calcularRondaPrevia(cantidad) {
    const cuadro = calcularCuadroPrincipal(cantidad);
    const sobrantes = cantidad - cuadro;
    return { cuadro: cuadro, sobrantes: sobrantes, combates: sobrantes };
}






    
function crearCruces(participantes, numeroInicio = 1) {
    const cruces = [];
    for (let i = 0; i < participantes.length; i += 2) {
        const participante1 = participantes[i];
        const participante2 = participantes[i + 1];
        if (participante1 && participante2) {
            cruces.push({ numero: numeroInicio + cruces.length, participante1: participante1, participante2: participante2, ganador: null });
        }
    }
    return cruces;
}

function generarTorneo(participantes) {
    const cantidad = participantes.length;
    const rondas = [];
    if (cantidad < 2) return rondas;
    const participantesBarajados = barajar(participantes);
    
    const cuadroObjetivo = calcularCuadroPrincipal(cantidad);
    const sobrantes = cantidad - cuadroObjetivo;
    
    let crucesActuales = [];
    let numeroCombateGlobal = 1;

    if (sobrantes === 0) {
        const participantesCuadro = barajar(participantesBarajados);
        crucesActuales = crearCruces(participantesCuadro, numeroCombateGlobal);
        rondas.push({ nombre: "Primera ronda", tipo: "principal", participantes: participantesCuadro, reservas: [], cruces: crucesActuales });
        numeroCombateGlobal += crucesActuales.length;
    } else {
        const cantidadCombatientesPrevia = sobrantes * 2;
        const participantesPrevia = participantesBarajados.slice(0, cantidadCombatientesPrevia);
        const pasanDirectamente = participantesBarajados.slice(cantidadCombatientesPrevia);
        
        const crucesPrevia = crearCruces(participantesPrevia, numeroCombateGlobal);
        rondas.push({ nombre: "Ronda previa", tipo: "previa", participantes: participantesPrevia, reservas: pasanDirectamente, cruces: crucesPrevia });
        numeroCombateGlobal += crucesPrevia.length;

        const marcadoresGanadores = crucesPrevia.map(c => ({ tipo: "ganador_combate", combate: c.numero, etiqueta: "Ganador combate " + c.numero }));
        const participantesCuadroPrincipal = barajar([...marcadoresGanadores, ...pasanDirectamente]);
        
        crucesActuales = crearCruces(participantesCuadroPrincipal, numeroCombateGlobal);
        
        let nombreCuadroPrincipal = "Cuadro principal";
        if (crucesActuales.length === 32) nombreCuadroPrincipal = "Dieciseisavos de final";
        else if (crucesActuales.length === 16) nombreCuadroPrincipal = "Octavos de final";
        else if (crucesActuales.length === 8) nombreCuadroPrincipal = "Cuartos de final";

        rondas.push({ nombre: nombreCuadroPrincipal, tipo: "principal", participantes: participantesCuadroPrincipal, reservas: [], cruces: crucesActuales });
        numeroCombateGlobal += crucesActuales.length;
    }





    
        while (crucesActuales.length > 1) {
        const siguientesCrucesParticipantes = crucesActuales.map(c => ({ tipo: "ganador_combate", combate: c.numero, etiqueta: "Ganador combate " + c.numero }));
        crucesActuales = crearCruces(siguientesCrucesParticipantes, numeroCombateGlobal);
        
        let nombreRonda = "Eliminatorias";
        const len = crucesActuales.length;
        
        if (len === 1024) {
            nombreRonda = "Mil veinticuatroavos de final";
        } else if (len === 512) {
            nombreRonda = "Quinientos doceavos de final";
        } else if (len === 256) {
            nombreRonda = "Doscientos cincuenta y seisavos de final";
        } else if (len === 128) {
            nombreRonda = "Ciento veintiochoavos de final";
        } else if (len === 64) {
            nombreRonda = "Sesenta y cuatroavos de final";
        } else if (len === 32) {
            nombreRonda = "Treintaidosavos de final";
        } else if (len === 16) {
            nombreRonda = "Dieciseisavos de final";
        } else if (len === 8) {
            nombreRonda = "Octavos de final";
        } else if (len === 4) {
            nombreRonda = "Cuartos de final";
        } else if (len === 2) {
            nombreRonda = "Semifinales";
        } else if (len === 1) {
            nombreRonda = "Gran Final";
        }

        rondas.push({ nombre: nombreRonda, tipo: "eliminatoria", participantes: [], reservas: [], cruces: crucesActuales });
        numeroCombateGlobal += crucesActuales.length;
    }





    
    return rondas;
}

    



    
    

    function obtenerTextoParticipante(participante) {
    if (participante && typeof participante === "object" && participante.j1) {
        return participante.j2 ? participante.j2 + " (" + participante.j1 + ")" : participante.j1;
    }
    if (typeof participante === "string") return participante;
    return "—";
}
function crearParticipanteVisual(participante, datosSeries) {
    const elemento = document.createElement("div");
    elemento.className = "participanteCombate";
    if (participante && typeof participante === "object" && participante.j1) {
        elemento.textContent = obtenerTextoParticipante(participante);
        elemento.dataset.codigo = participante.j1;
        return elemento;
    }
    if (participante && (participante.tipo === "ganador_previa" || participante.tipo === "ganador_combate")) {
        const origenNum = participante.combate;
        const resOrigen = datosSeries[origenNum];
        if (resOrigen && resOrigen.ganadorNombre) {
            elemento.textContent = resOrigen.ganadorNombre;
            elemento.dataset.codigo = resOrigen.ganadorCodigo;
            elemento.classList.add("ganadorDecidido");
        } else {
            elemento.textContent = "🏆 " + participante.etiqueta;
            elemento.classList.add("ganadorPendiente");
        }
        return elemento;
    }
    elemento.textContent = "—";
    return elemento;
}
    function resolverParticipanteReal(p, datosSeries) {
    if (p && p.tipo === "ganador_combate" && datosSeries[p.combate]) {
        return { j1: datosSeries[p.combate].ganadorCodigo, j2: datosSeries[p.combate].ganadorNombre };
    }
    return p;
}
function mostrarCruce(cruce) {
    const tarjeta = document.createElement("div");
    tarjeta.className = "cruceCombate";
    tarjeta.dataset.combateId = cruce.numero;

    const numero = document.createElement("div");
    numero.className = "numeroCombate";
    numero.textContent = "Combate " + cruce.numero;
    tarjeta.appendChild(numero);

    let datosSeries = {};
    try { datosSeries = JSON.parse(localStorage.getItem(CLAVE_RESULTADOS_SERIES) || "{}"); } catch (e) {}
    const resCombate = datosSeries[cruce.numero];

    const participantes = document.createElement("div");
    participantes.className = "participantesCombate";

    const p1Real = resolverParticipanteReal(cruce.participante1, datosSeries);
    const p2Real = resolverParticipanteReal(cruce.participante2, datosSeries);

    if (resCombate) {
        const p1Codigo = typeof p1Real === "object" ? p1Real.j1 : p1Real;
        const p2Codigo = typeof p2Real === "object" ? p2Real.j1 : p2Real;
        const esP1Ganador = resCombate.ganadorCodigo === p1Codigo;
        const esP2Ganador = resCombate.ganadorCodigo === p2Codigo;

        const p1Div = document.createElement("div");
        p1Div.className = "participanteCombate" + (esP1Ganador ? " ganadorTorneo" : "");
        p1Div.textContent = obtenerTextoParticipante(p1Real) + (esP1Ganador ? " 👑" : "");

        const marcadorDiv = document.createElement("div");
        marcadorDiv.className = "marcadorSerie";
        marcadorDiv.style.cssText = "font-weight: bold; padding: 0 8px; color: #58a6ff;";
        marcadorDiv.textContent = `${resCombate.victorias1} - ${resCombate.victorias2}`;

        const p2Div = document.createElement("div");
        p2Div.className = "participanteCombate" + (esP2Ganador ? " ganadorTorneo" : "");
        p2Div.textContent = obtenerTextoParticipante(p2Real) + (esP2Ganador ? " 👑" : "");

        participantes.appendChild(p1Div);
        participantes.appendChild(marcadorDiv);
        participantes.appendChild(p2Div);
        tarjeta.classList.add("combateFinalizado");
    } else {
        participantes.appendChild(crearParticipanteVisual(cruce.participante1, datosSeries));
        const versus = document.createElement("button");
        versus.type = "button";
        versus.className = "versusCombate";
        versus.textContent = "⚔️";
        versus.title = "Lanzar combate en la Arena";

        const p1Valido = p1Real && (typeof p1Real === "string" || p1Real.j1);
        const p2Valido = p2Real && (typeof p2Real === "string" || p2Real.j1);

        if (p1Valido && p2Valido) {
            const codigo1 = typeof p1Real === "string" ? p1Real : p1Real.j1;
            const codigo2 = typeof p2Real === "string" ? p2Real : p2Real.j1;
            versus.addEventListener("click", function() {
                const datosCombateTorneo = { modoTorneo: true, combateNumero: cruce.numero, combatiente1: codigo1, combatiente2: codigo2 };
                localStorage.setItem("palentropia_combate_activo", JSON.stringify(datosCombateTorneo));
                window.location.href = "arena2.html";
            });
        } else {
            versus.disabled = true;
            versus.style.opacity = "0.35";
            versus.style.cursor = "default";
        }
        participantes.appendChild(versus);
        participantes.appendChild(crearParticipanteVisual(cruce.participante2, datosSeries));
    }
    tarjeta.appendChild(participantes);
    return tarjeta;
}

    function mostrarRondas(rondas) {
    const contenedor = document.getElementById("contenedorRondas");
    contenedor.innerHTML = "";
    rondas.forEach(ronda => {
        const bloque = document.createElement("section");
        bloque.className = "rondaTorneo";
        const titulo = document.createElement("h2");
        titulo.textContent = ronda.nombre;
        bloque.appendChild(titulo);
        if (ronda.reservas && ronda.reservas.length) {
            const reservas = document.createElement("div");
            reservas.className = "pasanDirectamente";
            const texto = document.createElement("span");
            texto.innerHTML = "<strong>⏭ Pasan directamente:</strong> ";
            reservas.appendChild(texto);
            ronda.reservas.forEach((participante, indice) => {
                const elemento = document.createElement("span");
                elemento.textContent = obtenerTextoParticipante(participante);
                if (indice > 0) reservas.appendChild(document.createTextNode(" · "));
                reservas.appendChild(elemento);
            });
            bloque.appendChild(reservas);
        }
        const lista = document.createElement("div");
        lista.className = "listaCombates";
        ronda.cruces.forEach(cruce => { lista.appendChild(mostrarCruce(cruce)); });
        bloque.appendChild(lista);
        contenedor.appendChild(bloque);
    });
}
function mismosParticipantes(pGuardados, pActuales) {
    if (!Array.isArray(pGuardados) || !Array.isArray(pActuales) || pGuardados.length !== pActuales.length) return false;
    for (let i = 0; i < pActuales.length; i++) {
        if (String(pGuardados[i]) !== String(pActuales[i])) return false;
    }
    return true;
}
function guardarEmparejamientos(participantes, rondas) {
    const datos = { participantes: participantes.map(p => p.j1), rondas: rondas, criterio: obtenerCriterioTorneo(), fecha: Date.now() };
    localStorage.setItem(CLAVE_TORNEO_EMPAREJAMIENTOS, JSON.stringify(datos));
}
function obtenerEmparejamientosGuardados(participantes) {
    const guardado = localStorage.getItem(CLAVE_TORNEO_EMPAREJAMIENTOS);
    if (!guardado) return null;
    try {
        const datos = JSON.parse(guardado);
        if (!datos || !Array.isArray(datos.participantes) || !Array.isArray(datos.rondas)) return null;
        const participantesActuales = participantes.map(p => p.j1);
        if (!mismosParticipantes(datos.participantes, participantesActuales)) return null;
        return datos.rondas;
    } catch (error) { console.error("Error leyendo emparejamientos:", error); return null; }
}
function eliminarEmparejamientosGuardados() { localStorage.removeItem(CLAVE_TORNEO_EMPAREJAMIENTOS); }
function mostrarEstadoTorneo(participantes, informacion, fueGenerado) {
    const estado = document.getElementById("estadoCombates");
    if (!estado) return;
    if (informacion.sobrantes > 0) {
        estado.textContent = participantes.length + " participantes · " + informacion.combates + " combates de ronda previa · " + informacion.cuadro + " participantes en el cuadro principal.";
    } else {
        estado.textContent = participantes.length + " participantes · cuadro de " + informacion.cuadro + ".";
    }
    estado.textContent += fueGenerado ? " Emparejamientos fijados." : " Emparejamientos guardados.";
}

    async function iniciarCombates(forzarNuevo = false) {
    mostrarTituloTorneo();
    const matrizJ1 = obtenerParticipantes();
    const estado = document.getElementById("estadoCombates");
    if (matrizJ1.length < 2) {
        estado.textContent = "No hay suficientes participantes para generar combates.";
        window.TORNEO_COMBATES = [];
        return;
    }
    const mapaNombres = await obtenerMapaNombres();
    const participantes = crearParticipantesDatos(matrizJ1, mapaNombres);
    if (participantes.length < 2) {
        estado.textContent = "No hay suficientes participantes válidos para generar combates.";
        window.TORNEO_COMBATES = [];
        return;
    }

    const ultimoGanadorJSON = localStorage.getItem("palentropia_ultimo_ganador");
    if (ultimoGanadorJSON) {
        try {
            const infoGanador = JSON.parse(ultimoGanadorJSON);
            let datosSeries = {};
            try { datosSeries = JSON.parse(localStorage.getItem(CLAVE_RESULTADOS_SERIES) || "{}"); } catch (e) {}
            
            datosSeries[infoGanador.combateNumero] = {
                ganadorCodigo: infoGanador.ganadorCodigo,
                ganadorNombre: infoGanador.ganadorNombre,
                victorias1: infoGanador.victorias1,
                victorias2: infoGanador.victorias2
            };
            localStorage.setItem(CLAVE_RESULTADOS_SERIES, JSON.stringify(datosSeries));
            localStorage.removeItem("palentropia_ultimo_ganador");
        } catch (e) { console.error("Error procesando último ganador de la arena:", e); }
    }

    if (forzarNuevo) eliminarEmparejamientosGuardados();

    let rondas = obtenerEmparejamientosGuardados(participantes);
    let fueGenerado = false;
    if (!rondas) {
        rondas = generarTorneo(participantes);
        guardarEmparejamientos(participantes, rondas);
        fueGenerado = true;
    }
    window.TORNEO_COMBATES = rondas;
    const informacion = calcularRondaPrevia(participantes.length);
    mostrarEstadoTorneo(participantes, informacion, fueGenerado);
    mostrarRondas(rondas);
}

document.addEventListener("DOMContentLoaded", function() {
    const botonMenu = document.getElementById("botonMenuPrincipal");
    if (botonMenu) {
        botonMenu.addEventListener("click", function() {
            window.location.href = "index.html";
        });
    }
    const botonRehacer = document.getElementById("botonRehacerEmparejamientos");
    if (botonRehacer) {
        botonRehacer.addEventListener("click", async function() {
            const confirmar = confirm("¿Quieres rehacer los emparejamientos del torneo y borrar los resultados actuales?");
            if (!confirmar) return;
            botonRehacer.disabled = true;
            try {
                localStorage.removeItem(CLAVE_RESULTADOS_SERIES);
                await iniciarCombates(true);
            } catch (error) { console.error("Error rehaciendo emparejamientos:", error); }
            botonRehacer.disabled = false;
        });
    }
    iniciarCombates();
});
</script>
</body>
</html>
