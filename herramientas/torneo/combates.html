<!DOCTYPE html><html lang="es"><head>

<title>PalEntropía — Combates</title><link rel="stylesheet"
      href="combates.css"></head><body><!-- =====================================================

type="button"
title="Volver al menú principal"
aria-label="Volver al menú principal">

</button><!-- =====================================================
     CABECERA

    Combates
</div></header><!-- =====================================================
     CONTENEDOR PRINCIPAL
     ===================================================== --><main id="combates"><section id="cabeceraCombates"><h2 id="tituloTorneo">
    ⚔️ Torneo
</h2>

<p id="estadoCombates">
    Preparando emparejamientos...
</p>

</section><!-- =================================================

</section></main><!-- =====================================================
     VOLVER AL ÍNDICE

href="index.html"
id="botonVolver">

← Volver al índice del torneo

</a></section><!-- =====================================================
     MOTOR DEL TORNEO
     ===================================================== --><script>

window.TORNEO_COMBATES = [];


/* =====================================================
   OBTENER CRITERIO DEL TORNEO
   ===================================================== */

function obtenerCriterioTorneo() {

    const criterio =
        localStorage.getItem(
            "palentropia_criterio_torneo"
        );

    return String(
        criterio || ""
    ).trim();

}


/* =====================================================
   TRANSFORMAR CRITERIO PARA MOSTRAR
   ===================================================== */

function transformarCriterioTorneo(
    criterio
) {

    const valor =
        String(
            criterio || ""
        ).trim();

    if (!valor) {
        return "";
    }


    const equivalencias = {

        "perm":
            "Pérmico",

        "chord":
            "Chordata",

        "placen":
            "Placentaria"

    };


    const clave =
        valor.toLowerCase();


    if (
        equivalencias[
            clave
        ]
    ) {

        return equivalencias[
            clave
        ];

    }


    /*
    Los códigos se mantienen
    exactamente como fueron introducidos.
    */

    return valor;

}


/* =====================================================
   MOSTRAR TÍTULO DEL TORNEO
   ===================================================== */

function mostrarTituloTorneo() {

    const titulo =
        document.getElementById(
            "tituloTorneo"
        );

    if (!titulo) {
        return;
    }


    const criterio =
        obtenerCriterioTorneo();


    const criterioMostrar =
        transformarCriterioTorneo(
            criterio
        );


    if (
        criterioMostrar
    ) {

        titulo.textContent =
            "⚔️ Torneo " +
            criterioMostrar;

    }

    else {

        titulo.textContent =
            "⚔️ Torneo";

    }

}


/* =====================================================
   OBTENER PARTICIPANTES
   ===================================================== */

function obtenerParticipantes() {

    const guardado =
        localStorage.getItem(
            "palentropia_matriz_combatientes"
        );

    if (!guardado) {
        return [];
    }

    try {

        const matriz =
            JSON.parse(
                guardado
            );

        if (
            !Array.isArray(matriz)
        ) {
            return [];
        }

        return matriz
            .map(
                codigo =>
                    String(
                        codigo || ""
                    ).trim()
            )
            .filter(
                codigo =>
                    codigo !== ""
            );

    }

    catch (error) {

        console.error(
            "Error leyendo participantes:",
            error
        );

        return [];

    }

}


/* =====================================================
   OBTENER J2
   ===================================================== */

async function obtenerMapaNombres() {

    const mapaNombres =
        new Map();

    try {

        const respuesta =
            await fetch(
                "../generador_fase_2/paleofichas.json"
            );

        if (!respuesta.ok) {

            throw new Error(
                "No se pudo cargar paleofichas.json."
            );

        }

        const datos =
            await respuesta.json();

        if (
            !Array.isArray(datos)
        ) {
            return mapaNombres;
        }

        datos.forEach(
            registro => {

                if (!registro) {
                    return;
                }

                const j1 =
                    String(
                        registro.j1 ||
                        registro.codigo ||
                        registro.J1 ||
                        ""
                    ).trim();

                const j2 =
                    String(
                        registro.j2 ||
                        registro.nombre ||
                        registro.J2 ||
                        ""
                    ).trim();

                if (
                    j1 &&
                    j2
                ) {

                    mapaNombres.set(
                        j1,
                        j2
                    );

                }

            }
        );

    }

    catch (error) {

        console.error(
            "Error cargando nombres J2:",
            error
        );

    }

    return mapaNombres;

}


/* =====================================================
   CONVERTIR PARTICIPANTES
   J1 → J1 + J2
   ===================================================== */

function crearParticipantesDatos(
    matrizJ1,
    mapaNombres
) {

    const participantes = [];

    matrizJ1.forEach(
        codigo => {

            const j1 =
                String(
                    codigo || ""
                ).trim();

            if (!j1) {
                return;
            }

            const j2 =
                mapaNombres.get(j1) ||
                "";

            participantes.push({

                j1:
                    j1,

                j2:
                    j2

            });

        }
    );

    return participantes;

}


/* =====================================================
   BARAJAR PARTICIPANTES
   FISHER-YATES
   ===================================================== */

function barajar(
    matriz
) {

    const resultado =
        [...matriz];

    for (
        let i =
            resultado.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        const temporal =
            resultado[i];

        resultado[i] =
            resultado[j];

        resultado[j] =
            temporal;

    }

    return resultado;

}


/* =====================================================
   CALCULAR MAYOR POTENCIA DE 2
   MENOR O IGUAL AL TOTAL
   ===================================================== */

function calcularCuadroPrincipal(
    cantidad
) {

    let potencia =
        1;

    while (
        potencia * 2 <=
        cantidad
    ) {

        potencia *= 2;

    }

    return potencia;

}


/* =====================================================
   CALCULAR RONDA PREVIA
   ===================================================== */

function calcularRondaPrevia(
    cantidad
) {

    const cuadro =
        calcularCuadroPrincipal(
            cantidad
        );

    const sobrantes =
        cantidad -
        cuadro;

    return {

        cuadro:
            cuadro,

        sobrantes:
            sobrantes,

        combates:
            sobrantes

    };

}


/* =====================================================
   CREAR CRUCES DE UNA LISTA
   ===================================================== */

function crearCruces(
    participantes
) {

    const cruces = [];

    for (
        let i = 0;
        i < participantes.length;
        i += 2
    ) {

        const participante1 =
            participantes[i];

        const participante2 =
            participantes[i + 1];

        if (
            participante1 &&
            participante2
        ) {

            cruces.push({

                numero:
                    cruces.length + 1,

                participante1:
                    participante1,

                participante2:
                    participante2,

                ganador:
                    null

            });

        }

    }

    return cruces;

}


/* =====================================================
   GENERAR TORNEO
   ===================================================== */

function generarTorneo(
    participantes
) {

    const cantidad =
        participantes.length;

    const rondas = [];

    if (
        cantidad < 2
    ) {

        return rondas;

    }


    /*
    BARAJADO GENERAL
    */

    const participantesBarajados =
        barajar(
            participantes
        );


    const cuadro =
        calcularCuadroPrincipal(
            cantidad
        );

    const sobrantes =
        cantidad -
        cuadro;


    /* =================================================
       CUADRO DIRECTO
       ================================================= */

    if (
        sobrantes === 0
    ) {

        const participantesCuadro =
            barajar(
                participantesBarajados
            );

        rondas.push({

            nombre:
                "Primera ronda",

            tipo:
                "principal",

            participantes:
                participantesCuadro,

            reservas:
                [],

            cruces:
                crearCruces(
                    participantesCuadro
                )

        });

        return rondas;

    }


    /* =================================================
       RONDA PREVIA
       ================================================= */

    const cantidadParaPrevia =
        sobrantes * 2;

    const participantesPrevia =
        participantesBarajados.slice(
            0,
            cantidadParaPrevia
        );

    const pasanDirectamente =
        participantesBarajados.slice(
            cantidadParaPrevia
        );


    const crucesPrevia =
        crearCruces(
            participantesPrevia
        );


    rondas.push({

        nombre:
            "Ronda previa",

        tipo:
            "previa",

        participantes:
            participantesPrevia,

        reservas:
            pasanDirectamente,

        cruces:
            crucesPrevia

    });


    /* =================================================
       CUADRO PRINCIPAL
       ================================================= */

    const marcadoresGanadores = [];

    for (
        let i = 0;
        i < crucesPrevia.length;
        i++
    ) {

        marcadoresGanadores.push({

            tipo:
                "ganador_previa",

            combate:
                i + 1,

            etiqueta:
                "Ganador combate " +
                (
                    i + 1
                )

        });

    }


    const siguiente = [];


    marcadoresGanadores.forEach(
        ganador => {

            siguiente.push(
                ganador
            );

        }
    );


    pasanDirectamente.forEach(
        participante => {

            siguiente.push(
                participante
            );

        }
    );


    /*
    BARAJAR LAS PLAZAS DEL
    CUADRO PRINCIPAL
    */

    const siguienteBarajado =
        barajar(
            siguiente
        );


    rondas.push({

        nombre:
            "Cuadro principal",

        tipo:
            "principal",

        participantes:
            siguienteBarajado,

        reservas:
            [],

        cruces:
            crearCruces(
                siguienteBarajado
            )

    });


    return rondas;

}


/* =====================================================
   OBTENER TEXTO DEL PARTICIPANTE
   FORMATO:
   Gastornis (006_01)
   ===================================================== */

function obtenerTextoParticipante(
    participante
) {

    if (
        participante &&
        typeof participante ===
        "object" &&
        participante.j1
    ) {

        if (
            participante.j2
        ) {

            return (
                participante.j2 +
                " (" +
                participante.j1 +
                ")"
            );

        }

        return participante.j1;

    }


    if (
        typeof participante ===
        "string"
    ) {

        return participante;

    }


    return "—";

}


/* =====================================================
   CREAR ELEMENTO DE PARTICIPANTE
   ===================================================== */

function crearParticipanteVisual(
    participante
) {

    const elemento =
        document.createElement(
            "div"
        );

    elemento.className =
        "participanteCombate";


    /*
    PARTICIPANTE NORMAL
    */

    if (
        participante &&
        typeof participante ===
        "object" &&
        participante.j1
    ) {

        elemento.textContent =
            obtenerTextoParticipante(
                participante
            );

        elemento.dataset.codigo =
            participante.j1;

        return elemento;

    }


    /*
    GANADOR DE COMBATE PREVIO
    */

    if (
        participante &&
        participante.tipo ===
        "ganador_previa"
    ) {

        elemento.textContent =
            "🏆 " +
            participante.etiqueta;

        elemento.classList.add(
            "ganadorPendiente"
        );

        return elemento;

    }


    elemento.textContent =
        "—";

    return elemento;

}


/* =====================================================
   CREAR TARJETA DE COMBATE
   ===================================================== */

function mostrarCruce(
    cruce
) {

    const tarjeta =
        document.createElement(
            "div"
        );

    tarjeta.className =
        "cruceCombate";


    const numero =
        document.createElement(
            "div"
        );

    numero.className =
        "numeroCombate";

    numero.textContent =
        "Combate " +
        cruce.numero;

    tarjeta.appendChild(
        numero
    );


    const participantes =
        document.createElement(
            "div"
        );

    participantes.className =
        "participantesCombate";


    participantes.appendChild(
        crearParticipanteVisual(
            cruce.participante1
        )
    );


    const versus =
        document.createElement(
            "div"
        );

    versus.className =
        "versusCombate";

    versus.textContent =
        "⚔️";

    participantes.appendChild(
        versus
    );


    participantes.appendChild(
        crearParticipanteVisual(
            cruce.participante2
        )
    );


    tarjeta.appendChild(
        participantes
    );


    return tarjeta;

}
/* =====================================================
MOSTRAR RONDAS
===================================================== */

function mostrarRondas(
rondas
) {

const contenedor =
    document.getElementById(
        "contenedorRondas"
    );


contenedor.innerHTML =
    "";


rondas.forEach(
    ronda => {

        const bloque =
            document.createElement(
                "section"
            );


        bloque.className =
            "rondaTorneo";


        const titulo =
            document.createElement(
                "h2"
            );


        titulo.textContent =
            ronda.nombre;


        bloque.appendChild(
            titulo
        );


        /*
        PARTICIPANTES QUE PASAN DIRECTAMENTE
        */

        if (
            ronda.reservas &&
            ronda.reservas.length
        ) {

            const reservas =
                document.createElement(
                    "div"
                );


            reservas.className =
                "pasanDirectamente";


            const texto =
                document.createElement(
                    "span"
                );


            texto.innerHTML =
                "<strong>⏭ Pasan directamente:</strong> ";


            reservas.appendChild(
                texto
            );


            ronda.reservas.forEach(
                (
                    participante,
                    indice
                ) => {

                    const elemento =
                        document.createElement(
                            "span"
                        );


                    elemento.textContent =
                        obtenerTextoParticipante(
                            participante
                        );


                    if (
                        indice >
                        0
                    ) {

                        reservas.appendChild(
                            document.createTextNode(
                                " · "
                            )
                        );

                    }


                    reservas.appendChild(
                        elemento
                    );

                }
            );


            bloque.appendChild(
                reservas
            );

        }


        /*
        LISTA DE COMBATES
        */

        const lista =
            document.createElement(
                "div"
            );


        lista.className =
            "listaCombates";


        ronda.cruces.forEach(
            cruce => {

                lista.appendChild(
                    mostrarCruce(
                        cruce
                    )
                );

            }
        );


        bloque.appendChild(
            lista
        );


        contenedor.appendChild(
            bloque
        );

    }
);

}

/* =====================================================
INICIAR
===================================================== */

async function iniciarCombates() {

/*
MOSTRAR CRITERIO DEL TORNEO
*/

mostrarTituloTorneo();


const matrizJ1 =
    obtenerParticipantes();


const estado =
    document.getElementById(
        "estadoCombates"
    );


if (
    matrizJ1.length <
    2
) {

    estado.textContent =
        "No hay suficientes participantes para generar combates.";

    return;

}


/*
CARGAR J2
*/

const mapaNombres =
    await obtenerMapaNombres();


/*
CREAR PARTICIPANTES
CON J1 + J2
*/

const participantes =
    crearParticipantesDatos(
        matrizJ1,
        mapaNombres
    );


if (
    participantes.length <
    2
) {

    estado.textContent =
        "No hay suficientes participantes válidos para generar combates.";

    return;

}


const informacion =
    calcularRondaPrevia(
        participantes.length
    );


const rondas =
    generarTorneo(
        participantes
    );


window.TORNEO_COMBATES =
    rondas;


if (
    informacion.sobrantes >
    0
) {

    estado.textContent =
        participantes.length +
        " participantes · " +
        informacion.combates +
        " combates de ronda previa · " +
        informacion.cuadro +
        " participantes en el cuadro principal.";

}

else {

    estado.textContent =
        participantes.length +
        " participantes · cuadro de " +
        informacion.cuadro +
        ".";

}


mostrarRondas(
    rondas
);


console.log(
    "TORNEO_COMBATES:",
    rondas
);

}

/* =====================================================
ARRANQUE
===================================================== */

document.addEventListener(
"DOMContentLoaded",
function() {

    /* ---------------------------------------------
       MENÚ PRINCIPAL
    --------------------------------------------- */

    const botonMenu =
        document.getElementById(
            "botonMenuPrincipal"
        );


    if (
        botonMenu
    ) {

        botonMenu.addEventListener(
            "click",
            function() {

                window.location.href =
                    "../../index.html";

            }
        );

    }


    /* ---------------------------------------------
       INICIAR TORNEO
    --------------------------------------------- */

    iniciarCombates();

}

);

</script></body></html>
