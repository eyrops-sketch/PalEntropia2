<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PalEntropía — Clasificación Global</title>
<link rel="stylesheet" href="index.css">
</head>

<body>

<!-- =====================================================
     BOTÓN MENÚ PRINCIPAL
     ===================================================== -->
<button id="botonMenuPrincipal" type="button" title="Volver al menú principal" aria-label="Volver al menú principal">
🏠
</button>

<!-- =====================================================
     CABECERA
     ===================================================== -->
<header id="cabecera">
<h1>PalEntropía</h1>
<div id="subtitulo">Ranking Histórico Global</div>
</header>

<!-- =====================================================
     CONTENEDOR PRINCIPAL
     ===================================================== -->
<main id="torneo">

<section id="cabeceraTorneo">
    <h2>📊 Clasificación General</h2>
    <p>Acumulado histórico de puntos de todos los torneos disputados</p>
</section>

<!-- =====================================================
     TABLA / LISTA DE CLASIFICACIÓN
     ===================================================== -->
<section id="indiceTorneo">
    <div id="contenedorClasificacion" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
        <!-- Se cargará dinámicamente mediante JavaScript -->
    </div>
</section>

</main>

<!-- =====================================================
     VOLVER AL ÍNDICE DEL TORNEO
     ===================================================== -->
<section id="volver">
<a href="index.html" id="botonVolver">
    ← Volver al índice del torneo
</a>
</section>

<!-- =====================================================
     LÓGICA DE LA CLASIFICACIÓN GLOBAL
     ===================================================== -->
<script>
const CLAVE_PALMARES = "palentropia_palmares_historico";

function cargarClasificacionGlobal() {
    const contenedor = document.getElementById("contenedorClasificacion");
    contenedor.innerHTML = "";

    let historico = [];
    try {
        historico = JSON.parse(localStorage.getItem(CLAVE_PALMARES) || "[]");
    } catch (e) {
        console.error("Error leyendo el palmarés:", e);
    }

    if (!historico.length) {
        contenedor.innerHTML = `
            <div class="bloqueTorneo" style="text-align: center; color: #aaa;">
                <p>Todavía hay suficientes datos registrados para generar la clasificación.</p>
            </div>
        `;
        return;
    }

    // Objeto para acumular estadísticas por combatiente (clave única: código)
    const ranking = {};

    function sumarPuntos(codigo, nombre, puntos, tipo) {
        if (!codigo) return;
        if (!ranking[codigo]) {
            ranking[codigo] = {
                codigo: codigo,
                nombre: nombre || codigo,
                puntosTotales: 0,
                campeonatos: 0,
                subcampeonatos: 0,
                semifinales: 0
            };
        }
        ranking[codigo].puntosTotales += puntos;
        if (tipo === "campeon") ranking[codigo].campeonatos++;
        if (tipo === "subcampeon") ranking[codigo].subcampeonatos++;
        if (tipo === "semifinal") ranking[codigo].semifinales++;
    }

    // Procesar cada torneo del histórico
    historico.forEach(item => {
        // Soporte retrocompatible para registros planos antiguos
        if (item.campeon) {
            sumarPuntos(item.campeon.codigo, item.campeon.nombre, item.campeon.puntos || 0, "campeon");
        } else if (item.codigo) {
            sumarPuntos(item.codigo, item.nombre, item.puntos || 0, "campeon");
        }

        if (item.subcampeon) {
            sumarPuntos(item.subcampeon.codigo, item.subcampeon.nombre, item.subcampeon.puntos || 0, "subcampeon");
        }

        if (Array.isArray(item.semifinalistas)) {
            item.semifinalistas.forEach(semi => {
                sumarPuntos(semi.codigo, semi.nombre, semi.puntos || 0, "semifinal");
            });
        }
    });

    // Convertir a array y ordenar de mayor a menor puntuación
    const listaRanking = Object.values(ranking);
    listaRanking.sort((a, b) => b.puntosTotales - a.puntosTotales);

    // Renderizar filas del ranking
    listaRanking.forEach((combatiente, index) => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "bloqueTorneo";
        
        let colorBorde = "#25292c";
        let iconoPosicion = `#${index + 1}`;
        if (index === 0) { colorBorde = "#d4af37"; iconoPosicion = "🥇"; }
        else if (index === 1) { colorBorde = "#c0c0c0"; iconoPosicion = "🥈"; }
        else if (index === 2) { colorBorde = "#cd7f32"; iconoPosicion = "🥉"; }

        tarjeta.style.borderLeft = `4px solid ${colorBorde}`;

        tarjeta.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="font-size: 18px; font-weight: bold; width: 30px; text-align: center; color: #62d6ff;">${iconoPosicion}</span>
                    <div>
                        <strong style="font-size: 16px; color: #fff;">${combatiente.nombre}</strong> 
                        <span style="font-size: 13px; color: #8b949e;">(${combatiente.codigo})</span>
                        <div style="font-size: 12px; color: #8b949e; margin-top: 2px;">
                            👑 ${combatiente.campeonatos} vit. | 🥈 ${combatiente.subcampeonatos} sub. | 🥉 ${combatiente.semifinales} semis
                        </div>
                    </div>
                </div>
                <div style="background: #1f2428; padding: 6px 14px; border-radius: 6px; border: 1px solid #30363d;">
                    ⭐ <span style="color: #d4af37; font-weight: bold; font-size: 16px;">${combatiente.puntosTotales} pts</span>
                </div>
            </div>
        `;

        contenedor.appendChild(tarjeta);
    });
}

// Botón de menú principal
document.getElementById("botonMenuPrincipal").addEventListener("click", function() {
    window.location.href = "../../index.html";
});

document.addEventListener("DOMContentLoaded", cargarClasificacionGlobal);
</script>

</body>
</html>
