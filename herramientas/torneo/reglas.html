<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PalEntropía — Reglas del torneo</title>

<link rel="stylesheet"
      href="reglas.css">

</head>

<body>


<!-- =====================================================
     BOTÓN MENÚ PRINCIPAL
     ===================================================== -->

<button
    id="botonMenuPrincipal"
    type="button"
    title="Volver al menú principal"
    aria-label="Volver al menú principal">

    🏠

</button>


<!-- =====================================================
     CABECERA
     ===================================================== -->

<header id="cabecera">

    <h1>PalEntropía</h1>

    <div id="subtitulo">
        Reglas del torneo
    </div>

</header>


<!-- =====================================================
     CONTENEDOR PRINCIPAL
     ===================================================== -->

<main id="torneo">


    <section id="cabeceraTorneo">

        <h2 id="tituloCabeceraTorneo">
            ⚙️ Reglas del torneo
        </h2>

        <p id="criterioTorneo">
            Configuración del torneo
        </p>

    </section>


    <!-- =================================================
         REGLAS DEL TORNEO
         ================================================= -->

    <section id="reglasTorneo">


        <!-- =============================================
             PARTIDOS POR SERIE
             ============================================= -->

        <div class="bloqueTorneo">

            <h3>
                ⚔️ Partidos por serie
            </h3>

            <p>
                Número de combates que debe disputar cada serie.
            </p>

            <input
                id="partidosSerie"
                type="number"
                min="1"
                step="2"
                value="1"
                inputmode="numeric"
                aria-label="Número de partidos por serie">

            <div id="avisoPartidosSerie"></div>

        </div>


        <!-- =============================================
             TIPO DE COMBATE
             ============================================= -->

        <div class="bloqueTorneo">

            <h3>
                🎲 Tipo de combate
            </h3>

            <p>
                Sistema utilizado para resolver los combates.
            </p>

            <select
                id="tipoCombate"
                aria-label="Tipo de combate">

                <option value="standard">
                    Standard
                </option>

            </select>

        </div>


    </section>


</main>


<!-- =====================================================
     VOLVER AL ÍNDICE DEL TORNEO
     ===================================================== -->

<section id="volver">

    <a
        href="index.html"
        id="botonVolver">

        ← Volver al torneo

    </a>

</section>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>


/* =====================================================
   CLAVES DE LOCALSTORAGE
   ===================================================== */

const CLAVE_REGLAS_TORNEO =
    "palentropia_reglas_torneo";

const CLAVE_CRITERIO_TORNEO =
    "palentropia_criterio_torneo";


/* =====================================================
   CSV INCORPORADO POR DEFECTO
   ===================================================== */

const CSV_CONFIG_DEFAULT = `parametro,standard
hp_base,100
bonificacion_dominante,0.15
factor_imprevisible_min,0.78
factor_imprevisible_max,1.22
coeficiente_combate,1.00
coeficiente_combate_min,0.50
coeficiente_combate_max,1.50
iniciativa_velocidad,0.70
iniciativa_tactica,0.30
dano_base,4
dano_por_ataque,0.10
defensa_divisor,200
variacion_dano,0.25
multiplicador_critico,2.50
critico_base,10
critico_tactica,0.15
fatiga_minima_critico,20
esquiva_velocidad,0.15
fallo_base,14
fallo_reduccion_tactica,0.03
coste_ataque_potente_hp,0.14
fatiga_minima_ataque_potente,65
fatiga_max,100
fatiga_inicial,100
fatiga_regeneracion_turno,6
coste_fatiga_A001,8
coste_fatiga_A002,38
coste_fatiga_A003,10
coste_fatiga_D001,20
fatiga_defensa_atacante,15
reduccion_defensa,0.35
error_defensa_base,45
error_defensa_reduccion_inteligencia,0.03
error_defensa_reduccion_tactica,0.02
error_defensa_fatiga_umbral,50
error_defensa_fatiga_incremento,0.20
error_defensa_min,15
error_defensa_max,65
golpe_mortal,false
dano_vida_75,1.00
dano_vida_50,1.05
dano_vida_25,1.15
dano_vida_10,1.25
dano_vida_critica,1.35
max_turnos,100
general,1
escenariojug1,1
escenariojug2,1`;


/* =====================================================
   REGLAS POR DEFECTO
   ===================================================== */

const REGLAS_TORNEO_DEFECTO = {

    partidosSerie: 1,

    tipoCombate: "standard"

};


/* =====================================================
   PROCESAR CSV INCORPORADO
   ===================================================== */

function parsearCSVTexto(textoCSV, nombreConfig = "standard") {
    let configExterna = {};
    try {
        const lineas = textoCSV.split("\n");
        if (lineas.length === 0) return configExterna;

        const cabecera = lineas[0].trim().split(",");
        const indiceColumna = cabecera.indexOf(nombreConfig);
        
        if (indiceColumna === -1) return configExterna;

        for (let i = 1; i < lineas.length; i++) {
            const linea = lineas[i].trim();
            if (!linea) continue;
            
            const partes = linea.split(",");
            const parametro = partes[0] ? partes[0].trim() : "";
            let val = partes[indiceColumna] !== undefined ? partes[indiceColumna].trim() : "";

            if (parametro && val !== "") {
                if (val === "true") val = true;
                else if (val === "false") val = false;
                else if (!isNaN(val)) val = Number(val);
                
                configExterna[parametro] = val;
            }
        }
    } catch (err) {
        console.warn("Error al procesar el CSV integrado:", err);
    }
    return configExterna;
}


/* =====================================================
   OBTENER REGLAS
   ===================================================== */

function obtenerReglasTorneo() {

    const guardado =
        localStorage.getItem(
            CLAVE_REGLAS_TORNEO
        );


    if (!guardado) {

        return {
            ...REGLAS_TORNEO_DEFECTO,
            coeficientes: parsearCSVTexto(CSV_CONFIG_DEFAULT, "standard")
        };

    }


    try {

        const reglas =
            JSON.parse(
                guardado
            );


        return {

            ...REGLAS_TORNEO_DEFECTO,

            ...reglas,

            coeficientes: reglas.coeficientes || parsearCSVTexto(CSV_CONFIG_DEFAULT, reglas.tipoCombate || "standard")

        };

    }

    catch (error) {

        console.error(
            "Reglas del torneo no válidas:",
            error
        );


        return {
            ...REGLAS_TORNEO_DEFECTO,
            coeficientes: parsearCSVTexto(CSV_CONFIG_DEFAULT, "standard")
        };

    }

}


/* =====================================================
   GUARDAR REGLAS AUTOMÁTICAMENTE
   ===================================================== */

function guardarReglasTorneo() {

    const partidos =
        Number(
            document.getElementById(
                "partidosSerie"
            ).value
        );


    const tipo =
        document.getElementById(
            "tipoCombate"
        ).value;

    const coeficientesExtraidos = parsearCSVTexto(CSV_CONFIG_DEFAULT, tipo);

    localStorage.setItem(

        CLAVE_REGLAS_TORNEO,

        JSON.stringify({

            partidosSerie:
                partidos,

            tipoCombate:
                tipo,

            coeficientes:
                coeficientesExtraidos

        })

    );

}


/* =====================================================
   OBTENER CRITERIO DEL TORNEO
   ===================================================== */

function obtenerCriterioTorneo() {

    const criterio =
        localStorage.getItem(
            CLAVE_CRITERIO_TORNEO
        );


    if (
        !criterio ||
        !String(criterio).trim()
    ) {

        return "";

    }


    const valor =
        String(
            criterio
        ).trim();


    const equivalencias = {

        "perm":
            "Pérmico",

        "chord":
            "Chordata",

        "placen":
            "Placentaria"

    };


    const clave =
        valor.toLowerCase();


    return (
        equivalencias[clave] ||
        valor
    );

}


/* =====================================================
   MOSTRAR IDENTIFICADOR DEL TORNEO
   ===================================================== */

function mostrarIdentificadorTorneo() {

    const criterio =
        obtenerCriterioTorneo();


    if (!criterio) {

        return;

    }


    const subtitulo =
        document.getElementById(
            "subtitulo"
        );


    const titulo =
        document.getElementById(
            "tituloCabeceraTorneo"
        );


    const descripcion =
        document.getElementById(
            "criterioTorneo"
        );


    if (subtitulo) {

        subtitulo.textContent =
            "Reglas — " +
            criterio;

    }


    if (titulo) {

        titulo.textContent =
            "⚙️ Reglas del torneo — " +
            criterio;

    }


    if (descripcion) {

        descripcion.textContent =
            "Configuración del torneo — " +
            criterio;

    }

}


/* =====================================================
   CARGAR REGLAS EN LA INTERFAZ
   ===================================================== */

function cargarReglasEnInterfaz() {

    const reglas =
        obtenerReglasTorneo();


    const partidos =
        document.getElementById(
            "partidosSerie"
        );


    const tipo =
        document.getElementById(
            "tipoCombate"
        );


    let valorPartidos =
        Number(
            reglas.partidosSerie
        );


    /*
    Si el valor almacenado no es válido,
    volvemos a 1.
    */

    if (
        !Number.isInteger(valorPartidos) ||
        valorPartidos < 1 ||
        valorPartidos % 2 === 0
    ) {

        valorPartidos = 1;

    }


    partidos.value =
        valorPartidos;


    /*
    =====================================================
    TIPO DE COMBATE
    =====================================================
    */

    const opcionExiste =
        Array.from(
            tipo.options
        ).some(
            opcion =>
                opcion.value ===
                reglas.tipoCombate
        );


    if (opcionExiste) {

        tipo.value =
            reglas.tipoCombate;

    }

    else {

        tipo.value =
            "standard";

    }

}


/* =====================================================
   VALIDAR PARTIDOS POR SERIE
   ===================================================== */

function validarPartidosSerie() {

    const campo =
        document.getElementById(
            "partidosSerie"
        );


    const aviso =
        document.getElementById(
            "avisoPartidosSerie"
        );


    const valor =
        Number(
            campo.value
        );


    /*
    Campo vacío
    */

    if (
        campo.value === ""
    ) {

        aviso.textContent =
            "Introduce un número impar.";

        return false;

    }


    /*
    Solo enteros positivos impares
    */

    if (
        !Number.isInteger(valor) ||
        valor < 1 ||
        valor % 2 === 0
    ) {

        aviso.textContent =
            "Debe ser un número impar: 1, 3, 5, 7...";

        return false;

    }


    aviso.textContent =
        "";


    return true;

}


/* =====================================================
   CAMBIO DE PARTIDOS POR SERIE
   ===================================================== */

document
    .getElementById(
        "partidosSerie"
    )
    .addEventListener(
        "input",
        function() {

            if (
                validarPartidosSerie()
            ) {

                guardarReglasTorneo();

            }

        }
    );


/* =====================================================
   CAMBIO DE TIPO DE COMBATE
   ===================================================== */

document
    .getElementById(
        "tipoCombate"
    )
    .addEventListener(
        "change",
        function() {

            guardarReglasTorneo();

        }
    );


/* =====================================================
   BOTÓN MENÚ PRINCIPAL
   ===================================================== */

document
    .getElementById(
        "botonMenuPrincipal"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "../../index.html";

        }
    );


/* =====================================================
   INICIALIZACIÓN
   ===================================================== */

mostrarIdentificadorTorneo();

cargarReglasEnInterfaz();

// Asegurar que se guarde de forma predeterminada con los coeficientes del CSV integrado
guardarReglasTorneo();


</script>

</body>

</html>
