          <div class="barra-contenedor">
            <div id="c2VidaBarra" class="barra-vida"></div>
          </div>

          <div id="c2VidaTexto">❤️ — / —</div>

          <div class="barra-contenedor">
            <div id="c2FatigaBarra" class="barra-fatiga"></div>
          </div>

          <div id="c2FatigaTexto">⚡ — / —</div>

          <div id="c2Estadisticas"></div>

          <div id="c2Estado">—</div>

        </article>

      </div>

    </section>


    <section id="acciones" class="panel">

      <h2>🎯 Acciones</h2>

      <div class="botones-acciones">

        <button id="botonA001" type="button">
          A001

        <button id="botonA002" type="button">
          A002
        </button>

        <button id="botonA003" type="button">
          A003
        </button>

        <button id="botonD001" type="button">
          D001
        </button>

        <button id="botonAuto" type="button">
          🤖 Automático

    </section>

      <h2>📜 Registro del combate</h2>

  <script src="../generador_fase_2/palarenastats.js"></script>
  <script src="standar-ataques.js"></script>
  <script src="standar-efectos.js"></script>
  <script src="standar.js"></script>


  <script>

    const RUTA_MASTER = "../generador_fase_2/master.csv";
    const RUTA_PALEOFICHAS = "../generador_fase_2/paleofichas.json";

    const CLAVE_REGLAS_TORNEO = "palentropia_reglas_torneo";

    const REGLAS_TORNEO_DEFECTO = {
      partidosSerie: 1,
      tipoCombate: "standard"
    };


    let paleofichas = [];
    let master = [];

    let combateActual = null;

    let reglasTorneo = {
      ...REGLAS_TORNEO_DEFECTO
    };

    let serieActiva = false;
    let partidosSerie = 1;
    let partidoActual = 0;

    let victorias1 = 0;
    let victorias2 = 0;

    let victoriasNecesarias = 1;


    const codigo1 = document.getElementById("codigo1");
    const codigo2 = document.getElementById("codigo2");

    const nombre1 = document.getElementById("nombre1");
    const nombre2 = document.getElementById("nombre2");

    const botonPreparar = document.getElementById("botonPreparar");
    const botonSerie = document.getElementById("botonSerie");

    const mensajeConfiguracion =
      document.getElementById("mensajeConfiguracion");

    const serieFormato =
      document.getElementById("serieFormato");

    const partidoActualElemento =
      document.getElementById("partidoActual");

    const c1Nombre =
      document.getElementById("c1Nombre");

    const c1Codigo =
      document.getElementById("c1Codigo");

    const c1Perfil =
      document.getElementById("c1Perfil");

    const c1Victorias =
      document.getElementById("c1Victorias");

    const c1VidaBarra =
      document.getElementById("c1VidaBarra");

    const c1VidaTexto =
      document.getElementById("c1VidaTexto");

    const c1FatigaBarra =
      document.getElementById("c1FatigaBarra");

    const c1FatigaTexto =
      document.getElementById("c1FatigaTexto");

    const c1Estadisticas =
      document.getElementById("c1Estadisticas");

    const c1Estado =
      document.getElementById("c1Estado");


    const c2Nombre =
      document.getElementById("c2Nombre");

    const c2Codigo =
      document.getElementById("c2Codigo");

    const c2Perfil =
      document.getElementById("c2Perfil");

    const c2Victorias =
      document.getElementById("c2Victorias");

    const c2VidaBarra =
      document.getElementById("c2VidaBarra");

    const c2VidaTexto =
      document.getElementById("c2VidaTexto");

    const c2FatigaBarra =
      document.getElementById("c2FatigaBarra");

    const c2FatigaTexto =
      document.getElementById("c2FatigaTexto");

    const c2Estadisticas =
      document.getElementById("c2Estadisticas");

    const c2Estado =
      document.getElementById("c2Estado");


    const turnoActual =
      document.getElementById("turnoActual");

    const iniciativa =
      document.getElementById("iniciativa");

    const registro =
      document.getElementById("registro");

    const resultado =
      document.getElementById("resultado");

    const resultadoIcono =
      document.getElementById("resultadoIcono");

    const resultadoTitulo =
      document.getElementById("resultadoTitulo");

    const resultadoTexto =
      document.getElementById("resultadoTexto");

    const botonNuevoCombate =
      document.getElementById("botonNuevoCombate");


    async function cargarPaleofichas(){

      const respuesta =
        await fetch(RUTA_PALEOFICHAS);

      paleofichas =
        await respuesta.json();

    }


    async function cargarMaster(){

      const respuesta =
        await fetch(RUTA_MASTER);

      const texto =
        await respuesta.text();

      master =
        interpretarCSV(texto);

    }


    function interpretarCSV(texto){

      const lineas =
        texto
          .split(/\r?\n/)
          .filter(linea => linea.trim() !== "");

      if(!lineas.length){
        return [];
      }

      const cabeceras =
        separarCSV(lineas[0]);

      return lineas
        .slice(1)
        .map(linea => {

          const valores =
            separarCSV(linea);

          const objeto = {};

          cabeceras.forEach((cabecera, indice) => {
            objeto[cabecera] =
              valores[indice] ?? "";
          });

          return objeto;

        });

    }


    function separarCSV(linea){

      const resultado = [];
      let actual = "";
      let dentroComillas = false;

      for(let i = 0; i < linea.length; i++){

        const caracter =
          linea[i];

        if(caracter === '"'){

          if(
            dentroComillas &&
            linea[i + 1] === '"'
          ){

            actual += '"';
            i++;

          }else{

            dentroComillas =
              !dentroComillas;

          }

        }else if(
          caracter === "," &&
          !dentroComillas
        ){

          resultado.push(actual);
          actual = "";

        }else{

          actual += caracter;

        }

      }

      resultado.push(actual);

      return resultado;

    }


    function obtenerNombrePaleoficha(codigo){

      const ficha =
        paleofichas.find(
          ficha =>
            String(ficha.j1).trim() ===
            String(codigo).trim()
        );

      if(ficha){
        return ficha.j2 || "—";
      }

      const fila =
        master.find(
          fila =>
            String(fila.j1).trim() ===
            String(codigo).trim()
        );

      return fila
        ? (fila.j2 || "—")
        : "—";

    }


    function buscarFicha(codigo){

      const codigoLimpio =
        String(codigo)
          .trim();

      if(!codigoLimpio){
        return null;
      }

      const ficha =
        paleofichas.find(
          ficha =>
            String(ficha.j1).trim() ===
            codigoLimpio
        );

      if(ficha){
        return ficha;
      }

      return master.find(
        fila =>
          String(fila.j1).trim() ===
          codigoLimpio
      ) || null;

    }


    function actualizarNombre(input, elemento){

      const codigo =
        String(input.value)
          .trim();

      if(!codigo){

        elemento.textContent =
          "—";

        return;

      }

      elemento.textContent =
        obtenerNombrePaleoficha(codigo);

    }
        codigo1.addEventListener("input", function(){

      actualizarNombre(
        codigo1,
        nombre1
      );

    });


    codigo2.addEventListener("input", function(){

      actualizarNombre(
        codigo2,
        nombre2
      );

    });


    function obtenerReglasTorneo(){

      try{

        const guardado =
          localStorage.getItem(
            CLAVE_REGLAS_TORNEO
          );

        if(!guardado){

          return {
            ...REGLAS_TORNEO_DEFECTO
          };

        }

        const reglas =
          JSON.parse(guardado);

        return {
          ...REGLAS_TORNEO_DEFECTO,
          ...reglas
        };

      }catch(error){

        return {
          ...REGLAS_TORNEO_DEFECTO
        };

      }

    }


    function cargarReglasTorneo(){

      reglasTorneo =
        obtenerReglasTorneo();

      partidosSerie =
        Number(
          reglasTorneo.partidosSerie
        );

      if(
        !Number.isInteger(partidosSerie) ||
        partidosSerie < 1 ||
        partidosSerie % 2 === 0
      ){

        partidosSerie =
          REGLAS_TORNEO_DEFECTO.partidosSerie;

      }

      reglasTorneo.partidosSerie =
        partidosSerie;

      actualizarInterfazSerie();

    }


    function actualizarInterfazSerie(){

      if(serieActiva){

        serieFormato.textContent =
          "Mejor de " +
          partidosSerie;

        partidoActualElemento.textContent =
          "Partido " +
          partidoActual +
          " / " +
          partidosSerie;

      }else{

        serieFormato.textContent =
          "Mejor de —";

        partidoActualElemento.textContent =
          "Partido — / —";

      }

      c1Victorias.textContent =
        "🏆 Victorias: " +
        victorias1;

      c2Victorias.textContent =
        "🏆 Victorias: " +
        victorias2;

    }


    async function iniciarSerie(){

      cargarReglasTorneo();

      if(
        reglasTorneo.tipoCombate !==
        "standard"
      ){

        mensajeConfiguracion.textContent =
          "⚠️ El tipo de combate configurado en reglas.html no es standard.";

        return;

      }

      const ficha1 =
        buscarFicha(codigo1.value);

      const ficha2 =
        buscarFicha(codigo2.value);

      if(!ficha1 || !ficha2){

        mensajeConfiguracion.textContent =
          "⚠️ Introduce dos códigos de Paleoficha válidos.";

        return;

      }

      serieActiva = true;

      partidoActual = 0;

      victorias1 = 0;
      victorias2 = 0;

      victoriasNecesarias =
        Math.floor(partidosSerie / 2) + 1;

      resultado.style.display =
        "none";

      registro.innerHTML =
        "";

      actualizarInterfazSerie();

      iniciarSiguientePartido();

    }


    function iniciarSiguientePartido(){

      if(!serieActiva){
        return;
      }

      partidoActual++;

      actualizarInterfazSerie();

      prepararCombate();

    }


    async function prepararCombate(){

      const ficha1 =
        buscarFicha(codigo1.value);

      const ficha2 =
        buscarFicha(codigo2.value);

      if(!ficha1 || !ficha2){

        mensajeConfiguracion.textContent =
          "⚠️ Introduce dos códigos de Paleoficha válidos.";

        return;

      }

      if(
        typeof window.crearCombateEstandar !==
        "function"
      ){

        mensajeConfiguracion.textContent =
          "⚠️ No se ha encontrado el motor de combate estándar.";

        return;

      }

      try{

        combateActual =
          await window.crearCombateEstandar(
            ficha1,
            ficha2
          );

        mensajeConfiguracion.textContent =
          "";

        resultado.style.display =
          "none";

        mostrarCombatientes();

        registro.innerHTML =
          "";

        if(serieActiva){

          registro.innerHTML +=
            "<div>🏆 Serie — Partido " +
            partidoActual +
            " / " +
            partidosSerie +
            "</div>";

        }

        registro.innerHTML +=
          "<div>⚔️ Combate preparado.</div>";

        habilitarAcciones(true);

      }catch(error){

        console.error(error);

        mensajeConfiguracion.textContent =
          "⚠️ Error al preparar el combate.";

      }

    }


    function mostrarCombatientes(){

      if(!combateActual){
        return;
      }

      const c1 =
        combateActual.combatiente1;

      const c2 =
        combateActual.combatiente2;

      if(c1){

        c1Nombre.textContent =
          c1.nombre || "—";

        c1Codigo.textContent =
          c1.codigo || "—";

        c1Perfil.textContent =
          c1.perfil || "—";

      }

      if(c2){

        c2Nombre.textContent =
          c2.nombre || "—";

        c2Codigo.textContent =
          c2.codigo || "—";

        c2Perfil.textContent =
          c2.perfil || "—";

      }

      actualizarInterfazSerie();

      actualizarEstadoCombate();

    }


    function actualizarEstadoCombate(){

      if(!combateActual){
        return;
      }

      const c1 =
        combateActual.combatiente1;

      const c2 =
        combateActual.combatiente2;

      if(c1){

        actualizarVida(
          c1,
          c1VidaBarra,
          c1VidaTexto
        );

        actualizarFatiga(
          c1,
          c1FatigaBarra,
          c1FatigaTexto
        );

        actualizarEstadisticas(
          c1,
          c1Estadisticas
        );

        c1Estado.textContent =
          c1.estado || "—";

      }

      if(c2){

        actualizarVida(
          c2,
          c2VidaBarra,
          c2VidaTexto
        );

        actualizarFatiga(
          c2,
          c2FatigaBarra,
          c2FatigaTexto
        );

        actualizarEstadisticas(
          c2,
          c2Estadisticas
        );

        c2Estado.textContent =
          c2.estado || "—";

      }

      if(
        combateActual.turno !==
        undefined
      ){

        turnoActual.textContent =
          "Turno " +
          combateActual.turno;

      }

      if(
        combateActual.iniciativa !==
        undefined
      ){

        iniciativa.textContent =
          "Iniciativa " +
          combateActual.iniciativa;

      }

    }


    function actualizarVida(
      combatiente,
      barra,
      texto
    ){

      const vida =
        Number(
          combatiente.vida ??
          combatiente.hp ??
          0
        );

      const vidaMax =
        Number(
          combatiente.vidaMax ??
          combatiente.hpMax ??
          combatiente.vida_max ??
          vida
        );

      const porcentaje =
        vidaMax > 0
          ? Math.max(
              0,
              Math.min(
                100,
                (vida / vidaMax) * 100
              )
            )
          : 0;

      barra.style.width =
        porcentaje + "%";

      texto.textContent =
        "❤️ " +
        vida +
        " / " +
        vidaMax;

    }


    function actualizarFatiga(
      combatiente,
      barra,
      texto
    ){

      const fatiga =
        Number(
          combatiente.fatiga ??
          0
        );

      const fatigaMax =
        Number(
          combatiente.fatigaMax ??
          combatiente.fatiga_max ??
          100
        );

      const porcentaje =
        fatigaMax > 0
          ? Math.max(
              0,
              Math.min(
                100,
                (fatiga / fatigaMax) * 100
              )
            )
          : 0;

      barra.style.width =
        porcentaje + "%";

      texto.textContent =
        "⚡ " +
        fatiga +
        " / " +
        fatigaMax;

    }


    function actualizarEstadisticas(
      combatiente,
      elemento
    ){

      const estadisticas =
        combatiente.estadisticas ||
        combatiente.stats;

      if(!estadisticas){

        elemento.textContent =
          "";

        return;

      }

      elemento.innerHTML =
        Object.entries(estadisticas)
          .map(
            ([clave, valor]) =>
              "<div>" +
              clave +
              ": " +
              valor +
              "</div>"
          )
          .join("");

    }


    function habilitarAcciones(habilitar){

      document
        .querySelectorAll(
          "#acciones button"
        )
        .forEach(
          boton =>
            boton.disabled =
              !habilitar
        );

        }
        async function ejecutarAccionManual(codigoAccion){

      if(!combateActual){
        return;
      }

      try{

        const resultadoAccion =
          await window.PALARENA_STANDAR.ejecutarAccion(
            combateActual,
            codigoAccion
          );

        if(resultadoAccion){

          mostrarResultadoAccion(
            resultadoAccion
          );

        }

        actualizarEstadoCombate();

        if(
          combateActual.finalizado ||
          combateActual.terminado
        ){

          finalizarInterfaz();

        }

      }catch(error){

        console.error(error);

        registro.innerHTML +=
          "<div>⚠️ Error al ejecutar la acción.</div>";

      }

    }


    function mostrarResultadoAccion(
      resultadoAccion
    ){

      if(!registro){
        return;
      }

      if(
        typeof resultadoAccion ===
        "string"
      ){

        registro.innerHTML +=
          "<div>" +
          resultadoAccion +
          "</div>";

        return;

      }

      if(
        resultadoAccion.mensaje
      ){

        registro.innerHTML +=
          "<div>" +
          resultadoAccion.mensaje +
          "</div>";

      }

    }


    async function ejecutarTurnoAutomatico(){

      if(!combateActual){
        return;
      }

      try{

        const resultadoTurno =
          await window.ejecutarTurnoEstandar(
            combateActual
          );

        if(resultadoTurno){

          mostrarResultadoAccion(
            resultadoTurno
          );

        }

        actualizarEstadoCombate();

        if(
          combateActual.finalizado ||
          combateActual.terminado
        ){

          finalizarInterfaz();

          return;

        }

      }catch(error){

        console.error(error);

        registro.innerHTML +=
          "<div>⚠️ Error durante el combate automático.</div>";

      }

    }


    function finalizarInterfaz(){

      habilitarAcciones(false);

      if(serieActiva){

        finalizarPartidoSerie();

        return;

      }

      mostrarResultadoFinal();

    }


    function obtenerGanadorCombate(){

      if(!combateActual){
        return null;
      }

      if(
        combateActual.ganador
      ){

        return combateActual.ganador;

      }

      if(
        combateActual.resultado &&
        combateActual.resultado.ganador
      ){

        return combateActual.resultado.ganador;

      }

      const c1 =
        combateActual.combatiente1;

      const c2 =
        combateActual.combatiente2;

      if(
        c1 &&
        Number(c1.vida ?? c1.hp ?? 0) <= 0
      ){

        return c2;

      }

      if(
        c2 &&
        Number(c2.vida ?? c2.hp ?? 0) <= 0
      ){

        return c1;

      }

      return null;

    }


    function mostrarResultadoFinal(){

      const ganador =
        obtenerGanadorCombate();

      resultado.style.display =
        "";

      if(!ganador){

        resultadoIcono.textContent =
          "⚖️";

        resultadoTitulo.textContent =
          "Combate finalizado";

        resultadoTexto.textContent =
          "No se ha podido determinar un ganador.";

        return;

      }

      resultadoIcono.textContent =
        "🏆";

      resultadoTitulo.textContent =
        "Ganador";

      resultadoTexto.textContent =
        ganador.nombre ||
        ganador.codigo ||
        "—";

    }


    function finalizarPartidoSerie(){

      const ganador =
        obtenerGanadorCombate();

      if(!ganador){

        resultado.style.display =
          "";

        resultadoIcono.textContent =
          "⚖️";

        resultadoTitulo.textContent =
          "Partido finalizado";

        resultadoTexto.textContent =
          "No se ha podido determinar el ganador del partido.";

        return;

      }

      const codigoGanador =
        String(
          ganador.codigo ??
          ganador.j1 ??
          ""
        ).trim();

      const codigoJugador1 =
        String(
          codigo1.value
        ).trim();

      const codigoJugador2 =
        String(
          codigo2.value
        ).trim();

      if(
        codigoGanador ===
        codigoJugador1
      ){

        victorias1++;

      }else if(
        codigoGanador ===
        codigoJugador2
      ){

        victorias2++;

      }else{

        const nombreGanador =
          String(
            ganador.nombre ||
            ""
          ).trim();

        const nombreJugador1 =
          obtenerNombrePaleoficha(
            codigoJugador1
          );

        const nombreJugador2 =
          obtenerNombrePaleoficha(
            codigoJugador2
          );

        if(
          nombreGanador ===
          nombreJugador1
        ){

          victorias1++;

        }else if(
          nombreGanador ===
          nombreJugador2
        ){

          victorias2++;

        }

      }

      actualizarInterfazSerie();

      if(
        victorias1 >=
        victoriasNecesarias
      ){

        mostrarResultadoSerie(
          1,
          ganador
        );

        serieActiva = false;

        return;

      }

      if(
        victorias2 >=
        victoriasNecesarias
      ){

        mostrarResultadoSerie(
          2,
          ganador
        );

        serieActiva = false;

        return;

      }

      mostrarResultadoPartidoSerie(
        ganador
      );

    }


    function mostrarResultadoPartidoSerie(
      ganador
    ){

      resultado.style.display =
        "";

      resultadoIcono.textContent =
        "🏆";

      resultadoTitulo.textContent =
        "Ganador del partido";

      resultadoTexto.textContent =
        (
          ganador.nombre ||
          ganador.codigo ||
          "—"
        ) +
        " gana el partido " +
        victorias1 +
        " - " +
        victorias2 +
        ".";

      botonNuevoCombate.textContent =
        "▶️ Siguiente partido";

    }


    function mostrarResultadoSerie(
      numeroGanador,
      ganador
    ){

      resultado.style.display =
        "";

      resultadoIcono.textContent =
        "🏆";

      resultadoTitulo.textContent =
        "🏆 Ganador de la serie — Mejor de " +
        partidosSerie;

      let nombreGanador =
        ganador.nombre ||
        ganador.codigo ||
        "—";

      resultadoTexto.textContent =
        nombreGanador +
        " gana la serie " +
        victorias1 +
        " - " +
        victorias2 +
        ".";

      botonNuevoCombate.textContent =
        "🔄 Nueva serie";

      registro.innerHTML +=
        "<div>🏆 Serie finalizada: " +
        nombreGanador +
        " — " +
        victorias1 +
        " - " +
        victorias2 +
        "</div>";

    }

      );


    document
      .getElementById("botonAuto")
      .addEventListener(
        "click",
        async function(){

          if(!combateActual){
            return;
          }

          habilitarAcciones(false);

          while(
            combateActual &&
            !combateActual.finalizado &&
            !combateActual.terminado
          ){

            await ejecutarTurnoAutomatico();

            if(
              combateActual.finalizado ||
              combateActual.terminado
            ){

              break;

            }

          }

          if(
            combateActual &&
            (
              combateActual.finalizado ||
              combateActual.terminado
            )
          ){

            finalizarInterfaz();

          }else{

            habilitarAcciones(true);

          }

        }
      );


    botonPreparar.addEventListener(
      "click",
      function(){

        prepararCombate();

      }
    );


    botonSerie.addEventListener(
      "click",
      function(){

        iniciarSerie();

      }
    );
       botonNuevoCombate.addEventListener(
      "click",
      function(){

        if(
          serieActiva &&
          (
            victorias1 <
            victoriasNecesarias
          ) &&
          (
            victorias2 <
            victoriasNecesarias
          )
        ){

          resultado.style.display =
            "none";

          registro.innerHTML =
            "";

          iniciarSiguientePartido();

          return;

        }

        serieActiva = false;

        partidoActual = 0;

        victorias1 = 0;
        victorias2 = 0;

        victoriasNecesarias = 1;

        combateActual = null;

        resultado.style.display =
          "none";

        registro.innerHTML =

        botonNuevoCombate.textContent =
          "🔄 Nuevo combate";

        actualizarInterfazSerie();

      }
    );


    async function iniciar(){

      try{

        habilitarAcciones(false);

        resultado.style.display =
          "none";

        await cargarPaleofichas();

        await cargarMaster();

        cargarReglasTorneo();

        actualizarNombre(
          codigo1,
          nombre1
        );

        actualizarNombre(
          codigo2,
          nombre2
        );

      }catch(error){

        console.error(error);

        mensajeConfiguracion.textContent =
          "⚠️ No se han podido cargar los datos.";

      }

    }


    iniciar();
