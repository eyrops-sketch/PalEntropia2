/* =============================== */
/* CARGAR PALEOFICHAS               */
/* =============================== */

async function cargarPaleofichas(){

  try{

    const respuesta =
      await fetch(
        RUTA_PALEOFICHAS
      );

    if(
      !respuesta.ok
    ){

      throw new Error(
        "No se pudo cargar paleofichas.json"
      );

    }

    fichas =
      await respuesta.json();

    nombresPaleofichas = {};

    fichas.forEach(
      function(ficha){

        if(
          ficha &&
          ficha.j1 &&
          ficha.j2
        ){

          nombresPaleofichas[
            String(
              ficha.j1
            ).trim()
          ] =
            ficha.j2;

        }

      }
    );

    actualizarNombre(
      codigo1,
      nombre1
    );

    actualizarNombre(
      codigo2,
      nombre2
    );

  }catch(error){

    console.error(
      error
    );

    mostrarMensaje(
      "❌ Error cargando las Paleofichas."
    );

  }

}



/* =============================== */
/* CARGAR MASTER                    */
/* =============================== */

async function cargarMaster(){

  try{

    const respuesta =
      await fetch(
        RUTA_MASTER
      );

    if(
      !respuesta.ok
    ){

      throw new Error(
        "No se pudo cargar master.csv"
      );

    }

    const texto =
      await respuesta.text();

    fichas =
      interpretarCSV(
        texto
      );

  }catch(error){

    console.error(
      error
    );

    mostrarMensaje(
      "❌ Error cargando master.csv."
    );

  }

}



/* =============================== */
/* INTERPRETAR CSV                  */
/* =============================== */

function interpretarCSV(
  texto
){

  const lineas =
    texto
      .split(/\r?\n/)
      .filter(
        function(linea){

          return linea.trim() !== "";

        }
      );

  if(
    !lineas.length
  ){

    return [];

  }

  const cabecera =
    separarCSV(
      lineas[0]
    );

  const datos = [];

  for(
    let i = 1;
    i < lineas.length;
    i++
  ){

    const valores =
      separarCSV(
        lineas[i]
      );

    const objeto = {};

    cabecera.forEach(
      function(campo,indice){

        objeto[campo] =
          valores[indice] !== undefined
            ? valores[indice]
            : "";

      }
    );

    datos.push(
      objeto
    );

  }

  return datos;

}



/* =============================== */
/* SEPARAR CSV                     */
/* =============================== */

function separarCSV(
  linea
){

  const resultado = [];

  let actual = "";

  let dentroComillas =
    false;

  for(
    let i = 0;
    i < linea.length;
    i++
  ){

    const caracter =
      linea[i];

    if(
      caracter === '"'
    ){

      if(
        dentroComillas &&
        linea[i + 1] === '"'
      ){

        actual += '"';

        i++;

      }else{

        dentroComillas =
          !dentroComillas;

      }

    }else if(
      caracter === "," &&
      !dentroComillas
    ){

      resultado.push(
        actual.trim()
      );

      actual = "";

    }else{

      actual +=
        caracter;

    }

  }

  resultado.push(
    actual.trim()
  );

  return resultado;

}



/* =============================== */
/* NOMBRE PALEOFICHA                */
/* =============================== */

function obtenerNombrePaleoficha(
  codigo
){

  const clave =
    String(
      codigo || ""
    ).trim();

  if(
    nombresPaleofichas[
      clave
    ]
  ){

    return nombresPaleofichas[
      clave
    ];

  }

  const ficha =
    fichas.find(
      function(item){

        return String(
          item.j1 || ""
        ).trim() === clave;

      }
    );

  if(
    ficha &&
    ficha.j2
  ){

    return ficha.j2;

  }

  return "Paleoficha no encontrada";

}



/* =============================== */
/* BUSCAR FICHA                    */
/* =============================== */

function buscarFicha(
  codigo
){

  const clave =
    String(
      codigo || ""
    ).trim();

  return fichas.find(
    function(ficha){

      return String(
        ficha.j1 || ""
      ).trim() === clave;

    }
  ) || null;

}



/* =============================== */
/* ACTUALIZAR NOMBRE                */
/* =============================== */

function actualizarNombre(
  input,
  elemento
){

  const codigo =
    String(
      input.value || ""
    ).trim();

  if(
    !codigo
  ){

    elemento.textContent =
      "";

    return;

  }

  elemento.textContent =
    obtenerNombrePaleoficha(
      codigo
    );

}



/* =============================== */
/* PREPARAR COMBATE                 */
/* =============================== */

    !ficha1

  if(
    !ficha2

      "❌ No se encontró la Paleoficha 2."
    );

    return;

  }


  try{

    combate =

        ficha1,
        ficha2
      );


    combatiente1 =
      combate.combatiente1;

    combatiente2 =
      combate.combatiente2;

    combateActivo =

    activarBotones();

      combatiente1.nombre +
      " (" +
      combatiente1.codigo +
      ")" +
      " vs " +
      combatiente2.nombre +
      " (" +
      combatiente2.codigo +
      ")"
    );


    mostrarMensaje(
      "Combate preparado correctamente."
    );

  }catch(error){

    console.error(
      error
    );

    mostrarMensaje(
      "❌ Error preparando el combate."
    );

  }

}

/* =============================== */

function obtenerNombrePerfil(

){

  const perfiles = {

    agresivo:
      "🔥 Agresivo",

    defensivo:
      "🛡️ Defensivo",

    rapido:
      "⚡ Rápido",

    aguante:
      "💪 Aguante",

    tactico:
      "🎯 Táctico",

    equilibrado:
      "⚖️ Equilibrado"

  };

  return perfiles[
    perfil
  ] ||
  perfil ||
  "—";

}



/* =============================== */
/* MOSTRAR VIDA                     */
/* =============================== */

function mostrarVida(
  combatiente,
  texto,
  barra
){

  const vida =
    obtenerNumero(
      combatiente.vida
    );

  const vidaMax =
    obtenerNumero(
      combatiente.vida_max
    );

  const porcentaje =
    vidaMax > 0
      ? Math.max(
          0,
          Math.min(
            100,
            (vida / vidaMax) * 100
          )
        )
      : 0;


  texto.textContent =
    Math.round(
      vida
    ) +
    " / " +
    Math.round(
      vidaMax
    );


  barra.style.width =
    porcentaje + "%";

}

/* MOSTRAR FATIGA                   */

      combatiente.fatiga

    fatigaMax > 0

          Math.min(
            100,

  texto.textContent =

      "<span>Táctica</span>" +
      "<strong>" +
        Math.round(
          obtenerNumero(
            stats.tactica
          )
        ) +
      "</strong>" +
    "</div>" +

    "<div>" +
      "<span>Inteligencia</span>" +
      "<strong>" +
        Math.round(
          obtenerNumero(
            stats.inteligencia
          )
        ) +
      "</strong>" +
    "</div>";

}



/* =============================== */
/* OBTENER NÚMERO                   */
/* =============================== */

function obtenerNumero(
  valor
){

  const numero =
    Number(
      valor
    );

  return Number.isFinite(
    numero
  )
    ? numero
    : 0;

}



/* =============================== */
/* MOSTRAR ESTADO                   */
/* =============================== */

function mostrarEstado(
  combatiente,
  elemento
){

  if(
    !combatiente
  ){

    elemento.textContent =
      "—";

    return;

  }


  if(
    combatiente.derrotado
  ){

    elemento.textContent =
      "💀 Derrotado";

    return;

  }


  if(
    combatiente.defendiendo
  ){

    elemento.textContent =
      "🛡️ Defendiendo";

    return;

  }


  elemento.textContent =
    "🟢 En combate";

}



/* =============================== */
/* ACTIVAR BOTONES                  */
/* =============================== */

function activarBotones(){

  botonA001.disabled =
    false;


  /*
     A002 solamente está
     disponible con 50 % o más
     de fatiga.
  */

  botonA002.disabled =
    Number(
      combatiente1.fatiga
    ) <
    window.PALARENA_STANDAR
      .configuracion
      .fatiga_minima_ataque_potente;


  botonA003.disabled =
    false;


  botonD001.disabled =
    false;


  botonAuto.disabled =
    false;

}



/* =============================== */
/* DESACTIVAR BOTONES               */
/* =============================== */

function desactivarBotones(){

  botonA001.disabled =
    true;

  botonA002.disabled =
    true;

  botonA003.disabled =
    true;

  botonD001.disabled =
    true;

  botonAuto.disabled =
    true;

}



/* =============================== */
/* ACCIÓN DEL JUGADOR               */
/* =============================== */

function ejecutarAccionJugador(
  codigo
){

  if(
    !combateActivo ||
    !combate ||
    !combatiente1 ||
    !combatiente2
  ){

    return;

  }


  /*
     Protección adicional para A002.
     Aunque el botón esté desactivado,
     también se comprueba aquí para
     impedir su ejecución directa.
  */

  if(
    codigo === "A002" &&
    Number(
      combatiente1.fatiga
    ) <
    window.PALARENA_STANDAR
      .configuracion
      .fatiga_minima_ataque_potente
  ){

    añadirRegistro(
      "😓 Ataque potente bloqueado: fatiga insuficiente."
    );

    activarBotones();

    return;

  }


  desactivarBotones();


  try{

    const atacante =
      combatiente1;

    const objetivo =
      combatiente2;


    const resultadoJugador =
      window.PALARENA_STANDAR
        .ejecutarAccion(
          atacante,
          objetivo,
          codigo
        );


    procesarResultado(
      resultadoJugador,
      combatiente1,
      combatiente2
    );


    if(
      combatiente2.derrotado ||
      obtenerNumero(
        combatiente2.vida
      ) <= 0
    ){

      finalizarInterfaz({

        ganador:
          combatiente1

      });

      return;

    }


    /*
       Turno de la IA.
    */

    const accionIA =
      window.PALARENA_STANDAR
        .decidirAccion(
          combatiente2,
          combatiente1
        );


    const resultadoIA =
      window.PALARENA_STANDAR
        .ejecutarAccion(
          combatiente2,
          combatiente1,
          accionIA
        );


    procesarResultado(
      resultadoIA,
      combatiente2,
      combatiente1
    );


    if(
      combatiente1.derrotado ||
      obtenerNumero(
        combatiente1.vida
      ) <= 0
    ){

      finalizarInterfaz({

        ganador:
          combatiente2

      });

      return;

    }


    /*
       Regeneración de fatiga
       al finalizar el turno.
    */

    if(
      typeof window.PALARENA_STANDAR
        .regenerarFatiga ===
      "function"
    ){

      window.PALARENA_STANDAR
        .regenerarFatiga(
          combatiente1
        );

      window.PALARENA_STANDAR
        .regenerarFatiga(
          combatiente2
        );

    }


    combatiente1.defendiendo =
      false;

    combatiente2.defendiendo =
      false;


    combate.turno++;


    mostrarCombatientes();


    /*
       Actualiza el estado del botón
       A002 después de la regeneración
       de fatiga.
    */

    activarBotones();


  }catch(error){

    console.error(
      error
    );

    añadirRegistro(
      "❌ Error ejecutando la acción."
    );

    activarBotones();

  }

}

</script>
<script>

/* =============================== */
/* PROCESAR RESULTADO               */
/* =============================== */

function procesarResultado(
  resultado,
  atacante,
  objetivo
){

  if(
    !resultado
  ){

    return;

  }


  if(
    resultado.mensaje
  ){

    añadirRegistro(
      resultado.mensaje
    );

  }


  if(
    resultado.daño !== undefined
  ){

    añadirRegistro(
      "💥 Daño: " +
      resultado.daño
    );

  }


  if(
    resultado.critico
  ){

    añadirRegistro(
      "💢 ¡Golpe crítico!"
    );

  }


  if(
    resultado.mortal
  ){

    añadirRegistro(
      "☠️ ¡Golpe mortal!"
    );

  }


  if(
    resultado.inversion
  ){

    añadirRegistro(
      "🔄 ¡Inversión!"
    );

  }


  if(
    resultado.contraataque
  ){

    añadirRegistro(
      "⚔️ ¡Contraataque!"
    );

  }


  if(
    resultado.defensa
  ){

    if(
      resultado.defensa.acierto
    ){

      añadirRegistro(
        "🛡️ Defensa efectiva."
      );

    }else{

      añadirRegistro(
        "🛡️ Defensa superada."
      );

    }

  }


  if(
    resultado.fallo
  ){

    añadirRegistro(
      "❌ El ataque falló."
    );

  }


  if(
    resultado.bloqueado_por_fatiga
  ){

    añadirRegistro(
      "😓 Acción bloqueada por fatiga."
    );

  }


  if(
    resultado.esquiva
  ){

    añadirRegistro(
      "💨 ¡Ataque esquivado!"
    );

  }


  if(
    resultado.efecto
  ){

    if(
      typeof resultado.efecto ===
      "string"
    ){

      añadirRegistro(
        "✨ Efecto: " +
        resultado.efecto
      );

    }else if(
      resultado.efecto.nombre
    ){

      añadirRegistro(
        "✨ Efecto: " +
        resultado.efecto.nombre
      );

    }

  }


  /*
     El motor puede devolver
     uno o varios registros.
  */

  if(
    Array.isArray(
      resultado.registro
    )
  ){

    resultado.registro.forEach(
      function(linea){

        añadirRegistro(
          linea
        );

      }
    );

  }else if(
    resultado.registro
  ){

    añadirRegistro(
      resultado.registro
    );

  }


  mostrarCombatientes();

}



/* =============================== */
/* BOTONES DE ACCIÓN                */
/* =============================== */

botonA001.addEventListener(
  "click",
  function(){

    ejecutarAccionJugador(
      "A001"
    );

  }
);


botonA002.addEventListener(
  "click",
  function(){

    ejecutarAccionJugador(
      "A002"
    );

  }
);


botonA003.addEventListener(
  "click",

    ejecutarAccionJugador(
      "A003"
    );

  }
);


botonD001.addEventListener(
  "click",
  function(){

    ejecutarAccionJugador(
      "D001"
    );

  }
);


botonAuto.addEventListener(
  "click",
  ejecutarCombateAutomatico
);



/* =============================== */
/* COMBATE AUTOMÁTICO               */
/* =============================== */

function ejecutarCombateAutomatico(){

  if(
    !combateActivo ||
    !combate
  ){

    return;

  }


  desactivarBotones();


  try{

    let resultadoTurno;


    while(
      combate.estado !==
      "finalizado"
    ){

      resultadoTurno =
        window.ejecutarTurnoEstandar(
          combate
        );


      if(
        resultadoTurno
      ){

        procesarTurnoAutomatico(
          resultadoTurno
        );

      }

    }


    mostrarCombatientes();


    mostrarResultadoCombate({

      ganador:
        combate.ganador ===
        combatiente1.codigo
          ? combatiente1
          : combatiente2

    });


    combateActivo =
      false;


  }catch(error){

    console.error(
      error
    );


    añadirRegistro(
      "❌ Error durante el combate automático."
    );


    activarBotones();

  }

}



/* =============================== */
/* PROCESAR TURNO AUTOMÁTICO       */
/* =============================== */

function procesarTurnoAutomatico(
  resultado
){

  if(
    !resultado
  ){

    return;

  }


  if(
    resultado.turno !== undefined
  ){

    añadirRegistro(
      "🔄 Turno " +
      resultado.turno
    );

  }


  /*
     Primera acción del turno.
  */

  if(
    resultado.primero
  ){

    procesarResultado(
      resultado.primero,
      resultado.primero.atacante ||
      combatiente1,
      resultado.primero.objetivo ||
      combatiente2
    );

  }


  /*
     Segunda acción del turno.
  */

  if(
    resultado.segundo
  ){

    procesarResultado(
      resultado.segundo,
      resultado.segundo.atacante ||
      combatiente2,
      resultado.segundo.objetivo ||
      combatiente1
    );

  }


  mostrarCombatientes();

}

      </script>
<script>

/* =============================== */
/* FINALIZAR INTERFAZ               */
/* =============================== */

function finalizarInterfaz(
  resultado
){

  combateActivo =
    false;


  desactivarBotones();


  mostrarResultadoCombate(
    resultado
  );

}



/* =============================== */
/* MOSTRAR RESULTADO                 */
/* =============================== */

function mostrarResultadoCombate(
  resultado
){

  let ganador = null;


  /*
     Si el motor devuelve el código
     del combatiente ganador,
     lo convertimos en el objeto
     correspondiente.
  */

  if(
    resultado &&
    typeof resultado.ganador ===
    "string"
  ){

    if(
      window.PALARENA_STANDAR &&
      typeof window.PALARENA_STANDAR
        .obtenerCombatiente ===
      "function"
    ){

      ganador =
        window.PALARENA_STANDAR
          .obtenerCombatiente(
            combate,
            resultado.ganador
          );

    }

  }else if(
    resultado &&
    resultado.ganador
  ){

    ganador =
      resultado.ganador;

  }


  /*
     Si todavía no se ha localizado
     el ganador, se utiliza el
     ganador almacenado en el combate.
  */

  if(
    !ganador &&
    combate &&
    combate.ganador
  ){

    if(
      combate.ganador ===
      combatiente1.codigo
    ){

      ganador =
        combatiente1;

    }else if(
      combate.ganador ===
      combatiente2.codigo
    ){

      ganador =
        combatiente2;

    }

  }


  /*
     Último respaldo:
     comprobar directamente
     el estado de los combatientes.
  */

  if(
    !ganador &&
    combatiente1 &&
    (
      combatiente2.derrotado ||
      obtenerNumero(
        combatiente2.vida
      ) <= 0
    )
  ){

    ganador =
      combatiente1;

  }


  if(
    !ganador &&
    combatiente2 &&
    (
      combatiente1.derrotado ||
      obtenerNumero(
        combatiente1.vida
      ) <= 0
    )
  ){

    ganador =
      combatiente2;

  }


  if(
    ganador
  ){

    resultadoIcono.textContent =
      "🏆";

    resultadoTitulo.textContent =
      "¡Combate finalizado!";

    resultadoTexto.innerHTML =

      "<strong>" +
      ganador.nombre +
      "</strong>" +

      " (" +
      ganador.codigo +
      ")" +

      "<br><br>" +

      "🏆 ¡Ha ganado el combate!";

  }else{

    resultadoIcono.textContent =
      "⚔️";

    resultadoTitulo.textContent =
      "Combate finalizado";

    resultadoTexto.textContent =
      "El combate ha terminado.";

  }


  resultado.classList.remove(
    "resultado-oculto"
  );


  mostrarCombatientes();

}



/* =============================== */
/* LIMPIAR REGISTRO                 */
/* =============================== */

function limpiarRegistro(){

  registroCombate.innerHTML =
    "";

}



/* =============================== */
/* AÑADIR REGISTRO                  */
/* =============================== */

function añadirRegistro(
  texto
){

  if(
    !texto
  ){

    return;

  }


  const linea =
    document.createElement(
      "div"
    );


  linea.className =
    "registro-linea";


  linea.textContent =
    texto;


  registroCombate.appendChild(
    linea
  );


  /*
     Mantiene visible siempre
     la parte más reciente
     del combate.
  */

  registroCombate.scrollTop =
    registroCombate.scrollHeight;

}



/* =============================== */
/* MOSTRAR MENSAJE                  */
/* =============================== */

function mostrarMensaje(
  texto
){

  if(
    !texto
  ){

    return;

  }


  añadirRegistro(
    texto
  );

}

      </script>
