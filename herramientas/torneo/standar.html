<script>

const RUTA_MASTER =
  "../generador_fase_2/master.csv";

const RUTA_PALEOFICHAS =
  "../generador_fase_2/paleofichas.json";


let datosMaster = [];

let datosPaleofichas = [];

let combatiente1 = null;

let combatiente2 = null;

let combateActivo = false;

let serieActiva = false;

let victorias1 = 0;

let victorias2 = 0;

let victoriasNecesarias = 2;



/* ================================= */
/* CARGA DE DATOS                     */
/* ================================= */

async function cargarDatos() {

  try {

    const respuestaMaster =
      await fetch(RUTA_MASTER);

    const textoMaster =
      await respuestaMaster.text();

    datosMaster =
      parsearCSV(textoMaster);


    const respuestaPaleofichas =
      await fetch(RUTA_PALEOFICHAS);

    datosPaleofichas =
      await respuestaPaleofichas.json();


    console.log(
      "Datos cargados correctamente."
    );

  } catch (error) {

    console.error(
      "Error cargando los datos:",
      error
    );

  }

}



/* ================================= */
/* PARSEAR CSV                       */
/* ================================= */

function parsearCSV(texto) {

  const lineas =
    texto
      .trim()
      .split(/\r?\n/);

  if (!lineas.length) {

    return [];

  }


  const cabeceras =
    lineas[0]
      .split(",")
      .map(
        campo => campo.trim()
      );


  return lineas
    .slice(1)
    .map(linea => {

      const valores =
        linea.split(",");

      const objeto = {};

      cabeceras.forEach(
        (cabecera, indice) => {

          objeto[cabecera] =
            valores[indice]
              ? valores[indice].trim()
              : "";

        }
      );

      return objeto;

    });

}



/* ================================= */
/* BUSCAR FICHA                      */
/* ================================= */

function buscarFicha(codigo) {

  const codigoNormalizado =
    codigo
      .trim()
      .toUpperCase();


  const fila =
    datosMaster.find(
      dato =>
        String(dato.j1)
          .trim()
          .toUpperCase() ===
        codigoNormalizado
    );


  if (!fila) {

    return null;

  }


  const ficha =
    datosPaleofichas.find(
      dato =>
        String(dato.j1)
          .trim()
          .toUpperCase() ===
        codigoNormalizado
    );


  return {

    ...fila,

    ...(ficha || {})

  };

}



/* ================================= */
/* MOSTRAR NOMBRES EN CONFIGURACIÓN  */
/* ================================= */

function actualizarNombreConfig(
  input,
  salida
) {

  const codigo =
    input.value
      .trim()
      .toUpperCase();


  if (!codigo) {

    salida.textContent =
      "—";

    return;

  }


  const ficha =
    buscarFicha(codigo);


  if (ficha) {

    salida.textContent =
      ficha.j2 || "—";

  } else {

    salida.textContent =
      "Código no encontrado";

  }

}



/* ================================= */
/* ELEMENTOS DE CONFIGURACIÓN         */
/* ================================= */

const codigo1 =
  document.getElementById(
    "codigo1"
  );

const codigo2 =
  document.getElementById(
    "codigo2"
  );

const nombre1 =
  document.getElementById(
    "nombre1"
  );

const nombre2 =
  document.getElementById(
    "nombre2"
  );


codigo1.addEventListener(
  "input",
  () =>
    actualizarNombreConfig(
      codigo1,
      nombre1
    )
);


codigo2.addEventListener(
  "input",
  () =>
    actualizarNombreConfig(
      codigo2,
      nombre2
    )
);



/* ================================= */
/* PREPARAR COMBATE                   */
/* ================================= */

document
  .getElementById("botonPreparar")
  .addEventListener(
    "click",
    prepararCombate
  );


function prepararCombate() {

  const valor1 =
    codigo1.value
      .trim()
      .toUpperCase();

  const valor2 =
    codigo2.value
      .trim()
      .toUpperCase();


  if (!valor1 || !valor2) {

    alert(
      "Introduce los dos códigos."
    );

    return;

  }


  if (valor1 === valor2) {

    alert(
      "Los combatientes deben ser diferentes."
    );

    return;

  }


  const ficha1 =
    buscarFicha(valor1);

  const ficha2 =
    buscarFicha(valor2);


  if (!ficha1) {

    alert(
      "No se encuentra el combatiente 1."
    );

    return;

  }


  if (!ficha2) {

    alert(
      "No se encuentra el combatiente 2."
    );

    return;

  }


  const reglas =
    obtenerReglasCombate();


  combatiente1 =
    window.crearCombateEstandar(
      ficha1,
      ficha2,
      reglas
    );


  combatiente2 =
    combatiente1
      ? combatiente1.combatiente2
      : null;


  if (
    !combatiente1 ||
    !combatiente2
  ) {

    console.error(
      "No se pudieron crear los combatientes."
    );

    return;

  }


  combateActivo =
    true;


  mostrarCombatientes();

  activarBotones();

  limpiarRegistro();


  /*
   * =====================================
   * NUEVO
   * =====================================
   *
   * Después de preparar el combate,
   * cargamos las imágenes i3 mediante:
   *
   * botonPreparar
   *      ↓
   * cargarImagenesCombatientesAsync
   *      ↓
   * BUSCARUTA.buscar()
   *      ↓
   * imagen i3
   *
   */

  if (
    window.cargarImagenesCombatientesAsync
  ) {

    window.cargarImagenesCombatientesAsync(
      valor1,
      valor2
    );

  }


  añadirRegistro(
    "⚔️ Combate preparado correctamente."
  );

}
    /* ================================= */
/* REGLAS DEL COMBATE                 */
/* ================================= */

function obtenerReglasCombate() {

  if (
    window.obtenerReglasEstandar
  ) {

    return window.obtenerReglasEstandar();

  }


  return {};

}



/* ================================= */
/* MOSTRAR COMBATIENTES               */
/* ================================= */

function mostrarCombatientes() {

  if (
    !combatiente1 ||
    !combatiente2
  ) {

    return;

  }


  /* ================================= */
  /* COMBATIENTE 1                     */
  /* ================================= */

  document
    .getElementById("c1Nombre")
    .textContent =
      combatiente1.nombre || "—";


  document
    .getElementById("c1Codigo")
    .textContent =
      combatiente1.codigo || "—";


  document
    .getElementById("c1Perfil")
    .textContent =
      combatiente1.perfil || "—";


  document
    .getElementById("c1Victorias")
    .textContent =
      victorias1;


  /* ================================= */
  /* VIDA 1                            */
  /* ================================= */

  actualizarVida(
    1,
    combatiente1
  );


  /* ================================= */
  /* FATIGA 1                          */
  /* ================================= */

  actualizarFatiga(
    1,
    combatiente1
  );


  /* ================================= */
  /* STATS 1                           */
  /* ================================= */

  mostrarStats(
    1,
    combatiente1
  );


  /* ================================= */
  /* ESTADO 1                          */
  /* ================================= */

  document
    .getElementById("c1Estado")
    .textContent =
      combatiente1.estado ||
      "Preparado";



  /* ================================= */
  /* COMBATIENTE 2                     */
  /* ================================= */

  document
    .getElementById("c2Nombre")
    .textContent =
      combatiente2.nombre || "—";


  document
    .getElementById("c2Codigo")
    .textContent =
      combatiente2.codigo || "—";


  document
    .getElementById("c2Perfil")
    .textContent =
      combatiente2.perfil || "—";


  document
    .getElementById("c2Victorias")
    .textContent =
      victorias2;


  /* ================================= */
  /* VIDA 2                            */
  /* ================================= */

  actualizarVida(
    2,
    combatiente2
  );


  /* ================================= */
  /* FATIGA 2                          */
  /* ================================= */

  actualizarFatiga(
    2,
    combatiente2
  );


  /* ================================= */
  /* STATS 2                           */
  /* ================================= */

  mostrarStats(
    2,
    combatiente2
  );


  /* ================================= */
  /* ESTADO 2                          */
  /* ================================= */

  document
    .getElementById("c2Estado")
    .textContent =
      combatiente2.estado ||
      "Preparado";


  actualizarTurno();

}



/* ================================= */
/* ACTUALIZAR VIDA                    */
/* ================================= */

function actualizarVida(
  numero,
  combatiente
) {

  const vida =
    Number(
      combatiente.vida ??
      combatiente.hp ??
      0
    );


  const vidaMaxima =
    Number(
      combatiente.vidaMaxima ??
      combatiente.hpMax ??
      combatiente.vida_maxima ??
      vida
    );


  const porcentaje =
    vidaMaxima > 0
      ? Math.max(
          0,
          Math.min(
            100,
            (vida / vidaMaxima) * 100
          )
        )
      : 0;


  document
    .getElementById(
      `c${numero}VidaTexto`
    )
    .textContent =
      `${vida} / ${vidaMaxima}`;


  document
    .getElementById(
      `c${numero}VidaBarra`
    )
    .style.width =
      `${porcentaje}%`;

}



/* ================================= */
/* ACTUALIZAR FATIGA                  */
/* ================================= */

function actualizarFatiga(
  numero,
  combatiente
) {

  const fatiga =
    Number(
      combatiente.fatiga ??
      0
    );


  const fatigaMaxima =
    Number(
      combatiente.fatigaMaxima ??
      100
    );


  const porcentaje =
    fatigaMaxima > 0
      ? Math.max(
          0,
          Math.min(
            100,
            (fatiga / fatigaMaxima) * 100
          )
        )
      : 0;


  document
    .getElementById(
      `c${numero}FatigaTexto`
    )
    .textContent =
      fatiga;


  document
    .getElementById(
      `c${numero}FatigaBarra`
    )
    .style.width =
      `${porcentaje}%`;

}



/* ================================= */
/* MOSTRAR STATS                      */
/* ================================= */

function mostrarStats(
  numero,
  combatiente
) {

  const elemento =
    document.getElementById(
      `c${numero}Stats`
    );


  if (!elemento) {

    return;

  }


  if (
    window.mostrarStatsCombatiente
  ) {

    elemento.innerHTML =
      window.mostrarStatsCombatiente(
        combatiente
      );

    return;

  }


  const stats =
    combatiente.stats ||
    {};


  const nombres = {

    ofensiva: "⚔️ Ofensiva",

    defensa: "🛡️ Defensa",

    movilidad: "🏃 Movilidad",

    resistencia: "💪 Resistencia",

    adaptabilidad: "🧬 Adaptabilidad"

  };


  elemento.innerHTML =
    Object.keys(nombres)
      .map(
        clave => {

          const valor =
            stats[clave] ??
            combatiente[clave] ??
            0;


          return `
            <div class="stat">
              <span>${nombres[clave]}</span>
              <strong>${valor}</strong>
            </div>
          `;

        }
      )
      .join("");

}



/* ================================= */

  const turno =

  const indicador =
    document.getElementById(
      "indicadorTurno"

    indicador.textContent =

  }


  const iniciativa =
    combatiente1.iniciativa ??
    "—";


  const elementoIniciativa =
    document.getElementById(
      "indicadorIniciativa"
    );


  if (elementoIniciativa) {

    elementoIniciativa.textContent =
      `Iniciativa: ${iniciativa}`;

}

  const ids = [

    "botonAtaque",

    "botonDefensa",

    "botonEspecial",

    "botonSiguiente"

  ];


  ids.forEach(
    id => {

      const boton =

      if (boton) {

        boton.disabled =
          false;

      }

    }
  );

function desactivarBotones() {

  const ids = [

    "botonAtaque",

    "botonDefensa",

    "botonEspecial",

    "botonSiguiente"

  ];


  ids.forEach(
    id => {

        document.getElementById(id);


      if (boton) {

        boton.disabled =
          true;

      }

    }

/* ================================= */

function añadirRegistro(
  texto
) {

  const registro =
    document.getElementById(
      "registroCombate"
    );


  if (!registro) {

    return;

  }


  const linea =
    document.createElement(
      "div"
    );


  linea.className =
    "linea-registro";


  linea.textContent =
    texto;


  registro.appendChild(
    linea
  );


  registro.scrollTop =
    registro.scrollHeight;

}



/* ================================= */
/* LIMPIAR REGISTRO                   */

/* ATAQUE                             */
/* ================================= */

function ejecutarAtaque() {

  if (
    !combateActivo ||
    !combatiente1 ||
    !combatiente2
  ) {

    return;

  }


  if (
    window.ejecutarAtaqueEstandar
  ) {

    const resultado =
      window.ejecutarAtaqueEstandar(
        combatiente1,
        combatiente2
      );


    if (resultado) {

      procesarResultado(
        resultado
      );

    }

  }

}

/* ================================= */

function procesarResultado(
  resultado
) {

  if (
    typeof resultado ===
    "string"
  ) {

    añadirRegistro(
      resultado
    );

    return;

  }


  if (
    resultado.mensaje
  ) {

    añadirRegistro(
      resultado.mensaje
    );

  }


  if (
    resultado.texto
  ) {

    mostrarResultado(
      resultado.texto
    );

  }


  mostrarCombatientes();

      }

document
  .getElementById("botonSerie")
  .addEventListener(
    "click",
    iniciarPartidoSerie
  );


function iniciarPartidoSerie() {

  const valor1 =
    codigo1.value
      .trim()
      .toUpperCase();

  const valor2 =
    codigo2.value
      .trim()
      .toUpperCase();


  if (!valor1 || !valor2) {

    alert(
      "Introduce los dos códigos."
    );

    return;

  }


  if (valor1 === valor2) {

    alert(
      "Los combatientes deben ser diferentes."
    );

    return;

  }


  const ficha1 =
    buscarFicha(valor1);

  const ficha2 =
    buscarFicha(valor2);


  if (!ficha1 || !ficha2) {

    alert(
      "No se encuentran los combatientes."
    );

    return;

  }


  victorias1 = 0;

  victorias2 = 0;

  serieActiva = true;


  actualizarMarcadorSerie(
    ficha1,
    ficha2
  );


  prepararCombate();


}



/* ================================= */
/* MARCADOR DE SERIE                  */
/* ================================= */

function actualizarMarcadorSerie(
  ficha1,
  ficha2
) {

  const nombreSerie1 =
    document.getElementById(
      "serieNombre1"
    );

  const nombreSerie2 =
    document.getElementById(
      "serieNombre2"
    );


  const victoriasSerie1 =
    document.getElementById(
      "serieVictorias1"
    );

  const victoriasSerie2 =
    document.getElementById(
      "serieVictorias2"
    );


  if (nombreSerie1) {

    nombreSerie1.textContent =
      ficha1.j2 || "—";

  }


  if (nombreSerie2) {

    nombreSerie2.textContent =
      ficha2.j2 || "—";

  }


  if (victoriasSerie1) {

    victoriasSerie1.textContent =
      victorias1;

  }


  if (victoriasSerie2) {

    victoriasSerie2.textContent =
      victorias2;

  }

}



/* ================================= */
/* FINALIZAR COMBATE                  */
/* ================================= */

function finalizarCombate(
  ganador
) {

  combateActivo =
    false;


  desactivarBotones();


  if (
    ganador === 1
  ) {

    victorias1++;

  }


  if (
    ganador === 2
  ) {

    victorias2++;

  }


  actualizarMarcadorSerie(
    {
      j2:
        combatiente1
          ? combatiente1.nombre
          : "—"
    },
    {
      j2:
        combatiente2
          ? combatiente2.nombre
          : "—"
    }
  );


  if (
    serieActiva &&
    (
      victorias1 >=
        victoriasNecesarias ||
      victorias2 >=
        victoriasNecesarias
    )
  ) {

    finalizarSerie();

    return;

  }


  if (serieActiva) {

    añadirRegistro(
      "🏆 Combate terminado. Preparando el siguiente combate de la serie."
    );

  }

}



/* ================================= */
/* FINALIZAR SERIE                    */
/* ================================= */

function finalizarSerie() {

  serieActiva =
    false;

  combateActivo =
    false;


  desactivarBotones();


  const ganadorSerie =
    victorias1 >
    victorias2
      ? combatiente1
      : combatiente2;


  const resultado =
    document.getElementById(
      "resultadoSerie"
    );


  if (resultado) {

    resultado.textContent =
      `🏆 Ganador de la serie: ${
        ganadorSerie
          ? ganadorSerie.nombre
          : "—"
      }`;

  }


  añadirRegistro(
    `🏆 Serie terminada. Ganador: ${
      ganadorSerie
        ? ganadorSerie.nombre
        : "—"
    }`
  );

}
