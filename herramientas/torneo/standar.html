async function cargarPaleofichas(){

  try{

    const respuesta =
      await fetch(
        RUTA_PALEOFICHAS
      );

    if(!respuesta.ok){

      throw new Error(
        "No se pudo cargar paleofichas.json"
      );

    }

    const datos =
      await respuesta.json();

    nombresPaleofichas = {};

    if(Array.isArray(datos)){

      datos.forEach(
        function(ficha){

          if(!ficha){
            return;
          }

          const codigo =
            ficha.j1 ||
            ficha.codigo ||
            "";

          const nombre =
            ficha.j2 ||
            ficha.nombre ||
            "";

          if(codigo){

            nombresPaleofichas[
              String(codigo)
                .trim()
                .toLowerCase()
            ] = nombre;

          }

        }
      );

    }else if(
      datos &&
      typeof datos === "object"
    ){

      Object.keys(datos).forEach(
        function(clave){

          const ficha =
            datos[clave];

          if(!ficha){
            return;
          }

          const codigo =
            ficha.j1 ||
            ficha.codigo ||
            clave;

          const nombre =
            ficha.j2 ||
            ficha.nombre ||
            "";

          if(codigo){

            nombresPaleofichas[
              String(codigo)
                .trim()
                .toLowerCase()
            ] = nombre;

          }

        }
      );

    }

  }catch(error){

    console.error(error);

    nombresPaleofichas = {};

  }

}


async function cargarMaster(){

  try{

    const respuesta =
      await fetch(
        RUTA_MASTER
      );

    if(!respuesta.ok){

      throw new Error(
        "No se pudo cargar master.csv"
      );

    }

    const texto =
      await respuesta.text();

    fichas =
      interpretarCSV(texto);

    mensajeConfiguracion.textContent =
      "Datos de Paleofichas cargados correctamente.";

  }catch(error){

    console.error(error);

    mensajeConfiguracion.textContent =
      "❌ Error al cargar master.csv.";

  }

}


function interpretarCSV(texto){

  const lineas =
    texto
      .split(/\r?\n/)
      .map(
        linea =>
          linea.trim()
      )
      .filter(Boolean);

  if(lineas.length < 2){
    return [];
  }

  const cabecera =
    separarCSV(lineas[0]);

  const resultado = [];

  for(
    let i = 1;
    i < lineas.length;
    i++
  ){

    const columnas =
      separarCSV(
        lineas[i]
      );

    if(!columnas.length){
      continue;
    }

    const ficha = {};

    for(
      let j = 0;
      j < cabecera.length;
      j++
    ){

      ficha[cabecera[j]] =
        columnas[j] !== undefined
          ? columnas[j]
          : "";

    }

    for(
      let n = 1;
      n <= 11;
      n++
    ){

      const clave =
        "e" + n;

      if(
        ficha[clave] !== undefined &&
        ficha[clave] !== ""
      ){

        ficha[clave] =
          Number(
            ficha[clave]
          );

      }

    }

    resultado.push(
      ficha
    );

  }

  return resultado;

}


function separarCSV(linea){

  const resultado = [];

  let actual = "";

  let comillas = false;

  for(
    let i = 0;
    i < linea.length;
    i++
  ){

    const caracter =
      linea[i];

    if(caracter === '"'){

      comillas =
        !comillas;

      continue;

    }

    if(
      caracter === "," &&
      !comillas
    ){

      resultado.push(
        actual.trim()
      );

      actual = "";

    }else{

      actual +=
        caracter;

    }

  }

  resultado.push(
    actual.trim()
  );

  return resultado;

}


function obtenerNombrePaleoficha(codigo){

  const clave =
    String(codigo)
      .trim()
      .toLowerCase();

  return (
    nombresPaleofichas[clave] ||
    ""
  );

}


function buscarFicha(codigo){

  const buscado =
    String(codigo)
      .trim()
      .toLowerCase();

  const ficha =
    fichas.find(
      ficha =>
        String(ficha.j1)
          .trim()
          .toLowerCase() ===
        buscado
    );

  if(!ficha){
    return null;
  }

  const fichaCompleta = {
    ...ficha
  };

  const nombre =
    obtenerNombrePaleoficha(
      ficha.j1
    );

  fichaCompleta.j2 =
    nombre ||
    ficha.j2 ||
    ficha.nombre ||
    "";

  fichaCompleta.nombre =
    fichaCompleta.j2;

  return fichaCompleta;

}


function actualizarNombre(
  input,
  elemento
){

  const ficha =
    buscarFicha(
      input.value
    );

  if(ficha){

    elemento.textContent =
      ficha.j2 ||
      "Sin nombre";

  }else{

    elemento.textContent =
      "—";

  }

}

botonPreparar.addEventListener(

function prepararCombate(){

  const valor1 =
    codigo1.value.trim();

  const valor2 =
    codigo2.value.trim();

  if(!valor1 || !valor2){

    mostrarMensaje(
      "Introduce los dos códigos J1."
    );

    return;

  }

  if(
    valor1.toLowerCase() ===
    valor2.toLowerCase()
  ){

    mostrarMensaje(
      "Los dos combatientes deben ser diferentes."
    );

    return;

  }

  ficha1 =
    buscarFicha(
      valor1
    );

  ficha2 =
    buscarFicha(
      valor2
    );

  if(!ficha1){

    mostrarMensaje(
      "No se encuentra la Paleoficha " +
      valor1 +
      "."
    );

    return;

  }

  if(!ficha2){

    mostrarMensaje(
      "No se encuentra la Paleoficha " +
      valor2 +
      "."
    );

    return;

  }

  try{

    combate =
      window.crearCombateEstandar(
        ficha1,
        ficha2
      );

    if(!combate){

      throw new Error(
        "No se pudo crear el combate."
      );

    }

    combatiente1 =
      combate.combatiente1;

    combatiente2 =
      combate.combatiente2;

    combateActivo = true;

    mostrarCombatientes();

    activarBotones();

    limpiarRegistro();

    añadirRegistro(
      "⚔️ Combate preparado: " +
      combatiente1.nombre +
      " (" +
      combatiente1.codigo +
      ")" +
      " vs " +
      combatiente2.nombre +
      " (" +
      combatiente2.codigo +
      ")"
    );

    mostrarMensaje(
      "Combate preparado correctamente."
    );

  }catch(error){

    console.error(error);

    mostrarMensaje(
      "❌ Error al preparar el combate."
    );

  }

}
function mostrarCombatientes(){

  if(
    !combate ||
    !combatiente1 ||
    !combatiente2
  ){
    return;
  }


  document.getElementById(
    "c1Nombre"
  ).textContent =
    combatiente1.nombre ||
    "—";

  document.getElementById(
    "c1Codigo"
  ).textContent =
    combatiente1.codigo ||
    "—";

  document.getElementById(
    "c1Perfil"
  ).textContent =
    obtenerNombrePerfil(
      combatiente1.perfil
    );


  document.getElementById(
    "c2Nombre"
  ).textContent =
    combatiente2.nombre ||
    "—";

  document.getElementById(
    "c2Codigo"
  ).textContent =
    combatiente2.codigo ||
    "—";

  document.getElementById(
    "c2Perfil"
  ).textContent =
    obtenerNombrePerfil(
      combatiente2.perfil
    );


  mostrarVida(
    combatiente1,
    "c1"
  );

  mostrarVida(
    combatiente2,
    "c2"
  );


  mostrarFatiga(
    combatiente1,
    "c1"
  );

  mostrarFatiga(
    combatiente2,
    "c2"
  );


  mostrarStats(
    combatiente1,
    "c1"
  );

  mostrarStats(
    combatiente2,
    "c2"
  );


  mostrarEstado(
    combatiente1,
    "c1"
  );

  mostrarEstado(
    combatiente2,
    "c2"
  );


  document.getElementById(
    "turnoActual"
  ).textContent =
    "Turno " +
    (
      combate.turno ||
      "—"
    );


  let iniciativa = "—";

  if(
    combate.iniciativa
  ){

    iniciativa =
      combate.iniciativa;

  }else if(
    combatiente1.iniciativa !==
      undefined &&
    combatiente2.iniciativa !==
      undefined
  ){

    iniciativa =
      combatiente1.iniciativa +
      " / " +
      combatiente2.iniciativa;

  }

  document.getElementById(
    "iniciativa"
  ).textContent =
    iniciativa;

}


function obtenerNombrePerfil(
  perfil
){

  const perfiles = {

    agresivo:
      "🔥 Agresivo",

    defensivo:
      "🛡️ Defensivo",

    rapido:
      "⚡ Rápido",

    aguante:
      "❤️ Aguante",

    tactico:
      "🧠 Táctico"

  };

  return (
    perfiles[perfil] ||
    perfil ||
    "—"
  );

}


function mostrarVida(
  combatiente,
  prefijo
){

  const vida =
    Number(
      combatiente.hp
    );

  const vidaMax =
    Number(
      combatiente.hp_max
    ) || 100;

  const vidaSegura =
    Number.isFinite(vida)
      ? Math.max(
          0,
          Math.min(
            vidaMax,
            vida
          )
        )
      : vidaMax;

  const porcentaje =
    Math.max(
      0,
      Math.min(
        100,
        vidaSegura /
          vidaMax *
          100
      )
    );


  const texto =
    document.getElementById(
      prefijo +
      "VidaTexto"
    );

  const barra =
    document.getElementById(
      prefijo +
      "VidaBarra"
    );


  if(texto){

    texto.textContent =
      Math.round(
        vidaSegura
      ) +
      " / " +
      Math.round(
        vidaMax
      );

  }


  if(barra){

    barra.style.width =
      porcentaje +
      "%";

  }

}

      ? Math.max(
          0,
          Math.min(
            fatigaMax,
            fatiga
          )
        )
      : fatigaMax;

  const porcentaje =
    Math.max(
      0,
      Math.min(
        100,
        fatigaSegura /
          fatigaMax *
          100
      )
    );


  const texto =
    document.getElementById(
      prefijo +
      "FatigaTexto"
    );

}

  const resistencia =

    "<div>❤️ Resistencia: " +
    resistencia +
    "</div>" +

    "<div>🧠 Táctica: " +
    tactica +
    "</div>";

}


function obtenerNumero(
  valor
){

  const numero =
    Number(valor);

  return Number.isFinite(
    numero
  )
    ? Math.round(numero)
    : 0;

}


function mostrarEstado(
  combatiente,
  prefijo
){

  const estado =
    document.getElementById(
      prefijo +
      "Estado"
    );

  if(!estado){
    return;
  }


  const mensajes = [];


  if(
    combatiente.derrotado
  ){

    mensajes.push(
      "☠️ Derrotado"
    );

  }


  if(
    combatiente.defendiendo
  ){

    mensajes.push(
      "🛡️ Defendiendo"
    );

  }


  if(
    Array.isArray(
      combatiente.efectos
    )
  ){

    combatiente.efectos.forEach(
      function(efecto){

        if(!efecto){
          return;
        }

        const nombre =
          efecto.nombre ||
          efecto.codigo ||
          "Efecto";

        const duracion =
          efecto.turnos !==
            undefined
            ? efecto.turnos
            : efecto.duracion;

        if(
          duracion !==
            undefined &&
          duracion > 0
        ){

          mensajes.push(
            "✨ " +
            nombre +
            " (" +
            duracion +
            ")"
          );

        }else{

          mensajes.push(
            "✨ " +
            nombre
          );

        }

      }
    );

  }

function activarBotones(){

  botonA001.disabled =
    false;

     disponible con 50 % o más

    Number(

      .configuracion

}


function desactivarBotones(){

  botonA002.disabled =

function ejecutarAccionJugador(
  codigo
){

  if(
    !combateActivo ||
    !combate
  ){

    return;

  }


  /*
     Protección de interfaz.

     Aunque el motor también bloquea
     A002 por debajo del mínimo,
     la interfaz no permite solicitar
     la acción en esas condiciones.
  */

  if(
    codigo === "A002" &&
    Number(
      combatiente1.fatiga
    ) <
    window.PALARENA_STANDAR
      .configuracion
      .fatiga_minima_ataque_potente
  ){

    añadirRegistro(
      "😓 Ataque potente bloqueado: fatiga insuficiente."
    );

    activarBotones();

    return;

  }


  try{

    /* ==========================
       ACCIÓN DEL JUGADOR
    ========================== */

    const atacante =
      combatiente1;

    const objetivo =
      combatiente2;

    const resultadoJugador =
      window.PALARENA_STANDAR
        .ejecutarAccion(
          atacante,
          objetivo,
          codigo
        );


    procesarResultado(
      resultadoJugador,
      combatiente1,
      combatiente2
    );


    if(
      combatiente2.derrotado
    ){

      finalizarInterfaz({

        ganador:
          combatiente1

      });

      return;

    }


    /* ==========================
       ACCIÓN DE LA IA
    ========================== */

    const accionIA =
      window.PALARENA_STANDAR
        .decidirAccion(
          combatiente2,
          combatiente1
        );


    const resultadoIA =
      window.PALARENA_STANDAR
        .ejecutarAccion(
          combatiente2,
          combatiente1,
          accionIA
        );


    procesarResultado(
      resultadoIA,
      combatiente2,
      combatiente1
    );


    if(
      combatiente1.derrotado
    ){

      finalizarInterfaz({

        ganador:
          combatiente2

      });

      return;

    }


    if(
      typeof window.PALARENA_STANDAR
        .regenerarFatiga ===
      "function"
    ){

      window.PALARENA_STANDAR
        .regenerarFatiga(
          combatiente1
        );

      window.PALARENA_STANDAR
        .regenerarFatiga(
          combatiente2
        );

    }


    combatiente1.defendiendo =
      false;

    combatiente2.defendiendo =
      false;


    combate.turno++;


    mostrarCombatientes();


    /*
       Actualiza el estado del botón
       A002 después de la regeneración
       de fatiga.
    */

    activarBotones();


  }catch(error){

    console.error(error);

    añadirRegistro(
      "❌ Error durante la acción."
    );

  }

  }
  function procesarResultado(
  resultado,
  atacante,
  objetivo
){

  if(!resultado){
    return;
  }


  if(resultado.mensaje){

    añadirRegistro(
      resultado.mensaje
    );

  }


  if(
    resultado.dano !== undefined &&
    resultado.dano > 0
  ){

    añadirRegistro(
      "💥 " +
      atacante.nombre +
      " causa " +
      resultado.dano +
      " de daño a " +
      objetivo.nombre +
      "."
    );

  }


  if(resultado.critico){

    añadirRegistro(
      "💥 ¡Golpe crítico!"
    );

  }


  if(resultado.golpe_mortal){

    añadirRegistro(
      "☠️ ¡GOLPE MORTAL!"
    );

  }


  if(resultado.inversion){

    añadirRegistro(
      "🔄 ¡Inversión! La defensa provoca un contraataque."
    );

  }


  if(resultado.contraataque){

    añadirRegistro(
      "⚡ ¡Contraataque!"
    );

  }


  if(resultado.defensa){

    if(
      resultado.defensa ===
      "acierto"
    ){

      añadirRegistro(
        "🛡️ ¡Defensa acertada!"
      );

    }else if(
      resultado.defensa ===
      "error"
    ){

      añadirRegistro(
        "⚠️ ¡Error de defensa!"
      );

    }

  }


  if(resultado.fallo){

    añadirRegistro(
      "❌ ¡El ataque falla!"
    );

  }


  if(
    resultado.bloqueado_por_fatiga
  ){

    añadirRegistro(
      "😓 ¡Crítico bloqueado por fatiga!"
    );

  }


  if(resultado.esquiva){

    añadirRegistro(
      "💨 ¡Ataque esquivado!"
    );

  }


  if(resultado.efecto){

    añadirRegistro(
      "✨ " +
      resultado.efecto.nombre +
      " aplicado."
    );

  }


  if(resultado.registro){

    if(
      Array.isArray(
        resultado.registro
      )
    ){

      resultado.registro.forEach(
        mensaje =>
          añadirRegistro(
            mensaje
          )
      );

    }else{

      añadirRegistro(
        resultado.registro
      );

    }

  }


  mostrarCombatientes();

}

function ejecutarCombateAutomatico(){

  if(
    !combateActivo ||
    !combate
  ){

    return;

  }


  desactivarBotones();


  try{

    let resultado;


    while(
      combate.estado !==
      "finalizado"
    ){

      resultado =
        window.ejecutarTurnoEstandar(
          combate
        );


      if(resultado){

        procesarTurnoAutomatico(
          resultado
        );

      }

    }


    mostrarCombatientes();


    mostrarResultadoCombate({

      ganador:
        combate.ganador ===
        combatiente1.codigo
          ? combatiente1
          : combatiente2

    });


    combateActivo =
      false;


  }catch(error){

    console.error(error);

    añadirRegistro(
      "❌ Error durante el combate automático."
    );

    activarBotones();

  }

}

        );

      }


      if(datos.defensa){

        if(
          datos.defensa ===

        ){

      }


      if(datos.fallo){

      if(
        datos.bloqueado_por_fatiga

          )

              )

          );

        }

    }
  );


  mostrarCombatientes();

  function finalizarInterfaz(
  resultado
){

  combateActivo =
    false;

  desactivarBotones();

  mostrarResultadoCombate(
    resultado
  );

}


function mostrarResultadoCombate(
  resultado
){

  if(!resultado){
    return;
  }


  let ganador = null;


  if(resultado.ganador){

    if(
      typeof resultado.ganador ===
      "string"
    ){

      ganador =
        window.PALARENA_STANDAR
          .obtenerCombatiente(
            combate,
            resultado.ganador
          );

    }else{

      ganador =
        resultado.ganador;

    }

  }


  if(
    !ganador &&
    combate
  ){

    if(
      combate.ganador ===
      combatiente1.codigo
    ){

      ganador =
        combatiente1;

    }else if(
      combate.ganador ===
      combatiente2.codigo
    ){

      ganador =
        combatiente2;

    }

  }


  const panel =
    document.getElementById(
      "resultado"
    );

  const titulo =
    document.getElementById(
      "resultadoTitulo"
    );

  const texto =
    document.getElementById(
      "resultadoTexto"
    );

  const icono =
    document.getElementById(
      "resultadoIcono"
    );


  if(ganador){

    icono.textContent =
      "🏆";

    titulo.textContent =
      "🏆 " +
      (
        ganador.nombre ||
        "Ganador"
      );

    texto.textContent =
      "El combate ha terminado.";

  }else{

    icono.textContent =
      "⚔️";

    titulo.textContent =
      "⚔️ Combate terminado";

    texto.textContent =
      "Se ha determinado el resultado.";

  }


  panel.classList.remove(
    "resultado-oculto"
  );


  mostrarCombatientes();

}


function limpiarRegistro(){

  document.getElementById(

function añadirRegistro(
  texto
){

  const registro =

    );

  const linea =
    document.createElement(
      "div"
    );

  linea.className =
    "linea-registro";

  linea.textContent =
    texto;

  registro.appendChild(
    linea
  );

  registro.scrollTop =
    registro.scrollHeight;

}
