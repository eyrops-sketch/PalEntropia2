<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PalEntropía — Palmarés Histórico</title>
<link rel="stylesheet" href="index.css">
</head>

<body>

<!-- =====================================================
     BOTÓN MENÚ PRINCIPAL
     ===================================================== -->
<button id="botonMenuPrincipal" type="button" title="Volver al menú principal" aria-label="Volver al menú principal">
🏠
</button>

<!-- =====================================================
     CABECERA
     ===================================================== -->
<header id="cabecera">
<h1>PalEntropía</h1>
<div id="subtitulo">Palmarés Histórico</div>
</header>

<!-- =====================================================
     CONTENEDOR PRINCIPAL
     ===================================================== -->
<main id="torneo">

<section id="cabeceraTorneo">
    <h2>🏆 Salón de la Fama</h2>
    <p>Historial de campeones, subcampeones, semifinalistas y puntos de los torneos</p>
</section>

<!-- =====================================================
     LISTA DE CAMPEONES
     ===================================================== -->
<section id="indiceTorneo">
    <div id="contenedorPalmares" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
        <!-- Se cargará dinámicamente mediante JavaScript -->
    </div>
</section>

</main>

<!-- =====================================================
     VOLVER AL ÍNDICE DEL TORNEO
     ===================================================== -->
<section id="volver">
<a href="index.html" id="botonVolver">
    ← Volver al índice del torneo
</a>
</section>

<!-- =====================================================
     LÓGICA DEL PALMARÉS
     ===================================================== -->
<script>
const CLAVE_PALMARES = "palentropia_palmares_historico";

function cargarPalmares() {
    const contenedor = document.getElementById("contenedorPalmares");
    contenedor.innerHTML = "";

    let historico = [];
    try {
        historico = JSON.parse(localStorage.getItem(CLAVE_PALMARES) || "[]");
    } catch (e) {
        console.error("Error leyendo el palmarés:", e);
    }

    if (!historico.length) {
        contenedor.innerHTML = `
            <div class="bloqueTorneo" style="text-align: center; color: #aaa;">
                <p>Todavía no hay ningún campeón registrado en el palmarés.</p>
            </div>
        `;
        return;
    }

    // Ordenar de más reciente a más antiguo basándose en el timestamp o fecha
    historico.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

    historico.forEach((item) => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "bloqueTorneo";
        tarjeta.style.borderLeftColor = "#d4af37"; // Detalle dorado para el palmarés

        const nombreTorneo = item.torneo || "Torneo General";
        const fecha = item.fechaHora || "Fecha desconocida";
        
        // Datos del campeón (con soporte retrocompatible)
        const campeonNombre = item.campeon ? item.campeon.nombre : (item.nombre || "Desconocido");
        const campeonCodigo = item.campeon ? item.campeon.codigo : (item.codigo || "");
        const campeonPuntos = item.campeon ? item.campeon.puntos : (item.puntos !== undefined ? item.puntos : "—");

        // Datos del subcampeón
        const subcampeonNombre = item.subcampeon ? item.subcampeon.nombre : "—";
        const subcampeonCodigo = item.subcampeon ? item.subcampeon.codigo : "";
        const subcampeonPuntos = item.subcampeon ? item.subcampeon.puntos : "—";

        // Marcador de la final si existe
        const victorias1 = item.victorias1 !== undefined ? item.victorias1 : "";
        const victorias2 = item.victorias2 !== undefined ? item.victorias2 : "";

        // Semifinalistas
        let semifinalistasHTML = "";
        if (item.semifinalistas && item.semifinalistas.length > 0) {
            const listaSemis = item.semifinalistas.map(s => `${s.nombre} <span style="font-size: 13px; color: #8b949e;">(${s.codigo})</span>`).join(" · ");
            const puntosSemis = item.semifinalistas[0].puntos;
            semifinalistasHTML = `
                <div style="font-size: 14px; color: #c9d1d9; margin-top: 4px;">
                    🥉 <strong>Semifinalistas:</strong> ${listaSemis} — ⭐ <span style="color: #d4af37; font-weight: bold;">${puntosSemis} pts c/u</span>
                </div>`;
        }

        tarjeta.innerHTML = `
            <h3 style="color: #d4af37; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;">
                <span>🏆 ${nombreTorneo}</span>
                <span style="font-size: 13px; color: #8b949e; font-weight: normal;">${fecha}</span>
            </h3>
            <div style="font-size: 15px; color: #fff; margin-top: 10px; display: flex; flex-direction: column; gap: 6px;">
                <div>
                    👑 <strong>Campeón:</strong> <span style="color: #62d6ff;">${campeonNombre}</span> <span style="font-size: 13px; color: #8b949e;">(${campeonCodigo})</span> — ⭐ <span style="color: #d4af37; font-weight: bold;">${campeonPuntos} pts</span>
                    ${victorias1 !== "" ? `&nbsp;|&nbsp; ⚔️ <strong>Final:</strong> ${victorias1} - ${victorias2}` : ""}
                </div>
                <div>
                    🥈 <strong>Subcampeón:</strong> <span style="color: #c9d1d9;">${subcampeonNombre}</span> ${subcampeonCodigo ? `<span style="font-size: 13px; color: #8b949e;">(${subcampeonCodigo})</span>` : ""} — ⭐ <span style="color: #d4af37; font-weight: bold;">${subcampeonPuntos} pts</span>
                </div>
                ${semifinalistasHTML}
            </div>
        `;

        contenedor.appendChild(tarjeta);
    });
}

// Botón de menú principal
document.getElementById("botonMenuPrincipal").addEventListener("click", function() {
    window.location.href = "../../index.html";
});

document.addEventListener("DOMContentLoaded", cargarPalmares);
</script>

</body>
</html>
