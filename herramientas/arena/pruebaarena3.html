<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PalEntropía — Arena</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
}

.contenedor {
    max-width: 900px;
    margin: auto;
}

h1 {
    margin: 0 0 5px;
    font-size: 28px;
}

.subtitulo {
    color: #aaa;
    margin-bottom: 25px;
}

.panel {
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
}

h2 {
    margin-top: 20px;
    font-size: 20px;
}

label {
    display: block;
    margin-top: 10px;
    color: #aaa;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #222;
    color: #fff;
    border: 1px solid #444;
    border-radius: 6px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #444;
}

.boton-principal {
    background: #7040a0;
}

.boton-principal:hover {
    background: #8050b0;
}

.resultado {
    line-height: 1.7;
}

.bloque {
    padding: 12px;
    margin-top: 12px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 6px;
}

.ok {
    color: #7cff9b;
}

.error {
    color: #ff7777;
}

.aviso {
    color: #ffd166;
}

.etiqueta {
    color: #aaa;
}

.codigo {
    font-family: monospace;
}

hr {
    border: 0;
    border-top: 1px solid #333;
    margin: 14px 0;
}

</style>

</head>

<body>

<div class="contenedor">

<h1>🎲 PalEntropía</h1>

<div class="subtitulo">
Arena — Prueba de combate
</div>

<div class="panel">

<h2>🦖 Paleoficha 1</h2>

<label for="codigo1">
Código de Paleoficha
</label>

<input
    id="codigo1"
    type="text"
    value="006_01"
    placeholder="Ejemplo: 006_01"
>

<h2>🦖 Paleoficha 2</h2>

<label for="codigo2">
Código de Paleoficha
</label>

<input
    id="codigo2"
    type="text"
    value="001_02"
    placeholder="Ejemplo: 001_02"
>

<button
    class="boton-principal"
    onclick="prepararCombateArena()"
>
⚔️ Preparar combate
</button>

</div>

<div
    id="resultado"
    class="panel resultado"
>

<span class="aviso">
Cargando datos de Arena...
</span>

</div>

</div>

<script src="../generador_fase_2/palhab.js"></script>
<script src="../generador_fase_2/palmedio.js"></script>
<script src="../generador_fase_2/palmodo.js"></script>

<script src="./palarenaataques.js"></script>
<script src="./palarenaefectos.js"></script>

<script src="./palarena.js"></script>

<script>

let masterArena = [];

async function cargarMasterArena() {

    try {

        const respuesta =
            await fetch(
                "../generador_fase_2/master.csv"
            );

        if (!respuesta.ok) {

            throw new Error(
                "No se pudo cargar master.csv"
            );

        }

        const texto =
            await respuesta.text();

        masterArena =
            parsearMasterArena(
                texto
            );

        mostrarResultadoArena(

            `
            <div class="ok">
                ✓ Datos cargados correctamente
            </div>

            <div class="bloque">
                Paleofichas disponibles:
                ${masterArena.length}
            </div>
            `

        );

    }

    catch (error) {

        console.error(
            "Error cargando master.csv:",
            error
        );

        mostrarResultadoArena(

            `
            <div class="error">
                ✗ Error cargando master.csv
            </div>

            <div class="bloque">
                ${error.message}
            </div>
            `

        );

    }

}

function parsearMasterArena(texto) {

    const lineas =
        texto
            .trim()
            .split(/\r?\n/);

    if (lineas.length < 2) {
        return [];
    }

    const cabecera =
        lineas[0]
            .split(",")
            .map(
                campo =>
                    campo.trim()
            );

    const registros = [];

    for (
        let i = 1;
        i < lineas.length;
        i++
    ) {

        const linea =
            lineas[i].trim();

        if (!linea) {
            continue;
        }

        const valores =
            linea.split(",");

        const registro = {};

        cabecera.forEach(
            function(
                campo,
                indice
            ) {

                registro[campo] =
                    (
                        valores[indice] ??
                        ""
                    ).trim();

            }
        );

        registros.push(
            registro
        );

    }

    return registros;

}

function buscarFichaArena(codigo) {

    if (!codigo) {
        return null;
    }

    return masterArena.find(
        function(ficha) {
            return ficha.j1 === codigo;
        }
    ) || null;

}

function mostrarResultadoArena(html) {

    const elemento =
        document.getElementById(
            "resultado"
        );

    elemento.innerHTML =
        html;

}

function generarEstadisticasArena(ficha) {

    return `

        <div class="bloque">

            <strong>
                📊 Estadísticas
            </strong>

            <br><br>

            e1 Adaptabilidad:
            ${ficha.e1}

            <br>

            e2 Sociabilidad:
            ${ficha.e2}

            <br>

            e3 Resistencia:
            ${ficha.e3}

            <br>

            e4 Reproducción:
            ${ficha.e4}

            <br>

            e5 Ofensiva:
            ${ficha.e5}

            <br>

            e6 Defensa:
            ${ficha.e6}

            <br>

            e7 Movilidad:
            ${ficha.e7}

            <br>

            e8 Plasticidad ecológica:
            ${ficha.e8}

            <br>

            e9 Tamaño:
            ${ficha.e9}

            <br>

            e10 Velocidad:
            ${ficha.e10}

            <br>

            e11 Inteligencia:
            ${ficha.e11}

        </div>

    `;

}
function generarFichaArena(
    ficha,
    numero
) {

    return `

        <div class="bloque">

            <strong>
                🦖 Combatiente ${numero}
            </strong>

            <br><br>

            <span class="etiqueta">
                Código:
            </span>

            <span class="codigo">
                ${ficha.j1}
            </span>

            <br>

            <span class="etiqueta">
                Nombre:
            </span>

            ${ficha.j2}

            <br>

            <span class="etiqueta">
                Cronología:
            </span>

            ${ficha.j3}

            <br>

            <span class="etiqueta">
                Modo de vida:
            </span>

            MV${ficha.j9}

            <br>

            <span class="etiqueta">
                j5:
            </span>

            ${ficha.j5}

            <br>

            <span class="etiqueta">
                j6:
            </span>

            ${ficha.j6}

            <br>

            <span class="etiqueta">
                j7:
            </span>

            ${ficha.j7}

            <br>

            <span class="etiqueta">
                j8:
            </span>

            ${ficha.j8}

            ${generarEstadisticasArena(ficha)}

        </div>

    `;

}

function prepararCombatienteArena(ficha) {

    if (
        typeof crearCombatienteArena !==
        "function"
    ) {

        return null;

    }

    return crearCombatienteArena(
        ficha
    );

}

function prepararCombateArena() {

    const codigo1 =
        document
            .getElementById("codigo1")
            .value
            .trim();

    const codigo2 =
        document
            .getElementById("codigo2")
            .value
            .trim();

    const ficha1 =
        buscarFichaArena(
            codigo1
        );

    const ficha2 =
        buscarFichaArena(
            codigo2
        );

    if (!ficha1) {

        mostrarResultadoArena(

            `
            <div class="error">
                ✗ No se encuentra la
                Paleoficha ${codigo1}
            </div>
            `

        );

        return;

    }

    if (!ficha2) {

        mostrarResultadoArena(

            `
            <div class="error">
                ✗ No se encuentra la
                Paleoficha ${codigo2}
            </div>
            `

        );

        return;

    }

    let html = `

        <div class="ok">
            ✓ Paleofichas cargadas correctamente
        </div>

    `;

    html +=
        generarFichaArena(
            ficha1,
            1
        );

    html +=
        generarFichaArena(
            ficha2,
            2
        );

    const combatiente1 =
        prepararCombatienteArena(
            ficha1
        );

    const combatiente2 =
        prepararCombatienteArena(
            ficha2
        );

    if (
        !combatiente1 ||
        !combatiente2
    ) {

        html += `

            <div class="bloque error">

                ✗ No se pudo crear
                uno o ambos combatientes.

                <br><br>

                Comprueba que
                <strong>palarena.js</strong>
                se ha cargado correctamente.

            </div>

        `;

        mostrarResultadoArena(
            html
        );

        return;

    }

    html += `

        <div class="bloque">

            <strong>
                ⚔️ Combatientes preparados
            </strong>

            <br><br>

            <strong>
                ${combatiente1.nombre}
            </strong>

            <br>

            HP:
            ${combatiente1.hp_max}

            <br>

            Iniciativa:
            ${combatiente1.iniciativa}

            <br>

            Ataque especial:
            ${combatiente1.ataque_especial}

            <hr>

            <strong>
                ${combatiente2.nombre}
            </strong>

            <br>

            HP:
            ${combatiente2.hp_max}

            <br>

            Iniciativa:
            ${combatiente2.iniciativa}

            <br>

            Ataque especial:
            ${combatiente2.ataque_especial}

        </div>

    `;

    mostrarResultadoArena(
        html
    );

}

cargarMasterArena();

</script>

</body>

</html>
