<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PalEntropía — Arena — Prueba de combate</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;
    padding: 20px;

    background: #111;
    color: #eee;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

.contenedor {

    max-width: 1100px;
    margin: auto;

}

h1 {

    margin-top: 0;

    color: #fff;

}

h2 {

    margin-top: 0;

}

.panel {

    background: #1b1b1b;

    border: 1px solid #333;

    border-radius: 12px;

    padding: 20px;

    margin-bottom: 20px;

}

.fila {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 20px;

}

label {

    display: block;

    margin-bottom: 6px;

    font-weight: bold;

}

input {

    width: 100%;

    padding: 12px;

    border-radius: 8px;

    border: 1px solid #555;

    background: #111;

    color: #fff;

    font-size: 16px;

}

button {

    padding: 12px 18px;

    border: none;

    border-radius: 8px;

    background: #333;

    color: #fff;

    font-size: 16px;

    cursor: pointer;

}

button:hover {

    background: #444;

}

.boton-combate {

    margin-top: 20px;

    width: 100%;

    font-size: 18px;

    font-weight: bold;

}

.boton-ficha {

    display: inline-block;

    margin-top: 12px;

    padding: 9px 14px;

    border-radius: 7px;

    background: #252525;

    color: #fff;

    text-decoration: none;

    border: 1px solid #555;

}

.boton-ficha:hover {

    background: #3a3a3a;

}

.estado {

    padding: 12px;

    border-radius: 8px;

    background: #151515;

    border: 1px solid #333;

    margin-bottom: 20px;

}

.combatiente {

    background: #151515;

    border: 1px solid #333;

    border-radius: 10px;

    padding: 18px;

}

.codigo {

    color: #aaa;

    font-size: 14px;

}

.nombre {

    font-size: 24px;

    font-weight: bold;

    margin: 5px 0 15px;

}

.dato {

    margin: 6px 0;

}

.estadisticas {

    margin-top: 18px;

}

.estadistica {

    display: flex;

    justify-content: space-between;

    padding: 5px 0;

    border-bottom: 1px solid #292929;

}

.habitats {

    margin-top: 18px;

}

.habitats-codigo {

    font-family: monospace;

    font-size: 15px;

    word-break: break-all;

    color: #ddd;

}

.preparados {

    margin-top: 20px;

    padding: 15px;

    border-radius: 8px;

    background: #151515;

    border: 1px solid #333;

}

.hp {

    font-size: 20px;

    font-weight: bold;

}

.iniciativa {

    margin-top: 5px;

}

.ataque {

    margin-top: 5px;

}

.oculto {

    display: none;

}

@media (max-width: 700px) {

    .fila {

        grid-template-columns: 1fr;

    }

    body {

        padding: 12px;

    }

}

</style>

</head>


<body>

<div class="contenedor">


<h1>🎲 PalEntropía</h1>

<div class="panel">

<h2>Arena — Prueba de combate</h2>


<div class="fila">


<div>

<label for="codigo1">
🦖 Paleoficha 1
</label>

<input
    id="codigo1"
    type="text"
    value="006_01"
    autocomplete="off"
>

</div>


<div>

<label for="codigo2">
🦖 Paleoficha 2
</label>

<input
    id="codigo2"
    type="text"
    value="001_02"
    autocomplete="off"
>

</div>


</div>


<button
    class="boton-combate"
    id="btnPreparar"
    type="button"
>
⚔️ Preparar combate
</button>

</div>


<div
    id="estado"
    class="estado"
>
Esperando carga de Paleofichas...
</div>


<div
    id="resultado"
    class="fila"
>
</div>


</div>


<!-- ======================================================
     BASES DE DATOS
====================================================== -->

<script src="../generador_fase_2/palhab.js"></script>

<script src="../generador_fase_2/palmedio.js"></script>

<script src="../generador_fase_2/palmodo.js"></script>


<!-- ======================================================
     ARENA
====================================================== -->

<script src="palarenaataques.js"></script>

<script src="palarenaefectos.js"></script>

<script src="palarena.js"></script>


<script>

/*
============================================================
PALENTROPÍA — ARENA
PRUEBA DE COMBATE
============================================================

Archivo:
herramientas/arena/pruebaarena.html

Funciones:

- carga master.csv
- busca Paleofichas por j1
- muestra j2 como nombre real
- muestra j5 y j6
- muestra estadísticas
- oculta j3
- oculta j7
- oculta j8
- crea combatientes
- calcula HP
- calcula iniciativa
- muestra ataque especial
- enlaza con la Paleoficha correspondiente

============================================================
*/


/* ==========================================================
   CONFIGURACIÓN
   ========================================================== */

const RUTA_MASTER =
    "../generador_fase_2/master.csv";


const RUTA_PALEOFICHA =
    "https://palentropia.es/herramientas/generador_fase_2/generador_fase_2.html?codigo=";


/* ==========================================================
   VARIABLES
   ========================================================== */

let MASTER_ARENA = [];

let combatePreparado = null;


/* ==========================================================
   ELEMENTOS
   ========================================================== */

const estado =
    document.getElementById("estado");

const resultado =
    document.getElementById("resultado");

const btnPreparar =
    document.getElementById("btnPreparar");


/* ==========================================================
   PARSEAR CSV
========================================================== */

function parsearCSVLineaArena(linea) {

    const resultado = [];

    let actual = "";

    let entreComillas = false;


    for (
        let i = 0;
        i < linea.length;
        i++
    ) {

        const caracter =
            linea[i];


        if (caracter === '"') {

            entreComillas =
                !entreComillas;

            continue;

        }


        if (
            caracter === "," &&
            !entreComillas
        ) {

            resultado.push(
                actual.trim()
            );

            actual = "";

            continue;

        }


        actual += caracter;

    }


    resultado.push(
        actual.trim()
    );


    return resultado;

}


/* ==========================================================
   CARGAR MASTER
========================================================== */

async function cargarMasterArena() {

    try {

        const respuesta =
            await fetch(
                RUTA_MASTER,
                {
                    cache: "no-store"
                }
            );


        if (!respuesta.ok) {

            throw new Error(
                "HTTP " +
                respuesta.status
            );

        }


        const texto =
            await respuesta.text();


        const lineas =
            texto
                .split(/\r?\n/)
                .filter(
                    linea =>
                        linea.trim() !== ""
                );


        if (
            lineas.length < 2
        ) {

            throw new Error(
                "master.csv está vacío."
            );

        }


        const cabeceras =
            parsearCSVLineaArena(
                lineas[0]
            );


        MASTER_ARENA = [];


        for (
            let i = 1;
            i < lineas.length;
            i++
        ) {

            const valores =
                parsearCSVLineaArena(
                    lineas[i]
                );


            if (
                valores.length === 0
            ) {

                continue;

            }


            const registro = {};


            cabeceras.forEach(
                function(cabecera, indice) {

                    registro[cabecera] =
                        valores[indice] ?? "";

                }
            );


            if (
                registro.j1
            ) {

                MASTER_ARENA.push(
                    registro
                );

            }

        }


        estado.innerHTML =
            "✓ Datos cargados correctamente<br>" +
            "Paleofichas disponibles: " +
            MASTER_ARENA.length;


    }

    catch (error) {

        console.error(
            error
        );


        estado.innerHTML =
            "✗ Error cargando master.csv: " +
            error.message;

    }

}


/* ==========================================================
   BUSCAR PALEOFICHA
========================================================== */

function obtenerPaleofichaArena(
    codigo
) {

    if (!codigo) {

        return null;

    }


    const codigoNormalizado =
        codigo.trim();


    return MASTER_ARENA.find(
        function(ficha) {

            return (
                String(ficha.j1)
                    .trim()
                    .toLowerCase()
                ===
                codigoNormalizado
                    .toLowerCase()
            );

        }
    ) || null;

}


/* ==========================================================
   CONVERTIR ESTADÍSTICAS
========================================================== */

function obtenerEstadisticasVisualesArena(
    ficha
) {

    return [

        ["e1", "Adaptabilidad", ficha.e1],

        ["e2", "Sociabilidad", ficha.e2],

        ["e3", "Resistencia", ficha.e3],

        ["e4", "Reproducción", ficha.e4],

        ["e5", "Ofensiva", ficha.e5],

        ["e6", "Defensa", ficha.e6],

        ["e7", "Movilidad", ficha.e7],

        ["e8", "Plasticidad ecológica", ficha.e8],

        ["e9", "Tamaño", ficha.e9],

        ["e10", "Velocidad", ficha.e10],

        ["e11", "Inteligencia", ficha.e11]

    ];

}


/* ==========================================================
   ESCAPAR HTML
========================================================== */

function escaparHTMLArena(
    valor
) {

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==========================================================
   CREAR ENLACE PALEOFICHA
========================================================== */

function crearEnlacePaleofichaArena(
    codigo
) {

    return (
        RUTA_PALEOFICHA +
        encodeURIComponent(
            codigo
        )
    );

}


/* ==========================================================
   MOSTRAR COMBATIENTE
========================================================== */

function mostrarCombatienteArena(
    ficha,
    combatiente,
    numero
) {

    const estadisticas =
        obtenerEstadisticasVisualesArena(
            ficha
        );


    let html = "";


    html +=
        '<div class="combatiente">';


    html +=
        '<div class="codigo">' +
        '🦖 Combatiente ' +
        numero +
        '</div>';


    html +=
        '<div class="nombre">' +
        escaparHTMLArena(
            ficha.j2
        ) +
        '</div>';


    html +=
        '<div class="dato">' +
        '<strong>Código:</strong> ' +
        escaparHTMLArena(
            ficha.j1
        ) +
        '</div>';


    /*
    ----------------------------------------------------------
    j3 NO SE MUESTRA
    ----------------------------------------------------------
    */


    html +=
        '<div class="dato">' +
        '<strong>Modo de vida:</strong> ' +
        escaparHTMLArena(
            ficha.j9
        ) +
        '</div>';


    html +=
        '<div class="habitats">';

    html +=
        '<strong>🏠 Hábitats</strong>';


    html +=
        '<div class="dato">' +
        '<strong>j5:</strong> ' +
        '<span class="habitats-codigo">' +
        escaparHTMLArena(
            ficha.j5
        ) +
        '</span>' +
        '</div>';


    html +=
        '<div class="dato">' +
        '<strong>j6:</strong> ' +
        '<span class="habitats-codigo">' +
        escaparHTMLArena(
            ficha.j6
        ) +
        '</span>' +
        '</div>';


    html +=
        '</div>';


    /*
    ----------------------------------------------------------
    j7 Y j8 NO SE MUESTRAN
    ----------------------------------------------------------
    */


    html +=
        '<div class="estadisticas">';


    html +=
        '<strong>📊 Estadísticas</strong>';


    estadisticas.forEach(
        function(stat) {

            html +=
                '<div class="estadistica">' +

                '<span>' +
                escaparHTMLArena(
                    stat[0]
                ) +
                ' ' +
                escaparHTMLArena(
                    stat[1]
                ) +
                '</span>' +

                '<strong>' +
                escaparHTMLArena(
                    stat[2]
                ) +
                '</strong>' +

                '</div>';

        }
    );


    html +=
        '</div>';


    /*
    ----------------------------------------------------------
    ENLACE A LA PALEOFICHA
    ----------------------------------------------------------
    */

    html +=
        '<a ' +
        'class="boton-ficha" ' +
        'href="' +
        crearEnlacePaleofichaArena(
            ficha.j1
        ) +
        '" ' +
        'target="_blank" ' +
        'rel="noopener noreferrer">' +
        '📖 Consultar Paleoficha' +
        '</a>';


    html +=
        '<div class="preparados">';


    html +=
        '<div class="hp">' +
        '❤️ HP: ' +
        escaparHTMLArena(
            combatiente.hp
        ) +
        ' / ' +
        escaparHTMLArena(
            combatiente.hp_max
        ) +
        '</div>';


    html +=
        '<div class="iniciativa">' +
        '⚡ Iniciativa: ' +
        escaparHTMLArena(
            combatiente.iniciativa
        ) +
        '</div>';


    html +=
        '<div class="ataque">' +
        '⚔️ Ataque especial: ' +
        escaparHTMLArena(
            combatiente.ataque_especial
        ) +
        '</div>';


    html +=
        '</div>';


    html +=
        '</div>';


    return html;

}


/* ==========================================================
   PREPARAR COMBATE
========================================================== */

function prepararCombateArena() {

    const codigo1 =
        document
            .getElementById("codigo1")
            .value
            .trim();


    const codigo2 =
        document
            .getElementById("codigo2")
            .value
            .trim();


    const ficha1 =
        obtenerPaleofichaArena(
            codigo1
        );


    const ficha2 =
        obtenerPaleofichaArena(
            codigo2
        );


    if (!ficha1) {

        estado.innerHTML =
            "✗ No se encontró la Paleoficha: " +
            escaparHTMLArena(
                codigo1
            );

        resultado.innerHTML = "";

        return;

    }


    if (!ficha2) {

        estado.innerHTML =
            "✗ No se encontró la Paleoficha: " +
            escaparHTMLArena(
                codigo2
            );

        resultado.innerHTML = "";

        return;

    }


    /*
    ----------------------------------------------------------
    CREACIÓN REAL DE LOS COMBATIENTES
    ----------------------------------------------------------
    */

    if (
        typeof crearCombatienteArena
        !== "function"
    ) {

        estado.innerHTML =
            "✗ No se ha cargado palarena.js correctamente.";

        return;

    }


    const combatiente1 =
        crearCombatienteArena(
            ficha1
        );


    const combatiente2 =
        crearCombatienteArena(
            ficha2
        );


    combatePreparado = {

        estado: "preparado",

        turno: 0,

        combatiente1:
            combatiente1,

        combatiente2:
            combatiente2,

        actual: null,

        ganador: null,

        historial: []

    };


    estado.innerHTML =
        "✓ Paleofichas cargadas correctamente";


    resultado.innerHTML =

        mostrarCombatienteArena(
            ficha1,
            combatiente1,
            1
        )

        +

        mostrarCombatienteArena(
            ficha2,
            combatiente2,
            2
        );


}


/* ==========================================================
   EVENTO BOTÓN
========================================================== */

btnPreparar.addEventListener(
    "click",
    prepararCombateArena
);


/* ==========================================================
   INICIO
========================================================== */

cargarMasterArena();

</script>


</body>

</html>
