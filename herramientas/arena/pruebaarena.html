<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PalEntropía — Arena</title>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
}

.contenedor {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
}

.panel {
    background: #1b1b1b;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 0 10px rgba(255,255,255,0.05);
}

.combatiente {
    background: #151515;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: white;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 0;
    border-radius: 8px;
    background: #333;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #444;
}

.exito {
    color: #6cff8b;
}

.error {
    color: #ff7070;
}

.dato {
    margin: 5px 0;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
}

.stat {
    background: #222;
    padding: 7px;
    border-radius: 6px;
}

.consulta {
    display: inline-block;
    text-decoration: none;
    text-align: center;
    box-sizing: border-box;
    width: 100%;
    padding: 11px;
    margin-top: 12px;
    border-radius: 8px;
    background: #333;
    color: white;
}

.consulta:hover {
    background: #555;
}

.hp {
    font-size: 18px;
    margin-top: 12px;
}

.preparados {
    margin-top: 15px;
    padding: 12px;
    background: #202020;
    border-radius: 8px;
}

</style>

</head>


<body>

<div class="contenedor">

<h1>🎲 PalEntropía<br>Arena — Prueba de combate</h1>


<div class="panel">

<h2>🦖 Paleoficha 1</h2>

<input
    id="codigo1"
    type="text"
    value="006_01"
    placeholder="Código de Paleoficha">


<h2>🦖 Paleoficha 2</h2>

<input
    id="codigo2"
    type="text"
    value="001_02"
    placeholder="Código de Paleoficha">


<button onclick="prepararCombate()">
    ⚔️ Preparar combate
</button>

<div id="estado"></div>

</div>


<div id="resultado"></div>

</div>


<!-- =========================================================
     BASES DE DATOS
     ========================================================= -->

<script src="../generador_fase_2/palhab.js"></script>

<script src="../generador_fase_2/palmedio.js"></script>

<script src="../generador_fase_2/palmodo.js"></script>

<script src="palarenaataques.js"></script>

<script src="palarenaefectos.js"></script>

<script src="palarena.js"></script>


<script>

/*
============================================================
palentropía — arena
archivo: pruebaarena.html
función:
prueba de carga de Paleofichas y preparación de combate.

FUENTES:

master.csv
→ datos técnicos de Arena

paleofichas.json
→ nombre real j2

IMPORTANTE:
j2 NO se obtiene de master.csv.
============================================================
*/


const RUTA_MASTER =
    "../generador_fase_2/master.csv";


const RUTA_PALEOFICHAS =
    "../generador_fase_2/paleofichas.json";


let MASTER_ARENA = [];

let PALEOFICHAS_ARENA = {};


/* ==========================================================
   CARGAR MASTER.CSV
   ========================================================== */

async function cargarMasterArena() {

    const respuesta =
        await fetch(RUTA_MASTER);

    if (!respuesta.ok) {

        throw new Error(
            "No se pudo cargar master.csv"
        );

    }

    const texto =
        await respuesta.text();

    MASTER_ARENA =
        parsearCSVArena(texto);

}


/* ==========================================================
   PARSER CSV
   ========================================================== */

function parsearCSVArena(texto) {

    const lineas =
        texto
            .trim()
            .split(/\r?\n/);

    if (!lineas.length) {

        return [];

    }

    const cabeceras =
        lineas[0]
            .split(",");

    const registros = [];

    for (
        let i = 1;
        i < lineas.length;
        i++
    ) {

        if (!lineas[i].trim()) {
            continue;
        }

        const valores =
            lineas[i].split(",");

        const registro = {};

        cabeceras.forEach(
            function(cabecera, indice) {

                registro[cabecera.trim()] =
                    valores[indice] !== undefined
                        ? valores[indice].trim()
                        : "";

            }
        );

        registros.push(registro);

    }

    return registros;

}


/* ==========================================================
   CARGAR PALEOFICHAS.JSON
   ========================================================== */

async function cargarPaleofichasArena() {

    const respuesta =
        await fetch(RUTA_PALEOFICHAS);

    if (!respuesta.ok) {

        throw new Error(
            "No se pudo cargar paleofichas.json"
        );

    }

    const datos =
        await respuesta.json();


    PALEOFICHAS_ARENA = {};


    /*
    ----------------------------------------------------------
    Admite tanto:

    [
        { j1: "006_01", j2: "Tyrannosaurus rex" }
    ]

    como estructuras donde las fichas estén dentro
    de otra propiedad.
    ----------------------------------------------------------
    */

    if (Array.isArray(datos)) {

        datos.forEach(
            function(ficha) {

                if (
                    ficha &&
                    ficha.j1
                ) {

                    PALEOFICHAS_ARENA[
                        ficha.j1
                    ] = ficha;

                }

            }
        );

    }

    else if (
        datos &&
        typeof datos === "object"
    ) {

        /*
        Caso habitual:
        objeto indexado por código.
        */

        Object.keys(datos).forEach(
            function(clave) {

                const ficha =
                    datos[clave];

                if (
                    ficha &&
                    typeof ficha === "object"
                ) {

                    const codigo =
                        ficha.j1 || clave;

                    PALEOFICHAS_ARENA[
                        codigo
                    ] = ficha;

                }

            }
        );

    }

}


/* ==========================================================
   BUSCAR REGISTRO MASTER
   ========================================================== */

function buscarMasterArena(codigo) {

    return MASTER_ARENA.find(
        function(registro) {

            return registro.j1 === codigo;

        }
    ) || null;

}


/* ==========================================================
   BUSCAR PALEOFICHA
   ========================================================== */

function buscarPaleofichaArena(codigo) {

    return PALEOFICHAS_ARENA[codigo] || null;

}


/* ==========================================================
   OBTENER NOMBRE REAL
   ========================================================== */

function obtenerNombreArena(
    codigo,
    registroMaster
) {

    const paleoficha =
        buscarPaleofichaArena(codigo);


    /*
    PRIORIDAD ABSOLUTA:
    paleofichas.json
    */

    if (
        paleoficha &&
        paleoficha.j2
    ) {

        return paleoficha.j2;

    }


    /*
    Compatibilidad secundaria.
    */

    if (
        registroMaster &&
        registroMaster.j2 &&
        registroMaster.j2 !== "j2"
    ) {

        return registroMaster.j2;

    }


    return "Nombre no disponible";

}


/* ==========================================================
   OBTENER MODO DE VIDA
   ========================================================== */

function obtenerModoVidaArena(codigo) {

    const registro =
        buscarMasterArena(codigo);

    if (!registro) {
        return "";
    }

    return registro.j9 || "";

}


/* ==========================================================
   OBTENER ESTADÍSTICAS
   ========================================================== */

function obtenerDatosCombateArena(
    codigo
) {

    const registro =
        buscarMasterArena(codigo);


    if (!registro) {

        return null;

    }


    const nombre =
        obtenerNombreArena(
            codigo,
            registro
        );


    return {

        j1:
            registro.j1,

        j2:
            nombre,

        j3:
            registro.j3,

        j5:
            registro.j5,

        j6:
            registro.j6,

        j7:
            registro.j7,

        j8:
            registro.j8,

        j9:
            registro.j9,

        j10:
            registro.j10,

        e1:
            Number(registro.e1) || 0,

        e2:
            Number(registro.e2) || 0,

        e3:
            Number(registro.e3) || 0,

        e4:
            Number(registro.e4) || 0,

        e5:
            Number(registro.e5) || 0,

        e6:
            Number(registro.e6) || 0,

        e7:
            Number(registro.e7) || 0,

        e8:
            Number(registro.e8) || 0,

        e9:
            Number(registro.e9) || 0,

        e10:
            Number(registro.e10) || 0,

        e11:
            Number(registro.e11) || 0

    };

}


/* ==========================================================
   CREAR BLOQUE DE COMBATIENTE
   ========================================================== */

function crearHTMLCombatienteArena(
    datos
) {

    const nombre =
        datos.j2 || "Nombre no disponible";


    /*
    ----------------------------------------------------------
    Enlace directo a la Paleoficha
    ----------------------------------------------------------
    */

    const enlace =
        "https://palentropia.es/" +
        "herramientas/generador_fase_2/" +
        "generador_fase_2.html" +
        "?codigo=" +
        encodeURIComponent(datos.j1);


    let html = "";


    html += '<div class="combatiente">';


    html +=
        "<h2>🦖 Combatiente " +
        "</h2>";


    html +=
        '<div class="dato"><strong>' +
        escaparHTMLArena(nombre) +
        "</strong></div>";


    html +=
        '<div class="dato">Código: ' +
        escaparHTMLArena(datos.j1) +
        "</div>";


    /*
    ----------------------------------------------------------
    j3 y j7/j8 NO se muestran.
    ----------------------------------------------------------
    */


    html +=
        '<div class="dato">🧬 Modo de vida: ' +
        escaparHTMLArena(datos.j9) +
        "</div>";


    html +=
        "<h3>🏠 Hábitats</h3>";


    html +=
        '<div class="dato">j5: ' +
        escaparHTMLArena(datos.j5) +
        "</div>";


    html +=
        '<div class="dato">j6: ' +
        escaparHTMLArena(datos.j6) +
        "</div>";


    html +=
        "<h3>📊 Estadísticas</h3>";


    html +=
        '<div class="stats">';


    html += crearStatArena(
        "e1 Adaptabilidad",
        datos.e1
    );

    html += crearStatArena(
        "e2 Sociabilidad",
        datos.e2
    );

    html += crearStatArena(
        "e3 Resistencia",
        datos.e3
    );

    html += crearStatArena(
        "e4 Reproducción",
        datos.e4
    );

    html += crearStatArena(
        "e5 Ofensiva",
        datos.e5
    );

    html += crearStatArena(
        "e6 Defensa",
        datos.e6
    );

    html += crearStatArena(
        "e7 Movilidad",
        datos.e7
    );

    html += crearStatArena(
        "e8 Plasticidad ecológica",
        datos.e8
    );

    html += crearStatArena(
        "e9 Tamaño",
        datos.e9
    );

    html += crearStatArena(
        "e10 Velocidad",
        datos.e10
    );

    html += crearStatArena(
        "e11 Inteligencia",
        datos.e11
    );


    html += "</div>";


    /*
    ----------------------------------------------------------
    ENLACE A PALEOFICHA
    ----------------------------------------------------------
    */

    html +=
        '<a class="consulta" ' +
        'href="' +
        enlace +
        '" target="_blank" rel="noopener">' +
        "📖 Consultar Paleoficha" +
        "</a>";


    html += "</div>";


    return html;

}


/* ==========================================================
   STAT
   ========================================================== */

function crearStatArena(
    nombre,
    valor
) {

    return (
        '<div class="stat">' +
        "<strong>" +
        escaparHTMLArena(nombre) +
        "</strong><br>" +
        valor +
        "</div>"
    );

}


/* ==========================================================
   ESCAPAR HTML
   ========================================================== */

function escaparHTMLArena(valor) {

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================================
   PREPARAR COMBATE
   ========================================================== */

async function prepararCombate() {

    const estado =
        document.getElementById(
            "estado"
        );

    const resultado =
        document.getElementById(
            "resultado"
        );


    estado.innerHTML =
        "⏳ Cargando datos...";


    resultado.innerHTML = "";


    try {

        /*
        ------------------------------------------------------
        Cargar ambas fuentes.
        ------------------------------------------------------
        */

        await cargarMasterArena();

        await cargarPaleofichasArena();


        const codigo1 =
            document.getElementById(
                "codigo1"
            ).value.trim();


        const codigo2 =
            document.getElementById(
                "codigo2"
            ).value.trim();


        if (!codigo1 || !codigo2) {

            throw new Error(
                "Introduce los dos códigos."
            );

        }


        const datos1 =
            obtenerDatosCombateArena(
                codigo1
            );


        const datos2 =
            obtenerDatosCombateArena(
                codigo2
            );


        if (!datos1) {

            throw new Error(
                "No se encontró " +
                codigo1 +
                " en master.csv."
            );

        }


        if (!datos2) {

            throw new Error(
                "No se encontró " +
                codigo2 +
                " en master.csv."
            );

        }


        estado.innerHTML =
            '<div class="exito">' +
            "✓ Paleofichas cargadas correctamente" +
            "</div>";


        /*
        ------------------------------------------------------
        Mostrar combatientes.
        ------------------------------------------------------
        */

        resultado.innerHTML =
            crearHTMLCombatienteArena(
                datos1
            ) +

            crearHTMLCombatienteArena(
                datos2
            );


        /*
        ------------------------------------------------------
        Crear combatientes reales del motor.
        ------------------------------------------------------
        */

        const combatiente1 =
            crearCombatienteArena(
                datos1
            );


        const combatiente2 =
            crearCombatienteArena(
                datos2
            );


        resultado.innerHTML +=
            '<div class="panel preparados">' +

            "<h2>⚔️ Combatientes preparados</h2>" +

            "<strong>" +
            escaparHTMLArena(
                combatiente1.nombre
            ) +
            "</strong><br>" +

            "❤️ HP: " +
            combatiente1.hp +
            "<br>" +

            "⚡ Iniciativa: " +
            combatiente1.iniciativa +
            "<br>" +

            "⚔️ Ataque especial: " +
            escaparHTMLArena(
                combatiente1.ataque_especial
            ) +

            "<hr>" +

            "<strong>" +
            escaparHTMLArena(
                combatiente2.nombre
            ) +
            "</strong><br>" +

            "❤️ HP: " +
            combatiente2.hp +
            "<br>" +

            "⚡ Iniciativa: " +
            combatiente2.iniciativa +
            "<br>" +

            "⚔️ Ataque especial: " +
            escaparHTMLArena(
                combatiente2.ataque_especial
            ) +

            "</div>";


    }

    catch (error) {

        console.error(error);


        estado.innerHTML =
            '<div class="error">' +
            "✗ Error: " +
            escaparHTMLArena(
                error.message
            ) +
            "</div>";

    }

}


/* ==========================================================
   INICIO
   ========================================================== */

</script>

</body>

</html>
