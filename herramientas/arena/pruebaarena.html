<body>


<div class="contenedor">

    onclick="cargarCombate()"
>

>

<!-- ======================================================
     BASES DE DATOS

<script src="palhab.js"></script>

<!-- ======================================================
     MOTOR ARENA
     ====================================================== -->

<script src="palarena.js"></script>


<script>

/*
============================================================
PRUEBA ARENA
============================================================

Esta página:

1. Carga las Paleofichas desde master.csv.
2. Busca las fichas por j1.
3. Muestra sus datos.
4. Crea los dos combatientes.
5. Prepara el combate.

No contiene lógica propia de combate.

============================================================
*/


let masterArena = [];


/*
------------------------------------------------------------
CARGAR MASTER.CSV
------------------------------------------------------------
*/

async function cargarMasterArena() {

    try {

        const respuesta =
            await fetch("master.csv");

        if (!respuesta.ok) {

            throw new Error(
                "No se pudo cargar master.csv"
            );

        }

        const texto =
            await respuesta.text();

        masterArena =
            parsearMasterArena(texto);

        mostrarMensajeArena(
            "✓ master.csv cargado correctamente",
            "ok"
        );

    }

    catch (error) {

        console.error(error);

        mostrarMensajeArena(
            "✗ Error cargando master.csv: " +
            error.message,
            "error"
        );

    }

}


/*
------------------------------------------------------------
PARSER CSV
------------------------------------------------------------
*/

function parsearMasterArena(texto) {

    const lineas =
        texto
            .trim()
            .split(/\r?\n/);

    if (lineas.length < 2) {

        return [];

    }

    const cabecera =
        lineas[0]
            .split(",");

    const datos = [];


    for (
        let i = 1;
        i < lineas.length;
        i++
    ) {

        const linea =
            lineas[i].trim();

        if (!linea) {

            continue;

        }

        const valores =
            linea.split(",");

        const registro = {};


        cabecera.forEach(
            function(campo, indice) {

                registro[campo] =
                    valores[indice] ?? "";

            }
        );


        datos.push(registro);

    }


    return datos;

}


/*
------------------------------------------------------------
BUSCAR PALEOFICHA
------------------------------------------------------------
*/

function buscarFichaArena(codigo) {

    return masterArena.find(
        function(ficha) {

            return ficha.j1 === codigo;

        }
    ) || null;

}


/*
------------------------------------------------------------
MOSTRAR MENSAJE
------------------------------------------------------------
*/

function mostrarMensajeArena(
    mensaje,
    clase
) {

    const resultado =
        document.getElementById(
            "resultado"
        );

    resultado.innerHTML =
        '<div class="' +
        clase +
        '">' +
        mensaje +
        "</div>";

}


/*
------------------------------------------------------------
FORMATEAR ESTADÍSTICAS
------------------------------------------------------------
*/

function mostrarEstadisticasArena(
    ficha
) {

    return `

        <div class="bloque">

            <strong>📊 Estadísticas</strong>

            <br>

            e1 Adaptabilidad:
            ${ficha.e1}

            <br>

            e2 Sociabilidad:
            ${ficha.e2}

            <br>

            e3 Resistencia:
            ${ficha.e3}

            <br>

            e4 Reproducción:
            ${ficha.e4}

            <br>

            e5 Ofensiva:
            ${ficha.e5}

            <br>

            e6 Defensa:
            ${ficha.e6}

            <br>

            e7 Movilidad:
            ${ficha.e7}

            <br>

            e8 Plasticidad:
            ${ficha.e8}

            <br>

            e9 Tamaño:
            ${ficha.e9}

            <br>

            e10 Velocidad:
            ${ficha.e10}

            <br>

            e11 Inteligencia:
            ${ficha.e11}

        </div>

    `;

}


/*
------------------------------------------------------------
MOSTRAR FICHA
------------------------------------------------------------
*/

function mostrarFichaArena(
    ficha,
    numero
) {

    return `

        <div class="bloque">

            <strong>
                🦖 Combatiente ${numero}
            </strong>

            <br><br>

            <span class="etiqueta">
                Código:
            </span>

            <span class="codigo">
                ${ficha.j1}
            </span>

            <br>

            <span class="etiqueta">
                Nombre:
            </span>

            ${ficha.j2}

            <br>

            <span class="etiqueta">
                Modo de vida:
            </span>

            MV${ficha.j9}

            <br>

            <span class="etiqueta">
                Hábitats:
            </span>

            H${ficha.j5}

            <br>

            <span class="etiqueta">
                Hábitats secundarios:
            </span>

            H${ficha.j6}

            <br>

            ${mostrarEstadisticasArena(ficha)}

        </div>

    `;

}


/*
------------------------------------------------------------
PREPARAR COMBATE
------------------------------------------------------------
*/

function cargarCombate() {

    const codigo1 =
        document
            .getElementById("codigo1")
            .value
            .trim();

    const codigo2 =
        document
            .getElementById("codigo2")
            .value
            .trim();


    const ficha1 =
        buscarFichaArena(codigo1);

    const ficha2 =
        buscarFichaArena(codigo2);


    if (!ficha1) {

        mostrarMensajeArena(
            "✗ No se encuentra la ficha " +
            codigo1,
            "error"
        );

        return;

    }


    if (!ficha2) {

        mostrarMensajeArena(
            "✗ No se encuentra la ficha " +
            codigo2,
            "error"
        );

        return;

    }


    let html = `

        <div class="ok">

            ✓ Fichas cargadas correctamente

        </div>

    `;


    html +=
        mostrarFichaArena(
            ficha1,
            1
        );


    html +=
        mostrarFichaArena(
            ficha2,
            2
        );


    /*
    --------------------------------------------------------
    CREAR COMBATIENTES
    --------------------------------------------------------
    */

    if (
        typeof crearCombatienteArena !==
        "function"
    ) {

        html += `

            <div class="bloque error">

                ✗ No se ha encontrado
                crearCombatienteArena()

            </div>

        `;

        document
            .getElementById("resultado")
            .innerHTML = html;

        return;

    }


    const combatiente1 =
        crearCombatienteArena(
            ficha1
        );


    const combatiente2 =
        crearCombatienteArena(
            ficha2
        );


    html += `

        <div class="bloque">

            <strong>
                ⚔️ Combatientes preparados
            </strong>

            <br><br>

            ${combatiente1.nombre}

            — HP:
            ${combatiente1.hp_max}

            <br>

            Iniciativa:
            ${combatiente1.iniciativa}

            <br>

            Ataque especial:
            ${combatiente1.ataque_especial}

            <hr>

            ${combatiente2.nombre}

            — HP:
            ${combatiente2.hp_max}

            <br>

            Iniciativa:
            ${combatiente2.iniciativa}

            <br>

            Ataque especial:
            ${combatiente2.ataque_especial}

        </div>

    `;


    document
        .getElementById("resultado")
        .innerHTML = html;

}


cargarMasterArena();

              </script>
