<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<title>PalEntropía — Arena</title>

<style>

* {
    box-sizing: border-box;
}

body {

    padding: 20px;

h1 {

button {

    font-size: 16px;

button:hover {

}

.estado {
    margin-top: 15px;
    padding: 10px;
    border-radius: 8px;
    background: #111;
}

.ok {
    color: #7cff8b;
}

.error {
    color: #ff6b6b;
}

.combatientes {
    display: grid;
    grid-template-columns: 1fr 1fr;

}

.combatiente {

.codigoFicha {

.stat span:last-child {

.enlace {

    text-align: center;
    padding: 10px;
    margin-top: 15px;
    border-radius: 8px;
    background: #252525;
    color: white;
    font-weight: bold;
}

.enlace:hover {
    background: #353535;
}

.preparados {
    font-size: 18px;
}

@media (max-width: 700px) {

    .selector,
    .combatientes {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<script src="../generador_fase_2/palhab.js"></script>

<script>

/*
============================================================
palentropía — arena
archivo: pruebaarena.html
versión: 1.3
parte: 1/2
============================================================
*/


const RUTA_MASTER =
    "../generador_fase_2/master.csv";


const RUTA_PALEOFICHAS =
    "../generador_fase_2/paleofichas.json";


const RUTA_GENERADOR =
    "../generador_fase_2/generador_fase_2.html";


let MASTER_ARENA = [];

let PALEOFICHAS_ARENA = {};

let COMBATE_ARENA = null;


/* ==========================================================
   ESCAPAR HTML
   ========================================================== */

function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {
        return "";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================================
   PARSER CSV
   ========================================================== */

function parsearCSVArena(texto) {

    const filas = [];

    let fila = [];

    let campo = "";

    let dentroComillas = false;


    for (
        let i = 0;
        i < texto.length;
        i++
    ) {

        const caracter =
            texto[i];


        if (caracter === '"') {

            if (
                dentroComillas &&
                texto[i + 1] === '"'
            ) {

                campo += '"';

                i++;

            } else {

                dentroComillas =
                    !dentroComillas;

            }

            continue;

        }


        if (
            caracter === "," &&
            !dentroComillas
        ) {

            fila.push(campo);

            campo = "";

            continue;

        }


        if (
            (caracter === "\n" ||
             caracter === "\r") &&
            !dentroComillas
        ) {

            if (
                caracter === "\r" &&
                texto[i + 1] === "\n"
            ) {

                i++;

            }

            fila.push(campo);

            campo = "";


            if (
                fila.some(
                    valor =>
                        String(valor).trim() !== ""
                )
            ) {

                filas.push(fila);

            }

            fila = [];

            continue;

        }


        campo += caracter;

    }


    if (
        campo !== "" ||
        fila.length > 0
    ) {

        fila.push(campo);

        if (
            fila.some(
                valor =>
                    String(valor).trim() !== ""
            )
        ) {

            filas.push(fila);

        }

    }


    if (
        filas.length === 0
    ) {

        return [];

    }


    const cabeceras =
        filas[0].map(
            valor =>
                String(valor).trim()
        );


    const datos = [];


    for (
        let i = 1;
        i < filas.length;
        i++
    ) {

        const objeto = {};


        for (
            let j = 0;
            j < cabeceras.length;
            j++
        ) {

            objeto[cabeceras[j]] =
                filas[i][j] !== undefined
                    ? String(
                        filas[i][j]
                    ).trim()
                    : "";

        }


        datos.push(objeto);

    }


    return datos;

}


/* ==========================================================
   CARGAR PALEOFICHAS.JSON
   ========================================================== */

async function cargarPaleofichasArena() {

    const respuesta =
        await fetch(
            RUTA_PALEOFICHAS
        );


    if (!respuesta.ok) {

        throw new Error(
            "No se pudo cargar paleofichas.json"
        );

    }


    const fichas =
        await respuesta.json();


    if (!Array.isArray(fichas)) {

        throw new Error(
            "paleofichas.json no contiene un array válido."
        );

    }


    PALEOFICHAS_ARENA = {};


    fichas.forEach(
        function(ficha) {

            if (
                !ficha ||
                !ficha.codigo
            ) {

                return;

            }


            /*
            IMPORTANTE:

            paleofichas.json:

            codigo
            nombre

            */

            PALEOFICHAS_ARENA[
                String(
                    ficha.codigo
                ).trim()
            ] = ficha;

        }
    );


    return fichas.length;

}


/* ==========================================================
   OBTENER PALEOFICHA
   ========================================================== */

function obtenerPaleofichaArena(codigo) {

    return PALEOFICHAS_ARENA[
        String(codigo).trim()
    ] || null;

}


/* ==========================================================
   OBTENER NOMBRE REAL
   ========================================================== */

function obtenerNombreArena(codigo) {

    const ficha =
        obtenerPaleofichaArena(
            codigo
        );


    if (
        ficha &&
        ficha.nombre
    ) {

        return ficha.nombre;

    }


    return "Nombre no disponible";

}


/* ==========================================================
   OBTENER FILA MASTER
   ========================================================== */

function obtenerDatosMasterArena(codigo) {

    return MASTER_ARENA.find(
        function(fila) {

            return String(
                fila.j1
            ).trim() ===
            String(
                codigo
            ).trim();

        }
    ) || null;

}


/* ==========================================================
   MODO DE VIDA
   ========================================================== */

function formatearModoArena(valor) {

    if (!valor) {

        return "No disponible";

    }


    let codigo =
        String(valor).trim();


    if (
        !codigo.startsWith("MV")
    ) {

        codigo =
            "MV" +
            codigo.padStart(
                3,
                "0"
            );

    }


    return codigo;

}


/* ==========================================================
   FIN PARTE 1
   ========================================================== */
<script>

/*
============================================================
palentropía — arena
archivo: pruebaarena.html
parte: 2/2
============================================================
*/


/* ==========================================================
   ESTADO
   ========================================================== */

let MASTER_ARENA = [];
let PALEOFICHAS_ARENA = [];

let COMBATE_ARENA = null;


/* ==========================================================
   CARGAR PALEOFICHAS
   ========================================================== */

async function cargarPaleofichasArena() {

    try {

        const respuesta =
            await fetch(
                "../generador_fase_2/paleofichas.json"
            );

        if (!respuesta.ok) {

            throw new Error(
                "No se pudo cargar paleofichas.json"
            );

        }

        PALEOFICHAS_ARENA =
            await respuesta.json();

        return true;

    } catch (error) {

        console.error(
            "Error cargando paleofichas.json:",
            error
        );

        return false;

    }

}


/* ==========================================================
   OBTENER NOMBRE REAL
   ========================================================== */

function obtenerNombrePaleofichaArena(codigo) {

    const ficha =
        PALEOFICHAS_ARENA.find(
            function(item) {

                return item.codigo === codigo;

            }
        );

    if (!ficha) {

        return "Nombre no disponible";

    }

    return ficha.nombre || "Nombre no disponible";

}


/* ==========================================================
   OBTENER DATOS DE UNA FICHA
   ========================================================== */

function prepararDatosArena(codigo) {

    const datos =
        MASTER_ARENA.find(
            function(item) {

                return item.j1 === codigo;

            }
        );

    if (!datos) {

        return null;

    }

    return {

        ...datos,

        j2:
            obtenerNombrePaleofichaArena(
                codigo
            )

    };

}


/* ==========================================================
   FICHA ALEATORIA
   ========================================================== */

function obtenerFichaAleatoriaArena() {

    if (
        !MASTER_ARENA ||
        MASTER_ARENA.length === 0
    ) {

        return null;

    }

    const indice =
        Math.floor(
            Math.random() *
            MASTER_ARENA.length
        );

    return MASTER_ARENA[indice];

}


/* ==========================================================
   SELECCIONAR DOS FICHAS
   ========================================================== */

function seleccionarDosFichasAleatoriasArena() {

    if (
        MASTER_ARENA.length < 2
    ) {

        return null;

    }

    const indice1 =
        Math.floor(
            Math.random() *
            MASTER_ARENA.length
        );

    let indice2 =
        Math.floor(
            Math.random() *
            MASTER_ARENA.length
        );

    while (
        indice2 === indice1
    ) {

        indice2 =
            Math.floor(
                Math.random() *
                MASTER_ARENA.length
            );

    }

    return [

        prepararDatosArena(
            MASTER_ARENA[indice1].j1
        ),

        prepararDatosArena(
            MASTER_ARENA[indice2].j1
        )

    ];

}


/* ==========================================================
   MOSTRAR COMBATIENTE
   ========================================================== */

function mostrarCombatienteArena(
    datos,
    numero
) {

    const contenedor =
        document.getElementById(
            "resultadoArena"
        );

    if (!contenedor || !datos) {

        return;

    }

    const stats = [

        ["Adaptabilidad", datos.e1],
        ["Sociabilidad", datos.e2],
        ["Resistencia", datos.e3],
        ["Reproducción", datos.e4],
        ["Ofensiva", datos.e5],
        ["Defensa", datos.e6],
        ["Movilidad", datos.e7],
        ["Plasticidad ecológica", datos.e8],
        ["Tamaño", datos.e9],
        ["Velocidad", datos.e10],
        ["Inteligencia", datos.e11]

    ];

    let html = "";

    html +=
        "<section class='combatiente'>";

    html +=
        "<h2>🦖 Combatiente " +
        numero +
        "</h2>";

    html +=
        "<h3>" +
        datos.j2 +
        "</h3>";

    html +=
        "<p><strong>Código:</strong> " +
        datos.j1 +
        "</p>";

    html +=
        "<p><strong>🧬 Modo de vida:</strong> " +
        datos.j9 +
        "</p>";

    html +=
        "<h3>🏠 Hábitats</h3>";

    html +=
        "<p>j5: " +
        datos.j5 +
        "</p>";

    html +=
        "<p>j6: " +
        datos.j6 +
        "</p>";

    html +=
        "<h3>📊 Estadísticas</h3>";

    stats.forEach(
        function(stat) {

            html +=
                "<p><strong>e" +
                obtenerNumeroStatArena(
                    stat[0]
                ) +
                " " +
                stat[0] +
                "</strong><br>" +
                stat[1] +
                "</p>";

        }
    );

    html +=
        "<p>📖 <a target='_blank' href='" +
        "https://palentropia.es/herramientas/" +
        "generador_fase_2/generador_fase_2.html" +
        "?codigo=" +
        encodeURIComponent(datos.j1) +
        "'>Consultar Paleoficha</a></p>";

    html +=
        "</section>";

    contenedor.innerHTML += html;

}


/* ==========================================================
   NÚMERO DE ESTADÍSTICA
   ========================================================== */

function obtenerNumeroStatArena(nombre) {

    const mapa = {

        "Adaptabilidad": 1,

        "Sociabilidad": 2,

        "Resistencia": 3,

        "Reproducción": 4,

        "Ofensiva": 5,

        "Defensa": 6,

        "Movilidad": 7,

        "Plasticidad ecológica": 8,

        "Tamaño": 9,

        "Velocidad": 10,

        "Inteligencia": 11

    };

    return mapa[nombre] || "";

}


/* ==========================================================
   PREPARAR COMBATE
   ========================================================== */

async function prepararCombateArena() {

    const boton =
        document.getElementById(
            "botonCombate"
        );

    if (boton) {

        boton.disabled = true;

    }

    const cargado =
        await cargarPaleofichasArena();

    if (!cargado) {

        alert(
            "No se pudo cargar paleofichas.json."
        );

        if (boton) {

            boton.disabled = false;

        }

        return;

    }

    if (
        !MASTER_ARENA ||
        MASTER_ARENA.length < 2
    ) {

        alert(
            "No hay suficientes Paleofichas."
        );

        return;

    }

    const fichas =
        seleccionarDosFichasAleatoriasArena();

    if (!fichas) {

        return;

    }

    const ficha1 = fichas[0];

    const ficha2 = fichas[1];

    document.getElementById(
        "codigoFicha1"
    ).textContent =
        ficha1.j1;

    document.getElementById(
        "codigoFicha2"
    ).textContent =
        ficha2.j1;


    const resultado =
        document.getElementById(
            "resultadoArena"
        );

    if (resultado) {

        resultado.innerHTML = "";

    }


    mostrarCombatienteArena(
        ficha1,
        1
    );

    mostrarCombatienteArena(
        ficha2,
        2
    );


    /*
    ----------------------------------------------------------
    CREAR COMBATE
    ----------------------------------------------------------
    */

    if (
        typeof crearCombateArena ===
        "function"
    ) {

        COMBATE_ARENA =
            crearCombateArena(
                ficha1,
                ficha2
            );

        mostrarPreparacionCombateArena(
            COMBATE_ARENA
        );

    }


    if (boton) {

        boton.disabled = false;

    }

}


/* ==========================================================
   MOSTRAR PREPARACIÓN
   ========================================================== */

function mostrarPreparacionCombateArena(
    combate
) {

    if (!combate) {

        return;

    }

    const contenedor =
        document.getElementById(
            "resultadoArena"
        );

    if (!contenedor) {

        return;

    }

    let html = "";

    html +=
        "<section class='preparacion-combate'>";

    html +=
        "<h2>⚔️ Combatientes preparados</h2>";

    html +=
        "<p>" +
        combate.combatiente1.nombre +
        "</p>";

    html +=
        "<p>❤️ HP: " +
        combate.combatiente1.hp +
        " / " +
        combate.combatiente1.hp_max +
        "</p>";

    html +=
        "<p>⚡ Iniciativa: " +
        combate.combatiente1.iniciativa +
        "</p>";

    html +=
        "<p>⚔️ Ataque especial: " +
        combate.combatiente1.ataque_especial +
        "</p>";

    html +=
        "<hr>";

    html +=
        "<p>" +
        combate.combatiente2.nombre +
        "</p>";

    html +=
        "<p>❤️ HP: " +
        combate.combatiente2.hp +
        " / " +
        combate.combatiente2.hp_max +
        "</p>";

    html +=
        "<p>⚡ Iniciativa: " +
        combate.combatiente2.iniciativa +
        "</p>";

    html +=
        "<p>⚔️ Ataque especial: " +
        combate.combatiente2.ataque_especial +
        "</p>";

    html +=
        "</section>";

    contenedor.innerHTML += html;

}


/* ==========================================================
   INICIALIZACIÓN
   ========================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        /*
        ------------------------------------------------------
        Cargar master.csv
        ------------------------------------------------------
        */

        const cargado =
            await cargarMasterArena();

        if (!cargado) {

            return;

        }

        /*
        ------------------------------------------------------
        Botón de combate.
        ------------------------------------------------------
        */

        const boton =
            document.getElementById(
                "botonCombate"
            );

        if (boton) {

            boton.addEventListener(
                "click",
                prepararCombateArena
            );

        }

        /*
        ------------------------------------------------------
        Generar automáticamente dos fichas
        al abrir la prueba.
        ------------------------------------------------------
        */

        await prepararCombateArena();

    }
);

</script>

</body>
</html>
