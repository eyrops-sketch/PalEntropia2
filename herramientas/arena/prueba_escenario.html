<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PalEntropía - Prueba Escenario</title>

    <link
        rel="stylesheet"
        href="stylearena.css"
    >

</head>


<body>

<main class="arena">

    <header class="arena-cabecera">

        <h1>🎲 PalEntropía</h1>

        <h2>Arena</h2>

        <p>
            Prueba de generación de escenario
        </p>

    </header>


    <section class="panel">

        <h2>🎲 Escenario</h2>

        <div id="escenario">
            Generando escenario...
        </div>

        <button
            id="btnNuevoEscenario"
            type="button"
        >
            🎲 Nuevo escenario
        </button>

    </section>


    <section class="panel">

        <h2>🦖 Prueba de Paleoficha</h2>

        <label for="codigoFicha">
            Código
        </label>

        <input
            type="text"
            id="codigoFicha"
            value="006_01"
            maxlength="7"
        >

        <button
            id="btnEvaluar"
            type="button"
        >
            Evaluar ficha
        </button>

    </section>


    <section class="panel">

        <h2>⚔️ Resultado</h2>

        <div id="resultado">

            Esperando evaluación...

        </div>

    </section>

</main>


<!-- ==================================================
     BASES DE DATOS
================================================== -->

<script src="../generador_fase_2/palhab.js"></script>

<script src="../generador_fase_2/palmedio.js"></script>

<script src="../generador_fase_2/palmodo.js"></script>


<!-- ==================================================
     MOTOR DE DATOS
================================================== -->

<script src="palarenadatos.js"></script>

<script src="palarenaescenario.js"></script>


<script>

/*
========================================================
PRUEBA DE ESCENARIO
========================================================
*/


const escenarioElemento =
    document.getElementById("escenario");


const resultadoElemento =
    document.getElementById("resultado");


const codigoFicha =
    document.getElementById("codigoFicha");


const btnNuevoEscenario =
    document.getElementById("btnNuevoEscenario");


const btnEvaluar =
    document.getElementById("btnEvaluar");


/*
========================================================
GENERAR ESCENARIO
========================================================
*/

function generarEscenario() {

    const escenario =
        window.PALARENA_ESCENARIO.generar();


    mostrarEscenario(escenario);


    /*
    Si ya tenemos una ficha,
    la volvemos a evaluar.
    */

    if (codigoFicha.value.trim() !== "") {

        evaluarFicha();

    }

}


/*
========================================================
MOSTRAR ESCENARIO
========================================================
*/

function mostrarEscenario(escenario) {

    if (!escenario) {

        escenarioElemento.innerHTML =
            "<p>❌ No se pudo generar el escenario.</p>";

        return;

    }


    const habitatsHTML =
        escenario.habitats
            .map(codigo => {

                const datos =
                    window.PALARENA_DATOS
                        .obtenerHabitat(codigo);

                const nombre =
                    datos
                        ? datos.nombre
                        : "Desconocido";


                return `
                    <div class="dato">
                        <strong>${codigo}</strong>
                        — ${nombre}
                    </div>
                `;

            })
            .join("");


    const modoDatos =
        window.PALARENA_DATOS
            .obtenerModo(escenario.modo);


    const modoNombre =
        modoDatos
            ? modoDatos.nombre
            : "Desconocido";


    const mediosHTML =
        escenario.medios
            .map(medio => {

                return `
                    <div class="dato">

                        <strong>
                            ${medio.SM}
                        </strong>

                        |

                        <strong>
                            ${medio.L}
                        </strong>

                        |

                        <strong>
                            ${medio.ES}
                        </strong>

                        |

                        <strong>
                            ${medio.C}
                        </strong>

                    </div>
                `;

            })
            .join("");


    escenarioElemento.innerHTML = `

        <h3>🏠 Hábitats</h3>

        ${habitatsHTML}


        <h3>🧬 Modo de vida</h3>

        <div class="dato">

            <strong>
                ${escenario.modo}
            </strong>

            — ${modoNombre}

        </div>


        <h3>🌎 Medios ecológicos</h3>

        ${mediosHTML}

    `;

}


/*
========================================================
EVALUAR FICHA
========================================================
*/

function evaluarFicha() {

    const codigo =
        codigoFicha.value.trim();


    if (!codigo) {

        resultadoElemento.innerHTML =
            "Introduce un código de Paleoficha.";

        return;

    }


    const resultado =
        window.PALARENA_ESCENARIO
            .evaluar(codigo);


    if (!resultado) {

        resultadoElemento.innerHTML = `

            <p>
                ❌ No se pudo evaluar
                <strong>${codigo}</strong>
            </p>

        `;

        return;

    }


    const ficha =
        resultado.ficha;


    const bonificacion =
        resultado.bonificacion;


    /*
    ----------------------------------------------
    HÁBITATS
    ----------------------------------------------
    */

    let textoHabitats =
        "Ninguna";


    if (bonificacion.habitats > 0) {

        textoHabitats =
            bonificacion.habitats +
            " coincidencia(s)";

    }


    /*
    ----------------------------------------------
    MODO
    ----------------------------------------------
    */

    const textoModo =
        bonificacion.modo
            ? "✓ Coincide"
            : "0";


    /*
    ----------------------------------------------
    MEDIOS
    ----------------------------------------------
    */

    const textoMedios =
        bonificacion.medios.coincidencias;


    /*
    ----------------------------------------------
    RESULTADO
    ----------------------------------------------
    */

    resultadoElemento.innerHTML = `

        <div class="dato">

            <strong>
                ${ficha.j1}
            </strong>

        </div>


        <div class="dato">

            <strong>
                Nombre:
            </strong>

            ${ficha.j2}

        </div>


        <hr>


        <h3>🏠 Hábitats</h3>

        <div class="dato">

            Coincidencias:
            <strong>
                ${textoHabitats}
            </strong>

        </div>


        <h3>🧬 Modo de vida</h3>

        <div class="dato">

            ${textoModo}

        </div>


        <h3>🌎 Medios ecológicos</h3>

        <div class="dato">

            Componentes coincidentes:
            <strong>
                ${textoMedios}
            </strong>

        </div>


        <hr>


        <div class="bonificacion">

            🎯 BONIFICACIÓN TOTAL

            <strong>
                +${bonificacion.total}
            </strong>

        </div>

    `;

}


/*
========================================================
BOTONES
========================================================
*/

btnNuevoEscenario.addEventListener(
    "click",
    generarEscenario
);


btnEvaluar.addEventListener(
    "click",
    evaluarFicha
);


/*
========================================================
INICIO
========================================================
*/

async function iniciar() {

    escenarioElemento.innerHTML =
        "⏳ Cargando base de datos...";


    const cargado =
        await window.PALARENA_DATOS.cargar();


    if (!cargado) {

        escenarioElemento.innerHTML =
            "❌ Error cargando master.csv.";

        return;

    }


    generarEscenario();

}


iniciar();

</script>


</body>

</html>
