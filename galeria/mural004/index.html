<div id="visor" onclick="cerrarImagen()">

<img id="imagenGrande">

<style>

#visor{

display:none;

position:fixed;

z-index:999;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.9);

justify-content:center;

align-items:center;

cursor:pointer;

}

#visor img{

max-width:95%;

max-height:95%;

border-radius:15px;

box-shadow:0 0 30px #b84cff;

}

</style>

<script>

const imagenes=document.querySelectorAll(".obra img");

const visor=document.getElementById("visor");

const imagenGrande=document.getElementById("imagenGrande");

imagenes.forEach(imagen=>{

imagen.onclick=function(e){

e.stopPropagation();

imagenGrande.src=this.src;

visor.style.display="flex";

}

});

function cerrarImagen(){

visor.style.display="none";

}

</script>
